name: Deploy to GitHub Pages

# DEPLOYMENT PAUSED (2026-11-09): automatic deployment is intentionally
# disabled for the Release 1.1.0 GitHub publication. This workflow only runs
# on a manual dispatch; restore the `push: branches: [main]` trigger (see the
# repository history of this file) when live hosting is decided.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, and let a newer run finish rather than
# cancelling a deploy that is already in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build
        env:
          # Optional. Set a repository variable with this name to enable in-page
          # form delivery (e.g. a Formspree endpoint). Without it the contact
          # form composes a pre-filled email instead.
          NEXT_PUBLIC_CONTACT_ENDPOINT: ${{ vars.NEXT_PUBLIC_CONTACT_ENDPOINT }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
