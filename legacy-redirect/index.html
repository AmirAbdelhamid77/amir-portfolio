<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amir Abdelhamid — moved</title>
    <link rel="canonical" href="https://hansa.amir-portfolio.workers.dev/" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=https://hansa.amir-portfolio.workers.dev/" />
    <script>
      window.location.replace("https://hansa.amir-portfolio.workers.dev/");
    </script>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fcfcfb;
        color: #1f1f1f;
        font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        padding: 24px;
      }
      a {
        color: #0285f7;
        text-underline-offset: 4px;
      }
      .mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: #0285f7;
        color: #fff;
        font-weight: 700;
        font-size: 14px;
        letter-spacing: -0.02em;
        margin-bottom: 18px;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0 0 6px;
      }
      p {
        margin: 0;
        color: #6b6b6b;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #151515;
          color: #f2f2f2;
        }
        p {
          color: #a3a3a3;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">AA</span>
      <h1>This site has moved</h1>
      <p>
        The portfolio now lives at
        <a href="https://hansa.amir-portfolio.workers.dev/">hansa.amir-portfolio.workers.dev</a>.
      </p>
    </main>
  </body>
</html>
