<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340"><rect width="960" height="340" fill="#FAFBFC"/><text x="480" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#0B3D5C" font-weight="700">Dual axis manufactures a relationship. Panels keep scales honest.</text><rect x="24" y="46" width="450" height="270" rx="8" fill="#fff" stroke="#E05A4F"/><text x="249" y="70" text-anchor="middle" font-family="system-ui" font-size="13" fill="#E05A4F" font-weight="700">Trap - one chart, two Y axes</text><polyline points="60,250 120,230 180,210 240,200 300,170 360,150 420,130" fill="none" stroke="#0E7C7B" stroke-width="3"/><polyline points="60,220 120,200 180,210 240,160 300,180 360,120 420,140" fill="none" stroke="#E05A4F" stroke-width="3"/><text x="60" y="300" font-family="system-ui" font-size="11" fill="#0E7C7B">Life expectancy</text><text x="300" y="300" font-family="system-ui" font-size="11" fill="#E05A4F">HDI</text><rect x="486" y="46" width="450" height="270" rx="8" fill="#fff" stroke="#0E7C7B"/><text x="711" y="70" text-anchor="middle" font-family="system-ui" font-size="13" fill="#0E7C7B" font-weight="700">Better - small multiples, shared X</text><polyline points="520,150 580,140 640,132 700,128 760,118 820,110 880,102" fill="none" stroke="#0E7C7B" stroke-width="3"/><line x1="520" y1="170" x2="900" y2="170" stroke="#D0D7DE"/><polyline points="520,270 580,255 640,250 700,230 760,235 820,210 880,205" fill="none" stroke="#0B3D5C" stroke-width="3"/><text x="520" y="162" font-family="system-ui" font-size="10" fill="#57606A">LE years</text><text x="520" y="292" font-family="system-ui" font-size="10" fill="#57606A">HDI 0-1</text></svg>