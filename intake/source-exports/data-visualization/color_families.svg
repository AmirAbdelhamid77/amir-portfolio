" width="80" height="36" fill="#F7F7F7" stroke="#D0D7DE"/><rect x="360" y="224" width="80" height="36" fill="#E8A0A8"/><rect x="440" y="224" width="80" height="36" fill="#D0545E"/><rect x="520" y="224" width="80" height="36" fill="#B40426"/><text x="620" y="248" font-family="system-ui" font-size="12" fill="#57606A">loss  -  0  -  gain</text></svg>