<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280"><rect width="760" height="280" fill="#FAFBFC"/><text x="380" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#0B3D5C" font-weight="700">A point estimate without uncertainty is overconfident</text><rect x="40" y="50" width="680" height="200" fill="#fff" stroke="#D0D7DE"/><line x1="100" y1="210" x2="680" y2="210" stroke="#D0D7DE"/><circle cx="220" cy="120" r="7" fill="#0E7C7B"/><line x1="220" y1="70" x2="220" y2="170" stroke="#0E7C7B" stroke-width="3"/><line x1="208" y1="70" x2="232" y2="70" stroke="#0E7C7B" stroke-width="3"/><line x1="208" y1="170" x2="232" y2="170" stroke="#0E7C7B" stroke-width="3"/><circle cx="400" cy="100" r="7" fill="#2B6CB0"/><line x1="400" y1="88" x2="400" y2="112" stroke="#2B6CB0" stroke-width="3"/><circle cx="580" cy="130" r="7" fill="#E05A4F"/><line x1="580" y1="55" x2="580" y2="205" stroke="#E05A4F" stroke-width="3"/><line x1="568" y1="55" x2="592" y2="55" stroke="#E05A4F" stroke-width="3"/><line x1="568" y1="205" x2="592" y2="205" stroke="#E05A4F" stroke-width="3"/><text x="220" y="232" text-anchor="middle" font-family="system-ui" font-size="12" fill="#57606A">Usable interval</text><text x="400" y="232" text-anchor="middle" font-family="system-ui" font-size="12" fill="#57606A">Too precise to be true</text><text x="580" y="232" text-anchor="middle" font-family="system-ui" font-size="12" fill="#57606A">Detectable, not useful</text></svg>