<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300"><rect width="920" height="300" fill="#FAFBFC"/><text x="460" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#0B3D5C" font-weight="700">Simpson - the aggregate can reverse the subgroups</text><rect x="24" y="46" width="280" height="230" rx="8" fill="#fff" stroke="#D0D7DE"/><text x="164" y="72" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="700" fill="#E05A4F">Aggregate: B wins</text><rect x="70" y="140" width="70" height="90" fill="#0E7C7B"/><rect x="170" y="110" width="70" height="120" fill="#E05A4F"/><text x="105" y="248" text-anchor="middle" font-size="12" font-family="system-ui">A 45%</text><text x="205" y="248" text-anchor="middle" font-size="12" font-family="system-ui">B 55%</text><rect x="320" y="46" width="280" height="230" rx="8" fill="#fff" stroke="#D0D7DE"/><text x="460" y="72" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="700" fill="#0E7C7B">Segment 1: A wins</text><rect x="366" y="120" width="70" height="110" fill="#0E7C7B"/><rect x="466" y="150" width="70" height="80" fill="#E05A4F"/><text x="401" y="248" text-anchor="middle" font-size="12" font-family="system-ui">A 70%</text><text x="501" y="248" text-anchor="middle" font-size="12" font-family="system-ui">B 50%</text><rect x="616" y="46" width="280" height="230" rx="8" fill="#fff" stroke="#D0D7DE"/><text x="756" y="72" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="700" fill="#0E7C7B">Segment 2: A wins</text><rect x="662" y="150" width="70" height="80" fill="#0E7C7B"/><rect x="762" y="170" width="70" height="60" fill="#E05A4F"/><text x="697" y="248" text-anchor="middle" font-size="12" font-family="system-ui">A 40%</text><text x="797" y="248" text-anchor="middle" font-size="12" font-family="system-ui">B 30%</text></svg>