<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340"><rect width="900" height="340" fill="#FAFBFC"/><text x="450" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#0B3D5C" font-weight="700">Encoding accuracy - position before weaker channels</text><rect x="30" y="55" width="840" height="48" rx="8" fill="#E8F4F3" stroke="#0E7C7B"/><text x="48" y="85" font-size="15" font-weight="700" fill="#0E7C7B" font-family="system-ui">1. Position on a common scale</text><text x="430" y="85" font-size="13" fill="#57606A" font-family="system-ui">Most accurate - bar, dot, scatter axes</text><rect x="30" y="110" width="840" height="48" rx="8" fill="#E8EEF8" stroke="#2B6CB0"/><text x="48" y="140" font-size="15" font-weight="700" fill="#2B6CB0" font-family="system-ui">2. Position on unaligned scales</text><text x="430" y="140" font-size="13" fill="#57606A" font-family="system-ui">Small multiples - still strong</text><rect x="30" y="165" width="840" height="48" rx="8" fill="#E8EEF2" stroke="#0B3D5C"/><text x="48" y="195" font-size="15" font-weight="700" fill="#0B3D5C" font-family="system-ui">3. Length</text><text x="430" y="195" font-size="13" fill="#57606A" font-family="system-ui">Bars; keep a zero baseline</text><rect x="30" y="220" width="840" height="48" rx="8" fill="#FBF3E4" stroke="#E6A23C"/><text x="48" y="250" font-size="15" font-weight="700" fill="#C27A10" font-family="system-ui">4. Angle / area</text><text x="430" y="250" font-size="13" fill="#57606A" font-family="system-ui">Pies and bubbles - comparison degrades fast</text><rect x="30" y="275" width="840" height="48" rx="8" fill="#FBECEC" stroke="#E05A4F"/><text x="48" y="305" font-size="15" font-weight="700" fill="#E05A4F" font-family="system-ui">5. Color / size / opacity</text><text x="430" y="305" font-size="13" fill="#57606A" font-family="system-ui">Secondary encodings when precision is not the job</text></svg>