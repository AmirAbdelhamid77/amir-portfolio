<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320"><rect width="900" height="320" fill="#FAFBFC"/><text x="450" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#0B3D5C" font-weight="700">A mean is not a distribution</text><rect x="30" y="50" width="400" height="240" fill="#fff" stroke="#D0D7DE"/><text x="230" y="76" text-anchor="middle" font-family="system-ui" font-size="13" fill="#57606A">Same mean = 70</text><rect x="110" y="120" width="70" height="140" fill="#0E7C7B"/><rect x="260" y="120" width="70" height="140" fill="#E05A4F"/><text x="145" y="112" text-anchor="middle" font-size="12" font-family="system-ui">70</text><text x="295" y="112" text-anchor="middle" font-size="12" font-family="system-ui">70</text><text x="145" y="276" text-anchor="middle" font-size="12" font-family="system-ui" fill="#57606A">Team A</text><text x="295" y="276" text-anchor="middle" font-size="12" font-family="system-ui" fill="#57606A">Team B</text><rect x="470" y="50" width="400" height="240" fill="#fff" stroke="#D0D7DE"/><text x="670" y="76" text-anchor="middle" font-family="system-ui" font-size="13" fill="#57606A">A is tight. B is two processes.</text><rect x="540" y="150" width="90" height="80" fill="#0E7C7B" opacity="0.45" stroke="#0E7C7B"/><line x1="585" y1="150" x2="585" y2="230" stroke="#0B3D5C" stroke-width="3"/><line x1="585" y1="130" x2="585" y2="150" stroke="#0B3D5C"/><line x1="585" y1="230" x2="585" y2="250" stroke="#0B3D5C"/><rect x="690" y="100" width="90" height="140" fill="#E05A4F" opacity="0.35" stroke="#E05A4F"/><line x1="735" y1="100" x2="735" y2="240" stroke="#9B2C2C" stroke-width="3"/><circle cx="735" cy="80" r="4" fill="#E05A4F"/><circle cx="735" cy="260" r="4" fill="#E05A4F"/><text x="585" y="276" text-anchor="middle" font-size="12" font-family="system-ui" fill="#57606A">Team A</text><text x="735" y="276" text-anchor="middle" font-size="12" font-family="system-ui" fill="#57606A">Team B</text></svg>