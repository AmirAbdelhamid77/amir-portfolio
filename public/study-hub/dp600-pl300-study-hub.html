<main><section class="domain"><h2>Getting Started</h2><article class="sec open" id="s1"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>How to Use this Cheat Sheet</span></button><div class="sec-body"><p>All the skills you need to pass PL-300 are listed here. If you are just considering taking the exam, read through the skills to see what you’ll be working on.</p>
<p>If you are already working toward PL-300, find skills that you want to work on, then look up the content you need to take to gain those skills.</p></div></article><article class="sec open" id="s2"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>What is the PL-300 Certification?</span></button><div class="sec-body"><p>PL-300 is a professional certification in Microsoft Power BI for people working as (or wishing to work as) a data analyst or business analyst. The exam tests you in four areas:</p>
<ul>
<li><strong>25–30%</strong> Preparing data
</li>
<li><strong>25–30%</strong> Modeling data
</li>
<li><strong>25–30%</strong> Visualizing and analyzing data
</li>
<li><strong>15–20%</strong> Managing and securing Power BI
</ul>
<p>Skills as measured from 20 April 2026. A score of 700 or higher passes; the credential renews each year through a free assessment on Microsoft Learn.</p></div></article></section><section class="domain"><h2>Prepare the Data</h2><article class="sec open" id="s3"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Prepare the Data</span></button><div class="sec-body"><p>Preparing data means importing, cleaning, and manipulating data to get it ready for analysis.</p></div></article><article class="sec open" id="s4"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Get or connect to data</span></button><div class="sec-body"><p>Power BI connects to over 100 data sources, from spreadsheets to databases to web pages. You need to know how to get data from the source into Power BI.</p>
<ul>
<li>Identify and connect to data sources or a shared semantic model
</li>
<li>Change data source settings, including credentials and privacy levels
</li>
<li>Choose between Direct Lake, DirectQuery, and Import
</li>
<li>Create and modify parameters
</li></ul></div></article><article class="sec open" id="s5"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Profile and clean the data</span></button><div class="sec-body"><p>Datasets are seldom clean when you get them. You need to know how to detect and rectify issues with data.</p>
<ul>
<li>Evaluate data, including data statistics and column properties
</li>
<li>Resolve inconsistencies, unexpected or null values, and data quality issues
</li>
<li>Resolve data import errors
</li></ul></div></article><article class="sec open" id="s6"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Transform and load the data</span></button><div class="sec-body"><p>Even clean data often needs manipulating into a form suitable for analysis — new columns from existing ones, a subset of the rows, or tables combined.</p>
<ul>
<li>Select appropriate column data types
</li>
<li>Create and transform columns
</li>
<li>Group and aggregate rows
</li>
<li>Pivot, unpivot, and transpose data
</li>
<li>Convert semi-structured data to a table
</li>
<li>Create fact tables and dimension tables
</li>
<li>Identify when to use reference or duplicate queries and the resulting impact
</li>
<li>Merge and append queries
</li>
<li>Identify and create appropriate keys for relationships
</li>
<li>Configure data loading for queries
</li></ul></div></article></section><section class="domain"><h2>Model the Data</h2><article class="sec open" id="s7"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Model the Data</span></button><div class="sec-body"><p>Data modeling is about defining what goes into each table and how the tables are related. (Not to be confused with statistical modeling, which is about inference and predictions.)</p></div></article><article class="sec open" id="s8"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Design and implement a data model</span></button><div class="sec-body"><p>The first step in data modeling is specifying the structure of each table and how the tables relate.</p>
<ul>
<li>Configure table and column properties
</li>
<li>Implement role-playing dimensions
</li>
<li>Define a relationship’s cardinality and cross-filter direction
</li>
<li>Create a common date table
</li>
<li>Identify use cases for calculated columns and calculated tables
</li></ul></div></article><article class="sec open" id="s9"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Create model calculations by using DAX</span></button><div class="sec-body"><p>The ability to perform useful analytics hinges on the ability to create useful measures from the data. Power BI has an entire programming language to help you: DAX.</p>
<ul>
<li>Create single aggregation measures
</li>
<li>Use the CALCULATE function to manipulate filters
</li>
<li>Implement time intelligence measures
</li>
<li>Use basic statistical functions
</li>
<li>Create semi-additive measures
</li>
<li>Create a measure by using quick measures
</li>
<li>Create calculated tables or columns
</li>
<li>Create calculation groups
</ul>
<pre><code>Sales EU =
CALCULATE(
    SUM(Sales[Amount]),
    Region[Continent] = &quot;Europe&quot;
)</code></pre></div></article><article class="sec open" id="s10"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Optimize model performance</span></button><div class="sec-body"><p>If a dashboard or report runs slowly, you may need to change the data or the calculations to improve the speed.</p>
<ul>
<li>Improve performance by identifying and removing unnecessary rows and columns
</li>
<li>Identify poorly performing measures, relationships, and visuals by using Performance Analyzer and DAX query view
</li>
<li>Improve performance by reducing granularity
</li></ul></div></article></section><section class="domain"><h2>Visualize and Analyze the Data</h2><article class="sec open" id="s11"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Visualize and Analyze the Data</span></button><div class="sec-body"><p>Data visualization and crunching numbers are the heart of data analysis. Once you have answers, the results need to be organized into a report for consumption.</p></div></article><article class="sec open" id="s12"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Create reports</span></button><div class="sec-body"><p>At a basic level, you create the text, metrics, and visualizations, then arrange them in a suitable order.</p>
<ul>
<li>Select an appropriate visual
</li>
<li>Format and configure visuals
</li>
<li>Create a narrative visual with Copilot
</li>
<li>Apply and customize a theme
</li>
<li>Apply conditional formatting
</li>
<li>Apply slicing and filtering
</li>
<li>Use Copilot to create a new report page, and to suggest content for it
</li>
<li>Configure the report page
</li>
<li>Choose when to use a paginated report
</li>
<li>Create visual calculations by using DAX
</li></ul></div></article><article class="sec open" id="s13"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Enhance reports for usability and storytelling</span></button><div class="sec-body"><p>A report’s effectiveness is largely about how many useful and interesting thoughts its users have after seeing it.</p>
<ul>
<li>Configure bookmarks
</li>
<li>Create custom tooltips
</li>
<li>Edit and configure interactions between visuals
</li>
<li>Configure navigation for a report
</li>
<li>Apply sorting to visuals
</li>
<li>Configure sync slicers
</li>
<li>Group and layer visuals by using the Selection pane
</li>
<li>Configure drillthrough navigation, including pages, filters, and buttons
</li>
<li>Configure export settings
</li>
<li>Design reports for mobile devices
</li>
<li>Enable personalization in a report, including personalized visuals
</li>
<li>Design and configure Power BI reports for accessibility
</li>
<li>Configure automatic page refresh
</li></ul></div></article><article class="sec open" id="s14"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Identify patterns and trends</span></button><div class="sec-body"><p>Beyond descriptive statistics, analysis involves many techniques to answer questions with data, from finding related data points with cluster analysis to making predictions with forecasting.</p>
<ul>
<li>Use the Analyze feature in Power BI
</li>
<li>Use grouping, binning, and clustering
</li>
<li>Use AI visuals
</li>
<li>Use reference lines, error bars, and forecasting
</li>
<li>Detect outliers and anomalies
</li>
<li>Use Copilot to summarize the underlying semantic model
</li></ul></div></article></section><section class="domain"><h2>Manage and Secure Power BI</h2><article class="sec open" id="s15"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Manage and Secure Power BI</span></button><div class="sec-body"><p>Once you have your report, you need to make it available to your users, keep it up to date, and control who can see what.</p></div></article><article class="sec open" id="s16"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Create and manage workspaces and assets</span></button><div class="sec-body"><p>Power BI workspaces let you manage reports, dashboards, and semantic models; scheduled refresh keeps the data current.</p>
<ul>
<li>Create and configure a workspace
</li>
<li>Configure and update an app
</li>
<li>Publish, import, or update items in a workspace
</li>
<li>Create dashboards
</li>
<li>Choose a distribution method
</li>
<li>Configure subscriptions and data alerts
</li>
<li>Promote or certify Power BI content
</li>
<li>Identify when a gateway is required
</li>
<li>Configure a semantic model scheduled refresh
</li></ul></div></article><article class="sec open" id="s17"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Secure and govern Power BI items</span></button><div class="sec-body"><ul>
<li>Assign workspace roles
</li>
<li>Configure item-level access
</li>
<li>Configure access to semantic models
</li>
<li>Implement row-level security roles
</li>
<li>Configure row-level security group membership
</li>
<li>Apply sensitivity labels
</li></ul></div></article></section></main>
</div>
<footer>Study notes for exam preparation.</footer>

r(--line);margin-top:12px;padding-top:10px}\n.expl h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}\n.nav-row{display:flex;justify-content:space-between;margin-top:20px}\n.empty{color:var(--muted);text-align:center;padding:40px 10px}\nfooter{max-width:1280px;margin:0 auto;padding:0 22px 30px;color:var(--muted);font-size:12.5px}\n@media (max-width:860px){\n  .layout{flex-direction:column}\n  aside{position:static;width:100%;max-height:none;padding:12px 22px 0}\n  .grid{grid-template-columns:repeat(10,1fr)}\n  main{padding:12px 14px 40px}\n  .toolbar input[type=\"search\"]{margin-left:0;width:100%}\n}\n\n.aa-block{margin-top:16px;display:grid;gap:10px}\n.aa-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff}\n.aa-label{font-weight:600}\n.aa-select{font:inherit;font-size:14px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:#fff;max-width:100%}\n.aa-select.correct{border-color:var(--green);background:var(--green-bg)}\n.aa-select.incorrect{border-color:var(--red);background:var(--red-bg)}\n.aa-select:disabled{cursor:default}\n.aa-code{margin-top:4px}\n.aa-code pre{background:#0f2a43;color:#e8f1f8;border-radius:8px;padding:12px 14px;overflow-x:auto;font-size:13px;line-height:1.7;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;margin:0}\n.aa-code select{font-family:inherit;font-size:12.5px;padding:3px 6px;border-radius:6px;border:1.5px solid #7fb3d5;background:#fff;color:#1c2733;max-width:280px;vertical-align:middle}\n.aa-code select.correct{border-color:#2e9e5b;background:var(--green-bg)}\n.aa-code select.incorrect{border-color:#e57373;background:var(--red-bg)}\n.yn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:12px 14px}\n.yn-row.correct{border-color:var(--green);backg const DATA = {"dp600": [{"n": 1, "kind": "single", "kind_label": "Single choice", "case": "Contoso", "case_ref": null, "stem_html": "<p>Overview - Contoso, Ltd. is a US-based health supplements company. Contoso has two divisions named Sales and Research. The Sales division contains two departments named Online Sales and Retail Sales. The Research division assigns internally developed product lines to individual teams of researchers and analysts. Existing Environment - Identity Environment - Contoso has a Microsoft Entra tenant named contoso.com. The tenant contains two groups named ResearchReviewersGroup1 and ResearchReviewersGroup2. Data Environment - Contoso has the following data environment: The Sales division uses a Microsoft Power BI Premium capacity. The semantic model of the Online Sales department includes a fact table named Orders that uses Import made. In the system of origin, the OrderID value represents the sequence in which orders are created. The Research department uses an on-premises, third-party data warehousing product. Fabric is enabled for contoso.com. An Azure Data Lake Storage Gen2 storage account named storage1 contains Research division data for a product line named Productline1. The data is in the delta format. A Data Lake Storage Gen2 storage account named storage2 contains Research division data for a product line named Productline2. The data is in the CSV format. Requirements - Planned Changes - Contoso plans to make the following changes: Enable support for Fabric in the Power BI Premium capacity used by the Sales division. Make all the data for the Sales division and the Research division available in Fabric. For the Research division, create two Fabric workspaces named Productline1ws and Productine2ws. In Productline1ws, create a lakehouse named Lakehouse1. In Lakehouse1, create a shortcut to storage1 named ResearchProduct. Data Analytics Requirements - Contoso identifies the following data analytics requirements: All the workspaces for the Sales division and the Research division must support all Fabric experiences. The Research division workspaces must use a dedicated, on-demand capacity that has per-minute billing. The Research division workspaces must be grouped together logically to support OneLake data hub filtering based on the department name. For the Research division workspaces, the members of ResearchReviewersGroup1 must be able to read lakehouse and warehouse data and shortcuts by using SQL endpoints. For the Research division workspaces, the members of ResearchReviewersGroup2 must be able to read lakehouse data by using Lakehouse explorer. All the semantic models and reports for the Research division must use version control that supports branching. Data Preparation Requirements - Contoso identifies the following data preparation requirements: The Research division data for Productline1 must be retrieved from Lakehouse1 by using Fabric notebooks. All the Research division data in the lakehouses must be presented as managed tables in Lakehouse explorer. Semantic Model Requirements - Contoso identifies the following requirements for implementing and managing semantic models: The number of rows added to the Orders table during refreshes must be minimized. The semantic models in the Research division workspaces must use Direct Lake mode. General Requirements - Contoso identifies the following high-level requirements that must be considered for all solutions: Follow the principle of least privilege when applicable. Minimize implementation and maintenance effort when possible. You need to ensure that Contoso can use version control to meet the data analytics requirements and the general requirements. What should you do?<\/p>", "options": [{"letter": "A", "text": "Store at the semantic models and reports in Data Lake Gen2 storage."}, {"letter": "B", "text": "Modify the settings of the Research workspaces to use a GitHub repository."}, {"letter": "C", "text": "Modify the settings of the Research division workspaces to use an Azure Repos repository."}, {"letter": "D", "text": "Store all the semantic models and reports in Microsoft OneDrive."}], "key": ["C"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>C. Modify the settings of the Research division workspaces to use an Azure Repos repository.<\/p>\n<p>Contoso needs version control for its data analytics and general requirements. In Microsoft Fabric and Power BI, version control is best managed through Git integration using Azure Repos or GitHub.<\/p>\n<p>Azure Repos is a Git-based repository within Azure DevOps, providing versioning, tracking, and collaboration for code, reports, and semantic models.<\/p>\n<p>This is the most appropriate choice for version-controlling Power BI artifacts like datasets, reports, and semantic models in a workspace.<\/p>", "exh": ""}, {"n": 2, "kind": "hotspot", "kind_label": "Hotspot", "case": "Contoso", "case_ref": 1, "stem_html": "<p>You need to recommend a solution to group the Research division workspaces. What should you include in the recommendation? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p>\n<ul><li>Grouping method: Capacity / Domain / Tenant<\/li><li>Tool: OneLake data hub / The Fabric Admin portal / The Microsoft Entra admin center<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>Domain: Group the Research division workspaces based on their departmental context.<\/p>\n<p>Domain allows you to group workspaces based on their purpose or business context. In this case, grouping by department (Research division) aligns with the requirement.<\/p>\n<p>The Fabric Admin Portal is the primary management interface for Microsoft Fabric.<\/p>", "answer_area": {"kind": "dropdowns", "controls": [{"id": "d1", "label": "Grouping method:", "options": ["Capacity", "Domain", "Tenant"], "correct": "Domain"}, {"id": "d2", "label": "Tool:", "options": ["OneLake data hub", "The Fabric Admin portal", "The Microsoft Entra admin center"], "correct": "The Fabric Admin portal"}]}, "exh": ""}, {"n": 3, "kind": "single", "kind_label": "Single choice", "case": "Contoso", "case_ref": 1, "stem_html": "<p>You need to refresh the Orders table of the Online Sales department. The solution must meet the semantic model requirements. What should you include in the solution?<\/p>", "options": [{"letter": "A", "text": "an Azure Data Factory pipeline that executes a Stored procedure activity to retrieve the maximum value of the OrderID column in the destination lakehouse"}, {"letter": "B", "text": "an Azure Data Factory pipeline that executes a Stored procedure activity to retrieve the minimum value of the OrderID column in the destination lakehouse"}, {"letter": "C", "text": "an Azure Data Factory pipeline that executes a dataflow to retrieve the minimum value of the OrderID column in the destination lakehouse"}, {"letter": "D", "text": "an Azure Data Factory pipeline that executes a dataflow to retrieve the maximum value of the OrderID column in the destination lakehouse"}], "key": ["D"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>D. an Azure Data Factory pipeline that executes a dataflow to retrieve the maximum value of the OrderID column in the destination lakehouse. A dataflow can be used to retrieve the max OrderID number (stored in the destination table - OrderID is a sequencial number). This number can be used to set from which row data must be added to the destination table (implementing an incremental load).<\/p>", "exh": ""}, {"n": 4, "kind": "single", "kind_label": "Single choice", "case": "Contoso", "case_ref": 1, "stem_html": "<p>Which syntax should you use in a notebook to access the Research division data for Productline1?<\/p>", "options": [{"letter": "A", "text": "spark.read.format(“delta”).load(“Tables/productline1/ResearchProduct”)"}, {"letter": "B", "text": "spark.sql(“SELECT * FROM Lakehouse1.ResearchProduct ”)"}, {"letter": "C", "text": "external_table(‘Tables/ResearchProduct)"}, {"letter": "D", "text": "external_table(ResearchProduct)"}], "key": ["B"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>spark.sql(“SELECT * FROM Lakehouse1.ResearchProduct ”)<\/p>\n<p>The syntax of C and D is correct for KQL databases (incorrect in this use-case). When the shortcut is created, no additional folders have been added to the Tables section, therefore answer A is incorrect. Once created, the line of answer B can be used to access data correctly.<\/p>", "exh": ""}, {"n": 5, "kind": "hotspot", "kind_label": "Hotspot", "case": "Litware", "case_ref": null, "stem_html": "<p>Overview - Litware, Inc. is a manufacturing company that has offices throughout North America. The analytics team at Litware contains data engineers, analytics engineers, data analysts, and data scientists. Existing Environment - Fabric Environment - Litware has been using a Microsoft Power BI tenant for three years. Litware has NOT enabled any Fabric capacities and features. Available Data - Litware has data that must be analyzed as shown in the following table. The Product data contains a single table and the following columns.<\/p>\n<p>The customer satisfaction data contains the following tables: Survey - Question - Response - For each survey submitted, the following occurs: One row is added to the Survey table. One row is added to the Response table for each question in the survey. The Question table contains the text of each survey question. The third question in each survey response is an overall satisfaction score. Customers can submit a survey after each purchase. User Problems - The analytics team has large volumes of data, some of which is semi-structured. The team wants to use Fabric to create a new data store. Product data is often classified into three pricing groups: high, medium, and low. This logic is implemented in several databases and semantic models, but the logic does NOT always match across implementations. Requirements - Planned Changes - Litware plans to enable Fabric features in the existing tenant. The analytics team will create a new data store as a proof of concept (PoC). The remaining Liware users will only get access to the Fabric features once the PoC is complete. The PoC will be completed by using a Fabric trial capacity The following three workspaces will be created: AnalyticsPOC: Will contain the data store, semantic models, reports pipelines, dataflow, and notebooks used to populate the data store DataEngPOC: Will contain all the pipelines, dataflows, and notebooks used to populate OneLake DataSciPOC: Will contain all the notebooks and reports created by the data scientists The following will be created in the AnalyticsPOC workspace: A data store (type to be decided) A custom semantic model - A default semantic model - Interactive reports - The data engineers will create data pipelines to load data to OneLake either hourly or daily depending on the data source. The analytics engineers will create processes to ingest, transform, and load the data to the data store in the AnalyticsPOC workspace daily. Whenever possible, the data engineers will use low-code tools for data ingestion. The choice of which data cleansing and transformation tools to use will be at the data engineers’ discretion. All the semantic models and reports in the Analytics POC workspace will use the data store as the sole data source. Technical Requirements - The data store must support the following: Read access by using T-SQL or Python Semi-structured and unstructured data Row-level security (RLS) for users executing T-SQL queries Files loaded by the data engineers to OneLake will be stored in the Parquet format and will meet Delta Lake specifications. Data will be loaded without transformation in one area of the AnalyticsPOC data store. The data will then be cleansed, merged, and transformed into a dimensional model The data load process must ensure that the raw and cleansed data is updated completely before populating the dimensional model The dimensional model must contain a date dimension. There is no existing data source for the date dimension. The Litware fiscal year matches the calendar year. The date dimension must always contain dates from 2010 through the end of the current year. The product pricing group logic must be maintained by the analytics engineers in a single location. The pricing group data must be made available in the data store for T-SOL. queries and in the default semantic model. The following logic must be used: List prices that are less than or equal to 50 are in the low pricing group. List prices that are greater than 50 and less than or equal to 1,000 are in the medium pricing group. List prices that are greater than 1,000 are in the high pricing group. Security Requirements - Only Fabric administrators and the analytics team must be able to see the Fabric items created as part of the PoC. Litware identifies the following security requirements for the Fabric items in the AnalyticsPOC workspace: Fabric administrators will be the workspace administrators. The data engineers must be able to read from and write to the data store. No access must be granted to datasets or reports. The analytics engineers must be able to read from, write to, and create schemas in the data store. They also must be able to create and share semantic models with the data analysts and view and modify all reports in the workspace. The data scientists must be able to read from the data store, but not write to it. They will access the data by using a Spark notebook The data analysts must have read access to only the dimensional model objects in the data store. They also must have access to create Power BI reports by using the semantic models created by the analytics engineers. The date dimension must be available to all users of the data store. The principle of least privilege must be followed. Both the default and custom semantic models must include only tables or views from the dimensional model in the data store. Litware already has the following Microsoft Entra security groups: FabricAdmins: Fabric administrators AnalyticsTeam: All the members of the analytics team DataAnalysts: The data analysts on the analytics team DataScientists: The data scientists on the analytics team DataEngineers: The data engineers on the analytics team AnalyticsEngineers: The analytics engineers on the analytics team Report Requirements - The data analysts must create a customer satisfaction report that meets the following requirements: Enables a user to select a product to filter customer survey responses to only those who have purchased that product. Displays the average overall satisfaction score of all the surveys submitted during the last 12 months up to a selected dat. Shows data as soon as the data is updated in the data store. Ensures that the report and the semantic model only contain data from the current and previous year. Ensures that the report respects any table-level security specified in the source data store. Minimizes the execution time of report queries. You need to assign permissions for the data store in the AnalyticsPOC workspace. The solution must meet the security requirements. Which additional permissions should you assign when you share the data store? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p>\n<ul><li>DataEngineers: Build Reports on the default dataset / Read All Apache Spark / Read All SQL analytics endpoint data<\/li><li>DataAnalysts: Build Reports on the default dataset / Read All Apache Spark / Read All SQL analytics endpoint data<\/li><li>DataScientists: Build Reports on the default dataset / Read All Apache Spark / Read All SQL analytics endpoint data<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>Data Engineers: Read all Apache Spark - because they need to be able to work with Spark for Data curation.<\/p>\n<p>Data Analysts: Build Reports on the default dataset - because they are report builders<\/p>\n<p>Data Scientists: Read All SQL analytics Endpoints data_ They leverage curated data (by engineers) to do predictive analytics.<\/p>", "answer_area": {"kind": "dropdowns", "controls": [{"id": "d1", "label": "DataEngineers:", "options": ["Build Reports on the default dataset", "Read All Apache Spark", "Read All SQL analytics endpoint data"], "correct": "Read All Apache Spark"}, {"id": "d2", "label": "DataAnalysts:", "options": ["Build Reports on the default dataset", "Read All Apache Spark", "Read All SQL analytics endpoint data"], "correct": "Build Reports on the default dataset"}, {"id": "d3", "label": "DataScientists:", "options": ["Build Reports on the default dataset", "Read All Apache Spark", "Read All SQL analytics endpoint data"], "correct": "Read All SQL analytics endpoint data"}]}, "exh": ""}, {"n": 6, "kind": "hotspot", "kind_label": "Hotspot", "case": "Litware", "case_ref": 5, "stem_html": "<p>You need to create a DAX measure to calculate the average overall satisfaction score. How should you complete the DAX code? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p>\n<pre><code>Rolling 12 Overall Satisfaction =\nVAR NumberOfMonths = 12\nVAR LastCurrentDate = MAX ( &#x27;Date&#x27; [Date] )\nVAR Period = DATESINPERIOD ( &#x27;Date&#x27; [Date], LastCurrentDate, - NumberOfMonths, MONTH )\nVAR Result =\n    CALCULATE (\n        [dropdown 1],\n        [dropdown 2]\n        &#x27;Survey Question&#x27;[Question Title] = &quot;Overall Satisfaction&quot;\n    )\nRETURN\n    Result<\/code><\/pre>\n<ul><li>Dropdown 1: AVERAGE(&#x27;Survey&#x27;[Response Value]), / AVERAGEA(&#x27;Question&#x27;[Question Text]), / AVERAGEX(VALUES(&#x27;Survey&#x27;[Customer Key]),<\/li><li>Dropdown 2: LastCurrentDate, / NumberOfMonths, / Period,<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>1. Average(Survey[Response Value]) as this one is the only value that can be aggregated.<\/p>\n<p>Customer Key Does not make any sense , as it just a key to identify a customer, this can never provide us the score.<\/p>\n<p>2. Period : Variable is defined as to select 1 year of date range. Can directly be passed in the Filter context of Calculate formula.<\/p>", "answer_area": {"kind": "dropdowns", "code": "Rolling 12 Overall Satisfaction =\nVAR NumberOfMonths = 12\nVAR LastCurrentDate = MAX ( 'Date' [Date] )\nVAR Period = DATESINPERIOD ( 'Date' [Date], LastCurrentDate, - NumberOfMonths, MONTH )\nVAR Result =\n    CALCULATE (\n        [dropdown 1],\n        [dropdown 2]\n        'Survey Question'[Question Title] = \"Overall Satisfaction\"\n    )\nRETURN\n    Result", "controls": [{"id": "d1", "options": ["AVERAGE('Survey'[Response Value]),", "AVERAGEA('Question'[Question Text]),", "AVERAGEX(VALUES('Survey'[Customer Key]),"], "correct": "AVERAGE('Survey'[Response Value]),"}, {"id": "d2", "options": ["LastCurrentDate,", "NumberOfMonths,", "Period,"], "correct": "Period,"}]}, "exh": ""}, {"n": 7, "kind": "hotspot", "kind_label": "Hotspot", "case": "Litware", "case_ref": 5, "stem_html": "<p>You need to resolve the issue with the pricing group classification. How should you complete the T-SQL statement? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p>\n<pre><code>CREATE [dropdown 1] [dbo].[ProductsWithPricingGroup]\nAS\nSELECT ProductId,\n    ProductName,\n    ProductCategory,\n    ListPrice,\n    [dropdown 2]\n        WHEN ListPrice &lt;= 50 THEN &#x27;low&#x27;\n        [dropdown 3]\n        WHEN ListPrice &gt; 1000 THEN &#x27;high&#x27;\n    END AS PricingGroup\nFROM dbo.Products<\/code><\/pre>\n<ul><li>Dropdown 1: FUNCTION / PROCEDURE / TABLE / VIEW<\/li><li>Dropdown 2: CASE / COALESCE / IIF / SET<\/li><li>Dropdown 3: WHEN(ListPrice &gt; 50 AND ListPrice &lt; 1000) THEN &#x27;medium&#x27; / WHEN(ListPrice &gt;= 50 AND ListPrice &lt; 1000) THEN &#x27;medium&#x27; / WHEN ListPrice BETWEEN 50 AND 1000) THEN &#x27;medium&#x27;<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>VIEW: from an existing table.<\/p>\n<p>* CASE: correct syntax before the WHENs.<\/p>\n<p>* WHEN ListPrice BETWEEN 50 AND 1000 THEN &#x27;medium&#x27;: the other two options miss value 1000; on the other hand, the BETWEEN includes both 50 and 1000.<\/p>", "answer_area": {"kind": "dropdowns", "code": "CREATE [dropdown 1] [dbo].[ProductsWithPricingGroup]\nAS\nSELECT ProductId,\n    ProductName,\n    ProductCategory,\n    ListPrice,\n    [dropdown 2]\n        WHEN ListPrice <= 50 THEN 'low'\n        [dropdown 3]\n        WHEN ListPrice > 1000 THEN 'high'\n    END AS PricingGroup\nFROM dbo.Products", "controls": [{"id": "d1", "options": ["FUNCTION", "PROCEDURE", "TABLE", "VIEW"], "correct": "VIEW"}, {"id": "d2", "options": ["CASE", "COALESCE", "IIF", "SET"], "correct": "CASE"}, {"id": "d3", "options": ["WHEN(ListPrice > 50 AND ListPrice < 1000) THEN 'medium'", "WHEN(ListPrice >= 50 AND ListPrice < 1000) THEN 'medium'", "WHEN ListPrice BETWEEN 50 AND 1000) THEN 'medium'"], "correct": "WHEN ListPrice BETWEEN 50 AND 1000) THEN 'medium'"}]}, "exh": ""}, {"n": 8, "kind": "single", "kind_label": "Single choice", "case": "Litware", "case_ref": 5, "stem_html": "<p>What should you recommend using to ingest the customer data into the data store in the AnalyticsPOC workspace?<\/p>", "options": [{"letter": "A", "text": "a stored procedure"}, {"letter": "B", "text": "a pipeline that contains a KQL activity"}, {"letter": "C", "text": "a Spark notebook"}, {"letter": "D", "text": "a dataflow"}], "key": ["D"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>D. a dataflow.<\/p><p>A dataflow ingests the customer data into the data store and applies any needed transformations with Power Query before loading it. A stored procedure executes SQL logic inside a database, a pipeline with a KQL activity targets KQL databases, and a Spark notebook is a code-first compute tool rather than the ingestion service for this scenario.<\/p>", "exh": ""}, {"n": 9, "kind": "single", "kind_label": "Single choice", "case": "Litware", "case_ref": 5, "stem_html": "<p>Which type of data store should you recommend in the AnalyticsPOC workspace?<\/p>", "options": [{"letter": "A", "text": "a data lake"}, {"letter": "B", "text": "a warehouse"}, {"letter": "C", "text": "a lakehouse"}, {"letter": "D", "text": "an external Hive metastore"}], "key": ["C"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>A lakehouse The data store must handle semi-structured and unstructured data, therefore a Lakehouse should be the optimal solution supporting read access with T-SQL and Python.<\/p>", "exh": ""}, {"n": 10, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric warehouse that contains a table named Staging.Sales. Staging.Sales contains the following columns.<\/p>\n<p>You need to write a T-SQL query that will return data for the year 2023 that displays ProductID and ProductName and has a summarized Amount that is higher than 10,000. Which query should you use?<\/p>", "options": [{"letter": "A", "text": "SELECT ProductID, ProductName, SUM(Amount) AS TotalAmount\nFROM Staging.Sales\nWHERE DATEPART(YEAR,SaleDate) = '2023'\nGROUP BY ProductID, ProductName\nHAVING SUM(Amount) > 10000", "code": true}, {"letter": "B", "text": "SELECT ProductID, ProductName, SUM(Amount) AS TotalAmount\nFROM Staging.Sales\nGROUP BY ProductID, ProductName\nHAVING DATEPART(YEAR,SaleDate) = '2023' AND SUM(Amount) > 10000", "code": true}, {"letter": "C", "text": "SELECT ProductID, ProductName, SUM(Amount) AS TotalAmount\nFROM Staging.Sales\nWHERE DATEPART(YEAR,SaleDate) = '2023' AND SUM(Amount) > 10000\nGROUP BY ProductID, ProductName", "code": true}, {"letter": "D", "text": "SELECT ProductID, ProductName, SUM(Amount) AS TotalAmount\nFROM Staging.Sales\nWHERE DATEPART(YEAR,SaleDate) = '2023'\nGROUP BY ProductID, ProductName\nHAVING TotalAmount > 10000", "code": true}], "key": ["A"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>SELECT ProductID, ProductName, SUM(Amount) AS TotalAmount<\/p>\n<p>FROM Staging.Sales<\/p>\n<p>WHERE DATEPART(YEAR, SaleDate) = &#x27;2023&#x27;<\/p>\n<p>GROUP BY ProductID, ProductName<\/p>\n<p>HAVING SUM(Amount) &gt; 10000<\/p>\n<p>Answer A is the only answer with valid syntax.<\/p>\n<p>Answer B is excluded because the filter on year should be included in the WHERE-clause. It is the result of a function, but it is not an aggregate.<\/p>\n<p>Answer C is excluded because the filter on SUM(Amount) should be included in the HAVING-clause, since this is an aggregate.<\/p>\n<p>Answer D is excluded because the HAVING-clause does not accept aliases.<\/p>", "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Staging.Sales columns<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Name<\/th><th>Data type<\/th><th>Nullable<\/th><\/tr><\/thead><tbody><tr><td>ProductID<\/td><td>Integer<\/td><td>No<\/td><\/tr><tr><td>ProductName<\/td><td>Varchar(30)<\/td><td>No<\/td><\/tr><tr><td>SalesDate<\/td><td>Datetime2(6)<\/td><td>No<\/td><\/tr><tr><td>WholesalePrice<\/td><td>Decimal(18,2)<\/td><td>Yes<\/td><\/tr><tr><td>Amount<\/td><td>Decimal(18,2)<\/td><td>Yes<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 11, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a data warehouse that contains a table named Stage.Customers. Stage.Customers contains all the customer record updates from a customer relationship management (CRM) system. There can be multiple updates per customer. You need to write a T-SQL query that will return the customer ID, name. postal code, and the last updated time of the most recent row for each customer ID. How should you complete the code? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p>\n<pre><code>WITH CUSTOMERBASE AS (\n    SELECT [CustomerID], [CustomerName], [PostalCode], [LastUpdated],\n    x = [dropdown 1] OVER (PARTITION BY CustomerID ORDER BY LastUpdated DESC)\n    FROM [LakehousePOC].[dbo].[CustomerChanges]\n)\nSELECT CustomerID, CustomerName, PostalCode, LastUpdated\nFROM CUSTOMERBASE\n[dropdown 2]<\/code><\/pre>\n<ul><li>Dropdown 1: LAST_Value() / NTILE() / ROW_NUMBER()<\/li><li>Dropdown 2: Having Max(LastUpdated) = 1 / WHERE LastUpdated = Max(LastUpdated) / WHERE X = 1<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>Box 1: ROW_NUMBER()<\/p>\n<p>ROW_NUMBER() is a window function that assigns a unique sequential number to each row within a partition, based on the ORDER BY clause. In this case, it is used to assign a row number to each CustomerID, ordering by LastUpdated DESC.<\/p>\n<p>This ensures that the most recent record for each CustomerID gets ROW_NUMBER() = 1.<\/p>\n<p>Box 2: WHERE X = 1<\/p>\n<p>The alias X stores the row number assigned by ROW_NUMBER().<\/p>\n<p>Since we only want the most recent row per CustomerID, we filter for X = 1.<\/p>\n<p>This approach ensures we get only the latest entry for each customer, based on LastUpdated.<\/p>", "answer_area": {"kind": "dropdowns", "code": "WITH CUSTOMERBASE AS (\n    SELECT [CustomerID], [CustomerName], [PostalCode], [LastUpdated],\n    x = [dropdown 1] OVER (PARTITION BY CustomerID ORDER BY LastUpdated DESC)\n    FROM [LakehousePOC].[dbo].[CustomerChanges]\n)\nSELECT CustomerID, CustomerName, PostalCode, LastUpdated\nFROM CUSTOMERBASE\n[dropdown 2]", "controls": [{"id": "d1", "options": ["LAST_Value()", "NTILE()", "ROW_NUMBER()"], "correct": "ROW_NUMBER()"}, {"id": "d2", "options": ["Having Max(LastUpdated) = 1", "WHERE LastUpdated = Max(LastUpdated)", "WHERE X = 1"], "correct": "WHERE X = 1"}]}, "exh": ""}, {"n": 12, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant. You plan to create a Fabric notebook that will use Spark DataFrames to generate Microsoft Power BI visuals. You run the following code.<\/p>\n<p>For each of the following statements, select Yes if the statement is true. Otherwise, select No. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p>\n<pre><code>from powerbiclient import QuickVisualize, get_dataset_config, Report\n\nPBI_visualize = QuickVisualize(get_dataset_config(df))\nPBI_visualize<\/code><\/pre>\n<ul><li>The code embeds an existing Power BI report. — Yes / No<\/li><li>The code creates a Power BI report. — Yes / No<\/li><li>The code displays a summary of the DataFrame. — Yes / No<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>&quot;The code embeds an existing Power BI report.&quot;<\/p>\n<p>Answer: No<\/p>\n<p>Embedding a Power BI report typically involves using the Power BI Embedded API, which is not indicated here.<\/p>\n<p>&quot;The code creates a Power BI report.&quot;<\/p>\n<p>Answer: Yes<\/p>\n<p>If the code generates a new Power BI report (e.g., using Python, Power BI REST API, or Power BI Desktop automation), then this is correct.<\/p>\n<p>&quot;The code displays a summary of the DataFrame.&quot;<\/p>\n<p>Answer: No<\/p>\n<p>Displaying a summary of a DataFrame would involve functions like df.describe(), df.info(), or df.head() in Pandas. Since this is about Power BI, this function is not relevant.<\/p>", "answer_area": {"kind": "statements", "controls": [{"id": "s1", "text": "The code embeds an existing Power BI report.", "correct": "No"}, {"id": "s2", "text": "The code creates a Power BI report.", "correct": "Yes"}, {"id": "s3", "text": "The code displays a summary of the DataFrame.", "correct": "No"}]}, "exh": ""}, {"n": 13, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You are the administrator of a Fabric workspace that contains a lakehouse named Lakehouse1. Lakehouse1 contains the following tables: Table1: A Delta table created by using a shortcut Table2: An external table created by using Spark Table3: A managed table - You plan to connect to Lakehouse1 by using its SQL endpoint. What will you be able to do after connecting to Lakehouse1?<\/p>", "options": [{"letter": "A", "text": "Read Table3."}, {"letter": "B", "text": "Update the data Table3."}, {"letter": "C", "text": "Read Table2."}, {"letter": "D", "text": "Update the data in Table1."}], "key": ["A"], "key_source": "derived", "key_note": "Key follows from the explanation.", "statement_answers": null, "explanation_html": "<p>A. Read Table3.<\/p>\n<p>When you connect to a Lakehouse SQL endpoint in Microsoft Fabric, you are connecting to:<\/p>\n<p>The SQL analytics endpoint (read-only T-SQL surface over lakehouse tables)<\/p>\n<p>The SQL endpoint has important limitations.<\/p>", "exh": ""}, {"n": 14, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a warehouse. You use a dataflow to load a new dataset from OneLake to the warehouse. You need to add a PowerQuery step to identify the maximum values for the numeric columns. Which function should you include in the step?<\/p>", "options": [{"letter": "A", "text": "Table.MaxN"}, {"letter": "B", "text": "Table.Max"}, {"letter": "C", "text": "Table.Range"}, {"letter": "D", "text": "Table.Profile"}], "key": ["D"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>The Table.Profile function in PowerQuery is specifically designed to provide statistical information about a table&#x27;s columns, including the maximum values for numeric columns. When you apply Table.Profile to your dataset, it generates a summary of each column, which includes the minimum, maximum, average, standard deviation, count of distinct values, and other useful statistics.<\/p>", "exh": ""}, {"n": 15, "kind": "multi", "kind_label": "Multi-select", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a machine learning model registered in a Fabric workspace. You need to use the model to generate predictions by using the PREDICT function in a Fabric notebook. Which two languages can you use to perform model scoring? Each correct answer presents a complete solution. NOTE: Each correct answer is worth one point.<\/p>", "options": [{"letter": "A", "text": "T-SQL"}, {"letter": "B", "text": "DAX"}, {"letter": "C", "text": "Spark SQL"}, {"letter": "D", "text": "PySpark"}], "key": ["C", "D"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>Spark SQL: This language leverages the Spark framework, which is commonly used for big data processing and machine learning. Spark SQL allows you to run SQL queries over data and includes support for machine learning model scoring with the PREDICT function.<\/p>\n<p>PySpark: This is the Python API for Spark. PySpark allows you to interact with Spark using Python, which is one of the most popular programming languages for data analysis and machine learning. PySpark includes capabilities for integrating with machine learning models and running predictions using the PREDICT function.<\/p>", "exh": ""}, {"n": 16, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You are analyzing the data in a Fabric notebook. You have a Spark DataFrame assigned to a variable named df. You need to use the Chart view in the notebook to explore the data manually. Which function should you run to make the data available in the Chart view?<\/p>", "options": [{"letter": "A", "text": "displayHTML"}, {"letter": "B", "text": "show"}, {"letter": "C", "text": "write"}, {"letter": "D", "text": "display"}], "key": ["D"], "key_source": "derived", "key_note": "Key follows from the explanation.", "statement_answers": null, "explanation_html": "<p>The Fabric built-in visualization function allows you to turn Apache Spark DataFrames, Pandas DataFrames and SQL query results into rich format data visualizations.<\/p><p>You can use the display function on dataframes created in PySpark and Scala, on Spark DataFrames or Resilient Distributed Datasets (RDD), to produce the rich dataframe table view and chart view.<\/p><p>The output of a SQL statement appears in the rendered table view by default.<\/p>", "exh": ""}, {"n": 17, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a Microsoft Power BI report named Report1. Report1 includes a Python visual. Data displayed by the visual is grouped automatically and duplicate rows are NOT displayed. You need all rows to appear in the visual. What should you do?<\/p>", "options": [{"letter": "A", "text": "Reference the columns in the Python code by index."}, {"letter": "B", "text": "Modify the Sort Column By property for all columns."}, {"letter": "C", "text": "Add a unique field to each row."}, {"letter": "D", "text": "Modify the Summarize By property for all columns."}], "key": ["C"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>C. Add a unique field to each row.<\/p>\n<p>Add a unique field to each row: When you add a unique identifier (such as an ID column or a combination of columns that uniquely identifies each row), Power BI recognizes that each row is unique and will display all rows in the visual without grouping them.<\/p>", "exh": ""}, {"n": 18, "kind": "dragdrop", "kind_label": "Drag & drop", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a semantic model. The model contains data about retail stores. You need to write a DAX query that will be executed by using the XMLA endpoint. The query must return a table of stores that have opened since December 1, 2023. How should you complete the DAX expression? To answer, drag the appropriate values to the correct targets. Each value may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p>\n<p>Values: DEFINE / EVALUATE / FILTER / SUMMARIZE / TABLE<\/p>\n<pre><code>[drop target 1]\nVAR _SalesSince =\n    DATE (2023, 12, 01)\n[drop target 2]\nFILTER (\n    [drop target 3] (Store, Store[Name], Store[OpenDate]),\n    Store[OpenDate] &gt;= _SalesSince\n)<\/code><\/pre>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>DEFINE This section defines a variable (VAR _SalesSince) that stores a specific date (2023-12-01).<\/p>\n<p>EVALUATE<\/p>\n<p>This keyword is required for executing and returning a table result in DAX queries.<\/p>\n<p>SUMMARIZE<\/p>\n<p>Used to create a summary table with specific columns.<\/p>\n<p>Here, it summarizes data from the Store table, including Store[Name] and Store[OpenDate].<\/p>", "answer_area": {"kind": "dragdrop", "values": ["DEFINE", "EVALUATE", "FILTER", "SUMMARIZE", "TABLE"], "code": "[drop target 1]\nVAR _SalesSince =\n    DATE (2023, 12, 01)\n[drop target 2]\nFILTER (\n    [drop target 3] (Store, Store[Name], Store[OpenDate]),\n    Store[OpenDate] >= _SalesSince\n)", "controls": [{"id": "t1", "label": "Target 1", "correct": "DEFINE"}, {"id": "t2", "label": "Target 2", "correct": "EVALUATE"}, {"id": "t3", "label": "Target 3", "correct": "SUMMARIZE"}]}, "exh": ""}, {"n": 19, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric workspace named Workspace1 that contains a dataflow named Dataflow1. Dataflow1 has a query that returns 2,000 rows. You view the query in Power Query as shown in the following exhibit.<\/p>\n<p>Power Query view of the query (Name: NYC_Taxi_Green_2015_01). Columns: vendorID, lpepPickupDatetime, passengerCount, tripDistance, pickupLongitude, dropoffLatitude, storeAndFwdFlag. Filter applied: Table.SelectRows(#&quot;Filtered rows&quot;, each [lpepPickupDatetime] &gt;= #date(2015, 1, 1) and [lpepPickupDatetime] &lt;= #date ...). Applied steps include Source, Navigation 1, Navigation 2, Navigation 3, Changed column type, Choose columns, Filtered rows.<\/p>\n<p>Column profile for pickupLongitude: Count 1000, Error count 0, Null count 0, Distinct count 935, Unique count 871, NaN count 0.<\/p>\n<p>What can you identify about the pickupLongitude column?<\/p>", "options": [{"letter": "A", "text": "The column has duplicate values."}, {"letter": "B", "text": "All the table rows are profiled."}, {"letter": "C", "text": "The column has missing values."}, {"letter": "D", "text": "There are 935 values that occur only once."}], "key": ["A"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>Answer A<\/p>\n<p>Distinct Value: This refers to all different values present in a dataset. When you retrieve distinct values from a column, you eliminate duplicate values so that each value is shown once. For example, if a column contains the values , the distinct values would be .<\/p>\n<p>Unique Value: This usually refers to values that appear only once in the dataset. Unlike distinct values, a unique value will only be considered if it has no duplicates at all. For example, if a column contains the values , the unique values would be , since only 1 appears without repetition.<\/p>", "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Power Query (NYC_Taxi_Green_2015_01)<\/div><ul class=\"exh-ul\"><li><b>Formula bar:<\/b> <code>Table.SelectRows(#\"Filtered rows\", each [lpepPickupDatetime] &gt;= #date(2015, 1, 1) and [lpepPickupDatetime] &lt;= #date…<\/code> (cut off)<\/li><li><b>Query settings:<\/b> Name NYC_Taxi_Green_2015_01 · Entity type Custom · Data destination: none<\/li><li><b>Applied steps:<\/b> Source → Navigation 1 → Navigation 2 → Navigation 3 → Changed column type → Choose columns → Filtered rows → <b>Filtered rows<\/b> (selected, last step)<\/li><li><b>Columns shown:<\/b> vendorID, lpepPickupDatetime, passengerCount, tripDistance, <b>pickupLongitude<\/b> (selected), dropoffLatitude, storeAndFwdFlag, …<\/li><\/ul><p class=\"exh-p\"><b>First rows of data<\/b> (1,000 rows loaded):<\/p><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th><\/th><th>vendorID<\/th><th>lpepPickupDatetime<\/th><th>passengerCount<\/th><th>tripDistance<\/th><th>pickupLongitude<\/th><th>dropoffLatitude<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>1<\/td><td>1/16/2015<\/td><td>3<\/td><td>24.3<\/td><td>-73.95768738<\/td><td>40.8983345<\/td><\/tr><tr><td>2<\/td><td>1<\/td><td>1/7/2015<\/td><td>4<\/td><td>4<\/td><td>-73.94503021<\/td><td>40.87893677<\/td><\/tr><tr><td>3<\/td><td>1<\/td><td>1/17/2015<\/td><td>5<\/td><td>1.8<\/td><td>-73.95258331<\/td><td>40.78994751<\/td><\/tr><tr><td>4<\/td><td>1<\/td><td>1/15/2015<\/td><td>1<\/td><td>12.4<\/td><td>-73.88159943<\/td><td>40.7924118<\/td><\/tr><tr><td>5<\/td><td>1<\/td><td>1/28/2015<\/td><td>1<\/td><td>6.1<\/td><td>-73.9666748<\/td><td>40.87965393<\/td><\/tr><tr><td>6<\/td><td>1<\/td><td>1/22/2015<\/td><td>1<\/td><td>8.1<\/td><td>-74.00089264<\/td><td>40.75233459<\/td><\/tr><tr><td>7<\/td><td>1<\/td><td>1/21/2015<\/td><td>1<\/td><td>3.1<\/td><td>-73.95635986<\/td><td>40.76185989<\/td><\/tr><tr><td>8<\/td><td>1<\/td><td>1/21/2015<\/td><td>1<\/td><td>2.4<\/td><td>-73.95615387<\/td><td>40.76541519<\/td><\/tr><tr><td>9<\/td><td>1<\/td><td>1/9/2015<\/td><td>1<\/td><td>0.1<\/td><td>-73.83602905<\/td><td>40.83687592<\/td><\/tr><tr><td>10<\/td><td>1<\/td><td>1/8/2015<\/td><td>1<\/td><td>12.8<\/td><td>-73.94503021<\/td><td>40.68849182<\/td><\/tr><tr><td>11<\/td><td>1<\/td><td>1/30/2015<\/td><td>1<\/td><td>10.4<\/td><td>-73.94632721<\/td><td>40.78804779<\/td><\/tr><tr><td>12<\/td><td>1<\/td><td>1/16/2015<\/td><td>1<\/td><td>14.1<\/td><td>-74.11373901<\/td><td>40.6802063<\/td><\/tr><\/tbody><\/table><\/div><p class=\"exh-p\"><b>Table column profile details<\/b> for <code>pickupLongitude<\/code>:<\/p><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Statistic<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Count<\/td><td>1000<\/td><\/tr><tr><td>Error count<\/td><td>0<\/td><\/tr><tr><td>Null count<\/td><td>0<\/td><\/tr><tr><td>Distinct count<\/td><td>935<\/td><\/tr><tr><td>Unique count<\/td><td>871<\/td><\/tr><tr><td>NaN count<\/td><td>0<\/td><\/tr><\/tbody><\/table><\/div><p class=\"exh-p\">Value distribution: a bar chart of the individual pickupLongitude values (first bar clearly the tallest).<\/p><\/div>"}, {"n": 20, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant named Tenant1 that contains a workspace named WS1. WS1 uses a capacity named C1 and contains a dataset named DS1. You need to ensure read-write access to DS1 is available by using XMLA endpoint. What should be modified first?<\/p>", "options": [{"letter": "A", "text": "the DS1 settings"}, {"letter": "B", "text": "the WS1 settings"}, {"letter": "C", "text": "the C1 settings"}, {"letter": "D", "text": "the Tenant1 settings"}], "key": ["C"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>C. the C1 settings.<\/p>\n<p>To enable read-write access via the XMLA endpoint, the XMLA endpoint must be set to Read/Write at the capacity level.<\/p>\n<p>In Power BI / Fabric:<\/p>\n<p>XMLA endpoint configuration is controlled at the Premium capacity level<\/p>\n<p>Workspaces inherit this setting from the capacity.<\/p>", "exh": ""}, {"n": 21, "kind": "multi", "kind_label": "Multi-select", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a workspace named Workspace1. Workspace1 is assigned to a Fabric capacity. You need to recommend a solution to provide users with the ability to create and publish custom Direct Lake semantic models by using external tools. The solution must follow the principle of least privilege. Which three actions in the Fabric Admin portal should you include in the recommendation? Each correct answer presents part of the solution. NOTE: Each correct answer is worth one point.<\/p>", "options": [{"letter": "A", "text": "From the Tenant settings, set Allow XMLA Endpoints and Analyze in Excel with on-premises datasets to Enabled."}, {"letter": "B", "text": "From the Tenant settings, set Allow Azure Active Directory guest users to access Microsoft Fabric to Enabled."}, {"letter": "C", "text": "From the Tenant settings, select Users can edit data model in the Power BI service."}, {"letter": "D", "text": "From the Capacity settings, set XMLA Endpoint to Read Write."}, {"letter": "E", "text": "From the Tenant settings, set Users can create Fabric items to Enabled."}, {"letter": "F", "text": "From the Tenant settings, enable Publish to Web."}], "key": ["A", "D", "E"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>A Allow XMLA Endpoints and Analyze in Excel with on-premises datasets.<\/p>\n<p>From the Tenant settings, set Allow XMLA Endpoints and Analyze in Excel with on-premises datasets to Enabled. This allows users to interact with the dataset via XMLA endpoints and analyze data using Excel.<\/p>\n<p>D. Set XMLA Endpoint to Read Write.<\/p>\n<p>In the Capacity settings, configure the XMLA Endpoint to Read Write. This ensures that users have the necessary permissions to create and modify semantic models through external tools.<\/p>\n<p>E Enable Users to Create Fabric Items.<\/p>\n<p>From the Tenant settings, set Users can create Fabric items to Enabled. This grants users the ability to create custom semantic models within the Fabric workspace.<\/p>", "exh": ""}, {"n": 22, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You are creating a semantic model in Microsoft Power BI Desktop. You plan to make bulk changes to the model by using the Tabular Model Definition Language (TMDL) extension for Microsoft Visual Studio Code. You need to save the semantic model to a file. Which file format should you use?<\/p>", "options": [{"letter": "A", "text": "PBIP"}, {"letter": "B", "text": "PBIX"}, {"letter": "C", "text": "PBIT"}, {"letter": "D", "text": "PBIDS"}], "key": ["A"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>A. PBIP.<\/p>\n<p>PBIP (Power BI Project) is a file format that supports the open-source TMDL format and is designed for integrating Power BI with external development environments like Visual Studio Code.<\/p>\n<p>PBIX is the common Power BI report file format but is not intended for bulk edits through TMDL. PBIT is a Power BI template file, used for creating new reports based on an existing structure but not for bulk editing in Visual Studio Code.<\/p>\n<p>PBIDS is for creating Power BI dataset connections and is unrelated to TMDL editing.<\/p>", "exh": ""}, {"n": 23, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a warehouse named Warehouse1. Warehouse1 contains three schemas named schemaA, schemaB, and schemaC. You need to ensure that a user named User1 can truncate tables in schemaA only. How should you complete the T-SQL statement? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p>\n<pre><code>GRANT [dropdown 1] ON [dropdown 2] TO User1;<\/code><\/pre>\n<ul><li>Dropdown 1: ALTER / CONNECT / EXECUTE<\/li><li>Dropdown 2: DATABASE::schemaA / OBJECT::schemaA / SCHEMA::schemaA<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>ALTER: Allows modification of schema objects .<\/p>\n<p>SCHEMA::schemaA: Grants permissions on an entire schema instead of an individual database or object .<\/p>", "answer_area": {"kind": "dropdowns", "code": "GRANT [dropdown 1] ON [dropdown 2] TO User1;", "controls": [{"id": "d1", "options": ["ALTER", "CONNECT", "EXECUTE"], "correct": "ALTER"}, {"id": "d2", "options": ["DATABASE::schemaA", "OBJECT::schemaA", "SCHEMA::schemaA"], "correct": "SCHEMA::schemaA"}]}, "exh": ""}, {"n": 24, "kind": "multi", "kind_label": "Multi-select", "case": null, "case_ref": null, "stem_html": "<p>You plan to deploy Microsoft Power BI items by using Fabric deployment pipelines. You have a deployment pipeline that contains three stages named Development, Test, and Production. A workspace is assigned to each stage. You need to provide Power BI developers with access to the pipeline. The solution must meet the following requirements: Ensure that the developers can deploy items to the workspaces for Development and Test. Prevent the developers from deploying items to the workspace for Production. Follow the principle of least privilege. Which three levels of access should you assign to the developers? Each correct answer presents part of the solution. NOTE: Each correct answer is worth one point.<\/p>", "options": [{"letter": "A", "text": "Build permission to the production semantic models"}, {"letter": "B", "text": "Admin access to the deployment pipeline"}, {"letter": "C", "text": "Viewer access to the Development and Test workspaces"}, {"letter": "D", "text": "Viewer access to the Production workspace"}, {"letter": "E", "text": "Contributor access to the Development and Test workspaces"}, {"letter": "F", "text": "Contributor access to the Production workspace"}], "key": ["B", "D", "E"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>Admin access to the deployment pipeline : Admin access to the deployment pipeline is necessary to manage the pipeline stages and deployment processes. This allows developers to configure deployments between stages but does not grant direct access to the workspaces themselves.<\/p>\n<p>Viewer access to the Production workspace : Providing Viewer access to the Production workspace ensures that developers can see the items in the Production stage but cannot make changes or deploy items to the Production workspace. This restriction aligns with the requirement to prevent developers from deploying to the Production workspace.<\/p>\n<p>Contributor access to the Development and Test workspaces : Contributor access to the Development and Test workspaces allows developers to deploy and modify items within these stages. This access is necessary to enable developers to work on and test their items before they move to production.<\/p>", "exh": ""}, {"n": 25, "kind": "multi", "kind_label": "Multi-select", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric workspace that contains a DirectQuery semantic model. The model queries a data source that has 500 million rows. You have a Microsoft Power Bi report named Report1 that uses the model. Report1 contains visuals on multiple pages. You need to reduce the query execution time for the visuals on all the pages. What are two features that you can use? Each correct answer presents a complete solution, NOTE: Each correct answer is worth one point.<\/p>", "options": [{"letter": "A", "text": "user-defined aggregations"}, {"letter": "B", "text": "automatic aggregation"}, {"letter": "C", "text": "query caching"}, {"letter": "D", "text": "OneLake integration"}], "key": ["A", "B"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>A. User-defined aggregations.<\/p>\n<p>Aggregations help improve query performance by pre-aggregating data at different levels (e.g., summarizing sales by month instead of querying raw transactions).<\/p>\n<p>Users define aggregations based on expected queries, reducing the need to scan massive datasets.<\/p>\n<p>B. Automatic aggregations.<\/p>\n<p>Automatic aggregations optimize query performance by learning from query patterns and storing frequently used aggregate results in memory.<\/p>\n<p>This reduces the load on the underlying data source, speeding up DirectQuery performance.<\/p>", "exh": ""}, {"n": 26, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains 30 CSV files in OneLake. The files are updated daily. You create a Microsoft Power BI semantic model named Model1 that uses the CSV files as a data source. You configure incremental refresh for Model1 and publish the model to a Premium capacity in the Fabric tenant. When you initiate a refresh of Model1, the refresh fails after running out of resources. What is a possible cause of the failure?<\/p>", "options": [{"letter": "A", "text": "Query folding is occurring."}, {"letter": "B", "text": "Only refresh complete days is selected."}, {"letter": "C", "text": "XMLA Endpoint is set to Read Only."}, {"letter": "D", "text": "Query folding is NOT occurring."}, {"letter": "E", "text": "The delta type of the column used to partition the data has changed."}], "key": ["D"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>D. Query folding is NOT occurring.<\/p>\n<p>Incremental refresh depends on query folding to work efficiently.<\/p>\n<p>When query folding works:<\/p>\n<p>Power BI pushes the RangeStart and RangeEnd filters down to the data source.<\/p>\n<p>Only the required partitions are processed.<\/p>\n<p>Memory usage is controlled.<\/p>\n<p>However, with CSV files in OneLake:<\/p>\n<p>Query folding typically does NOT occur.<\/p>\n<p>The entire dataset may be loaded into memory first. Filtering happens after loading.<\/p>\n<p>This can cause excessive memory consumption.<\/p>\n<p>Result: Refresh fails due to running out of resources, even on Premium capacity.<\/p>", "exh": ""}, {"n": 27, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that uses a Microsoft Power BI Premium capacity. You need to enable scale-out for a semantic model. What should you do first?<\/p>", "options": [{"letter": "A", "text": "At the semantic model level, set Large dataset storage format to Off."}, {"letter": "B", "text": "At the tenant level, set Create and use Metrics to Enabled."}, {"letter": "C", "text": "At the semantic model level, set Large dataset storage format to On."}, {"letter": "D", "text": "At the tenant level, set Data Activator to Enabled."}], "key": ["C"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>C. At the semantic model level, set Large dataset storage format to On.<\/p>\n<p>To enable scale-out for a semantic model in Power BI Premium capacity, the model must first:<\/p>\n<p>Use Large dataset storage format<\/p>\n<p>Scale-out allows:<\/p>\n<p>Multiple read-only replicas of the semantic model<\/p>\n<p>Improved query performance<\/p>\n<p>Better concurrency handling.<\/p>", "exh": ""}, {"n": 28, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a warehouse. The warehouse uses row-level security (RLS). You create a Direct Lake semantic model that uses the Delta tables and RLS of the warehouse. When users interact with a report built from the model, which mode will be used by the DAX queries?<\/p>", "options": [{"letter": "A", "text": "DirectQuery"}, {"letter": "B", "text": "Dual"}, {"letter": "C", "text": "Direct Lake"}, {"letter": "D", "text": "Import"}], "key": ["A"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>A. Direct Query &quot;Row-level security only applies to queries on a Warehouse or SQL analytics endpoint in Fabric. Power BI queries on a warehouse in Direct Lake mode will fall back to Direct Query mode to abide by row-level security.&quot;<\/p>\n<p>When users interact with a report built from a Direct Lake semantic model, which leverages row-level security (RLS) and Delta tables from a warehouse, the DAX queries will operate in DirectQuery mode.<\/p>", "exh": ""}, {"n": 29, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a complex semantic model. The model is based on a star schema and contains many tables, including a fact table named Sales. You need to create a diagram of the model. The diagram must contain only the Sales table and related tables. What should you use from Microsoft Power BI Desktop?<\/p>", "options": [{"letter": "A", "text": "data categories"}, {"letter": "B", "text": "Data view"}, {"letter": "C", "text": "Model view"}, {"letter": "D", "text": "DAX query view"}], "key": ["C"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>C. Model view.<\/p>\n<p>Model view in Microsoft Power BI Desktop allows you to visualize and manage relationships between tables in a semantic model.<\/p>\n<p>Since the requirement is to create a diagram that includes only the Sales table and its related tables, Model view is the best choice.<\/p>\n<p>In Model view, you can filter and arrange tables to focus only on relevant parts of the data model, making it easier to analyze relationships.<\/p>", "exh": ""}, {"n": 30, "kind": "multi", "kind_label": "Multi-select", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a semantic model. The model uses Direct Lake mode. You suspect that some DAX queries load unnecessary columns into memory. You need to identify the frequently used columns that are loaded into memory. What are two ways to achieve the goal? Each correct answer presents a complete solution. NOTE: Each correct answer is worth one point.<\/p>", "options": [{"letter": "A", "text": "Use the Analyze in Excel feature."}, {"letter": "B", "text": "Use the Vertipaq Analyzer tool."}, {"letter": "C", "text": "Query the $System.DISCOVER_STORAGE_TABLE_COLUMN_SEGMENTS dynamic management view (DMV)."}, {"letter": "D", "text": "Query the DISCOVER_MEMORYGRANT dynamic management view (DMV)."}], "key": ["B", "C"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>B. Use the Vertipaq Analyzer tool.<\/p>\n<p>Vertipaq Analyzer: This tool helps analyze the internal structure of your Power BI model. It provides detailed information about the storage and memory usage of your model, including which columns are frequently accessed and loaded into memory. This can help you identify unnecessary columns that are consuming resources.<\/p>\n<p>Steps:<\/p>\n<p>Export your Power BI model to a .pbix file.<\/p>\n<p>Open the .pbix file in Power BI Desktop.<\/p>\n<p>Use the Vertipaq Analyzer tool to analyze the model and review the column usage statistics.<\/p>\n<p>C. Query the $System.DISCOVER_STORAGE_TABLE_COLUMN_SEGMENTS dynamic management view (DMV).<\/p>\n<p>DMVs: Dynamic Management Views (DMVs) provide detailed information about the operations of your Power BI models. Specifically, the $System.DISCOVER_STORAGE_TABLE_COLUMN_SEGMENTS DMV can give you insights into the storage and usage patterns of individual columns within your model.<\/p>", "exh": ""}, {"n": 31, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have the source data model shown in the following exhibit. The primary keys of the tables are indicated by a key symbol beside the columns involved in each key. You need to create a dimensional data model that will enable the analysis of order items by date, product, and customer. What should you include in the solution? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>\n<p>Source data model — tables and key columns (key symbol beside a column):<\/p>\n<ul><li>Date: Date (key)<\/li><li>Product: CompanyID (key), ProductID (key)<\/li><li>OrderItem: OrderDate, CompanyID, ProductID, OrderItemID (key), CustomerID<\/li><li>Company: CompanyID (key)<\/li><li>Customer: CompanyID (key), CustomerID (key)<\/li><\/ul>\n<p>Answer Area<\/p>\n<ul><li>The relationship between OrderItem and Product must be based on: The ProductID column / Both the CompanyID and the ProductID columns / A new key that combines the CompanyID and ProductID columns<\/li><li>The Company entity must be: Omitted / Denormalized into the Product entity only / Denormalized into the Customer and Product entities<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>The Product ID column.<\/p>\n<p>In a proper star schema:<\/p>\n<p>OrderItem is a fact table.<\/p>\n<p>Product is a dimension table.<\/p>\n<p>The relationship should use the primary key of the dimension.<\/p>\n<p>Denormalized into the Customer and Product entities.<\/p>\n<p>In star schema modeling.<\/p>\n<p>Snowflake schemas (separate Company table linked to Product and Customer) are not ideal in Power BI.<\/p>\n<p>Power BI performs best with denormalized dimensions.<\/p>", "answer_area": {"kind": "dropdowns", "controls": [{"id": "d1", "label": "The relationship between OrderItem and Product must be based on:", "options": ["The ProductID column", "Both the CompanyID and the ProductID columns", "A new key that combines the CompanyID and ProductID columns"], "correct": "The ProductID column"}, {"id": "d2", "label": "The Company entity must be:", "options": ["Omitted", "Denormalized into the Product entity only", "Denormalized into the Customer and Product entities"], "correct": "Denormalized into the Customer and Product entities"}]}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Source data model (ER diagram)<\/div><p class=\"exh-p\">Primary keys are marked with a key symbol beside the columns of each key.<\/p><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Table<\/th><th>Columns (key columns marked 🔑)<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>🔑 Date<\/td><\/tr><tr><td>Product<\/td><td>🔑 CompanyID, 🔑 ProductID (composite key)<\/td><\/tr><tr><td>Company<\/td><td>🔑 CompanyID<\/td><\/tr><tr><td>Customer<\/td><td>🔑 CompanyID, 🔑 CustomerID (composite key)<\/td><\/tr><tr><td>OrderItem<\/td><td>OrderDate, CompanyID, ProductID, 🔑 OrderItemID, CustomerID<\/td><\/tr><\/tbody><\/table><\/div><p class=\"exh-p\"><b>Relationships<\/b> (one-to-many, “1” side first): Date → OrderItem · Product → OrderItem · Company → OrderItem · Customer → OrderItem · Company → Product · Company → Customer.<\/p><\/div>"}, {"n": 32, "kind": "multi", "kind_label": "Multi-select", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a semantic model named Model1. Model1 uses Import mode. Model1 contains a table named Orders. Orders has 100 million rows and the following fields.<\/p>\n<p>You need to reduce the memory used by Model1 and the time it takes to refresh the model. Which two actions should you perform? Each correct answer presents part of the solution. NOTE: Each correct answer is worth one point.<\/p>", "options": [{"letter": "A", "text": "Split OrderDateTime into separate date and time columns."}, {"letter": "B", "text": "Replace TotalQuantity with a calculated column."}, {"letter": "C", "text": "Convert Quantity into the Text data type."}, {"letter": "D", "text": "Replace TotalSalesAmount with a measure."}], "key": ["A", "D"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>A. Split OrderDateTime into separate date and time columns .<\/p>\n<p>In Import mode, Power BI compresses data more efficiently when Date and Time are stored separately instead of a single DateTime column.<\/p>\n<p>DateTime values have higher cardinality (more unique values), which increases memory usage.<\/p>\n<p>Splitting into Date and Time reduces the number of unique values, improving compression and reducing memory usage.<\/p>\n<p>D. Replace TotalSalesAmount with a measure .<\/p>\n<p>Measures in Power BI are calculated at query time and do not consume additional memory, unlike calculated columns, which take up storage.<\/p>\n<p>TotalSalesAmount is likely derived from Quantity * UnitPrice, so instead of storing it as a column, it should be computed dynamically using a DAX measure.<\/p>\n<p>This reduces model size and improves performance.<\/p>", "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Semantic model columns<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Name<\/th><th>Data type<\/th><th>Description<\/th><\/tr><\/thead><tbody><tr><td>OrderID<\/td><td>Integer<\/td><td>Column imported from the source<\/td><\/tr><tr><td>OrderDateTime<\/td><td>Date/Time<\/td><td>Column imported from the source<\/td><\/tr><tr><td>Quantity<\/td><td>Integer<\/td><td>Column imported from the source<\/td><\/tr><tr><td>Price<\/td><td>Decimal<\/td><td>Column imported from the source<\/td><\/tr><tr><td>TotalSalesAmount<\/td><td>Decimal<\/td><td>Calculated c
