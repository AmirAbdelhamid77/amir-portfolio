olumns. These columns will be used for the slicers to filter the data by month.<\/p>\n<p>Action 2: Select unpivot other columns. This action will transform the 2019, 2020, and 2021 columns into rows, creating a column called &quot;Attribute&quot; that contains the years and a column called &quot;Value&quot; that contains the sales data. This step makes the data more suitable for visualization and filtering by year.<\/p>\n<p>Action 3: Rename the Attribute column as Year and the value column as sales. Renaming the columns provides a more descriptive and meaningful structure for your data.<\/p>\n<p>After performing these actions, your data will be in a format that allows you to create visuals and add slicers for the month and year in Power BI.<\/p>", "answer_area": {"controls": [{"correct": "Select the Month and MonthNumber columns.", "id": "t1", "label": "Step 1"}, {"correct": "Select Unpivot other columns.", "id": "t2", "label": "Step 2"}, {"correct": "Rename the Attribute column as Year and the Value column as Sales.", "id": "t3", "label": "Step 3"}], "kind": "dragdrop", "values": ["Select the Month and MonthNumber columns.", "Select Unpivot other columns.", "Rename the Attribute column as Year and the Value column as Sales.", "Select the 2019, 2020, and 2021 columns.", "Select Transpose."]}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Power Query table<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Month (text)<\/th><th>MonthNumber<\/th><th>2019<\/th><th>2020<\/th><th>2021<\/th><\/tr><\/thead><tbody><tr><td>Jan<\/td><td>1<\/td><td>345<\/td><td>5526<\/td><td>3456<\/td><\/tr><tr><td>Feb<\/td><td>2<\/td><td>758<\/td><td>773<\/td><td>0<\/td><\/tr><tr><td>Mar<\/td><td>3<\/td><td>37763<\/td><td>570<\/td><td>null<\/td><\/tr><tr><td>Apr<\/td><td>4<\/td><td>8364<\/td><td>9417<\/td><td>null<\/td><\/tr><tr><td>May<\/td><td>5<\/td><td>58256<\/td><td>276<\/td><td>null<\/td><\/tr><tr><td>June<\/td><td>6<\/td><td>6722<\/td><td>235<\/td><td>null<\/td><\/tr><tr><td>July<\/td><td>7<\/td><td>55225<\/td><td>6297<\/td><td>null<\/td><\/tr><tr><td>Aug<\/td><td>8<\/td><td>673<\/td><td>63<\/td><td>null<\/td><\/tr><tr><td>Sep<\/td><td>9<\/td><td>552<\/td><td>357<\/td><td>null<\/td><\/tr><tr><td>Oct<\/td><td>10<\/td><td>7838<\/td><td>24214<\/td><td>null<\/td><\/tr><tr><td>Nov<\/td><td>11<\/td><td>83544<\/td><td>257<\/td><td>null<\/td><\/tr><tr><td>Dec<\/td><td>12<\/td><td>32455<\/td><td>389<\/td><td>null<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 20, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You are using Power BI Desktop to connect to an Azure SQL database. The connection is configured as shown in the following exhibit.<\/p>\n<p>Use the drop-down menus to select the answer choice that completes each statement based on the information presented in the graphic. NOTE: Each correct solution is worth one point.<\/p>\n<p>Answer Area<\/p>\n<ul><li>The default timeout for the connection from Power BI Desktop to the database will be unlimited / one minute / 10 minutes<\/li><li>The Navigator will display all the tables / only tables that contain data / only tables that contain hierarchies<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>10 minutes.<\/p>\n<p>Only tables that Contain data.<\/p>\n<p>Command timeout in minutes: If your connection lasts longer than 10 minutes (the default timeout), you can enter another value in minutes to keep the connection open longer. This option is only available in Power Query Desktop.<\/p>\n<p>Navigate using full hierarchy: If checked, the navigator displays the complete hierarchy of tables in the database you&#x27;re connecting to. If cleared, the navigator displays only the tables whose columns and rows contain data.<\/p>\n<p>Include relationship columns: If checked, includes columns that might have relationships to other tables. If this box is cleared, you won’t see those columns.<\/p>", "answer_area": {"controls": [{"correct": "10 minutes", "id": "d1", "label": "The default timeout for the connection from Power BI Desktop to the database will be", "options": ["unlimited", "one minute", "10 minutes"]}, {"correct": "only tables that contain data", "id": "d2", "label": "The Navigator will display", "options": ["all the tables", "only tables that contain data", "only tables that contain hierarchies"]}], "kind": "dropdowns"}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): “SQL Server database” connection dialog<\/div><ul class=\"exh-ul\"><li><b>Server:<\/b> mydb.database.windows.net<\/li><li><b>Database (optional):<\/b> db1<\/li><li><b>Data Connectivity mode:<\/b> ◉ Import &nbsp; ○ DirectQuery<\/li><li><b>Advanced options:<\/b> Command timeout in minutes (optional): empty · SQL statement (optional, requires database): empty<\/li><li>☑ Include relationship columns · ☐ Navigate using full hierarchy · ☐ Enable SQL Server Failover support<\/li><\/ul><\/div>"}, {"n": 21, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have the Azure SQL databases shown in the following table.<\/p>\n<p>You plan to build a single PBIX file to meet the following requirements:<\/p>\n<ul><li>Data must be consumed from the database that corresponds to each stage of the development lifecycle.<\/li><li>Power BI deployment pipelines must NOT be used.<\/li><li>The solution must minimize administrative effort.<\/li><\/ul>\n<p>What should you do? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p>\n<ul><li>Create: One parameter / Two parameters / Three parameters<\/li><li>Parameter type: Text / True/False / Decimal number<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>To meet the requirements specified, we can use a single parameter in the PBIX file that controls which database is used for data consumption based on the stage of the development lifecycle.<\/p>\n<p>We can use a Text parameter type in Power BI to achieve this. The parameter can be used to switch between the different database connections when a user interacts with the report. The text parameter could include values such as &quot;Development&quot;, &quot;Staging&quot;, and &quot;Production&quot;, which correspond to the different databases shown in the table.<\/p>\n<p>The parameter can then be used in the queries to dynamically filter the data based on the selected stage of the development lifecycle. By using a single parameter, we can minimize administrative effort and ensure that the report works with each stage of the development lifecycle.<\/p>", "answer_area": {"controls": [{"correct": "One parameter", "id": "d1", "label": "Create:", "options": ["One parameter", "Two parameters", "Three parameters"]}, {"correct": "Text", "id": "d2", "label": "Parameter type:", "options": ["Text", "True/False", "Decimal number"]}], "kind": "dropdowns"}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Databases<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Name<\/th><th>Stage<\/th><th>Server URL<\/th><\/tr><\/thead><tbody><tr><td>db-powerbi-dev<\/td><td>Development<\/td><td>dev.database.windows.net<\/td><\/tr><tr><td>db-powerbi-uat<\/td><td>Test<\/td><td>uat.database.windows.net<\/td><\/tr><tr><td>db-powerbi-prod<\/td><td>Production<\/td><td>prod.database.windows.net<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 22, "kind": "multi", "kind_label": "Multi-select", "case": null, "case_ref": null, "stem_html": "<p>You are creating a query to be used as a Country dimension in a star schema. A snapshot of the source data is shown in the following table.<\/p>\n<p>You need to create the dimension. The dimension must contain a list of unique countries. Which two actions should you perform? Each correct answer presents part of the solution. NOTE: Each correct selection is worth one point.<\/p>", "options": [{"letter": "A", "text": "Delete the Country column."}, {"letter": "B", "text": "Remove duplicates from the table."}, {"letter": "C", "text": "Remove duplicates from the City column."}, {"letter": "D", "text": "Delete the City column."}, {"letter": "E", "text": "Remove duplicates from the Country column."}], "key": ["D", "E"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>D. Delete the City column.<\/p>\n<p>Since the requirement is:<\/p>\n<p>The dimension must contain a list of unique countries<\/p>\n<p>The City column is unnecessary and must be removed to ensure the dimension contains only country-level data.<\/p>\n<p>E. Remove duplicates from the Country column.<\/p>\n<p>To create a proper dimension:<\/p>\n<p>Each country must appear only once<\/p>\n<p>Therefore, duplicates must be removed from the Country column<\/p>\n<p>This ensures a clean one-row-per-country dimension.<\/p>\n<p>Why the Other Options Are Incorrect:<\/p>\n<p>A. Delete the Country column<\/p>\n<p>❌ This removes the very field you need.<\/p>\n<p>B. Remove duplicates from the table<\/p>\n<p>❌ This removes duplicate rows, not necessarily duplicate countries.<\/p>\n<p>If multiple cities exist per country, duplicates would remain.<\/p>\n<p>C. Remove duplicates from the City column<\/p>\n<p>❌ The requirement is about countries, not cities.<\/p>", "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Country / City<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Country<\/th><th>City<\/th><\/tr><\/thead><tbody><tr><td>USA<\/td><td>Seattle<\/td><\/tr><tr><td>USA<\/td><td>New York<\/td><\/tr><tr><td>USA<\/td><td>Denver<\/td><\/tr><tr><td>UK<\/td><td>Manchester<\/td><\/tr><tr><td>UK<\/td><td>London<\/td><\/tr><tr><td>Japan<\/td><td>Tokyo<\/td><\/tr><tr><td>Brazil<\/td><td>Rio<\/td><\/tr><tr><td>Brazil<\/td><td>Sao Paulo<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 23, "kind": "dragdrop", "kind_label": "Drag & drop", "case": null, "case_ref": null, "stem_html": "<p>You use Power Query Editor to preview the data shown in the following exhibit.<\/p>\n<p>You need to clean and transform the query so that all the rows of data are maintained, and error values in the discount column are replaced with a discount of 0.05. The solution must minimize administrative effort. Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.<\/p>\n<p>Answer Area<\/p>\n<p>Values: Select the discount column. / Select the price column. / For the discount column, change Data Type to Decimal Number. / For the discount column, change Data Type to Whole Number. / Select Replace Errors to replace each error value with 0.05.<\/p>\n<ul><li>Step 1<\/li><li>Step 2<\/li><li>Step 3<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>Select the discount Column<\/p>\n<p>Select Replace Errors to replace each error value with 0.05<\/p>\n<p>For the discount column ,Change Data Type to Decimal Number.<\/p>", "answer_area": {"controls": [{"correct": "Select the discount column.", "id": "t1", "label": "Step 1"}, {"correct": "Select Replace Errors to replace each error value with 0.05.", "id": "t2", "label": "Step 2"}, {"correct": "For the discount column, change Data Type to Decimal Number.", "id": "t3", "label": "Step 3"}], "kind": "dragdrop", "values": ["Select the discount column.", "Select the price column.", "For the discount column, change Data Type to Decimal Number.", "For the discount column, change Data Type to Whole Number.", "Select Replace Errors to replace each error value with 0.05."]}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Power Query preview with column quality<\/div><ul class=\"exh-ul\"><li><b>SKU<\/b> (text): 100% valid · 11 distinct, 11 unique<\/li><li><b>price<\/b> (number): 100% valid · 9 distinct, 7 unique<\/li><li><b>discount<\/b> (any type): 63% Error, 0% empty<\/li><\/ul><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>SKU<\/th><th>price<\/th><th>discount<\/th><\/tr><\/thead><tbody><tr><td>P00001<\/td><td>100<\/td><td>0.08<\/td><\/tr><tr><td>P00002<\/td><td>150<\/td><td>0.03<\/td><\/tr><tr><td>P00003<\/td><td>130<\/td><td>Error<\/td><\/tr><tr><td>P00004<\/td><td>200<\/td><td>0.06<\/td><\/tr><tr><td>P00005<\/td><td>80<\/td><td>Error<\/td><\/tr><tr><td>P00006<\/td><td>350<\/td><td>Error<\/td><\/tr><tr><td>P00007<\/td><td>100<\/td><td>Error<\/td><\/tr><tr><td>P00008<\/td><td>200<\/td><td>0.05<\/td><\/tr><tr><td>P00009<\/td><td>135<\/td><td>Error<\/td><\/tr><tr><td>P00010<\/td><td>90<\/td><td>Error<\/td><\/tr><tr><td>P00011<\/td><td>120<\/td><td>Error<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 24, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You attempt to use Power Query Editor to create a custom column and receive the error message shown in the following exhibit.<\/p>\n<p>Use the drop-down menus to select the answer choice that completes each statement based on the information presented in the graphic. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p>\n<ul><li>The error is caused by [answer choice]. error values in the source data / mismatched data types / NULL values<\/li><li>The desired outcome of the custom column is [answer choice]. 1A / A&amp;1 / A1<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>mismatched data types<\/p>\n<p>A1<\/p>\n<p>Mismatched data types and A1 are the correct answers.<\/p>\n<p>The custom column expression is trying to concatenate (use the &quot;&amp;&quot; operator) a text value and a number value, which are mismatched data types.<\/p>\n<p>In this case, the left side of the operator is a text value (e.g.,&quot;A&quot;), and the right side is a number value (e.g.,1).<\/p>\n<p>To achieve the desired outcome of the custom column as &quot;A1&quot;, you should ensure that both sides of the &quot;&amp;&quot; operator have the same data type, which is text in this case.<\/p>", "answer_area": {"controls": [{"correct": "mismatched data types", "id": "d1", "label": "The error is caused by [answer choice].", "options": ["error values in the source data", "mismatched data types", "NULL values"]}, {"correct": "A1", "id": "d2", "label": "The desired outcome of the custom column is [answer choice].", "options": ["1A", "A&1", "A1"]}], "kind": "dropdowns"}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Power Query error<\/div><pre class=\"exh-pre\"><code>= #&quot;Added Custom&quot;{0}[Custom]\n\nExpression.Error: We cannot apply operator &amp; to types Text and Number.\nDetails:\n    Operator=&amp;\n    Left=A\n    Right=1<\/code><\/pre><\/div>"}, {"n": 25, "kind": "multi", "kind_label": "Multi-select", "case": null, "case_ref": null, "stem_html": "<p>From Power Query Editor, you attempt to execute a query and receive the following error message. Datasource.Error: Could not find file. What are two possible causes of the error? Each correct answer presents a complete solution. NOTE: Each correct selection is worth one point.<\/p>", "options": [{"letter": "A", "text": "You do not have permissions to the file."}, {"letter": "B", "text": "An incorrect privacy level was used for the data source."}, {"letter": "C", "text": "The file is locked."}, {"letter": "D", "text": "The referenced file was moved to a new location."}], "key": ["A", "D"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>A and D. A if PBI cant find the file in the given path and D due this.<\/p>\n<p>p/252703<\/p>", "exh": ""}, {"n": 26, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have data in a Microsoft Excel worksheet as shown in the following table.<\/p>\n<p>You need to use Power Query to clean and transform the dataset. The solution must meet the following requirements: •If the discount column returns an error, a discount of 0.05 must be used. •All the rows of data must be maintained. •Administrative effort must be minimized. What should you do in Power Query Editor?<\/p>", "options": [{"letter": "A", "text": "Select Replace Errors."}, {"letter": "B", "text": "Edit the query in the Query Errors group."}, {"letter": "C", "text": "Select Remove Errors."}, {"letter": "D", "text": "Select Keep Errors."}], "key": ["A"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>A. Select Replace Errors.<\/p>\n<p>You must keep all rows and substitute any error in the Discount column with 0.05.<\/p>\n<p>Replace Errors lets you specify a replacement value for error cells in a column—exactly matching the requirement with minimal effort.<\/p>\n<p>* Other options:<\/p>\n<ul><li>C.Remove Errors → deletes rows containing errors (violates “maintain all rows”).<\/li><\/ul>\n<ul><li>D.Keep Errors → keeps only the error rows (also violates “maintain all rows”).<\/li><\/ul>\n<ul><li>B.Edit the query in the Query Errors group → not the right action for replacing error values; and there isn’t a<\/li><\/ul>\n<p>standard “Query Errors” group used for this scenario.<\/p>", "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Excel worksheet<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th><\/th><th>A (SKU)<\/th><th>B (price)<\/th><th>C (discount)<\/th><\/tr><\/thead><tbody><tr><td>2<\/td><td>P00001<\/td><td>100<\/td><td>0.08<\/td><\/tr><tr><td>3<\/td><td>P00002<\/td><td>150<\/td><td>0.03<\/td><\/tr><tr><td>4<\/td><td>P00003<\/td><td>130<\/td><td>#DIV/0!<\/td><\/tr><tr><td>5<\/td><td>P00004<\/td><td>200<\/td><td>0.06<\/td><\/tr><tr><td>6<\/td><td>P00005<\/td><td>80<\/td><td>#NAME?<\/td><\/tr><tr><td>7<\/td><td>P00006<\/td><td>350<\/td><td>#N/A<\/td><\/tr><tr><td>8<\/td><td>P00007<\/td><td>100<\/td><td>#NULL!<\/td><\/tr><tr><td>9<\/td><td>P00008<\/td><td>200<\/td><td>0.05<\/td><\/tr><tr><td>10<\/td><td>P00009<\/td><td>135<\/td><td>#NUM!<\/td><\/tr><tr><td>11<\/td><td>P00010<\/td><td>90<\/td><td>#REF!<\/td><\/tr><tr><td>12<\/td><td>P00011<\/td><td>120<\/td><td>#VALUE!<\/td><\/tr><\/tbody><\/table><\/div><p class=\"exh-p\">Row 1 holds the headers SKU, price, discount.<\/p><\/div>"}, {"n": 27, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a CSV file that contains user complaints. The file contains a column named Logged. Logged contains the date and time each complaint occurred. The data in Logged is in the following format: 2018-12-31 at 08:59. You need to be able to analyze the complaints by the logged date and use a built-in date hierarchy. What should you do?<\/p>", "options": [{"letter": "A", "text": "Apply the Parse function from the Data transformations options to the Logged column."}, {"letter": "B", "text": "Change the data type of the Logged column to Date."}, {"letter": "C", "text": "Split the Logged column by using at as the delimiter."}, {"letter": "D", "text": "Create a column by example that starts with 2018-12-31."}], "key": ["C"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>C.Split the Logged column by using at as the delimiter.<\/p>\n<p>You should split the Logged column by using &quot;at&quot; as the delimiter. This will allow you to separate the date and time into separate columns, which will enable you to analyze the complaints by date and use a built-in date hierarchy. Alternatively, you could also use a transformation to extract the date and time from the Logged<\/p>\n<p>column and set the data type of the new columns to Date and Time, respectively. Option A is incorrect because it only extracts the last 11 characters of the Logged column, which would not include the date. Option B is incorrect because the data in the Logged column is in a non-standard date format and cannot be directly converted to the Date data type. Option D is incorrect because it only extracts the first 11 characters of the Logged column, which would not include the time.<\/p>", "exh": ""}, {"n": 28, "kind": "dragdrop", "kind_label": "Drag & drop", "case": null, "case_ref": null, "stem_html": "<p>You have two Microsoft Excel workbooks in a Microsoft OneDrive folder. Each workbook contains a table named Sales. The tables have the same data structure in both workbooks. You plan to use Power BI to combine both Sales tables into a single table and create visuals based on the data in the table. The solution must ensure that you can publish a separate report and dataset. Which storage mode should you use for the report file and the dataset file? To answer, drag the appropriate modes to the correct files. Each mode may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p>\n<p>Values: DirectQuery / Import / LiveConnect / Push<\/p>\n<ul><li>Report file:<\/li><li>Dataset file:<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>Report file: Import.<\/p>\n<p>In Power BI, when you import data, it means that the data is loaded into the Power BI Desktop file. In this case, you would import the data from both Excel workbooks into your Power BI Desktop report file. This allows you to create visuals and reports based on the imported data. Importing the data ensures that you can work with the data even when you&#x27;re not connected to OneDrive.<\/p>\n<p>Dataset: Direct Query.<\/p>\n<p>To keep the data in OneDrive and maintain a live connection to the source, you should use Direct Query for the dataset. Direct Query allows Power BI to retrieve and query data from the original data source (in this case, the Excel workbooks in OneDrive) in real-time without importing it into the dataset. This ensures that your dataset is always up-to-date and reflects changes made to the source data.<\/p>", "answer_area": {"controls": [{"correct": "Import", "id": "t1", "label": "Report file:"}, {"correct": "DirectQuery", "id": "t2", "label": "Dataset file:"}], "kind": "dragdrop", "values": ["DirectQuery", "Import", "LiveConnect", "Push"]}, "exh": ""}, {"n": 29, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You use Power Query to import two tables named Order Header and Order Details from an Azure SQL database. The Order Header table relates to the Order Details table by using a column named Order ID in each table. You need to combine the tables into a single query that contains the unique columns of each table. What should you select in Power Query Editor?<\/p>", "options": [{"letter": "A", "text": "Merge queries"}, {"letter": "B", "text": "Combine files"}, {"letter": "C", "text": "Append queries"}], "key": ["A"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>A. Merge queries.<\/p>\n<p>The &quot;Merge queries&quot; option in Power Query Editor allows you to combine two or more tables by matching rows based on a common column (in this case, the Order ID column). This operation is similar to performing a SQL JOIN, where you can include columns from both tables in the resulting combined query<\/p>", "exh": ""}, {"n": 30, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a CSV file that contains user complaints. The file contains a column named Logged. Logged contains the date and time each complaint occurred. The data in Logged is in the following format: 2018-12-31 at 08:59. You need to be able to analyze the complaints by the logged date and use a built-in date hierarchy. What should you do?<\/p>", "options": [{"letter": "A", "text": "Apply a transformation to extract the last 11 characters of the Logged column and set the data type of the new column to Date."}, {"letter": "B", "text": "Change the data type of the Logged column to Date."}, {"letter": "C", "text": "Split the Logged column by using at as the delimiter."}, {"letter": "D", "text": "Apply the Parse function from the Date transformations options to the Logged column."}], "key": ["C"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>Split the Logged column by using at as the delimiter.<\/p>\n<p>By splitting the &quot;Logged&quot; column using &quot;at&quot; as the delimiter, you separate the date and time into two distinct<\/p>\n<p>columns.<\/p>\n<p>The first column would contain the date (2018-12-31).<\/p>\n<p>The second column would contain the time (08:59).<\/p>\n<p>Once you have the date part isolated, you can change its data type to Date in Power BI.<\/p>\n<p>This transformation allows you to use the date part for analysis (e.g., creating date hierarchies), as Power BI recognizes it as a valid date data type.<\/p>\n<p>Why Option C Works Well:<\/p>\n<p>Splitting ensures that you isolate the date portion in a cleaner format that Power BI can understand and handle properly for analysis.<\/p>\n<p>By setting the date column to a Date data type, you enable the built-in date hierarchy for analyzing complaints by day, month, quarter, etc.<\/p>\n<p>The time portion can be discarded or kept for further analysis (e.g., if you wanted to analyze complaints by time of day).<\/p>\n<p>Why Option D (Parse Function) Isn&#x27;t Ideal in This Case:<\/p>\n<p>The Parse function is often useful for converting recognized date/time formats into proper date types.<\/p>\n<p>However, since the &quot;Logged&quot; column has non-standard text (&quot;at&quot;) in the middle of the date-time format, the Parse function might not work as smoothly or effectively compared to splitting the column by the &quot;at&quot; delimiter, which directly handles the non-standard format.<\/p>", "exh": ""}, {"n": 31, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a folder that contains 50 JSON files. You need to use Power BI Desktop to make the metadata of the files available as a single dataset. The solution must NOT store the data of the JSON files. Which type of data source should you use, and which transformation should you perform? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p>\n<ul><li>Data source type: Folder / JSON / Text/CSV<\/li><li>Transformation: Combine the files of the Content column. / Delete the Attribute column. / Delete the Content column. / Expand the Attribute column.<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>Data source type: Folder<\/p>\n<p>Transformation: Delete the Content column.<\/p>\n<p>This approach will allow you to access the metadata for all the JSON files in the folder without importing the actual data from the JSON files into the dataset.<\/p>", "answer_area": {"controls": [{"correct": "Folder", "id": "d1", "label": "Data source type:", "options": ["Folder", "JSON", "Text/CSV"]}, {"correct": "Delete the Content column.", "id": "d2", "label": "Transformation:", "options": ["Combine the files of the Content column.", "Delete the Attribute column.", "Delete the Content column.", "Expand the Attribute column."]}], "kind": "dropdowns"}, "exh": ""}, {"n": 32, "kind": "multi", "kind_label": "Multi-select", "case": null, "case_ref": null, "stem_html": "<p>You have a PBIX file that imports data from a Microsoft Excel data source stored in a file share on a local network. You are notified that the Excel data source was moved to a new location. You need to update the PBIX file to use the new location. What are three ways to achieve the goal? Each correct answer presents a complete solution. NOTE: Each correct selection is worth one point.<\/p>", "options": [{"letter": "A", "text": "From the Datasets settings of the Power BI service, configure the data source credentials."}, {"letter": "B", "text": "From the Data source settings in Power BI Desktop, configure the file path."}, {"letter": "C", "text": "From Current File in Power BI Desktop, configure the Data Load settings."}, {"letter": "D", "text": "From Power Query Editor, use the formula bar to configure the file path for the applied step."}, {"letter": "E", "text": "From Advanced Editor in Power Query Editor, configure the file path in the M code."}], "key": ["B", "D", "E"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>B.From the Data source settings in Power BI Desktop, configure the file path.<\/p>\n<p>D.From Power Query Editor, use the formula bar to configure the file path for the applied step.<\/p>\n<p>E.From Advanced Editor in Power Query Editor, configure the file path in the M code.<\/p>\n<p>Why the Other Options Are Incorrect:<\/p>\n<p>A. From the Datasets settings of the Power BI service, configure the data source credentials.<\/p>\n<p>This option is related to managing authentication and credentials to access the data source (e.g., user permissions or authentication methods), but it does not handle the file path or location change.<\/p>\n<p>It’s useful for cloud-based sources, but for local network data sources, the file path needs to be updated within Power BI Desktop or the Power Query Editor.<\/p>\n<p>C. From Current File in Power BI Desktop, configure the Data Load settings.<\/p>\n<p>The Current File option in Power BI Desktop allows you to change data load settings, but it does not address the file path for an Excel data source. This setting is more related to options like whether to import or load data from the current file into the model, rather than specifying the path of the Excel file.<\/p>\n<p>Summary:<\/p>\n<p>To update the file path for the Excel data source after it has been moved:<\/p>\n<p>B, D, and E are the appropriate solutions, as they allow you to configure the new file path within the data source settings, Power Query Editor, or M code.<\/p>", "exh": ""}, {"n": 33, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a Power BI semantic model that contains the data sources shown in the following table.<\/p>\n<p>You need to configure the privacy level s of the data sources. What should you configure for each data source? To answer, select the appropriate options in the answer area. NOTE: Each correct answer is worth one point.<\/p>\n<p>Answer Area<\/p>\n<ul><li>Employee review data: None / Organizational / Private / Public<\/li><li>Sales opportunities: None / Organizational / Private / Public<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>Private.<\/p>\n<p>Organizational.<\/p>", "answer_area": {"controls": [{"correct": "Private", "id": "d1", "label": "Employee review data:", "options": ["None", "Organizational", "Private", "Public"]}, {"correct": "Organizational", "id": "d2", "label": "Sales opportunities:", "options": ["None", "Organizational", "Private", "Public"]}], "kind": "dropdowns"}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Data sources<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Name<\/th><th>Description<\/th><\/tr><\/thead><tbody><tr><td>Employee review data<\/td><td>Contains sensitive information. Must &lt;b&gt;NOT&lt;/b&gt; be folded into any other data sources<\/td><\/tr><tr><td>Sales opportunities<\/td><td>Contains less sensitive information. Must only be available internally<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 34, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You plan to use Power BI Desktop to create a bug tracking dashboard that will pull data from Analytics in Azure DevOps. From Power BI Desktop, you need to configure a data connector to authenticate to Azure DevOps. The solution must meet the following requirements: •Use Analytics views. •Filter data from the cloud. Which connector should you use?<\/p>", "options": [{"letter": "A", "text": "OData queries"}, {"letter": "B", "text": "Azure DevOps (Boards only)"}, {"letter": "C", "text": "Azure DevOps Server (Boards only)"}, {"letter": "D", "text": "OData Feed"}], "key": ["D"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>D. OData Feed.<\/p>\n<p>Azure DevOps Analytics views are exposed through an OData endpoint.<\/p>\n<p>The OData Feed connector in Power BI Desktop:<\/p>\n<p>Authenticates to Azure DevOps Analytics<\/p>\n<p>Supports server-side filtering, meaning data is filtered in the cloud before import<\/p>\n<p>Is the recommended approach for Analytics views<\/p>\n<p>Why not the others?<\/p>", "exh": ""}, {"n": 35, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You use Power Query Editor to preview the data shown in the following exhibit.<\/p>\n<p>You confirm that the data will always start on row 3, and row 3 will always contain the column names. How should you shape the query? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p>\n<ul><li>To configure the query to start on row 3, select [answer choice] Keep top rows / Remove errors / Remove top rows<\/li><li>To use the values in row 3 as the column names, select [answer choice] Rename / ode.<\/p>\n<p>Why the Suggested Solution Doesn&#x27;t Meet the Goal:<\/p>\n<p>Implicit Type Conversion:<\/p>\n<p>This solution focuses on type conversion but does not address the core issue: case sensitivity.<\/p>\n<p>Errors are not caused by a data type mismatch; they are due to case sensitivity mismatches in the source data, which is unrelated to type conversion.<\/p>\n<p>Implicit type conversion will not resolve errors resulting from case sensitivity.<\/p>\n<p>What Should Be Done:<\/p>\n<p>To resolve the issue, you need to ensure that the case sensitivity is handled properly. The correct approach would involve:<\/p>\n<p>Configuring the DirectQuery connection to ensure case-insensitive comparisons.<\/p>\n<p>Using Power Query transformations to standardize the case of the column data (e.g., converting all text to lowercase or uppercase).<\/p>\n<p>Verifying the settings in the source system to ensure consistency in case sensitivity.<\/p>\n<p>Summary:<\/p>\n<p>The proposed solution (implicitly converting values into the required type) does not address the core issue of case sensitivity in the data source.<\/p>\n<p>Therefore, the correct answer is B. No.<\/p>", "exh": ""}, {"n": 37, "kind": "series", "kind_label": "Yes / No", "case": null, "case_ref": null, "stem_html": "<p>Note: This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.<\/p>\n<p>After you answer a question in this section, you will NOT be able to return to it. As a result, these questions will not appear in the review screen. You have a data source that contains a column. The column contains case sensitive data. You have a Power BI semantic model in DirectQuery mode. You connect to the model and discover that it contains undefined values and errors. You need to resolve the issue. Solution: You change the semantic model mode. Does this meet the goal?<\/p>", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "key": ["B"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>No is a right answer.<\/p>\n<p>Why Changing the Semantic Model Mode Doesn&#x27;t Resolve the Issue:<\/p>\n<p>Switching the semantic model from DirectQuery to Import or other modes won&#x27;t inherently resolve case- sensitivity problems because:<\/p>\n<p>The underlying data remains case-sensitive.<\/p>\n<p>Undefined values and errors caused by case mismatches will still persist unless case sensitivity is addressed explicitly.<\/p>\n<p>The problem is related to data handling rather than the model mode.<\/p>\n<p>What Should Be Done:<\/p>\n<p>To resolve the issue, you should:<\/p>\n<p>Normalize the case of the column values in Power Query (e.g., convert all text to lowercase or uppercase).<\/p>\n<p>Ensure that the case sensitivity settings in the data source align with those in Power BI.<\/p>\n<p>Configure DirectQuery settings to handle case sensitivity where applicable.<\/p>\n<p>Summary:<\/p>\n<p>Changing the semantic model mode does not solve the issue of case sensitivity in the data. The correct approach would involve addressing case sensitivity explicitly in the data source or during the transformation process.<\/p>\n<p>Therefore, the correct answer is B. No.<\/p>", "exh": ""}, {"n": 38, "kind": "series", "kind_label": "Yes / No", "case": null, "case_ref": null, "stem_html": "<p>Note: This question is part of a series of questions that present the same scenario. Each question in the series<\/p>\n<p>contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution. After you answer a question in this section, you will NOT be able to return to it. As a result, these questions will not appear in the review screen. You have a data source that contains a column. The column contains case sensitive data. You have a Power BI semantic model in DirectQuery mode. You connect to the model and discover that it contains undefined values and errors. You need to resolve the issue. Solution: You normalize casing in the source query or Power Query Editor. Does this meet the goal?<\/p>", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "key": ["A"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>Correct answer is A:Yes.<\/p>\n<p>The issue arises because the data source contains case-sensitive data, and the Power BI semantic model in DirectQuery mode encounters errors due to mismatches in case sensitivity. Normalizing the casing in the source query or Power Query Editor resolves this issue by ensuring consistency in how data is interpreted.<\/p>\n<p>Why Normalizing Casing Resolves the Issue:<\/p>\n<p>Case Normalization:<\/p>\n<p>Transforming all text values in the column to either lowercase or uppercase eliminates case sensitivity issues.<\/p>\n<p>Power BI can then correctly match and interpret the data, preventing undefined values and errors.<\/p>\n<p>DirectQuery Mode Compatibility:<\/p>\n<p>By normalizing the casing in the source query or Power Query Editor, the data sent to the semantic model is consistent, and DirectQuery can function correctly.<\/p>\n<p>How Normalizing Casing Works:<\/p>\n<p>In Power Query Editor:<\/p>\n<p>Use transformations like &quot;Transform &gt; Format &gt; Lowercase&quot; or &quot;Uppercase&quot; on the column containing case- sensitive data.<\/p>\n<p>In the source query (if applicable):<\/p>\n<p>Use SQL functions like LOWER() or UPPER() in the query to ensure consistent case handling at the data source level.<\/p>\n<p>Why This Meets the Goal:<\/p>\n<p>The solution directly addresses the root cause: case sensitivity.<\/p>\n<p>It ensures consistent data comparison, preventing undefined values and errors in the semantic model.<\/p>\n<p>​Summary:<\/p>\n<p>Normalizing casing in the source query or Power Query Editor effectively resolves case sensitivity issues in the data, ensuring that Power BI can interpret and process the data correctly. Therefore, the correct answer is A. Yes.<\/p>", "exh": ""}, {"n": 39, "kind": "series", "kind_label": "Yes / No", "case": null, "case_ref": null, "stem_html": "<p>Note: This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution. After you answer a question in this section, you will NOT be able to return to it. As a result, these questions will not appear in the review screen. You have a data source that contains a column. The column contains case sensitive data. You have a Power BI semantic model in DirectQuery mode. You connect to the model and discover that it contains undefined values and errors. You need to resolve the issue. Solution: You add an index key and normalize casing in the data source. Does this meet the goal?<\/p>", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "key": ["B"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>B. No .<\/p>\n<p>Undefined values and errors in a DirectQuery model are typically caused by:<\/p>\n<p>Invalid or inconsistent data types<\/p>\n<p>Nulls or unexpected values<\/p>\n<p>Unsupported transformations or calculations pushed to the source<\/p>\n<p>Adding an index key and normalizing casing:<\/p>\n<p>May help with joins or consistency<\/p>\n<p>Does not resolve undefined values or query errors returned by the data source<\/p>\n<p>What actually addresses the issue:<\/p>\n<p>Fix data quality problems in the source (null handling, data type corrections)<\/p>\n<p>Adjust or remove unsupported transformations<\/p>\n<p>Validate relationships and DAX expressions that translate to source queries<\/p>", "exh": ""}, {"n": 40, "kind": "multi", "kind_label": "Multi-select", "case": null, "case_ref": null, "stem_html": "<p>You have a Microsoft Excel file in a Microsoft OneDrive folder. The file must be imported to a Power BI semantic model. You need to ensure that the semantic model can be refreshed in PowerBi.com. Which two connectors can you use to connect to the file? Each correct answer presents a complete solution. NOTE: Each correct selection is worth one point.<\/p>", "options": [{"letter": "A", "text": "Web"}, {"letter": "B", "text": "Excel Workbook"}, {"letter": "C", "text": "Folder"}, {"letter": "D", "text": "Text/CSV"}, {"letter": "E", "text": "SharePoint folder"}], "key": ["A", "E"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>A. Web.<\/p>\n<p>E. SharePoint folder.<\/p>\n<p>To connect to an Excel file stored in OneDrive and ensure it can be refreshed in PowerBI.com, the Web and SharePoint folder connectors are the best options. Therefore, the correct answers are A and E.<\/p>", "exh": ""}, {"n": 41, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You use Power Query Editor to preview a column named Date as shown in the following exhibit.<\/p>\n<p>You need to change the Date column to contain only the year. The solution must minimize administrative effort. What should you do?<\/p>", "options": [{"letter": "A", "text": "Split the column by delimiter."}, {"letter": "B", "text": "Split the column by number of characters."}, {"letter": "C", "text": "Extract the text after the delimiter."}, {"letter": "D", "text": "Transform the column to contain only the year."}], "key": ["D"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>Transform the column to contain only the year.<\/p>\n<p>Minimal Administrative Effort:<\/p>\n<p>By adding a new column, you preserve the original Date column while introducing a new column that contains just the year. This way, no data is lost, and the transformation is straightforward.<\/p>\n<p>Using Power Query:<\/p>\n<p>In Power Query, you can Add Column &gt; Date &gt; Year, which is an easy and direct way to extract the year from the date. This is typically a minimal-effort approach because it doesn&#x27;t require complex formulas or additional steps.<\/p>\n<p>Preserving Original Data:<\/p>\n<p>Adding a new column ensures that you retain the original date data, which could be useful for other transformations or analysis.<\/p>\n<p>Conclusion:<\/p>\n<p>Option D is correct because it provides a simple way to add a column that contains the year, offering a non- invasive solution while keeping the original data intact. This aligns with the requirement for minimal administrative effort.<\/p>", "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Date column in Power Query<\/div><ul class=\"exh-ul\"><li>Column type: Date · 100% valid, 0% error, 0% empty · <b>16 distinct, 0 unique<\/b><\/li><li>First values: 01-01-2014, 01-06-2014, 01-06-2014, 01-06-2014, 01-12-2014, 01-03-2014 …<\/li><\/ul><\/div>"}, {"n": 42, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You are designing the data model for a Power BI semantic model. You have the following tables in the star schema.<\/p>\n<p>Which table is the fact table of the star schema, and which column in the Patient table is the surrogate key of the star schema? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p>\n<ul><li>Fact table: Date / Patient / Test / Test Result<\/li><li>Surrogate key: Date of birth / Last name / Patient key / Patient source ID<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>Test Result.<\/p>\n<p>Patient key.<\/p>\n<p>The correct answers, based on the configuration, are:<\/p>\n<p>Fact Table: Test Result<\/p>\n<p>Contains the core transactional or measurable data (e.g., test scores, results, dates).<\/p>\n<p>Surrogate Key: PatientKey<\/p>\n<p>Links each test record in the fact table to the corresponding patient in the Patient dimension table.<\/p>", "answer_area": {"controls": [{"correct": "Test Result", "id": "d1", "label": "Fact table:", "options": ["Date", "Patient", "Test", "Test Result"]}, {"correct": "Patient key", "id": "d2", "label": "Surrogate key:", "options": ["Date of birth", "Last name", "Patient key", "Patient source ID"]}], "kind": "dropdowns"}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Tables<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Name<\/th><th>Description<\/th><\/tr><\/thead><tbody><tr><td>Date<\/td><td>Contains one row for each day from the last five years. Each row contains attributes for the year, quarter, month, week of the year, and day of the week. Date is the unique identifier of a row.<\/td><\/tr><tr><td>Patient<\/td><td>Contains one row per patient. Each row contains attributes for the patient key, patient source ID, first name, last name, date of birth, gender, address, city, state, and country. Patient key is the unique identifier of a row.<\/td><\/tr><tr><td>Test<\/td><td>Contains one row per test. Each row contains attributes for the test key, test source ID, type, and name. The test key is the unique identifier of a row.<\/td><\/tr><tr><td>Test Result<\/td><td>Contains one row per administered test. Each row contains attributes for the date the test was administered, test key, patient key, result value, and comments.<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 43, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You use Power BI Desktop to import two tables named Customer and Contacts. The Customer table contains the following columns: •Customer_Name •Customer ID •Website The Contacts table contains the following columns: •Contact ID •Contact Email<\/p>\n<p>•Contact Name •Customer Name A web-based contact form is used to fill the Contacts table. The data is not sanitized. You need to create a merge for the Customer and Contacts tables. What should you do?<\/p>", "options": [{"letter": "A", "text": "Disable fuzzy matching."}, {"letter": "B", "text": "Enable fuzzy matching."}, {"letter": "C", "text": "Set Join Kind to Left Outer."}], "key": ["B"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>enabling fuzzy matching (Option B), Power BI can perform a join that allows for slight variations and discrepancies in the &quot;Customer Name&quot; field between the two tables, effectively handling imperfect data. Fuzzy matching helps ensure that even non-exact matches are found and merged correctly, improving the accuracy of your merged dataset.<\/p>\n<p>Disabling fuzzy matching would only allow exact matches, which may result in incomplete or inaccurate merges due to the unsanitized data. Setting the Join Kind to Left Outer doesn&#x27;t address the issue of data inconsistencies and would still require exact matches unless fuzzy matching is enabled.<\/p>", "exh": ""}, {"n": 44, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You are using Microsoft Power BI Desktop to profile data in Power Query Editor. Table data is displayed as shown in the following exhibit.<\/p>\n<p>Use the drop-down menus to select the answer choice that completes each statement based on the information presented in the graphic. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p>\n<ul><li>Before you can transform the date column to show only the day, you must [answer choice]: change the data type. / use the Parse command on the column. / use the Replace Values command on the column.<\/li><li>To fix the error displayed for the data.Entries.menuAmount column, you must [answer choice]: change the data type. / rename the column. / use Conditional Formatting.<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>1. Before you can transform the date column to show only the day, you must:<\/p>\n<p>Change the data type.<\/p>\n<p>To extract only the day from a date column, you typically need to ensure that the column is in a date or datetime data type. If the column is not already in a date format, you will need to change its data type to a date or datetime format before performing any date-specific transformations.<\/p>\n<p>2. To fix the error displayed for the data entries, menu Amount column, you must:<\/p>\n<p>Change the data type.<\/p>\n<p>If the menu Amount column contains errors, it might be due to an incorrect data type. For example, if the column is supposed to contain numeric values but is set as text, you would need to change the data type to numeric (e.g., integer or decimal) to resolve the errors.<\/p>", "answer_area": {"controls": [{"correct": "change the data type.", "id": "d1", "label": "Before you can transform the date column to show only the day, you must [answer choice]:", "options": ["change the data type.", "use the Parse command on the column.", "use the Replace Values command on the column."]}, {"correct": "change the data type.", "id": "d2", "label": "To fix the error displayed for the data.Entries.menuAmount column, you must [answer choice]:", "options": ["change the data type.", "rename the column.", "use Conditional Formatting."]}], "kind": "dropdowns"}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Power Query preview<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>_id<\/th><th>date<\/th><th>data.Entries.menuAmount<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>2024-02-07<\/td><td>01/01/1900<\/td><\/tr><tr><td>1<\/td><td>2024-02-07<\/td><td>02/01/1900<\/td><\/tr><tr><td>1<\/td><td>2024-02-07<\/td><td>Error<\/td><\/tr><\/tbody><\/table><\/div><p class=\"exh-p\">The <code>data.Entries.menuAmount<\/code> column shows a quality bar with errors.<\/p><\/div>"}, {"n": 45, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a Power BI semantic model named Model1 that contains a table named Sales. Sales contains 10 million records and the following data.<\/p>\n<p>The related report displays the weekly sales per region. You need to minimize the size of Model1. How should you modify the CustomerID column and the PurchaseDateTime column? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p>\n<ul><li>CustomerID: Change the data type to Binary. / Remove any duplicate values. / Remove the column.<\/li><li>PurchaseDateTime: Change the data type to Duration. / Remove the column. / Split the column into separate date and time columns.<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>Customer ID : Remove the column.<\/p>\n<p>The CustomerID field is typically a unique identifier for customers in a dataset.<\/p>\n<p>Removing this column suggests that the CustomerID is not necessary for the analysis being performed.<\/p>\n<p>This might be applicable in cases where the dataset is being anonymized, or if the column does not contribute to the required insights.<\/p>\n<p>PurchaseDateTime :Split the column into separate date and time columns.<\/p>\n<p>The PurchaseDateTime field likely contains a timestamp, which includes both date and time information.<\/p>\n<p>Splitting it into separate date and time columns makes it easier to analyze trends based on dates (e.g., daily sales) or time (e.g., peak purchasing hours).<\/p>\n<p>This transformation is commonly performed in data preprocessing to facilitate time-based analysis.<\/p>", "answer_area": {"controls": [{"correct": "Remove the column.", "id": "d1", "label": "CustomerID:", "options": ["Change the data type to Binary.", "Remove any duplicate values.", "Remove the column."]}, {"correct": "Split the column into separate date and time columns.", "id": "d2", "label": "PurchaseDateTime:", "options": ["Change the data type to Duration.", "Remove the column.", "Split the column into separate date and time columns."]}], "kind": "dropdowns"}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Table columns<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Column name<\/th><th>Data type<\/th><th>Description<\/th><\/tr><\/thead><tbody><tr><td>PurchaseID<\/td><td>Text<\/td><td>Contains a unique ID for each order<\/td><\/tr><tr><td>CustomerID<\/td><td>Text<\/td><td>Contains a unique ID for each customer<\/td><\/tr><tr><td>PurchaseDateTime<\/td><td>Date/Time/Timezone<\/td><td>Contains the date and time that each order occurred<\/td><\/tr><tr><td>Region<\/td><td>Text<\/td><td>Contains the region where each order occurred<\/td><\/tr><tr><td>TotalAmount<\/td><td>Decimal number<\/td><td>Contains the total cost of each order<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 46, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Microsoft Power BI Desktop report named Report1 that uses an Azure SQL database as a data source. A user named User1 plans to create a report by using the same data source as Report1. You need to simplify the connection to the data source for User1. Which type of file should you create?<\/p>", "options": [{"letter": "A", "text": "PBIDS"}, {"letter": "B", "text": "XLSX"}, {"letter": "C", "text": "PBIT"}, {"letter": "D", "text": "PBIX"}], "key": ["A"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>A. PBIDS.<\/p>\n<p>A .pbids (Power BI data source) file is specifically designed to simplify connections to a data source. If the user double-clicks the .pbids file, Power BI Desktop opens and automatically connects them to the specified data source—making it easy for someone else (User1) to reuse the same Azure SQL connection as in Report1.<\/p>", "exh": ""}, {"n": 47, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a Power BI semantic model. You discover that the semantic model contains values that display as errors. You need to use data profiling features in Power Query to preview the data and identify the issues. What should you select to gain insight into the number of errors in the model, and what should you select to resolve the errors? To answer, select the appropriate options in the answer area. NOTE: Each correct answer is worth one point.<\/p>\n<p>Answer Area<\/p>\n<ul><li>To gain insight, select: Column distribution / Column quality / Formula Bar / Monospaced<\/li><li>To resolve the errors, select: Keep Errors / Remove Duplicates / Remove Empty / Replace Errors<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>1. To gain insight, Select: Column quality.<\/p>\n<p>Column quality provides useful information about valid, error, and empty values in a column.<\/p>\n<p>This helps assess the data&#x27;s reliability and cleanliness before analysis.<\/p>\n<p>It is particularly useful when dealing with datasets that may have missing or incorrect values.<\/p>\n<p>2. To resolve the errors, Select: Remove Empty.<\/p>\n<p>Remove Empty helps eliminate blank or missing values from the dataset.<\/p>\n<p>Empty values can cause issues in data analysis, affecting calculations and visualizations.<\/p>\n<p>Removing empty values ensures cleaner and more accurate data.<\/p>", "answer_area": {"controls": [{"correct": "Column quality", "id": "d1", "label": "To gain insight, select:", "options": ["Column distribution", "Column quality", "Formula Bar", "Monospaced"]}, {"correct": "Remove Empty", "id": "d2", "label": "To resolve the errors, select:", "options": ["Keep Errors", "Remove Duplicates", "Remove Empty", "Replace Errors"]}], "kind": "dropdowns"}, "exh": ""}, {"n": 48, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You plan to create a Power BI semantic model named Model1 that will contain data from an Azure SQL database named DB1. Model1 must show updated data within two minutes of the data being updated in DB1. You need to select a connectivity mode for the connection to DB1. What should you choose?<\/p>", "options": [{"letter": "A", "text": "DirectQuery"}, {"letter": "B", "text": "live connection"}, {"letter": "C", "text": "import"}], "key": ["A"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>A. Direct Query.<\/p>\n<p>Direct Query Mode – Queries are sent to the data source in real-time without importing data.<\/p>\n<p>DirectQuery mode ensures that Power BI always retrieves the latest data directly from DB1 every time a user interacts with a report.<\/p>", "exh": ""}, {"n": 49, "kind": "multi", "kind_label": "Multi-select", "case": null, "case_ref": null, "stem_html": "<p>You need to create a semantic model in Power BI Desktop. The solution must meet the following requirements: •The model must contain a table named Orders that has one row per order. Each row will contain the total amount per order. •The orders must be filtered to the selected CustomerID value. •Users must select the CustomerID value from a list. •The list of customers must come from an OData source. Which three objects should you create in Power Query Editor? Each correct answer presents part of the solution. NOTE: Each correct selection is worth one point.<\/p>", "options": [{"letter": "A", "text": "an Orders query that has a filter on CustomerID"}, {"letter": "B", "text": "a Customers query that has a filter on CustomerID"}, {"letter": "C", "text": "an Orders query that has a single column containing a list of customers"}, {"letter": "D", "text": "a Customers query that has a single column containing a list of customer IDs"}, {"letter": "E", "text": "a parameter for CustomerID that uses a query to populate the suggested values"}, {"letter": "F", "text": "a parameter for CustomerID that uses manually entered values to populate the suggested values"}], "key": ["A", "D", "E"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>A. An Orders query that has a filter on CustomerID: This query will fetch the orders and apply a filter based on the selected CustomerID to ensure the orders are filtered to the selected CustomerID value.<\/p>\n<p>D. A Customers query that has a single column containing a list of customer IDs: This query will fetch the list of customers from the OData source and provide a list of customer IDs that users can select from.<\/p>\n<p>E. A parameter for CustomerID that uses a query to populate the suggested values: This parameter will be used to dynamically filter the Orders query based on the selected CustomerID value. It will use the Customers query to populate the suggested values for the CustomerID parameter.<\/p>", "exh": ""}, {"n": 50, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You use Power BI Desktop to create a report named RPT1 that loads data from a Microsoft Excel file named File1. File1 is located in a network share. File1 is moved to a different folder. When you open RPT1 in Power BI Desktop, you discover that the report displays outdated data. You need to ensure that the data in File1 refreshes properly. What should you do?<\/p>", "options": [{"letter": "A", "text": "Change the data source."}, {"letter": "B", "text": "Clear the permissions of File1."}, {"letter": "C", "text": "Export a PBIDS file."}, {"letter": "D", "text": "Modify the permissions for File1."}], "key": ["A"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>A. Change the data source.<\/p>\n<p>Since File1 has been moved to a different folder, the path to the file has changed. Power BI Desktop relies on static file paths to locate data sources like Excel, CSV, or text files. When the original file is no longer in the expected location, Power BI cannot find it during refresh, and it may use cached/outdated data.<\/p>", "exh": ""}, {"n": 51, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a query that contains customer data in Power Query Editor as shown in the following exhibit.<\/p>\n<p>Use the drop-down menus to select the answer choice that completes each statement based on the information presented in the graphic. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p>\n<ul><li>Some values in the [answer choice] column are repeated. Customer ID / Customer Key / Customer Name<\/li><li>To standardize the values in the Phone column to 10 digits and exclude country calling codes, [answer choice]. extract the text after the &quot;)&quot; delimiter / extract the last 12 characters / split the column at the right-most occurrence of &quot;)&quot;<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>Customer Name.<\/p>\n<p>Extract the last 12 characters.<\/p>\n<p>Customer Name because it has a greater number of distinct vs unique values in the column. This implies that there are repeating values in it. -Second statement requires 10 digits in the phone number. If choose &quot;extract the text after the &quot;)&quot; delimiter&quot;, it will leave a leading whitespace for certain rows since there is a space after the &quot;)&quot; in certain rows and this counts as a digit which would make it 11 digits which does NOT meet the requirement.BUT, if we use the other option &quot;Extract the last 12 characters&quot;, then it will NOT include the leading whitespace and correctly satisfy the 10 digit requirement as well as not including whitespace which can throw off calculations, sort orders, etc.<\/p>", "answer_area": {"controls": [{"correct": "Customer Name", "id": "d1", "label": "Some values in the [answer choice] column are repeated.", "options": ["Customer ID", "Customer Key", "Customer Name"]}, {"correct": "extract the last 12 characters", "id": "d2", "label": "To standardize the values in the Phone column to 10 digits and exclude country calling codes, [answer choice].", "options": ["extract the text after the \")\" delimiter", "extract the last 12 characters", "split the column at the right-most occurrence of \")\""]}], "kind": "dropdowns"}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Power Query: Customers table (column quality, distribution and profile enabled)<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Column<\/th><th>Valid<\/th><th>Error<\/th><th>Empty<\/th><th>Distinct<\/th><th>Unique<\/th><\/tr><\/thead><tbody><tr><td>Customer Key<\/td><td>100%<\/td><td>0%<\/td><td>0%<\/td><td>18484<\/td><td>18484<\/td><\/tr><tr><td>Customer ID<\/td><td>100%<\/td><td>0%<\/td><td>0%<\/td><td>18484<\/td><td>18484<\/td><\/tr><tr><td>Customer Name<\/td><td>100%<\/td><td>0%<\/td><td>0%<\/td><td>18400<\/td><td>18317<\/td><\/tr><tr><td>Birth Date<\/td><td>100%<\/td><td>0%<\/td><td>0%<\/td><td>6139<\/td><td>1666<\/td><\/tr><tr><td><b>Phone<\/b> (selected)<\/td><td>100%<\/td><td>0%<\/td><td>0%<\/td><td>8890<\/td><td>8175<\/td><\/tr><tr><td>Address<\/td><td>100%<\/td><td>0%<\/td><td>0%<\/td><td>12802<\/td><td>7606<\/td><\/tr><\/tbody><\/table><\/div><p class=\"exh-p\"><b>Sample rows:<\/b><\/p><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Customer Key<\/th><th>Customer ID<\/th><th>Customer Name<\/th><th>Birth Date<\/th><th>Phone<\/th><th>Address<\/th><\/tr><\/thead><tbody><tr><td>11010<\/td><td>AW00011010<\/td><td>Jacquelyn Suarez<\/td><td>8/5/1969<\/td><td>1 (11) 500 555-0169<\/td><td>7800 Corrinne Court<\/td><\/tr><tr><td>11011<\/td><td>AW00011011<\/td><td>Curtis Lu<\/td><td>5/3/1969<\/td><td>1 (11) 500 555-0117<\/td><td>1224 Shoenic<\/td><\/tr><tr><td>11012<\/td><td>AW00011012<\/td><td>Lauren Walker<\/td><td>1/14/1979<\/td><td>717-555-0164<\/td><td>4785 Scott Street<\/td><\/tr><tr><td>11013<\/td><td>AW00011013<\/td><td>Ian Jenkins<\/td><td>8/3/1979<\/td><td>817-555-0185<\/td><td>7902 Hudson Ave.<\/td><\/tr><tr><td>11014<\/td><td>AW00011014<\/td><td>Sydney Bennett<\/td><td>11/6/1973<\/td><td>431-555-0156<\/td><td>9011 Tank Drive<\/td><\/tr><\/tbody><\/table><\/div><p class=\"exh-p\"><b>Column statistics for Phone:<\/b> Count 18484 · Error 0 · Empty 0 · Distinct 8890 · Unique 8175 · Empty string 0 · Min “1 (11) 5…” · Max “999-555…”. <b>Text length distribution:<\/b> two bars, for lengths 12 and 19.<\/p><\/div>"}, {"n": 52, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Power BI report named Report that contains the following tables.<\/p>\n<p>For the last three days, refresh in Power BI has failed, and you receive the following error message: “You have reached the maximum allowable memory allocation for your tier. Consider upgrading to a tier with more available memory.” You need to resolve the error and ensure that query response times are minimized for end users. What should you do?<\/p>", "options": [{"letter": "A", "text": "Merge the Sales person and invoice tables based on the SalesPersonId column."}, {"letter": "B", "text": "Change the invoice table to a DirectQuery table and read the data live from the source, retaining only the dimension tables as import tables."}, {"letter": "C", "text": "Reduce the size of the invoice table by summarizing sales by Product, Sales person, Calendar, and Customer."}, {"letter": "D", "text": "Change the invoice table to a composite table that contains historical data as a DirectQuery table and hot data as an import table, and then partition the table."}], "key": ["D"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>D. Change the invoice table to a composite table that contains historical data as a DirectQuery table and hot data as an import table, and then partition the table.<\/p>\n<p>Combines Import (fast performance) with DirectQuery (real-time, but slower).<\/p>\n<p>Hot data (recent, frequently queried) is kept in Import mode for performance.<\/p>\n<p>Historical data (older, less frequently queried) is kept in DirectQuery to reduce memory usage.<\/p>", "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Tables<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Name<\/th><th>Description<\/th><\/tr><\/thead><tbody><tr><td>Product<\/td><td>10 rows with a primary key named ProductId<\/td><\/tr><tr><td>Sales person<\/td><td>Five rows with a primary key named SalesPersonId<\/td><\/tr><tr><td>Calendar<\/td><td>Standard calendar table without time columns that is generated from a calculated table<\/td><\/tr><tr><td>Customer<\/td><td>25 rows with a primary key named CustomerId<\/td><\/tr><tr><td>Invoice<\/td><td>12 million rows from the last three months with many-to-one relationships to Product, Sales Person, Calendar, and Customer<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 53, "kind": "multi", "kind_label": "Multi-select", "case": null, "case_ref": null, "stem_html": "<p>You have a table named DIMCountries that contains a column named Country as shown in the following table.<\/p>\n<p>You plan to use DIMCountries as a dimension in a report. You need to ensure that the Country column in DIMCountries lists each country only once. Which two actions should you perform on the Country column? Each correct answer presents part of the solution. NOTE: Each correct answer is worth one point.<\/p>", "options": [{"letter": "A", "text": "Change Data category to Country."}, {"letter": "B", "text": "Remove duplicate values."}, {"letter": "C", "text": "Apply a clean transform."}, {"letter": "D", "text": "Replace the empty fields."}, {"letter": "E", "text": "Apply a Capitalize Each Word transform."}], "key": ["B", "E"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>B. Remove duplicate values.<\/p>\n<p>E. Apply a Capitalize Each Word transform.<\/p>\n<p>Remove duplicate values is essential to ensure that each country appears only once in the dimension.<\/p>\n<p>Capitalize Each Word standardizes the text (for example, usa, USA, Usa → Usa), which helps prevent<\/p>\n<p>duplicates caused by inconsistent casing before or during deduplication.<\/p>", "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Country column<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Country<\/th><\/tr><\/thead><tbody><tr><td>Afghanistan<\/td><\/tr><tr><td>afghanistan<\/td><\/tr><tr><td>Albania<\/td><\/tr><tr><td>Algeria<\/td><\/tr><tr><td>American Samoa<\/td><\/tr><tr><td>(blank)<\/td><\/tr><tr><td>Andorra<\/td><\/tr><tr><td>andorra<\/td><\/tr><tr><td>Antarctica<\/td><\/tr><tr><td>Argentina<\/td><\/tr><tr><td>(blank)<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 54, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You plan to use Power Query Editor to get data from an API. The API returns a JSON response. You have a username and password for the API. Which data source and authentication method should you use to connect to the API? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p>\n<ul><li>Data source: Dataflows / JSON / OData / Web<\/li><li>Authentication: Anonymous / Basic / Organizational account / Web API<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>Data source: Web<\/p>\n<p>Power Query uses the Web connector to fetch data from APIs (which typically return JSON or XML).<\/p>\n<p>Authentication: Basic.<\/p>\n<p>Since you have a username and password, the most common authentication for APIs that require these is Basic Authentication (username and password sent encoded in the HTTP header).If the API uses some other auth method (like OAuth), that would differ, but given username/password, Basic Auth is the standard.<\/p>", "answer_area": {"controls": [{"correct": "Web", "id": "d1", "label": "Data source:", "options": ["Dataflows", "JSON", "OData", "Web"]}, {"correct": "Basic", "id": "d2", "label": "Authentication:", "options": ["Anonymous", "Basic", "Organizational account", "Web API"]}], "kind": "dropdowns"}, "exh": ""}, {"n": 55, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You use Power Query Editor to create a query named Products. Products return the results shown in the following table.<\/p>\n<p>You need to shape the data to display a single combination of ProductCategory and ProductID on each row. How should you configure the ProductIDList column? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p>\n<ul><li>Split column: By delimiter / By positions / By number of characters<\/li><li>Advanced options: Set Split into to Columns. / Set Split into to Rows. / Set Quote character to None. / Set Number of columns to split into to 5.<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>Split column: By delimiter.<\/p>\n<p>This option tells Power Query how to split the data.<\/p>\n<p>A delimiter is a character that separates values, such as:<\/p>\n<p>Comma ,<\/p>\n<p>Space &quot; &quot;<\/p>\n<p>Dash -<\/p>\n<p>Pipe |<\/p>\n<p>Advanced option: Set Split into to Rows.<\/p>\n<p>This controls how the split results are arranged.<\/p>\n<p>Two possibilities:<\/p>\n<p>Split into Columns (default)<\/p>\n<p>Split into Rows (selected in your image)<\/p>", "answer_area": {"controls": [{"correct": "By delimiter", "id": "d1", "label": "Split column:", "options": ["By delimiter", "By positions", "By number of characters"]}, {"correct": "Set Split into to Rows.", "id": "d2", "label": "Advanced options:", "options": ["Set Split into to Columns.", "Set Split into to Rows.", "Set Quote character to None.", "Set Number of columns to split into to 5."]}], "kind": "dropdowns"}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Product categories<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>ProductCategory<\/th><th>ProductIDList<\/th><\/tr><\/thead><tbody><tr><td>Bikes<\/td><td>1,2,3,5,7<\/td><\/tr><tr><td>Components<\/td><td>4,6,8,10<\/td><\/tr><tr><td>Clothing<\/td><td>9,11,12,13,14<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 56, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You plan to create a Power BI semantic model named Model1 that will contain data from an Azure SQL database. Model1 will have the following tables.<\/p>\n<p>You create DimDate and DimProduct by using import storage mode. You need to configure the storage mode for each remaining table. The solution must meet the following requirements: •The data in FactSales must be available within five minutes of being available in the source data. •The query response time for reports connected to the model must be minimized. Which storage mode should you configure for each table? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p>\n<ul><li>DimCustomer: DirectQuery / Dual / Import<\/li><li>FactSales: DirectQuery / Dual / Import<\/li><li>FactMarketingEmail: DirectQuery / Dual / Import<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>1. DimCustomer: Dual<\/p>\n<p>While the image shows Import, the &quot;ideal&quot; answer for a dimension table in a composite model that joins to both Import and DirectQuery fact tables is often Dual.<\/p>\n<p>Dual mode allows a table to behave as Import when joined with an Import table (avoiding slow cross-source joins) and as DirectQuery when joined with a DirectQuery table (avoiding the performance penalty of a &quot;limited relationship&quot;).<\/p>\n<p>Why the image might select Import: If FactSales is the only DirectQuery table and there is no strict requirement for real-time customer data, keeping dimensions in Import is common for simplicity and fast slicer performance.<\/p>\n<p>2. FactSales: DirectQuery<\/p>\n<p>The Reason: Large transaction tables that require real-time reporting or are too massive to fit into memory are assigned DirectQuery. This leaves the data in the source (like SQL Server or Snowflake) and only queries what is needed when a visual is rendered.<\/p>\n<p>The Trade-off: Slower visual rendering compared to Import, but no need for a data refresh to see the latest sales.<\/p>\n<p>3. FactMarketingEmail: Import<\/p>\n<p>The Reason: This suggests this specific fact table is either smaller in size or does not require up-to-the-minute updates. By using Import, Power BI loads the data into the VertiPaq engine (in-memory).<\/p>\n<p>The Benefit: Blazing-fast performance for calculations and aggregations related to marketing metrics.<\/p>\n<p>Note: the marked answer image for this question shows Import for DimCustomer; the explanation gives Dual, which is used as the key here.<\/p>", "answer_area": {"controls": [{"correct": "Dual", "id": "d1", "label": "DimCustomer:", "options": ["DirectQuery", "Dual", "Import"]}, {"correct": "DirectQuery", "id": "d2", "label": "FactSales:", "options": ["DirectQuery", "Dual", "Import"]}, {"correct": "Import", "id": "d3", "label": "FactMarketingEmail:", "options": ["DirectQuery", "Dual", "Import"]}], "kind": "dropdowns"}, "exh": ""}, {"n": 57, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You use Power BI Desktop to import two tables named Customer and Contacts. The Customer table contains the following columns: •Customer_Name •Customer ID •Website The Contacts table contains the following columns: •Contact ID •Contact Email •Contact Name •Customer Name A web-based contact form is used to fill the Contacts table. The data is not sanitized. You need to create a merge for the Customer and Contacts tables. What should you do?<\/p>", "options": [{"letter": "A", "text": "Set Join Kind to Full Outer."}, {"letter": "B", "text": "Disable fuzzy matching."}, {"letter": "C", "text": "Set Join Kind to Left Outer."}, {"letter": "D", "text": "Enable fuzzy matching."}], "key": ["D"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>Technical Justification for Choosing Option D<\/p>\n<p>Requirement Context: Merge Customer and Contacts tables in Power BI Desktop, considering the Contacts<\/p>\n<p>table&#x27;s data is not sanitized (potentially leading to variations in matching fields).<\/p>\n<p>Key Consideration: The match between the two tables is based on names (Customer_Name in Customer table and Customer Name in Contacts table), which are prone to variations (typos, different formats, etc.) due to unsanitized data from a web form.<\/p>\n<p>Option Analysis:<\/p>\n<p>A. Set Join Kind to Full Outer:<\/p>\n<p>Inappropriateness Reason: The join type (Full Outer) does not address the primary concern of handling potential variations in matching names. A Full Outer Join would return all records from both tables, regardless of matches, which doesn&#x27;t solve the data in
