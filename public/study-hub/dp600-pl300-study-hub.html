ithin the weekly schedule, you can set the pipeline to repeat every 4 hours.<\/p>", "options": [{"letter": "A", "text": "Daily"}, {"letter": "B", "text": "By the minute"}, {"letter": "C", "text": "Weekly"}, {"letter": "D", "text": "Hourly"}], "exh": ""}, {"n": 49, "kind": "hotspot", "kind_label": "Hotspot", "case": "Contoso", "case_ref": 28, "stem_html": "<p>You need to recommend a solution to group the Research division workspaces. What should you include in the recommendation? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p><ul><li>Grouping method: Capacity / Domain / Tenant<\/li><li>Tool: OneLake data hub / The Fabric Admin portal / The Microsoft Entra admin center<\/li><\/ul>", "key": null, "key_source": null, "key_note": null, "statement_answers": null, "explanation_html": "<p>Domain: Group the Research division workspaces based on their departmental context.<\/p>\n<p>Domain allows you to group workspaces based on their purpose or business context. In this case, grouping by department (Research division) aligns with the requirement.<\/p>\n<p>The Fabric Admin Portal is the primary management interface for Microsoft Fabric.<\/p>", "options": [], "answer_area": {"kind": "dropdowns", "controls": [{"id": "d1", "label": "Grouping method:", "options": ["Capacity", "Domain", "Tenant"], "correct": "Domain"}, {"id": "d2", "label": "Tool:", "options": ["OneLake data hub", "The Fabric Admin portal", "The Microsoft Entra admin center"], "correct": "The Fabric Admin portal"}]}, "exh": ""}, {"n": 50, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a lakehouse named Lakehouse1. Lakehouse1 contains a table named Nyctaxi_raw. Nyctaxi_raw contains the following table: You create a Fabric notebook and attach it to Lakehouse1. You need to use PySpark code to transform the data. The solution must meet the following requirements: - Add a column named pickupDate that will contain only the date portion of pickupDateTime. - Filter the DataFrame to include only rows where fareAmount is a positive number that is less than 100. How should you complete the code? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>\n<p>Nyctaxi_raw table — Name / Data type: pickupDateTime Timestamp, passengerCount Integer, fareAmount Double, paymentType String, tipAmount Double.<\/p>\n<p>Answer Area<\/p><pre><code>df = spark.read.format(&quot;delta&quot;).load(&quot;Tables/nyctaxi_raw&quot;)\n\ndf2 = [dropdown 1] (&quot;pickupDate&quot;, df[&#x27;pickupDateTime&#x27;]\n    [dropdown 2] \\\n    [dropdown 3]<\/code><\/pre><ul><li>Dropdown 1: df.columns / df.select / df.withColumn / df.withColumnsRenamed<\/li><li>Dropdown 2: .alias(&#x27;date&#x27;) / .cast(&#x27;date&#x27;) / .cast(&#x27;pickupDate&#x27;) / .getfield(&#x27;date&#x27;)<\/li><li>Dropdown 3: .filter(&quot; fareAmount &gt; 0 AND fareAmount &lt; 100&quot;) / .filter(col(&quot;fareAmount&quot;).contains(&quot;1..100&quot;)) / .when(df.fareAmount &gt; 0 AND fareAmount &lt; 100) / .where(df.fareAmount.isin([1,100]))<\/li><\/ul>", "key": null, "key_source": null, "key_note": null, "statement_answers": null, "explanation_html": "<p>1. df.withColumn.<\/p>\n<p>The withColumn function is used to add or replace a column in a DataFrame.<\/p>\n<p>It is appropriate here because we are creating a new column (pickupDate) based on an existing column (tpepPickupDateTime).<\/p>\n<p>Alternative options like df.select or df.withColumnsRenamed would not modify a column directly.<\/p>\n<p>2 .cast(&#x27;date&#x27;)<\/p>\n<p>The .cast(&#x27;date&#x27;) function is used to convert a column’s data type to date.<\/p>\n<p>Since tpepPickupDateTime is likely a timestamp, converting it to a date ensures it only contains the date portion.<\/p>\n<p>Other options like .alias(&#x27;date&#x27;) only rename the column without changing its type.<\/p>\n<p>3.filter(&quot;fareAmount &gt; 0 AND fareAmount &lt; 100&quot;)<\/p>\n<p>The .filter() function in PySpark is used to apply SQL-like filtering conditions to DataFrames.<\/p>\n<p>The selected condition ensures that only rows where fareAmount is greater than 0 and less than 100 are retained.<\/p>\n<p>Other options like .where(df.fareAmount.isin()) filter for specific values rather than a range.<\/p>", "options": [], "answer_area": {"kind": "dropdowns", "code": "df = spark.read.format(\"delta\").load(\"Tables/nyctaxi_raw\")\n\ndf2 = [dropdown 1] (\"pickupDate\", df['pickupDateTime']\n    [dropdown 2] \\\n    [dropdown 3]", "controls": [{"id": "d1", "options": ["df.columns", "df.select", "df.withColumn", "df.withColumnsRenamed"], "correct": "df.withColumn"}, {"id": "d2", "options": [".alias('date')", ".cast('date')", ".cast('pickupDate')", ".getfield('date')"], "correct": ".cast('date')"}, {"id": "d3", "options": [".filter(\" fareAmount > 0 AND fareAmount < 100\")", ".filter(col(\"fareAmount\").contains(\"1..100\"))", ".when(df.fareAmount > 0 AND fareAmount < 100)", ".where(df.fareAmount.isin([1,100]))"], "correct": ".filter(\" fareAmount > 0 AND fareAmount < 100\")"}]}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Table columns<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Name<\/th><th>Data type<\/th><\/tr><\/thead><tbody><tr><td>pickupDateTime<\/td><td>Timestamp<\/td><\/tr><tr><td>passengerCount<\/td><td>Integer<\/td><\/tr><tr><td>fareAmount<\/td><td>Double<\/td><\/tr><tr><td>paymentType<\/td><td>String<\/td><\/tr><tr><td>tipAmount<\/td><td>Double<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 51, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a Microsoft Power BI report. You are exploring a new semantic model. You need to display the following column statistics: - Count - Average - Null count - Distinct count - Standard deviation Which Power Query function should you run?<\/p>", "key": ["D"], "key_source": "verified", "key_note": null, "statement_answers": null, "explanation_html": "<p>Table.Profile returns one row per column with Count, Average, Null count, Distinct count, Standard deviation, and minimum and maximum values. Table.Schema returns column metadata only, Table.View is a view helper, and Table.FuzzyGroup groups similar values.<\/p>", "options": [{"letter": "A", "text": "Table.schema"}, {"letter": "B", "text": "Table.view"}, {"letter": "C", "text": "Table.FuzzyGroup"}, {"letter": "D", "text": "Table.Profile"}], "exh": ""}, {"n": 52, "kind": "dragdrop", "kind_label": "Drag & drop", "case": null, "case_ref": null, "stem_html": "<p>You are implementing two dimension tables named Customers and Products in a Fabric warehouse. You need to use slowly changing dimension (SCD) to manage the versioning of data. The solution must meet the requirements shown in the following table. Which type of SCD should you use for each table? To answer, drag the appropriate SCD types to the correct tables. Each SCD type may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p><p>SCD Types: Type 0 / Type 1 / Type 2 / Type 3<\/p><ul><li>Customers: [drop target]<\/li><li>Products: [drop target]<\/li><\/ul>", "key": null, "key_source": null, "key_note": null, "statement_answers": null, "explanation_html": "<p>Creating a new version of a row for each change preserves history, which is Type 2. Overwriting the existing value in the latest row keeps only the current value, which is Type 1.<\/p>", "options": [], "answer_area": {"kind": "dragdrop", "values": ["Type 0", "Type 1", "Type 2", "Type 3"], "controls": [{"id": "t1", "label": "Customers:", "correct": "Type 2"}, {"id": "t2", "label": "Products:", "correct": "Type 1"}]}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Change handling per table<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Table<\/th><th>Change action<\/th><\/tr><\/thead><tbody><tr><td>Customers<\/td><td>Create a new version of the row.<\/td><\/tr><tr><td>Products<\/td><td>Overwrite the existing value in the latest row.<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 53, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You are analyzing the data in a Fabric notebook. You have a Spark DataFrame assigned to a variable named df. You need to use the Chart view in the notebook to explore the data manually. Which function should you run to make the data available in the Chart view?<\/p>", "key": ["D"], "key_source": "matched", "key_note": null, "statement_answers": null, "explanation_html": "<p>Display: This function is specifically designed for rendering visual representations of data within interactive notebooks. When you use the display function on a Spark DataFrame, it enables the data to be shown in a tabular format and also makes it available for interactive charting and visualization within the notebook.<\/p>", "options": [{"letter": "A", "text": "displayHTML"}, {"letter": "B", "text": "show"}, {"letter": "C", "text": "write"}, {"letter": "D", "text": "display"}], "exh": ""}, {"n": 54, "kind": "hotspot", "kind_label": "Hotspot", "case": "Litware", "case_ref": 27, "stem_html": "<p>You need to resolve the issue with the pricing group classification. How should you complete the T-SQL statement? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p><pre><code>CREATE [dropdown 1] [dbo].[ProductsWithPricingGroup]\nAS\nSELECT ProductId,\n    ProductName,\n    ProductCategory,\n    ListPrice,\n    [dropdown 2]\n        WHEN ListPrice &lt;= 50 THEN &#x27;low&#x27;\n        [dropdown 3]\n        WHEN ListPrice &gt; 1000 THEN &#x27;high&#x27;\n    END AS PricingGroup\nFROM dbo.Products<\/code><\/pre><ul><li>Dropdown 1: FUNCTION / PROCEDURE / TABLE / VIEW<\/li><li>Dropdown 2: CASE / COALESCE / IIF / SET<\/li><li>Dropdown 3: WHEN (ListPrice &gt; 50 AND ListPrice &lt;= 1000 ) THEN &#x27;medium&#x27; / WHEN (ListPrice &gt;= 50 AND ListPrice &lt; 1000 ) THEN &#x27;medium&#x27; / WHEN (ListPrice BETWEEN 50 AND 1000 ) THEN &#x27;medium&#x27;<\/li><\/ul>", "key": null, "key_source": null, "key_note": null, "statement_answers": null, "explanation_html": "<p>VIEW: from an existing table.<\/p>\n<p>* CASE: correct syntax before the WHENs.<\/p>\n<p>* WHEN ListPrice BETWEEN 50 AND 1000 THEN &#x27;medium&#x27;: the other two options miss value 1000; on the other hand, the BETWEEN includes both 50 and 1000.<\/p>", "options": [], "answer_area": {"kind": "dropdowns", "code": "CREATE [dropdown 1] [dbo].[ProductsWithPricingGroup]\nAS\nSELECT ProductId,\n    ProductName,\n    ProductCategory,\n    ListPrice,\n    [dropdown 2]\n        WHEN ListPrice <= 50 THEN 'low'\n        [dropdown 3]\n        WHEN ListPrice > 1000 THEN 'high'\n    END AS PricingGroup\nFROM dbo.Products", "controls": [{"id": "d1", "options": ["FUNCTION", "PROCEDURE", "TABLE", "VIEW"], "correct": "VIEW"}, {"id": "d2", "options": ["CASE", "COALESCE", "IIF", "SET"], "correct": "CASE"}, {"id": "d3", "options": ["WHEN (ListPrice > 50 AND ListPrice <= 1000 ) THEN 'medium'", "WHEN (ListPrice >= 50 AND ListPrice < 1000 ) THEN 'medium'", "WHEN (ListPrice BETWEEN 50 AND 1000 ) THEN 'medium'"], "correct": "WHEN (ListPrice BETWEEN 50 AND 1000 ) THEN 'medium'"}]}, "exh": ""}, {"n": 55, "kind": "dragdrop", "kind_label": "Drag & drop", "case": null, "case_ref": null, "stem_html": "<p>You are building a solution by using a Fabric notebook. You have a Spark DataFrame assigned to a variable named df. The DataFrame returns four columns. You need to change the data type of a string column named Age to integer. The solution must return a DataFrame that includes all the columns. How should you complete the code? To answer, drag the appropriate values to the correct targets. Each value may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p><p>Values: cast / col / get / select / selectExpr / transform / withColumn<\/p><pre><code>df. [drop target 1] (&quot;age&quot;, [drop target 2] (&quot;age&quot;). [drop target 3] (&quot;int&quot;)).show()<\/code><\/pre>", "key": null, "key_source": null, "key_note": null, "statement_answers": null, "explanation_html": "<p>withColumn adds or replaces the age column, col references the age column, and cast converts it to int: df.withColumn(\"age\", col(\"age\").cast(\"int\")).<\/p>", "options": [], "answer_area": {"kind": "dragdrop", "values": ["cast", "col", "get", "select", "selectExpr", "transform", "withColumn"], "code": "df. [drop target 1] (\"age\", [drop target 2] (\"age\"). [drop target 3] (\"int\")).show()", "controls": [{"id": "t1", "label": "Target 1", "correct": "withColumn"}, {"id": "t2", "label": "Target 2", "correct": "col"}, {"id": "t3", "label": "Target 3", "correct": "cast"}]}, "exh": ""}, {"n": 56, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains three users named User1, User2, and User3. The tenant contains a security group named Group1. User1 and User3 are members of Group1. The tenant contains the workspaces shown in the following table. The tenant contains the domains shown in the following table. User1 creates a new workspace named Workspace3. You assign Domain1 as the default domain of Group1. For each of the following statements, select Yes if the statement is true. Otherwise, select No. NOTE: Each correct selection is worth one point.<\/p>\n<p>Workspace admins — Workspace1: User1, Workspace2: User2. Domain admins — Domain1: User1, Domain2: User2.<\/p>\n<p>Answer Area<\/p><ul><li>User2 is assigned the Contributor role for Workspace3. — Yes / No<\/li><li>User3 is assigned the Viewer role for Workspace3. — Yes / No<\/li><li>User3 is assigned the Contributor role for Workspace1. — Yes / No<\/li><\/ul>", "key": null, "key_source": null, "key_note": null, "statement_answers": null, "explanation_html": "<p>Workspace roles are granted on the workspace, not through domains or groups. User2 has no role on Workspace3, User3 has no role on Workspace3, and User3 has no role on Workspace1, so all three statements are No.<\/p>", "options": [], "answer_area": {"kind": "statements", "controls": [{"id": "s1", "text": "User2 is assigned the Contributor role for Workspace3.", "correct": "No"}, {"id": "s2", "text": "User3 is assigned the Viewer role for Workspace3.", "correct": "No"}, {"id": "s3", "text": "User3 is assigned the Contributor role for Workspace1.", "correct": "No"}]}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Workspaces<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Name<\/th><th>Admin<\/th><\/tr><\/thead><tbody><tr><td>Workspace1<\/td><td>User1<\/td><\/tr><tr><td>Workspace2<\/td><td>User2<\/td><\/tr><\/tbody><\/table><\/div><\/div><div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Domains<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Name<\/th><th>Admin<\/th><\/tr><\/thead><tbody><tr><td>Domain1<\/td><td>User1<\/td><\/tr><tr><td>Domain2<\/td><td>User2<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 57, "kind": "single", "kind_label": "Single choice", "case": "Contoso", "case_ref": 28, "stem_html": "<p>Which syntax should you use in a notebook to access the Research division data for Productline1?<\/p>", "key": ["D"], "key_source": "verified", "key_note": null, "statement_answers": null, "explanation_html": "<p>The shortcut ResearchProduct sits in the Tables section of the lakehouse as a Delta table, so it is read with spark.read.format(\"delta\").load(\"Tables/ResearchProduct\"). \"Tables\" is not a schema in Spark SQL three-part naming, so the Spark SQL option is wrong, and the productline1 path does not exist.<\/p>", "options": [{"letter": "A", "text": "spark.sql(\"SELECT * FROM Lakehouse1.Tables.ResearchProduct\")"}, {"letter": "B", "text": "spark.read.format(\"delta\").load(\"Tables/productline1/ResearchProduct\")"}, {"letter": "C", "text": "external_table(ResearchProduct)"}, {"letter": "D", "text": "spark.read.format(\"delta\").load(\"Tables/ResearchProduct\")"}], "exh": ""}, {"n": 58, "kind": "dragdrop", "kind_label": "Drag & drop", "case": null, "case_ref": null, "stem_html": "<p>You are creating a data flow in Fabric to ingest data from an Azure SQL database by using a T-SQL statement. You need to ensure that any foldable Power Query transformation steps are processed by the Microsoft SQL Server engine. How should you complete the code? To answer, drag the appropriate values to the correct targets. Each value may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p><p>Values: EnableFolding / NativeQuery / Optimize / Record / StopFolding / Table / Value<\/p><pre><code>let\n    Source = Sql.Databases(\n        &quot;server.database.windows.net&quot;\n    ),\n    Database = Source{[Name = &quot;db&quot;]}[Data],\n    Query = [drop target 1].[drop target 2](\n        Database,\n        &quot; SELECT * FROM customer WHERE country IN (&#x27;USA&#x27;, &#x27;UK&#x27;)&quot;,\n        null,\n        [ [drop target 3] = true]\n    )\nin\n    Query<\/code><\/pre>", "key": null, "key_source": null, "key_note": null, "statement_answers": null, "explanation_html": "<p>Value.<\/p>\n<p>Value is the function used to store the result of the query.<\/p>\n<p>NativeQuery.<\/p>\n<p>NativeQuery allows executing a direct SQL query within Power Query M code. EnableFolding .<\/p>\n<p>This enables query folding, ensuring that transformations are executed in SQL Server rather than in Power Query.<\/p>", "options": [], "answer_area": {"kind": "dragdrop", "values": ["EnableFolding", "NativeQuery", "Optimize", "Record", "StopFolding", "Table", "Value"], "code": "let\n    Source = Sql.Databases(\n        \"server.database.windows.net\"\n    ),\n    Database = Source{[Name = \"db\"]}[Data],\n    Query = [drop target 1].[drop target 2](\n        Database,\n        \" SELECT * FROM customer WHERE country IN ('USA', 'UK')\",\n        null,\n        [ [drop target 3] = true]\n    )\nin\n    Query", "controls": [{"id": "t1", "label": "Target 1", "correct": "Value"}, {"id": "t2", "label": "Target 2", "correct": "NativeQuery"}, {"id": "t3", "label": "Target 3", "correct": "EnableFolding"}]}, "exh": ""}, {"n": 59, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains two workspaces named Workspace1 and Workspace2 and a user named User1. You need to ensure that User1 can perform the following tasks: - Create a new domain. - Create two subdomains named subdomain1 and subdomain2. - Assign Workspace1 to subdomain1. - Assign Workspace2 to subdomain2. The solution must follow the principle of least privilege. Which role should you assign to User1?<\/p>", "key": ["C"], "key_source": "verified", "key_note": null, "statement_answers": null, "explanation_html": "<p>Creating a domain is a tenant-level action that only a Fabric admin can perform. Domain admins manage subdomains inside a domain they administer, and a workspace Admin role is scoped to a single workspace.<\/p>", "options": [{"letter": "A", "text": "domain admin"}, {"letter": "B", "text": "domain contributor"}, {"letter": "C", "text": "Fabric admin"}, {"letter": "D", "text": "workspace Admin"}], "exh": ""}, {"n": 60, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric workspace named Workspace1 that contains a lakehouse named Lakehouse1. In Workspace1, you create a data pipeline named Pipeline1. You have CSV files stored in an Azure Storage account. You need to add an activity to Pipeline1 that will copy data from the CSV files to Lakehouse1. The activity must support Power Query M formula language expressions. Which type of activity should you add?<\/p>", "key": ["A"], "key_source": "verified", "key_note": null, "statement_answers": null, "explanation_html": "<p>A Dataflow activity runs a dataflow that uses the Power Query M formula language, so it can copy data from the CSV files into the lakehouse with M expressions. A Copy data activity copies data but does not support M expressions.<\/p>", "options": [{"letter": "A", "text": "Dataflow"}, {"letter": "B", "text": "Notebook"}, {"letter": "C", "text": "Script"}, {"letter": "D", "text": "Copy data"}], "exh": ""}, {"n": 61, "kind": "hotspot", "kind_label": "Hotspot", "case": "Contoso", "case_ref": 28, "stem_html": "<p>You need to migrate the Research division data for Productline2. The solution must meet the data preparation requirements. How should you complete the code? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p><p>Answer Area<\/p><pre><code>df=spark.read.format('csv').options(header=&quot;true&quot;,inferSchema=&quot;true&quot;).load(&quot;fs1@storage1.dfs.core.windows.net/files/productline2&quot;)\n\ndf.write.mode(&quot;overwrite&quot;).format(&quot;[dropdown 1]&quot;).save(&quot;[dropdown 2]&quot;)<\/code><\/pre><ul><li>Dropdown 1: csv / delta / parquet<\/li><li>Dropdown 2: productline2 / Tables/productline2 / Tables/research/productline2<\/li><\/ul>", "key": null, "key_source": "verified", "key_note": null, "statement_answers": null, "explanation_html": "<p>Managed tables in a lakehouse are stored in Delta format, so the format must be delta. Writing to Tables/productline2 places the data in the Tables section as a managed table. Writing to productline2 alone would land in the Files section, and Tables/research/productline2 is not the location of the Productline2 data.<\/p>", "options": [], "answer_area": {"kind": "dropdowns", "code": "df=spark.read.format('csv').options(header=\"true\",inferSchema=\"true\").load(\"fs1@storage1.dfs.core.windows.net/files/productline2\")\n\ndf.write.mode(\"overwrite\").format(\"[dropdown 1]\").save(\"[dropdown 2]\")", "controls": [{"id": "d1", "options": ["csv", "delta", "parquet"], "correct": "delta"}, {"id": "d2", "options": ["productline2", "Tables/productline2", "Tables/research/productline2"], "correct": "Tables/productline2"}]}, "exh": ""}, {"n": 62, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a workspace named Workspace1 and a user named DBUser. Workspace1 contains a lakehouse named Lakehouse1. DBUser does NOT have access to the tenant. You grant DBUser access to Lakehouse1 as shown in the following exhibit. Use the drop-down menus to select the answer choice that completes each statement based on the information presented in the graphic. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p><ul><li>DBUser can read the data in Lakehouse1 by using the [Answer choice]. — default semantic model / OneLake endpoint / Tabular Data Stream (TDS) endpoint<\/li><li>DBUser can query the data in Lakehouse1 by using [Answer choice]. — a KQL queryset / OneLake file explorer / Microsoft SQL Server Management Studio (SSMS)<\/li><\/ul>", "key": null, "key_source": null, "key_note": null, "statement_answers": null, "explanation_html": "<p>Only the \"Read all Apache Spark\" permission is checked, so DBUser can read the lakehouse data through the OneLake endpoint used by Spark and OneLake APIs, and can access it with OneLake file explorer. The SQL endpoint data option is unchecked, so the TDS endpoint and SSMS are not available, and a KQL queryset applies to KQL databases.<\/p>", "options": [], "answer_area": {"kind": "dropdowns", "controls": [{"id": "d1", "before": "DBUser can read the data in Lakehouse1 by using the", "after": ".", "options": ["default semantic model", "OneLake endpoint", "Tabular Data Stream (TDS) endpoint"], "correct": "OneLake endpoint"}, {"id": "d2", "before": "DBUser can query the data in Lakehouse1 by using", "after": ".", "options": ["a KQL queryset", "OneLake file explorer", "Microsoft SQL Server Management Studio (SSMS)"], "correct": "OneLake file explorer"}]}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): “Grant people access” dialog for MyLakehouse1<\/div><ul class=\"exh-ul\"><li>Text: “People you share this Lakehouse with can open it and its SQL endpoint and read the default dataset. To allow them to read directly in the Lakehouse, grant additional permissions.”<\/li><li><b>User:<\/b> DBUser<\/li><li><b>Additional permissions:<\/b> ☐ Read all SQL endpoint data · ☑ Read all Apache Spark · ☐ Build reports on the default semantic model<\/li><li><b>Notification options:<\/b> ☑ Notify recipients by email<\/li><\/ul><\/div>"}, {"n": 63, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a workspace named Workspace1. Workspace1 contains a data pipeline named Pipeline1 and a lakehouse named Lakehouse1. You perform the following actions: - Create a workspace named Workspace2. - Create a deployment pipeline named DeployPipeline1 that will deploy items from Workspace1 to Workspace2. - Add a folder named Folder1 to Workspace1. - Move Lakehouse1 to Folder1. - Run DeployPipeline1. Which structure will Workspace2 have when DeployPipeline1 is complete?<\/p>", "key": ["C"], "key_source": "verified", "key_note": null, "statement_answers": null, "explanation_html": "<p>Folders are part of an item’s identity in deployment pipelines: when an item in a folder is deployed, its folder is recreated in the target stage. Lakehouse1 was moved to Folder1, so it arrives as Folder1Lakehouse1. Pipeline1 was never moved to a folder, so it arrives as Pipeline1.<\/p>", "options": [{"letter": "A", "text": "Folder1Pipeline1 Folder1Lakehouse1"}, {"letter": "B", "text": "Pipeline1 Lakehouse1"}, {"letter": "C", "text": "Pipeline1 Folder1Lakehouse1"}, {"letter": "D", "text": "Folder1Lakehouse1"}], "exh": ""}, {"n": 64, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a lakehouse named Lakehouse1. Lakehouse1 contains a Delta table that has one million Parquet files. You need to remove files that were NOT referenced by the table during the past 30 days. The solution must ensure that the transaction log remains consistent, and the ACID properties of the table are maintained. What should you do?<\/p>", "key": ["D"], "key_source": "verified", "key_note": null, "statement_answers": null, "explanation_html": "<p>VACUUM removes files that are no longer referenced by a Delta table, including files older than the retention period. OPTIMIZE compacts small files and applies Z-order or V-order; it does not delete unreferenced files. Deleting files from OneLake file explorer bypasses the table’s transaction log.<\/p>", "options": [{"letter": "A", "text": "From OneLake file explorer, delete the files."}, {"letter": "B", "text": "Run the OPTIMIZE command and specify the Z-order parameter."}, {"letter": "C", "text": "Run the OPTIMIZE command and specify the V-order parameter."}, {"letter": "D", "text": "Run the VACUUM command."}], "exh": ""}, {"n": 65, "kind": "dragdrop", "kind_label": "Drag & drop", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a lakehouse named Lakehouse1. Readings from 100 IoT devices are appended to a Delta table in Lakehouse1. Each set of readings is approximately 25 KB. Approximately 10 GB of data is received daily. All the table and SparkSession settings are set to the default. You discover that queries are slow to execute. In addition, the lakehouse storage contains data and log files that are no longer used. You need to remove the files that are no longer used and combine small files into larger files with a target size of 1 GB per file. What should you do? To answer, drag the appropriate actions to the correct requirements. Each action may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p><p>Actions: Set the autoCompact table setting. / Set the optimizeWrite table setting. / Run the VACUUM command on a schedule. / Set the autoCompact SparkSession setting. / Run the OPTIMIZE command on a schedule. / Set the parallelDelete SparkSession setting.<\/p><ul><li>Remove the files: [drop target]<\/li><li>Combine the files: [drop target]<\/li><\/ul>", "key": null, "key_source": null, "key_note": null, "statement_answers": null, "explanation_html": "<p>Remove the files that are no longer used:<\/p>\n<p>Run the VACUUM command on a schedule: The VACUUM command cleans up old files and log files that are no longer needed by the Delta table, helping to free up storage and potentially improve performance by reducing the number of files the query engine needs to consider.<\/p>\n<p>Combine small files into larger files:<\/p>\n<p>Run the OPTIMIZE command on a schedule: The OPTIMIZE command compacts small files into larger ones, improving read performance by reducing the overhead associated with opening many small files. This can be particularly useful when you have a large number of small files due to frequent appends of small data sets.<\/p>", "options": [], "answer_area": {"kind": "dragdrop", "values": ["Set the autoCompact table setting.", "Set the optimizeWrite table setting.", "Run the VACUUM command on a schedule.", "Set the autoCompact SparkSession setting.", "Run the OPTIMIZE command on a schedule.", "Set the parallelDelete SparkSession setting."], "controls": [{"id": "t1", "label": "Remove the files:", "correct": "Run the VACUUM command on a schedule."}, {"id": "t2", "label": "Combine the files:", "correct": "Run the OPTIMIZE command on a schedule."}]}, "exh": ""}, {"n": 66, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric notebook that has the Python code and output shown in the following exhibit. Which type of analytics are you performing?<\/p>", "key": ["A"], "key_source": "verified", "key_note": null, "statement_answers": null, "explanation_html": "<p>The notebook draws a histogram of tip amounts and the output shows the distribution of the values. Summarizing and visualizing what the data contains is descriptive analytics. Diagnostic analytics would explain why something happened, predictive would forecast, and prescriptive would recommend actions.<\/p>", "options": [{"letter": "A", "text": "descriptive"}, {"letter": "B", "text": "diagnostic"}, {"letter": "C", "text": "prescriptive"}, {"letter": "D", "text": "predictive"}], "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Notebook code<\/div><pre class=\"exh-pre\"><code># Look at a histogram of tips by count by using Matplotlib\n\nax1 = sampled_taxi_pd_df[&#x27;tipAmount&#x27;].plot(kind=&#x27;hist&#x27;, bins=25, facecolor=&#x27;lightblue&#x27;...)\nax1.set_title(&#x27;Tip amount distribution&#x27;)\nax1.set_xlabel(&#x27;Tip Amount ($)&#x27;)\nax1.set_ylabel(&#x27;Counts&#x27;)\nplt.suptitle(&#x27;&#x27;)\nplt.show()<\/code><\/pre><\/div><div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Chart output<\/div><p class=\"exh-p\">A histogram titled <b>“Tip amount distribution”<\/b> (x-axis: Tip Amount ($), 0–25+; y-axis: Counts). The bars start very tall at $0–1 (about 860 counts), then fall steadily: about 560 at $1–2, 310 at $2–3, 130 at $3–4, 70 at $4–5, and only a few counts beyond $6, with a thin tail out to roughly $26. The distribution is strongly right-skewed.<\/p><\/div>"}, {"n": 67, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You are the administrator of a Fabric workspace that contains a lakehouse named Lakehouse1. Lakehouse1 contains the following tables: - Table1: A Delta table created by using a shortcut - Table2: An external table created by using Spark - Table3: A managed table You plan to connect to Lakehouse1 by using its SQL endpoint. What will you be able to do after connecting to Lakehouse1?<\/p>", "key": ["A"], "key_source": "matched", "key_note": null, "statement_answers": null, "explanation_html": "<p>A. Read Table3.<\/p>\n<p>When you connect to a Lakehouse SQL endpoint in Microsoft Fabric, you are connecting to:<\/p>\n<p>The SQL analytics endpoint (read-only T-SQL surface over lakehouse tables)<\/p>\n<p>The SQL endpoint has important limitations.<\/p>", "options": [{"letter": "A", "text": "Read Table3."}, {"letter": "B", "text": "Update the data Table3."}, {"letter": "C", "text": "Read Table2."}, {"letter": "D", "text": "Update the data in Table1."}], "exh": ""}, {"n": 68, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains customer churn data stored as Parquet files in OneLake. The data contains details about customer demographics and product usage. You create a Fabric notebook to read the data into a Spark DataFrame. You then create column charts in the notebook that show the distribution of retained customers as compared to lost customers based on geography, the number of products purchased, age, and customer tenure. Which type of analytics are you performing?<\/p>", "key": ["B"], "key_source": "verified", "key_note": null, "statement_answers": null, "explanation_html": "<p>Descriptive analytics provide granular insights based on historical data. This includes tracking past purchases, customer complaints, customer service reviews, and more. The column charts describe what happened in the data: the distribution of retained customers as compared to lost customers.<\/p><p>Predictive analytics forecasts the behavior of customers based on past data. Prescriptive analytics finds solutions based on insights from descriptive analytics. Diagnostic analytics involves the collection and examination of data pertaining to a particular issue or occurrence in order to comprehend the underlying causes.<\/p>", "options": [{"letter": "A", "text": "diagnostic"}, {"letter": "B", "text": "descriptive"}, {"letter": "C", "text": "prescriptive"}, {"letter": "D", "text": "predictive"}], "exh": ""}, {"n": 69, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant. You are creating a Fabric Data Factory pipeline. You have a stored procedure that returns the number of active customers and their average sales for the current month. You need to add an activity that will execute the stored procedure in a warehouse. The returned values must be available to the downstream activities of the pipeline. Which type of activity should you add?<\/p>", "key": ["C"], "key_source": "verified", "key_note": null, "statement_answers": null, "explanation_html": "<p>A Lookup activity executes a query or stored procedure and returns its result so later activities can use it. Get metadata returns information about data rather than query results, Switch branches on a value, and Append variable adds a value to an array variable.<\/p>", "options": [{"letter": "A", "text": "Get metadata"}, {"letter": "B", "text": "Switch"}, {"letter": "C", "text": "Lookup"}, {"letter": "D", "text": "Append variable"}], "exh": ""}, {"n": 70, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a lakehouse. You plan to use a visual query to merge two tables. You need to ensure that the query returns all the rows in both tables. Which type of join should you use?<\/p>", "key": ["B"], "key_source": "verified", "key_note": null, "statement_answers": null, "explanation_html": "<p>A full outer join returns every row from both tables, matching rows where the keys are equal and keeping unmatched rows from each side. Inner returns only matches, left and right outer keep all rows from one side only, and anti joins return only non-matching rows.<\/p>", "options": [{"letter": "A", "text": "inner"}, {"letter": "B", "text": "full outer"}, {"letter": "C", "text": "left outer"}, {"letter": "D", "text": "right anti"}, {"letter": "E", "text": "right outer"}, {"letter": "F", "text": "left anti"}], "exh": ""}], "extra": [{"n": 1, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric semantic model named Model1 that contains a table named Sales. Sales contains one million rows and uses Import storage mode. Model1 includes 50 DAX formulas that reference the Sales table and two DAX measures named Sales Quantity and Sales Quantity LY and 15 other measures. For each of the following statements, select Yes if the statement is true. Otherwise, select No. NOTE: Each correct selection is worth one point.<\/p>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>Dual storage changes where the Sales table is read from; it does not change how the 50 DAX formulas evaluate, so it does not by itself improve the performance of the formulas. A variable helps only when the same value is calculated more than once in a measure; storing the Sales Quantity result in a variable does not help if it is used once. DIVIDE() guards against division by zero; it is a correctness function, not a performance optimisation.<\/p>", "answer_area": {"kind": "statements", "controls": [{"id": "s1", "text": "Changing the storage mode of the Sales table to Dual will improve the performance of the formulas.", "correct": "No"}, {"id": "s2", "text": "Creating a variable in the Sales Quantity LY measure to store the result of the Sales Quantity measure will improve the overall performance of Model1.", "correct": "No"}, {"id": "s3", "text": "Using the DIVIDE() DAX function in the measures will improve the overall performance of Model1.", "correct": "No"}]}, "exh": ""}, {"n": 2, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a semantic model named Model1. Model1 contains a table named TemperatureUnit. TemperatureUnit contains a column named Unit. Unit contains manually added options for Celsius and Fahrenheit. Model1 contains the measures shown in the exhibit. You need to add a dynamic format string to the [TemperatureDisplay] measure to enable users to switch display values between metric (Celsius) and imperial (Fahrenheit). How should you complete the DAX expression? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>The format string must react to the unit the user picks. SELECTEDVALUE returns the single selected value of TemperatureUnit[Unit] (or \"Celsius\" when nothing is selected), and the column that holds the unit is Temperature[Unit]. The SWITCH then formats the value as \"0.0 °C\" or \"0.0 °F\".<\/p>", "answer_area": {"kind": "dropdowns", "code": "TempFormatted =\n    SWITCH(\n        [dropdown 1]( [dropdown 2], \"Celsius\"),\n        \"Celsius\", \"0.0 °C\",\n        \"Fahrenheit\", \"0.0 °F\",\n        \"0.0\"\n    )", "controls": [{"id": "d1", "options": ["CALCULATE", "LOOKUPVALUE", "SELECTEDVALUE"], "correct": "SELECTEDVALUE"}, {"id": "d2", "options": ["TemperatureMetric[Unit]", "Temperature[Unit]", "Unit[TemperatureUnit]"], "correct": "Temperature[Unit]"}]}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Measures in Model1<\/div><pre class=\"exh-pre\"><code>[TemperatureMetric] = AVERAGE(Weather[Temp])\n\n[TemperatureDisplay] =\nVAR Unit = SELECTEDVALUE(TemperatureUnit[Unit], &quot;Celsius&quot;)\nVAR CelsiusValue = [TemperatureMetric]\nRETURN\n    SWITCH(\n        Unit,\n        &quot;Fahrenheit&quot;, (CelsiusValue * 9/5) + 32,\n        CelsiusValue\n    )<\/code><\/pre><\/div>"}, {"n": 3, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Microsoft Power BI semantic model that contains a measure named TotalSalesAmount. TotalSalesAmount returns a sales revenue amount that is translated into a selected currency. You need to ensure that the value returned by TotalSalesAmount is formatted to use the correct currency symbol. What should you include in the solution?<\/p>", "options": [{"letter": "A", "text": "A dynamic format string"}, {"letter": "B", "text": "The WINDOW DAX function"}, {"letter": "C", "text": "A linguistic schema"}, {"letter": "D", "text": "A field parameter"}], "key": ["A"], "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>Scenario: Semantic model contains a measure: TotalSalesAmount. This measure returns sales revenue translated into a selected currency. Requirement: Format the result using the correct currency symbol dynamically. Analysis: Dynamic format string in DAX is specifically designed for applying formats (like currency symbols) dynamically based on slicers or calculation context. WINDOW function # used for windowing calculations, not formatting. Linguistic schema # used for Q&amp;A natural language, not for formatting. Field parameter # used to swap fields/measures dynamically, not for formatting.<\/p>", "answer_area": null, "exh": ""}, {"n": 4, "kind": "dragdrop", "kind_label": "Drag & drop", "case": null, "case_ref": null, "stem_html": "<p>You have Fabric tenant that contains a semantic model named Model1. Model1 contains the following tables.<\/p><p>You are designing a Microsoft Power BI report named Report1 that will deliver near-real-time (NRT) shipping data. Report1 will contain data about many shipped packages. You need to ensure that each table is in the appropriate storage mode to support Report1. The solution must support near-realtime data delivery while maintaining high query performance. Which storage mode should you select for each table? To answer, drag the appropriate storage modes to the correct tables. Each mode may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content. NOTE: Each correct selection is worth one point.<\/p>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>Report1 delivers near-real-time shipping data. The fact table must serve both fresh data and cached queries, so it uses Hybrid storage. The two dimensions are small and change rarely, so Dual storage lets them be served from memory or from the underlying tables as needed.<\/p>", "answer_area": {"kind": "dragdrop", "values": ["DirectQuery", "Dual", "Hybrid", "Import"], "controls": [{"id": "t1", "label": "FactPackageEvents:", "correct": "Hybrid"}, {"id": "t2", "label": "DimPackage:", "correct": "Dual"}, {"id": "t3", "label": "DimCarrier:", "correct": "Dual"}]}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Model1 tables<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Name<\/th><th>Description<\/th><\/tr><\/thead><tbody><tr><td>FactPackageEvents<\/td><td>Contains two columns named PackageID and CarrierID<\/td><\/tr><tr><td>DimPackage<\/td><td>Contains a column named PackageID<\/td><\/tr><tr><td>DimCarrier<\/td><td>Contains a column named CarrierID<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 5, "kind": "multi", "kind_label": "Multi-select", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a semantic model named Model1. Model1 contains a fact table with millions of rows of shipment data. You need to enable partitioning to improve the query performance and manageability of Model1. Which two tools can you use to achieve the goal? Each correct answer presents a complete solution. NOTE: Each correct answer is worth one point.<\/p>", "options": [{"letter": "A", "text": "Tabular Editor"}, {"letter": "B", "text": "Microsoft SQL Server Management Studio (SSMS)"}, {"letter": "C", "text": "the Microsoft Power BI service"}, {"letter": "D", "text": "Microsoft Power BI Desktop"}, {"letter": "E", "text": "DAX Studio"}], "key": ["A", "B"], "key_source": "derived", "key_note": "Note: the matching question in the reference bank names Power BI Desktop as one of the tools. Power BI Desktop cannot create or manage partitions; partitions are managed through the XMLA endpoint with Tabular Editor or SQL Server Management Studio, so the key shown here is Tabular Editor and SQL Server Management Studio.", "statement_answers": null, "explanation_html": "<p>Partitions are managed through the XMLA endpoint. Tabular Editor and SQL Server Management Studio can both create and manage partitions on a semantic model. Power BI Desktop does not expose partition management, and the Power BI service and DAX Studio are not the tools for this task.<\/p>", "answer_area": null, "exh": ""}, {"n": 6, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a Microsoft Power BI project that contains a file named definition.pbir. definition.pbir contains the following JSON.<\/p><p>For each of the following statements, select Yes if the statement is true. Otherwise, select No. NOTE: Each correct selection is worth one point.<\/p>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>Explanation:<\/p><p>We are analyzing the JSON for definition.pbir in a Power BI Project: { &quot; version &quot; : &quot; 1.0 &quot; , &quot; datasetReference &quot; : { &quot; byPath &quot; : { &quot; path &quot; : &quot; ../Sales.Dataset &quot; }, &quot; byConnection &quot; : null } } Statement 1: &quot; definition.pbir is in the PBIR-Legacy format. &quot; No # The legacy PBIR format references datasets by byConnection (pointing to the Power BI service). Here, it uses byPath, which is the new project format, not legacy. Statement 2: &quot; The semantic model referenced by definition.pbir is located in the Power BI service. &quot; No # The JSON shows byPath: &quot; ../Sales.Dataset &quot; , meaning the semantic model is referenced locally within the project folder (Sales.Dataset), not in the Power BI service. Statement 3: &quot; When the related report is opened, Power BI Desktop will open the semantic model in full edit mode. &quot; Yes # Since the semantic model is referenced by path (local PBIP project files), Power BI Desktop will open the model in full edit mode. If it had been byConnection, it would open in live connect mode to the service instead. Final Answer: PBIR-Legacy format # No Semantic model in Power BI service # No Opens in full edit mode # Yes<\/p>", "answer_area": {"kind": "statements", "controls": [{"id": "s1", "text": "definition.pbir is in the PBIR-Legacy format.", "correct": "No"}, {"id": "s2", "text": "The semantic model referenced by definition.pbir is located in the Power BI service.", "correct": "No"}, {"id": "s3", "text": "When the related report is opened, Power BI Desktop will open the semantic model in full edit mode.", "correct": "Yes"}]}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): definition.pbir<\/div><pre class=\"exh-pre\"><code>{\n  &quot;version&quot;: &quot;1.0&quot;,\n  &quot;datasetReference&quot;: {\n    &quot;byPath&quot;: {\n      &quot;path&quot;: &quot;../Sales.Dataset&quot;\n    },\n    &quot;byConnection&quot;: null\n  }\n}<\/code><\/pre><\/div>"}, {"n": 7, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a data warehouse. You need to load rows into a large Type 2 slowly changing dimension (SCD). The solution must minimize resource usage. Which T-SQL statement should you use?<\/p>", "options": [{"letter": "A", "text": "update and insert"}, {"letter": "B", "text": "MERGE"}, {"letter": "C", "text": "TRUNCATE TABLE and INSERT"}, {"letter": "D", "text": "CREATE TABLE AS SELECT"}], "key": ["B"], "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>For Type 2 Slowly Changing Dimensions (SCD): MERGE is the standard T-SQL approach, allowing conditional UPDATE for existing rows and INSERT for new history records, in a single statement. UPDATE + INSERT would require multiple steps and higher resource usage. TRUNCATE + INSERT would destroy historical data, violating SCD rules. CREATE TABLE AS SELECT is not suitable for incremental Type 2 handling. Correct answer: B . Reference: Implement SCD Type 2 with MERGE<\/p>", "answer_area": null, "exh": ""}, {"n": 8, "kind": "multi", "kind_label": "Multi-select", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a semantic model named Model1. Model1 contains a fact table named FactSales. FactSales has a relationship to a dimension table named DimDate on a column named OrderDate. To FactSales, you add a second relationship between FactSales and DimDate based on a column named ShippedDate. You need to filter by using ShippedDate in a new report. The solution must NOT affect the function of existing reports. Which two actions should you perform? Each correct answer presents part of the solution. NOTE: Each correct answer is worth one point.<\/p>", "options": [{"letter": "A", "text": "Disable the ShippedDate relationship between the tables."}, {"letter": "B", "text": "Use a relatedtable DAX function."}, {"letter": "C", "text": "Enable the ShippedDate relationship."}, {"letter": "D", "text": "Use a userelationship DAX function."}, {"letter": "E", "text": "Use a crossfilter DAX function."}], "key": ["D", "E"], "key_source": "answer", "key_note": null, "statement_answers": null, "explanation_html": "<p>The ShippedDate relationship is inactive, so existing reports that use the active OrderDate relationship are unaffected. In the new report you activate the ShippedDate relationship for the measure with USERELATIONSHIP and control the filter direction with CROSSFILTER.<\/p>", "answer_area": null, "exh": ""}, {"n": 9, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have two Microsoft Power BI queries named Employee and Retired Roles. You need to merge the Employee query with the Retired Roles query. The solution must ensure that rows in the Employee query that match the Retired Roles query are removed. Which column and Join Kind should you use in Power Query Editor? To answer, select the appropriate options in the answer area. NOTE: Each correct answer is worth one point<\/p>", "options": [], "key": null, "key_source": "derived", "key_note": null, "statement_answers": null, "explanation_html": "<p class=\"key-note\">Note: the marked answer area shows Inner (only matching rows). An inner join keeps only the rows that match, which is the opposite of the stated goal. Left Anti returns the rows in Employee that have no match in Retired Roles, so the matching rows are removed.<\/p><p>The matching column is Division, which appears in both queries. Left Anti returns only the rows in the first query (Employee) that have no matching row in the second query (Retired Roles), so the employees who have retired are removed from the result.<\/p>", "answer_area": {"kind": "dropdowns", "controls": [{"id": "d1", "label": "Column:", "options": ["ID", "Division", "Title Detail", "Role", "Department", "Department Number", "Division Number"], "correct": "Division"}, {"id": "d2", "label": "Join Kind:", "options": ["Left Outer (all from first, matching from second)", "Right Outer (all from second, matching from first)", "Full Outer (all rows from both)", "Inner (only matching rows)", "Left Anti (rows only in first)", "Right Anti (rows only in second)"], "correct": "Left Anti (rows only in first)"}]}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Power Query Merge dialog<\/div><p class=\"exh-p\">Merge: select a table and matching columns to create a merged table. The <b>Division<\/b> column is highlighted in both tables.<\/p><p class=\"exh-p\"><b>Employee (top table)<\/b><\/p><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>ID<\/th><th>Division<\/th><th>Title Detail<\/th><th>Role<\/th><th>Department<\/th><th>Department Number<\/th><th>Division Number<\/th><\/tr><\/thead><tbody><tr><td>198<\/td><td>Services<\/td><td>Marketing<\/td><td>Vice President<\/td><td>Marketing<\/td><td>22<\/td><td>14<\/td><\/tr><tr><td>299<\/td><td>Services<\/td><td>Business Development<\/td><td>Vice President<\/td><td>Sales<\/td><td>17<\/td><td>14<\/td><\/tr><tr><td>169<\/td><td>Services<\/td><td>Human Resources<\/td><td>Vice President<\/td><td>Human Resources<\/td><td>13<\/td><td>14<\/td><\/tr><tr><td>146<\/td><td>Services<\/td><td>HSE &amp; Risk Management<\/td><td>Vice President<\/td><td>Safety<\/td><td>16<\/td><td>14<\/td><\/tr><\/tbody><\/table><\/div><p class=\"exh-p\"><b>Retired Roles (bottom table)<\/b><\/p><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Division<\/th><th>Role<\/th><\/tr><\/thead><tbody><tr><td>Services<\/td><td>Technical Analyst<\/td><\/tr><tr><td>Services<\/td><td>Technical Support Analyst<\/td><\/tr><tr><td>Services<\/td><td>Senior Engineer<\/td><\/tr><tr><td>Services<\/td><td>Chief Technical Officer<\/td><\/tr><tr><td>Services<\/td><td>Applied Technology Specialist<\/td><\/tr><\/tbody><\/table><\/div><p class=\"exh-p\"><b>Join Kind<\/b> drop-down options: Left Outer, Right Outer, Full Outer, Inner, Left Anti, Right Anti.<\/p><\/div>"}, {"n": 10, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant named Tenant1 that contains a lakehouse named Lakehouse1. You need to add data to Lakehouse1 from a CSV file in an Azure Storage account outside of Fabric. The solution must minimize development effort. What should you use to add the data?<\/p>", "options": [{"letter": "A", "text": "a Dataflow Gen2"}, {"letter": "B", "text": "a shortcut"}, {"letter": "C", "text": "a copy job"}, {"letter": "D", "text": "a pipeline"}], "key": ["B"], "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>Requirement Tenant: Fabric tenant Tenant1 Data target: Lakehouse1 data store: CSV file in an Azure Storage account (outside of Fabric) Requirement: Minimize development effort Step 1: Understand options A). Dataflow Gen2 Used for ETL (transformations, cleansing, ingestion). More effort because you need to build Power Query transformations. Not minimal effort for simply exposing a file. B). Shortcut Fabric supports creating shortcuts to external data sources (OneLake, ADLS Gen2, Azure Blob, Dataverse, etc.). Shortcut directly exposes external files/tables inside the lakehouse without copying or moving data. This is the lowest-effort solution to access external CSV. C). Copy job Pipelines have a copy activity to physically copy data into Fabric. Requires setup and execution. More development effort than a shortcut. D). Pipeline Used for orchestrating complex ETL workflows. Overhead for this scenario. Step 2: Correct Answer Since the goal is simply to access a CSV in external storage with minimal development effort, the right solution is: B). a shortcut<\/p>", "answer_area": null, "exh": ""}, {"n": 11, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a workspace named Workspace1. Workspace1 contains a single semantic model that has two Microsoft Power BI reports. You have a Microsoft 365 subscription that contains a data loss prevention (DLP) policy named DLP1. You need to apply DLP1 to the items in Workspace1. What should you do?<\/p>", "options": [{"letter": "A", "text": "Apply a master data endorsement to the semantic model."}, {"letter": "B", "text": "Apply a certified endorsement to the semantic model."}, {"letter": "C", "text": "Create a workspace identity."}, {"letter": "D", "text": "Apply sensitivity labels to the semantic model and reports."}], "key": ["D"], "key_source": "answer", "key_note": null, "statement_answers": null, "explanation_html": "<p>Step 1: Understand the scenario Workspace1 contains a semantic model and two Power BI reports. A Microsoft 365 Data Loss Prevention (DLP) policy (DLP1) already exists. Requirement: Apply DLP1 to the workspace items. In Microsoft Fabric and Power BI, DLP policies are enforced through Microsoft Purview Information Protection (MIP) sensitivity labels. Step 2: Evaluate each option A). Apply a master data endorsement to the semantic model. Endorsements (promoted, certified) help users find and trust datasets but do not enforce DLP policies. Not correct. B). Apply a certified endorsement to the semantic model. Certification improves discoverability and trust, but again, it does not trigger DLP policy enforcement. Not correct. C). Create a workspace identity. Workspace identity (service principal) is used for connecting to external resources with managed identity. It does not relate to DLP policy application. Not correct. D). Apply sensitivity labels to the semantic model and reports. Sensitivity labels (from Microsoft Purview) integrate with Microsoft 365 DLP policies. When sensitivity labels are applied to Power BI datasets, reports, dashboards, and workspaces, DLP1 can enforce protections such as preventing sharing or exporting sensitive data. This is the correct answer. Step 3: Correct Action To apply DLP1 to Workspace1 items, you must: Configure sensitivity labels in Microsoft Purview. Apply those sensitivity labels to the semantic model and reports inside Workspace1. The existing DLP1 policy will then govern data handling for those items.<\/p>", "answer_area": null, "exh": ""}, {"n": 12, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You are creating a report and a semantic model in Microsoft Power BI Desktop. The Value measure has the expression shown in the following exhibit.<\/p><p>Use the drop-down menus to select the answer choice that completes each statement based on the information presented in the graphic. NOTE: Each correct selection is worth one point.<\/p>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>A dynamic format string lets the Value measure change its display format depending on the selected metric. The measure returns either a percentage or a whole number, so the format string must cover both: percentages or whole numbers.<\/p>", "answer_area": {"kind": "dropdowns", "code": "A [dropdown 1] was added to the Value measure.\n\nThe Value measure can return values formatted as [dropdown 2].", "controls": [{"id": "d1", "options": ["dynamic format string", "calculation group", "data category", "synonym"], "correct": "dynamic format string"}, {"id": "d2", "options": ["percentages only", "percentages or decimals", "whole numbers only", "percentages or whole numbers"], "correct": "percentages or whole numbers"}]}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Power BI Desktop: Value measure<\/div><ul class=\"exh-ul\"><li><b>Measure name:<\/b> Value · <b>Home table:<\/b> Fact · <b>Format:<\/b> Dynamic · <b>Data category:<\/b> Uncategorized<\/li><li><b>Format expression:<\/b><\/li><\/ul><pre class=\"exh-pre\"><code>SWITCH(SELECTEDVALUE(Metric[Metric]),&quot;# of Customers&quot;, &quot;#&quot;,\n       &quot;Gross Margin %&quot;,&quot;0.00%&quot;,\n       &quot;#,###&quot;)<\/code><\/pre><p class=\"exh-p\"><b>Report page<\/b> “Top 5 Products – # of Customers”: a metric slicer with the options # of Customers (selected), Gross Margin, Gross Margin %, Total COGS and Total Revenue; a table of customers per top-5 product (Primus 32, MI-72 17, one unnamed product 16, Gladius 14, Sova 10, total 85); plus charts of customers over time, by industry and by state.<\/p><\/div>"}, {"n": 13, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a semantic model named model1. The two largest columns in model1 are shown in the following table.<\/p><p>You need to optimize model 1. The solution must meet the following requirements: * Reduce the model size. * Increase refresh performance when using Import mode. * Ensure that the datetime value for each sales transaction is available in the model. What should you do on each column? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>TransactionKey has a cardinality of 2,500,350,000 and takes 160 GB; it is a key that is not needed for analysis, so it should be removed. SaleDateTime has a cardinality of 6,850,273 and takes 120 GB; splitting it into separate date and time columns lowers the cardinality of each resulting column.<\/p>", "answer_area": {"kind": "dropdowns", "controls": [{"id": "d1", "label": "TransactionKey:", "options": ["Remove the column.", "Change the data type of the column.", "Remove duplicates", "Split the column.", "Truncate the data."], "correct": "Remove the column."}, {"id": "d2", "label": "SaleDateTime:", "options": ["Remove the column.", "Change the data type of the column.", "Remove duplicates", "Split the column.", "Truncate the data."], "correct": "Split the column."}]}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Two largest columns in model1<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Name<\/th><th>Cardinality<\/th><th>Compressed size<\/th><th>Description<\/th><\/tr><\/thead><tbody><tr><td>TransactionKey<\/td><td>2,500,350,000<\/td><td>160 GB<\/td><td>Contains an incrementing surrogate key for a fact table named SalesTransaction<\/td><\/tr><tr><td>SaleDateTime<\/td><td>6,850,273<\/td><td>120 GB<\/td><td>Contains the datetime (to the nearest second) of when a sale occurred<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 14, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a workspace named Workspace1. You plan to deploy a semantic model named Model1 by using the XMLA endpoint. You need to optimize the deployment of Model1. The solution must minimize how long it takes to deploy Model1. What should you do in Workspace1?<\/p>", "options": [{"letter": "A", "text": "Select Small semantic model storage format."}, {"letter": "B", "text": "Select Users can edit data models in the Power BI service."}, {"letter": "C", "text": "Set Enable Cache for Shortcuts to On."}, {"letter": "D", "text": "Select Large semantic model storage format."}], "key": ["A"], "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>When using XMLA endpoint for deployment or processing, the semantic model storage format impacts deployment times. Small storage format allows faster metadata operations and shorter deployment times. Large semantic model storage format is only needed for extremely large models ( &gt; 10 GB dataset limit), and it increases deployment overhead. The other options (B: service editing, C: cache for shortcuts) are unrelated to XMLA endpoint deployment performance. Reference: Power BI semantic model storage format<\/p>", "answer_area": null, "exh": ""}, {"n": 15, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric warehouse named Warehouse1 that contains a table named TaxiTrips. TaxiTrips contains the following columns. You need to create a query that shows the top three taxi companies based on the total miles traveled. How should you complete the T-SQL statement? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p class=\"key-note\">Note: the open-dropdown images show the third option as \"ORDER BY tripDistance\", but the final marked answer shows \"ORDER BY sum(tripDistance)\". Only \"ORDER BY sum(tripDistance)\" sorts by the total distance, so the third option is shown here as \"ORDER BY sum(tripDistance)\".<\/p><p>TOP(3) limits the result to three rows. GROUP BY company aggregates the trips per taxi company, and ORDER BY sum(tripDistance) DESC ranks the companies by total distance so the top three are returned.<\/p>", "answer_area": {"kind": "dropdowns", "code": "SELECT [dropdown 1]\n    company AS TaxiCompany,\n    sum(passengerCount) AS TotalPassengers,\n    sum(tripDistance) TotalDistance\nFROM [Warehouse1].[dbo].[TaxiTrips]\n[dropdown 2]\n[dropdown 3] DESC;", "controls": [{"id": "d1", "options": ["FETCH NEXT 3 ROWS ONLY", "Limit (3)", "Top(3)"], "correct": "Top(3)"}, {"id": "d2", "options": ["GROUP BY company", "GROUP BY TaxiCompany", "ORDER BY tripDistance"], "correct": "GROUP BY company"}, {"id": "d3", "options": ["GROUP BY company", "GROUP BY sum(tripDistance)", "ORDER BY sum(tripDistance)"], "correct": "ORDER BY sum(tripDistance)"}]}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): TaxiTrips columns<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Name<\/th><th>Data type<\/th><th>Description<\/th><\/tr><\/thead><tbody><tr><td>Company<\/td><td>Varchar(100)<\/td><td>Name of each taxi company<\/td><\/tr><tr><td>passengerCount<\/td><td>Integer<\/td><td>Number of passengers per trip<\/td><\/tr><tr><td>tripDistance<\/td><td>Decimal(10,4)<\/td><td>Distance traveled in miles during a trip<\/td><\/tr><tr><td>pickupDate<\/td><td>Datetime2<\/td><td>Date and time a passenger was picked up<\/td><\/tr><tr><td>FareAmount<\/td><td>Decimal(10,4)<\/td><td>Cost of each trip<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 16, "kind": "dragdrop", "kind_label": "Drag & drop", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a Microsoft Power BI report named Report 1. Report1 is slow to render. You suspect that an inefficient DAX query is being executed. You need to identify the slowest DAX query, and then review how long the query spends in the formula engine as compared to the storage engine. Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.<\/p>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>First capture a recording in Performance analyzer, then look at the Server Timings tab to see the storage engine queries. Enable Query Timings and Server Timings and run the query, view the Query Timings tab, and sort the Duration (ms) column in descending order so the slowest DAX query is at the top.<\/p>", "answer_area": {"kind": "dragdrop", "values": ["View the Server Timings tab.", "From Performance analyzer, capture a recording.", "Enable Query Timings and Server Timings. Run the query.", "View the Query Timings tab.", "Sort the Duration (ms) column in descending order by DAX query time.", "Copy the first query to DAX Studio."], "controls": [{"id": "t1", "label": "Step 1", "correct": "From Performance analyzer, capture a recording."}, {"id": "t2", "label": "Step 2", "correct": "View the Server Timings tab."}, {"id": "t3", "label": "Step 3", "correct": "Enable Query Timings and Server Timings. Run the query."}, {"id": "t4", "label": "Step 4", "correct": "View the Query Timings tab."}, {"id": "t5", "label": "Step 5", "correct": "Sort the Duration (ms) column in descending order by DAX query time."}]}, "exh": ""}, {"n": 17, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a query in Power Query Editor that contains two columns named Order_Date and Shipping_Date. You need to create a column that will calculate the number of days between Order_Date and Shipping_Date for each row. Which Power Query function should you use?<\/p>", "options": [{"letter": "A", "text": "Duration.From"}, {"letter": "B", "text": "Date.AddDays"}, {"letter": "C", "text": "Duration.Days"}, {"letter": "D", "text": "DateTime.LocalNow"}], "key": ["C"], "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>Requirement We have two columns in Power Query Editor: Order_Date Shipping_Date We need to calculate the number of days between the two dates. Step 1: How date differences work in Power Query (M language) Subtracting two date or datetime values in Power Query returns a duration value. Example: [Shipping_Date] - [Order_Date] This produces a duration such as 3.00:00:00 (3 days). Step 2: Converting duration into days To get the number of days as an integer, we use Duration.Days(). Example: Duration.Days([Shipping_Date] - [Order_Date]) This returns 3 if the shipping date is 3 days after the order date. Step 3: Evaluate other options A). Duration.From # Converts a value to a duration type but does not extract the number of days. B). Date.AddDays # Adds days to a given date, not used for calculating the difference. C). Duration.Days # Correct, extracts total days from a duration. D). DateTime.LocalNow # Returns the current system datetime, unrelated to this requirement.<\/p>", "answer_area": null, "exh": ""}, {"n": 18, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You are designing a Fabric semantic model named Model1 for a financial analytics workspace. Model1 includes a DAX measure named Measure1 that returns total sales. You have a table named Currency that contains a column named Format. The Format column defines currency formatting strings for each record as follows: $8,880.00, €8,880.00, or similar. You have a report that uses the Currency column to identify which symbol and format string to display. In the report Measure1 must appear with two decimal places and the appropriate currency symbol based on the selected value in the Currency column. You create the following DAX formula. FORMAT = SELECTEDVALUE( ’ Currency ’ [Format]) You need to ensure that Measure1 appears correctly in visuals. The solution must minimize logic duplication. What should you do?<\/p>", "options": [{"letter": "A", "text": "Copy the DAX expression from the Format column and profile the expression into the format string expression of Measure."}, {"letter": "B", "text": "For Model1, set the data category of Measure to Country/Region."}, {"letter": "C", "text": "For Model1, set the format type of Measure1 to Currency."}, {"letter": "D", "text": "Create a dynamic format string for Measure1 that references the FORMAT measure."}], "key": ["D"], "key_source": "answer", "key_note": null, "statement_answers": null, "explanation_html": "<p>Measure1 must show two decimal places with the currency symbol of the selected Currency row. A dynamic format string on Measure1 that references the FORMAT measure applies the selected format string without duplicating the logic. A static Currency format cannot change by selection, and the data category does not control the format.<\/p>", "answer_area": null, "exh": ""}, {"n": 19, "kind": "multi", "kind_label": "Multi-select", "case": null, "case_ref": null, "stem_html": "<p>You have a Microsoft Fabric tenant that contains a dataflow. You are exploring a new semantic model. From Power Query, you need to view column information as shown in the following exhibit.<\/p><p>Which three Data view options should you select? Each correct answer presents part of the solution. NOTE: Each correct answer is worth one point.<\/p>", "options": [{"letter": "A", "text": "Enable column profile"}, {"letter": "B", "text": "Show column quality details"}, {"letter": "C", "text": "Show column profile in details pane"}, {"letter": "D", "text": "Enable details pane"}, {"letter": "E", "text": "Show column value distribution"}], "key": ["A", "C", "D"], "key_source": "derived", "key_note": "Note: the printed answer lists A, B, D. \"Show column quality details\" is not the option that displays the profile. The column profile is shown by enabling the column profile, showing it in the details pane, and enabling the details pane.", "statement_answers": null, "explanation_html": "<p>To view the column profile in Power Query you enable the column profile, show the column profile in the details pane, and enable the details pane. The exhibit shows the profile histograms that these three options produce.<\/p>", "answer_area": null, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Power Query column profile<\/div><p class=\"exh-p\">Each column also shows a value-distribution histogram and a quality bar (Valid / Error / Empty), as produced by the column-profile options.<\/p><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Column<\/th><th>Valid<\/th><th>Error<\/th><th>Empty<\/th><th>Distinct<\/th><th>Unique<\/th><\/tr><\/thead><tbody><tr><td>SalesOrderID<\/td><td>100%<\/td><td>0%<\/td><td>0%<\/td><td>32<\/td><td>4<\/td><\/tr><tr><td>OrderDate<\/td><td>100%<\/td><td>0%<\/td><td>0%<\/td><td>19<\/td><td>2<\/td><\/tr><tr><td>CustomerID<\/td><td>100%<\/td><td>0%<\/td><td>0%<\/td><td>32<\/td><td>4<\/td><\/tr><tr><td>LineItem<\/td><td>100%<\/td><td>0%<\/td><td>0%<\/td><td>50<\/td><td>(cut off)<\/td><\/tr><tr><td>ProductID<\/td><td>100%<\/td><td>0%<\/td><td>0%<\/td><td>142<\/td><td>(cut off)<\/td><\/tr><tr><td>OrderQty<\/td><td>100%<\/td><td>0%<\/td><td>0%<\/td><td>19<\/td><td>2<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 20, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric workspace named Workspace1 and a user named User1. You need to ensure that User1 can perform the following tasks in Workspace1: * Create dashboards. * Publish semantic models. * Create and publish reports. The solution must follow the principle of least privilege. Which workspace role should you assign to User1?<\/p>", "options": [{"letter": "A", "text": "Member"}, {"letter": "B", "text": "Admin"}, {"letter": "C", "text": "Viewer"}, {"letter": "D", "text": "Contributor"}], "key": ["D"], "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>Creating dashboards, publishing semantic models, and creating and publishing reports all require the Contributor role. Viewer cannot create or publish, and Member and Admin grant more than the least privilege requires.<\/p>", "answer_area": null, "exh": ""}, {"n": 21, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric workspace named Workspace1 and an Azure SQL database. You plan to create a dataflow that will read data from the database, and then transform the data by performing an inner join. You need to ignore spaces in the values when performing the inner join The solution must minimize development effort. What should you do?<\/p>", "options": [{"letter": "A", "text": "Append the queries by using fuzzy matching."}, {"letter": "B", "text": "Merge the queries by using fuzzy matching."}, {"letter": "C", "text": "Append the queries by using a lookup table."}, {"letter": "D", "text": "Merge the queries by using a lookup table."}], "key": ["B"], "key_source": "answer", "key_note": null, "statement_answers": null, "explanation_html": "<p>You need to perform an inner join and ignore spaces in the values. In Power Query, to handle joins where values may contain spaces or minor mismatches, you use fuzzy matching in the Merge Queries operation. Append queries combines rows, not columns, so it does not apply here. Lookup table is not required since the transformation can be handled natively in Power Query with fuzzy matching. Correct solution: Merge the queries by using fuzzy matching. Reference: Fuzzy merge in Power Query<\/p>", "answer_area": null, "exh": ""}, {"n": 22, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric warehouse that contains a table named SalesOrderDetail. SalesOrderDetail contains three columns named OrderQty, ProductID and SalesOrderID. SalesOrderDetail contains one row per combination of SalesOrderID and ProductID. You need to calculate the proportion of the total quantity of each sales order represented by each product within the sales order. Which T-SQL statement should you run?<\/p>", "options": [{"letter": "A", "text": "SELECT SalesOrderID, ProductID, OrderQty, CAST(1. * OrderQty / SUM(OrderQty) OVER(ORDER BY ProductID) * 100 AS DECIMAL(5,2)) AS PercentbyProductID FROM Sales.SalesOrderDetail;"}, {"letter": "B", "text": "SELECT SalesOrderID, ProductID, OrderQty, CAST(1. * OrderQty / SUM(OrderQty) OVER(PARTITION BY ProductID) * 100 AS DECIMAL(5,2)) AS PercentbyProductID FROM Sales.SalesOrderDetail;"}, {"letter": "C", "text": "SELECT SalesOrderID, ProductID, OrderQty, CAST(1. * OrderQty / SUM(OrderQty) OVER(PARTITION BY SalesOrderID) * 100 AS DECIMAL(5,2)) AS PercentbyProductID FROM Sales.SalesOrderDetail;"}, {"letter": "D", "text": "SELECT SalesOrderID, ProductID, OrderQty, CAST(1. * OrderQty / SUM(OrderQty) OVER(ORDER BY SalesOrderID) * 100 AS DECIMAL(5,2)) AS PercentbyProductID FROM Sales.SalesOrderDetail;"}], "key": ["C"], "key_source": "answer", "key_note": null, "statement_answers": null, "explanation_html": "<p>We need to calculate the proportion of the total quantity of each sales order represented by each product within the sales order. Step 1: Analyze the requirement Table: SalesOrderDetail Columns: OrderQty, ProductID, SalesOrderID Each row = one product in a sales order. Requirement: For each SalesOrderID, calculate what percentage each product contributes to the total order quantity. This means we must: Calculate the total order quantity per SalesOrderID. Divide each product’s OrderQty by that total. Express it as a percentage. Step 2: Evaluate the options A). Uses OVER(ORDER BY ProductID) Wrong: ORDER BY does not segment data, it only defines sequence. We need grouping by sales order. B). Uses OVER(PARTITION BY ProductID) Wrong: This would calculate percentages per product across all sales orders, not per sales order. C). Uses OVER(PARTITION BY SalesOrderID) Correct: This computes the total OrderQty per SalesOrderID and divides each product’s quantity by that total. Exactly what the requirement asks. D). Uses OVER(ORDER BY SalesOrderID) Wrong: Again, ORDER BY just sequences rows, does not group them. Step 3: Correct Query SELECT SalesOrderID, ProductID, OrderQty, CAST(1. * OrderQty / SUM(OrderQty) OVER(PARTITION BY SalesOrderID) * 100 AS DECIMAL(5,2)) AS PercentByProductID FROM Sales.SalesOrderDetail; Why Option C is Correct PARTITION BY SalesOrderID ensures the denominator is the total quantity for the current order. This produces the correct percentage breakdown of each product inside its sales order.<\/p>", "answer_area": null, "exh": ""}, {"n": 23, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that con
