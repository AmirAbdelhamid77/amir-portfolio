olumn that multiplies Quantity and Price<\/td><\/tr><tr><td>TotalQuantity<\/td><td>Integer<\/td><td>Measure<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 33, "kind": "multi", "kind_label": "Multi-select", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a semantic model. You need to prevent report creators from populating visuals by using implicit measures. What are two tools that you can use to achieve the goal? Each correct answer presents a complete solution. NOTE: Each correct answer is worth one point.<\/p>", "options": [{"letter": "A", "text": "Microsoft Power BI Desktop"}, {"letter": "B", "text": "Tabular Editor"}, {"letter": "C", "text": "Microsoft SQL Server Management Studio (SSMS)"}, {"letter": "D", "text": "DAX Studio"}], "key": ["A", "B"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>A. Microsoft Power BI Desktop: Power BI Desktop allows you to control and manage how measures are used within your reports. By carefully defining and using explicit measures within your data model, you can ensure that report creators use only these predefined measures instead of creating implicit measures automatically.<\/p>\n<p>B. Tabular Editor: Tabular Editor is a powerful tool for managing and editing Power BI and Analysis Services tabular models. It allows you to enforce best practices, such as disabling implicit measures, by modifying the model&#x27;s properties and ensuring that only explicit measures are available for use in reports.<\/p>", "exh": ""}, {"n": 34, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains two lakehouses. You are building a dataflow that will combine data from the lakehouses. The applied steps from one of the queries in the dataflow is shown in the following exhibit.<\/p>\n<p>Use the drop-down menus to select the answer choice that completes each statement based on the information presented in the graphic. NOTE: Each correct selection is worth one point.<\/p>\n<p>Query settings — Name: Customers1, Entity type: Custom. Applied steps: Source, Navigation 1, Capitalized each word, Appended query, Changed column type, Added custom, Filtered rows.<\/p>\n<p>Answer Area<\/p>\n<ul><li>[Answer choice] of the transformation steps in the query will fold. — All / None / Some<\/li><li>The Added custom step will be performed in [answer choice]. — each lakehouse&#x27;s query engine / the Microsoft Power Query engine / the source lakehouse query engine<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>1.Some of the transformation steps in the query will fold.&quot;<\/p>\n<p>Query folding refers to the ability of Power Query to push transformations back to the data source rather than processing them in Power Query itself.<\/p>\n<p>The answer &quot;Some&quot;.<\/p>\n<p>Some transformations are foldable (executed at the source).<\/p>\n<p>Some transformations are not foldable and will be executed locally in Power Query.<\/p>\n<p>This is common because basic transformations (filtering, joins, aggregations, etc.) often fold, but more complex operations (custom columns, advanced functions, etc.) may not.<\/p>\n<p>2. The Added custom step will be performed in the Microsoft Power Query engine.<\/p>\n<p>When a transformation cannot be folded, it is processed in the Power Query engine instead of being pushed to the source.<\/p>\n<p>Since the question mentions an added custom step, it likely includes:<\/p>\n<p>Custom calculations<\/p>\n<p>Complex transformations (like M code or certain joins)<\/p>\n<p>Operations that cannot be executed at the data source<\/p>\n<p>Such transformations are executed locally within Power Query rather than at the source (lakehouse query engine).<\/p>", "answer_area": {"kind": "dropdowns", "controls": [{"id": "d1", "before": "", "after": " of the transformation steps in the query will fold.", "options": ["All", "None", "Some"], "correct": "Some"}, {"id": "d2", "before": "The Added custom step will be performed in ", "after": ".", "options": ["each lakehouse's query engine", "the Microsoft Power Query engine", "the source lakehouse query engine"], "correct": "the Microsoft Power Query engine"}]}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Power Query “Query settings” pane<\/div><ul class=\"exh-ul\"><li><b>Name:<\/b> Customers1 &nbsp;·&nbsp; <b>Entity type:<\/b> Custom<\/li><li><b>Applied steps<\/b> (in order): Source → Navigation 1 → Capitalized each word → Appended query → Changed column type → Added custom → <b>Filtered rows<\/b> (selected step)<\/li><li>Right-click menu on “Filtered rows”: Edit settings · Rename · Delete · Delete until end · Insert step after · Move before · Move after (greyed out) · Extract previous… · View data source query (greyed out) · View query plan (greyed out) · Properties<\/li><\/ul><\/div>"}, {"n": 35, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a lakehouse named Lakehouse’. Lakehouse1 contains a table named Tablet. You are creating a new data pipeline. You plan to copy external data to Table’. The schema of the external data changes regularly. You need the copy operation to meet the following requirements: Replace Table1 with the schema of the external data. Replace all the data in Table1 with the rows in the external data. You add a Copy data activity to the pipeline. What should you do for the Copy data activity?<\/p>", "options": [{"letter": "A", "text": "From the Source tab, add additional columns."}, {"letter": "B", "text": "From the Destination tab, set Table action to Overwrite."}, {"letter": "C", "text": "From the Settings tab, select Enable staging."}, {"letter": "D", "text": "From the Source tab, select Enable partition discovery."}, {"letter": "E", "text": "From the Source tab, select Recursively."}], "key": ["B"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>B. From the Destination tab, set Table action to Overwrite.<\/p>\n<p>You need the copy operation to:<\/p>\n<p>Replace Table1 with the schema of the external data<\/p>\n<p>Replace all data in Table1 with the external data<\/p>\n<p>The best way to achieve this is by setting Table action to &quot;Overwrite&quot; in the Destination tab of the Copy Data activity.<\/p>\n<p>&quot;Overwrite&quot; ensures that the table is completely replaced, including the schema and data, which meets both requirements.<\/p>\n<p>This means that every time the pipeline runs, Table1 will have the latest schema and data from the external source.<\/p>", "exh": ""}, {"n": 36, "kind": "multi", "kind_label": "Multi-select", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a lakehouse. You plan to query sales data files by using the SQL endpoint. The files will be in an Amazon Simple Storage Service (Amazon S3) storage bucket. You need to recommend which file format to use and where to create a shortcut. Which two actions should you include in the recommendation? Each correct answer presents part of the solution. NOTE: Each correct answer is worth one point.<\/p>", "options": [{"letter": "A", "text": "Create a shortcut in the Files section."}, {"letter": "B", "text": "Use the Parquet format"}, {"letter": "C", "text": "Use the CSV format."}, {"letter": "D", "text": "Create a shortcut in the Tables section."}, {"letter": "E", "text": "Use the delta format."}], "key": ["D", "E"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>D. Create Shortcut in Tables Section.<\/p>\n<p>The SQL endpoint:<\/p>\n<p>Can only query objects inside the Tables area of a lakehouse<\/p>\n<p>Cannot directly query items in the Files section<\/p>\n<p>Therefore:<\/p>\n<p>The S3 shortcut must point to Delta files<\/p>\n<p>The shortcut must be created under Tables<\/p>\n<p>This registers the data as a table accessible via SQL.<\/p>\n<p>E.Delta Format .<\/p>\n<p>The SQL endpoint in Fabric only supports querying tables, not raw files.<\/p>\n<p>Delta format:<\/p>\n<p>Is the native table format in Fabric<\/p>\n<p>Is fully supported by the SQL endpoint<\/p>\n<p>Supports ACID transactions<\/p>\n<p>Supports schema enforcement<\/p>\n<p>Enables better performance.<\/p>", "exh": ""}, {"n": 37, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a lakehouse named Lakehouse1. Lakehouse1 contains a subfolder named Subfolder1 that contains CSV files. You need to convert the CSV files into the delta format that has V-Order optimization enabled. What should you do from Lakehouse explorer?<\/p>", "options": [{"letter": "A", "text": "Use the Load to Tables feature."}, {"letter": "B", "text": "Create a new shortcut in the Files section."}, {"letter": "C", "text": "Create a new shortcut in the Tables section."}, {"letter": "D", "text": "Use the Optimize feature."}], "key": ["A"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>A. Use the &quot;Load to Tables&quot; feature.<\/p>\n<p>To convert CSV files into Delta format with V-Order optimization, you need to load the files into tables in the Lakehouse.<\/p>\n<p>&quot;Load to Tables&quot; is a feature in Microsoft Fabric&#x27;s Lakehouse Explorer that allows you to convert files (such as CSV) into managed Delta tables.<\/p>\n<p>During this process, the data is converted into the Delta format, which supports V-Order optimization for better performance.<\/p>\n<p>V-Order is an advanced columnar storage format that enhances query performance and compression for Delta tables.<\/p>", "exh": ""}, {"n": 38, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a lakehouse named Lakehouse1. Lakehouse1 contains an unpartitioned table named Table1. You plan to copy data to Table1 and partition the table based on a date column in the source data. You create a Copy activity to copy the data to Table1. You need to specify the partition column in the Destination settings of the Copy activity. What should you do first?<\/p>", "options": [{"letter": "A", "text": "From the Destination tab, set Mode to Append."}, {"letter": "B", "text": "From the Destination tab, select the partition column."}, {"letter": "C", "text": "From the Source tab, select Enable partition discovery."}, {"letter": "D", "text": "From the Destination tabs, set Mode to Overwrite."}], "key": ["D"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>D. From the Destination tabs, set Mode to Overwrite.<\/p>\n<p>Expand Advanced, in Table action, select Overwrite, and then select Enable partition, under Partition columns, select Add column, and choose the column you want to use as the partition column. You can choose to use a single column or multiple columns as the partition column.<\/p>", "exh": ""}, {"n": 39, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a warehouse named Warehouse1. Warehouse1 contains a fact table named FactSales that has one billion rows. You run the following T-SQL statement. CREATE TABLE test.FactSales AS CLONE OF Dbo.FactSales; For each of the following statements, select Yes if the statement is true. Otherwise, select No. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p>\n<ul><li>A replica of dbo.Sales is created in the test schema by copying the metadata only. — Yes / No<\/li><li>Additional schema changes to dbo.FactSales will also apply to test.FactSales. — Yes / No<\/li><li>Additional schema changes to dbo.FactSales will also apply to test.FactSales. — Yes / No<\/li><\/ul>\n<p>(The third row is repeated verbatim; it is preserved as printed.)<\/p>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>1. Yes<\/p>\n<p>A replica of dbo.Sales is created in the test schema by copying the metadata only.<\/p>\n<p>If metadata-only copying is used, it means the structure (schema) is copied but not the data.<\/p>\n<p>This is possible with views, synonyms, or schema-only copies (e.g., CREATE TABLE ... AS NO DATA). If the intent is to create an empty table with the same structure, this would be true.<\/p>\n<p>2.No<\/p>\n<p>Additional schema changes to dbo.FactSales will also apply to test.FactSales.<\/p>\n<p>If test.FactSales was independently created (i.e., copied separately from dbo.FactSales), then any schema changes to dbo.FactSales will NOT automatically reflect in test.FactSales.<\/p>\n<p>Schema changes would only propagate if test.FactSales was a synonym, view, or linked table.<\/p>\n<p>Since it&#x27;s likely an independent table, changes to dbo.FactSales do not apply automatically.<\/p>\n<p>3.No<\/p>\n<p>Additional schema changes to dbo.FactSales will also apply to test.FactSales.<\/p>\n<p>This statement is identical to statement 2, so the answer remains the same.<\/p>\n<p>Changes to dbo.FactSales do not automatically apply to test.FactSales unless explicitly linked (e.g., via a view or a synonym.<\/p>", "answer_area": {"kind": "statements", "controls": [{"id": "s1", "text": "A replica of dbo.Sales is created in the test schema by copying the metadata only.", "correct": "Yes"}, {"id": "s2", "text": "Additional schema changes to dbo.FactSales will also apply to test.FactSales.", "correct": "No"}, {"id": "s3", "text": "Additional schema changes to dbo.FactSales will also apply to test.FactSales.", "correct": "No"}]}, "exh": ""}, {"n": 40, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have source data in a folder on a local computer. You need to create a solution that will use Fabric to populate a data store. The solution must meet the following requirements: Support the use of dataflows to load and append data to the data store. Ensure that Delta tables are V-Order optimized and compacted automatically. Which type of data store should you use?<\/p>", "options": [{"letter": "A", "text": "a lakehouse"}, {"letter": "B", "text": "an Azure SQL database"}, {"letter": "C", "text": "a warehouse"}, {"letter": "D", "text": "a KQL database"}], "key": ["A"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>The Lakehouse and the Delta Lake table format are central to Microsoft Fabric, assuring that tables are optimized for analytics is a key requirement.<\/p>\n<p>To meet the requirements of supporting dataflows to load and append data to the data store while ensuring that Delta tables are V-Order optimized and compacted automatically, you should use a lakehouse in Fabric as your solution.<\/p>", "exh": ""}, {"n": 41, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a lakehouse. You are using a Fabric notebook to save a large DataFrame by using the following code. df.write.partitionBy(“year”, “month”, “day”).mode(“overwrite”).parquet(“Files/SalesOrder”) For each of the following statements, select Yes if the statement is true. Otherwise, select No. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p>\n<ul><li>The results will form a hierarchy of folders for each partition key. — Yes / No<\/li><li>The resulting file partitions can be read in parallel across multiple nodes. — Yes / No<\/li><li>The resulting file partitions will use file compression. — Yes / No<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>1. &quot;The results will form a hierarchy of folders for each partition key.&quot;<\/p>\n<p>Yes<\/p>\n<p>Partitioning creates a folder structure where each folder represents a partition key value.<\/p>\n<p>For example, in a data lake, partitioned data may be stored as:<\/p>\n<p>bash<\/p>\n<p>Copy<\/p>\n<p>Edit<\/p>\n<p>/sales/year=2023/month=01/<\/p>\n<p>/sales/year=2023/month=02/<\/p>\n<p>This improves query performance by allowing queries to skip unnecessary partitions.<\/p>\n<p>2. &quot;The resulting file partitions can be read in parallel across multiple nodes.&quot;<\/p>\n<p>Yes Partitioned files are designed for parallel processing.<\/p>\n<p>In distributed environments like Spark, Synapse, or Fabric Lakehouse, each partition can be processed independently across multiple compute nodes, improving performance.<\/p>\n<p>This is especially true for columnar formats like Parquet and Delta tables, which support distributed query execution.<\/p>\n<p>3.&quot;The resulting file partitions will use file compression.&quot;<\/p>\n<p>Yes<\/p>\n<p>File compression is commonly used in partitioned storage to reduce storage costs and improve read performance.<\/p>\n<p>Formats like Parquet, ORC, and Delta support built-in compression (e.g., Snappy, Gzip, or ZSTD).<\/p>\n<p>Compressed partitions reduce I/O costs and improve query performance, making them a best practice.<\/p>", "answer_area": {"kind": "statements", "controls": [{"id": "s1", "text": "The results will form a hierarchy of folders for each partition key.", "correct": "Yes"}, {"id": "s2", "text": "The resulting file partitions can be read in parallel across multiple nodes.", "correct": "Yes"}, {"id": "s3", "text": "The resulting file partitions will use file compression.", "correct": "Yes"}]}, "exh": ""}, {"n": 42, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric workspace named Workspace1 that contains a data flow named Dataflow1 contains a query that returns the data shown in the following exhibit.<\/p>\n<p>Power Query table with columns VendorID and date columns 2015-01-01 to 2015-01-08. Each date column: Valid 100%, Error 0%, Empty 0%, 2 distinct, 2 unique — except 2015-01-03: 1 distinct, 0 unique. First rows: VendorID 1 and 2. Query settings — Name: Generated-NYC-Taxi-Gre..., Applied steps: Source, Promoted headers, Changed column type.<\/p>\n<p>You need to transform the data columns into attribute-value pairs, where columns become rows. You select the VendorID column. Which transformation should you select from the context menu of the VendorID column?<\/p>", "options": [{"letter": "A", "text": "Group by"}, {"letter": "B", "text": "Unpivot columns"}, {"letter": "C", "text": "Unpivot other columns"}, {"letter": "D", "text": "Split column"}, {"letter": "E", "text": "Remove other columns"}], "key": ["C"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>C. Unpivot Other Columns. You need to transform data columns into attribute-value pairs, meaning that columns will be converted into rows. This is achieved using Unpivoting in Power Query.<\/p>\n<p>&quot;Unpivot Columns&quot; (Option B) → Converts selected columns into rows.<\/p>\n<p>&quot;Unpivot Other Columns&quot; (Option C) → Converts all columns except the selected column into rows.<\/p>\n<p>Since you are selecting the VendorID column and want to transform the other columns into attribute-value pairs, you should choose &quot;Unpivot Other Columns.&quot;<\/p>", "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Power Query (Generated-NYC-Taxi-Green…)<\/div><ul class=\"exh-ul\"><li><b>Formula bar:<\/b> <code>Table.TransformColumnTypes(#\"Promoted headers\", {{\"VendorID\", Int64.Type}, {\"2015-01-01\", Int64.Type}, {\"2015-01-02\", …<\/code><\/li><li><b>Applied steps:<\/b> Source → Promoted headers → Changed column type (selected)<\/li><li>Column profiling is based on the top 1,000 rows. Every column is 100% valid (0% error, 0% empty).<\/li><\/ul><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th><\/th><th>VendorID<\/th><th>2015-01-01<\/th><th>2015-01-02<\/th><th>2015-01-03<\/th><th>2015-01-04<\/th><th>2015-01-05<\/th><th>2015-01-06<\/th><th>2015-01-07<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>1<\/td><td>16<\/td><td>15<\/td><td>0<\/td><td>9<\/td><td>12<\/td><td>9<\/td><td>9<\/td><\/tr><tr><td>2<\/td><td>2<\/td><td>20<\/td><td>15<\/td><td>7<\/td><td>17<\/td><td>20<\/td><td>6<\/td><td>6<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 43, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a data pipeline. You need to ensure that the pipeline runs every four hours on Mondays and Fridays. To what should you set Repeat for the schedule?<\/p>", "options": [{"letter": "A", "text": "Daily"}, {"letter": "B", "text": "By the minute"}, {"letter": "C", "text": "Weekly"}, {"letter": "D", "text": "Hourly"}], "key": ["C"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>Answer C : Weekly.<\/p>\n<p>The only way to do this is to set the schedule to &#x27;&#x27;Weekly&#x27;&#x27;, set the days on Monday and Friday and add manually 6 Time of 4 hour intervals.<\/p>\n<p>You need the pipeline to run every four hours on Mondays and Fridays.<\/p>\n<p>Weekly scheduling allows you to specify particular days of the week (e.g., Monday and Friday).<\/p>\n<p>Within the weekly schedule, you can set the pipeline to repeat every 4 hours.<\/p>", "exh": ""}, {"n": 44, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a warehouse. Several times a day, the performance of all warehouse queries degrades. You suspect that Fabric is throttling the compute used by the warehouse. What should you use to identify whether throttling is occurring?<\/p>", "options": [{"letter": "A", "text": "the Capacity settings"}, {"letter": "B", "text": "the Monitoring hub"}, {"letter": "C", "text": "dynamic management views (DMVs)"}, {"letter": "D", "text": "the Microsoft Fabric Capacity Metrics app"}], "key": ["D"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>The Microsoft Capacity Metrics app, also known as the metrics app, serves as a monitoring tool within the Microsoft Power BI service. It offers functionalities to track and analyze the resource utilization.<\/p>", "exh": ""}, {"n": 45, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric workspace that uses the default Spark starter pool and runtime version 1.2. You plan to read a CSV file named Sales_raw.csv in a lakehouse, select columns, and save the data as a Delta table to the managed area of the lakehouse. Sales_raw.csv contains 12 columns. You have the following code.<\/p>\n<p>For each of the following statements, select Yes if the statement is true. Otherwise, select No. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p>\n<pre><code>from pyspark.sql.functions import year\n\n(spark\n .read\n .format(&quot;csv&quot;)\n .option(&quot;header&quot;, &#x27;true&#x27;)\n .load(&quot;Files/sales_raw.csv&quot;)\n .select(&#x27;SalesOrderNumber&#x27;, &#x27;OrderDate&#x27;, &#x27;CustomerName&#x27;, &#x27;UnitPrice&#x27;)\n .withColumn(&quot;Year&quot;, year(&quot;OrderDate&quot;))\n .write\n .partitionBy(&#x27;Year&#x27;)\n .saveAsTable(&quot;sales&quot;)\n)<\/code><\/pre>\n<ul><li>The Spark engine will read only the &#x27;SalesOrderNumber&#x27;, &#x27;OrderDate&#x27;, &#x27;CustomerName&#x27;, &#x27;UnitPrice&#x27; columns from Sales_raw.csv. — Yes / No<\/li><li>Removing the partition will reduce the execution time of the query. — Yes / No<\/li><li>Adding inferSchema= &#x27;true&#x27; to the options will increase the execution time of the query. — Yes / No<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>No: The Spark engine will initially read all columns from the CSV file because the .select() transformation is applied after the data has been read into memory. Therefore, all 12 columns from Sales_raw.csv are read before the selection of specific columns is applied.<\/p>\n<p>•No: Removing the partition might not necessarily reduce the execution time. While there might be some overhead in writing data to partitions, the overall impact on read performance, especially for large datasets, is usually beneficial. The query execution time for saving might be higher due to partitioning, but the read performance improvement usually outweighs this cost.<\/p>\n<p>•Yes: Adding inferSchema = &#x27;true&#x27; will increase the execution time of the query because Spark will need to read through the entire dataset to determine the data types of each column. This extra pass over the data adds to the initial read time.<\/p>", "answer_area": {"kind": "statements", "controls": [{"id": "s1", "text": "The Spark engine will read only the 'SalesOrderNumber', 'OrderDate', 'CustomerName', 'UnitPrice' columns from Sales_raw.csv.", "correct": "No"}, {"id": "s2", "text": "Removing the partition will reduce the execution time of the query.", "correct": "No"}, {"id": "s3", "text": "Adding inferSchema= 'true' to the options will increase the execution time of the query.", "correct": "Yes"}]}, "exh": ""}, {"n": 46, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a warehouse. A user discovers that a report that usually takes two minutes to render has been running for 45 minutes and has still not rendered. You need to identify what is preventing the report query from completing. Which dynamic management view (DMV) should you use?<\/p>", "options": [{"letter": "A", "text": "sys.dm_exec_requests"}, {"letter": "B", "text": "sys.dm_exec_sessions"}, {"letter": "C", "text": "sys.dm_exec_connections"}, {"letter": "D", "text": "sys.dm_pdw_exec_requests"}], "key": ["A"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>The sys.dm_exec_requests dynamic management view provides real-time information about all requests currently executing on the SQL Server. This view helps you understand the status of each request, including whether it is blocked, waiting, or running.<\/p>", "exh": ""}, {"n": 47, "kind": "dragdrop", "kind_label": "Drag & drop", "case": null, "case_ref": null, "stem_html": "<p>You are creating a data flow in Fabric to ingest data from an Azure SQL database by using a T-SQL statement. You need to ensure that any foldable Power Query transformation steps are processed by the Microsoft SQL Server engine. How should you complete the code? To answer, drag the appropriate values to the correct targets. Each value may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p>\n<p>Values: EnableFolding / NativeQuery / Optimize / Record / StopFolding / Table / Value<\/p>\n<pre><code>let\n    Source = Sql.Databases(\n        &quot;server.database.windows.net&quot;\n    ),\n    Database = Source{[Name = &quot;db&quot;]}[Data],\n    Query = [drop target 1].[drop target 2](\n        Database,\n        &quot; SELECT * FROM customer WHERE country IN (&#x27;USA&#x27;, &#x27;UK&#x27;)&quot;,\n        null,\n        [ [drop target 3] = true]\n    )\nin\n    Query<\/code><\/pre>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>Value.<\/p>\n<p>Value is the function used to store the result of the query.<\/p>\n<p>NativeQuery.<\/p>\n<p>NativeQuery allows executing a direct SQL query within Power Query M code. EnableFolding .<\/p>\n<p>This enables query folding, ensuring that transformations are executed in SQL Server rather than in Power Query.<\/p>", "answer_area": {"kind": "dragdrop", "values": ["EnableFolding", "NativeQuery", "Optimize", "Record", "StopFolding", "Table", "Value"], "code": "let\n    Source = Sql.Databases(\n        \"server.database.windows.net\"\n    ),\n    Database = Source{[Name = \"db\"]}[Data],\n    Query = [drop target 1].[drop target 2](\n        Database,\n        \" SELECT * FROM customer WHERE country IN ('USA', 'UK')\",\n        null,\n        [ [drop target 3] = true]\n    )\nin\n    Query", "controls": [{"id": "t1", "label": "Target 1", "correct": "Value"}, {"id": "t2", "label": "Target 2", "correct": "NativeQuery"}, {"id": "t3", "label": "Target 3", "correct": "EnableFolding"}]}, "exh": ""}, {"n": 48, "kind": "dragdrop", "kind_label": "Drag & drop", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a lakehouse named Lakehouse1. Readings from 100 IoT devices are appended to a Delta table in Lakehouse1. Each set of readings is approximately 25 KB. Approximately 10 GB of data is received daily. All the table and SparkSession settings are set to the default. You discover that queries are slow to execute. In addition, the lakehouse storage contains data and log files that are no longer used. You need to remove the files that are no longer used and combine small files into larger files with a target size of 1 GB per file. What should you do? To answer, drag the appropriate actions to the correct requirements. Each action may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p>\n<p>Actions: Set the autoCompact table setting. / Set the optimizeWrite table setting. / Run the VACUUM command on a schedule. / Set the autoCompact SparkSession setting. / Run the OPTIMIZE command on a schedule. / Set the parallelDelete SparkSession setting.<\/p>\n<ul><li>Remove the files: [drop target]<\/li><li>Combine the files: [drop target]<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>Remove the files that are no longer used:<\/p>\n<p>Run the VACUUM command on a schedule: The VACUUM command cleans up old files and log files that are no longer needed by the Delta table, helping to free up storage and potentially improve performance by reducing the number of files the query engine needs to consider.<\/p>\n<p>Combine small files into larger files:<\/p>\n<p>Run the OPTIMIZE command on a schedule: The OPTIMIZE command compacts small files into larger ones, improving read performance by reducing the overhead associated with opening many small files. This can be particularly useful when you have a large number of small files due to frequent appends of small data sets.<\/p>", "answer_area": {"kind": "dragdrop", "values": ["Set the autoCompact table setting.", "Set the optimizeWrite table setting.", "Run the VACUUM command on a schedule.", "Set the autoCompact SparkSession setting.", "Run the OPTIMIZE command on a schedule.", "Set the parallelDelete SparkSession setting."], "controls": [{"id": "t1", "label": "Remove the files:", "correct": "Run the VACUUM command on a schedule."}, {"id": "t2", "label": "Combine the files:", "correct": "Run the OPTIMIZE command on a schedule."}]}, "exh": ""}, {"n": 49, "kind": "multi", "kind_label": "Multi-select", "case": null, "case_ref": null, "stem_html": "<p>You need to create a data loading pattern for a Type 1 slowly changing dimension (SCD). Which two actions should you include in the process? Each correct answer presents part of the solution. NOTE: Each correct answer is worth one point.<\/p>", "options": [{"letter": "A", "text": "Update rows when the non-key attributes have changed."}, {"letter": "B", "text": "Insert new rows when the natural key exists in the dimension table, and the non-key attribute values have changed."}, {"letter": "C", "text": "Update the effective end date of rows when the non-key attribute values have changed."}, {"letter": "D", "text": "Insert new records when the natural key is a new value in the table."}], "key": ["A", "D"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>A. Update rows when the non-key attributes have changed: In a Type 1 SCD, when a change is detected in any of the non-key attributes of an existing row, the current row is updated with the new values. This type of SCD does not keep any historical data; it simply overwrites the old data with the new data.<\/p>\n<p>D. Insert new records when the natural key is a new value in the table: When a new record (with a new natural key) is encountered that does not already exist in the dimension table, it is inserted as a new row. This is necessary to ensure that all new entities are captured in the dimension.<\/p>", "exh": ""}, {"n": 50, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric workspace named Workspace1 and an Azure Data Lake Storage Gen2 account named storage1. Workspace1 contains a lakehouse named Lakehouse1. You need to create a shortcut to storage1 in Lakehouse1. Which connection and endpoint should you specify? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p>\n<ul><li>Connection: abfs / abfss / https<\/li><li>Endpoint: blob / dfs / file<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>1. Connection Type: https<\/p>\n<p>The selection of https means that the connection is being made using secure HTTPS endpoints rather than using Azure Blob File System (ABFS/ABFSS) protocols.<\/p>\n<p>https is commonly used for REST API-based access to Azure Storage.<\/p>\n<p>2. Endpoint Type: dfs<\/p>\n<p>The selection of dfs (Distributed File System) means that the connection is using Azure Data Lake Storage Gen2.<\/p>\n<p>dfs endpoints enable Hierarchical Namespace (HNS), which allows for file system-like directory structures and optimized big data analytics.<\/p>\n<p>This is required for Spark, Azure Synapse, Fabric, and Databricks.<\/p>", "answer_area": {"kind": "dropdowns", "controls": [{"id": "d1", "label": "Connection:", "options": ["abfs", "abfss", "https"], "correct": "https"}, {"id": "d2", "label": "Endpoint:", "options": ["blob", "dfs", "file"], "correct": "dfs"}]}, "exh": ""}, {"n": 51, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You are analyzing customer purchases in a Fabric notebook by using PySpark. You have the following DataFrames: transactions: Contains five columns named transaction_id, customer_id, product_id, amount, and date and has 10 million rows, with each row representing a transaction. customers: Contains customer details in 1,000 rows and three columns named customer_id, name, and country. You need to join the DataFrames on the customer_id column. The solution must minimize data shuffling. You write the following code. from pyspark.sql import functions as F results = Which code should you run to populate the results DataFrame?<\/p>", "options": [{"letter": "A", "text": "transactions.join(F.broadcast(customers), transactions.customer_id == customers.customer_id)"}, {"letter": "B", "text": "transactions.join(customers, transactions.customer_id == customers.customer_id).distinct()"}, {"letter": "C", "text": "transactions.join(customers, transactions.customer_id == customers.customer_id)"}, {"letter": "D", "text": "transactions.crossJoin(customers).where(transactions.customer_id == customers.customer_id)"}], "key": ["A"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>A. transactions.join(F.broadcast(customers), transactions.customer_id == customers.customer_id)Optimized method to perform a join between a very large table and a smaller one.<\/p>\n<p>In Apache Spark, broadcasting refers to an optimization technique for join operations. When you join two DataFrames or RDDs and one of them is significantly smaller than the other, Spark can &quot;broadcast&quot; the smaller table to all nodes in the cluster. This approach avoids the need for network shuffles for each row of the larger table, significantly reducing the execution time of the join operation.<\/p>", "exh": ""}, {"n": 52, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a Microsoft Power BI report and a semantic model that uses Direct Lake mode. From Power BI Desktop, you open Performance analyzer as shown in the following exhibit.<\/p>\n<p>Use the drop-down menus to select the answer choice that completes each statement based on the information presented in the graphic. NOTE: Each correct selection is worth one point.<\/p>\n<p>Performance analyzer — Durations (ms):<\/p>\n<ul><li>Card: 638 total — DAX query 431, Visual display 25, Other 181<\/li><li>Card (after a filter change): 46<\/li><li>Card: 9205 total — DAX query 9055, Direct query 8660, Visual display 24, Other 126<\/li><\/ul>\n<p>Fields pane shows &quot;Sum of col1&quot;. Drill through: Cross-report Off, Keep all filters On.<\/p>\n<p>Answer Area<\/p>\n<ul><li>The Direct Lake fallback behavior is set to [dropdown]. — Automatic / DirectLakeOnly / DirectQueryOnly<\/li><li>The query for the table visual is executed by using [dropdown]. — the composite model / Direct Lake / Direct Query<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>1. Direct Lake Fallback Behavior: Automatic.<\/p>\n<p>Direct Lake Mode enables real-time querying of Delta tables in a Fabric lakehouse without requiring data import or DirectQuery.<\/p>\n<p>When fallback behavior is set to Automatic, Power BI will automatically switch between Direct Lake Mode and DirectQuery when necessary (e.g., if a feature isn&#x27;t supported in Direct Lake).<\/p>\n<p>This provides the best balance between performance and flexibility.<\/p>\n<p>2.Query Execution: Direct Lake.<\/p>\n<p>Direct Lake Mode allows Power BI to load data directly from Delta tables in a Fabric lakehouse without preloading or sending queries to an external database.<\/p>\n<p>It provides better performance than DirectQuery by eliminating query overhead and improving response times.<\/p>", "answer_area": {"kind": "dropdowns", "controls": [{"id": "d1", "before": "The Direct Lake fallback behavior is set to ", "after": ".", "options": ["Automatic", "DirectLakeOnly", "DirectQueryOnly"], "correct": "Automatic"}, {"id": "d2", "before": "The query for the table visual is executed by using ", "after": ".", "options": ["the composite model", "Direct Lake", "Direct Query"], "correct": "Direct Lake"}]}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Performance analyzer (semantic model in Direct Lake mode)<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Name<\/th><th>Duration (ms)<\/th><\/tr><\/thead><tbody><tr><td>Recording started (5/15/2023 5:10:49 PM)<\/td><td>–<\/td><\/tr><tr><td>Refreshed visual<\/td><td>–<\/td><\/tr><tr><td><b>Card<\/b><\/td><td><b>638<\/b><\/td><\/tr><tr><td>&amp;nbsp;&amp;nbsp;DAX query<\/td><td>431<\/td><\/tr><tr><td>&amp;nbsp;&amp;nbsp;Visual display<\/td><td>25<\/td><\/tr><tr><td>&amp;nbsp;&amp;nbsp;Other<\/td><td>181<\/td><\/tr><tr><td>Changed a filter<\/td><td>–<\/td><\/tr><tr><td>Edited a visual<\/td><td>–<\/td><\/tr><tr><td>Card (collapsed)<\/td><td>46<\/td><\/tr><tr><td>Changed a filter<\/td><td>–<\/td><\/tr><tr><td><b>Card<\/b><\/td><td><b>9205<\/b><\/td><\/tr><tr><td>&amp;nbsp;&amp;nbsp;DAX query<\/td><td>9055<\/td><\/tr><tr><td>&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;Direct query<\/td><td>8660<\/td><\/tr><tr><td>&amp;nbsp;&amp;nbsp;Visual display<\/td><td>24<\/td><\/tr><tr><td>&amp;nbsp;&amp;nbsp;Other<\/td><td>126<\/td><\/tr><\/tbody><\/table><\/div><p class=\"exh-p\">Visualizations pane: Card visual · Field “Sum of col1” · Drill through: Cross-report Off, Keep all filters On.<\/p><\/div>"}, {"n": 53, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a lakehouse named Lakehouse1. Lakehouse1 contains a table named Nyctaxi_raw. Nyctaxi_row contains the following table:<\/p>\n<p>You create a Fabric notebook and attach it to Lakehouse1. You need to use PySpark code to transform the data. The solution must meet the following requirements: Add a column named pickupDate that will contain only the date portion of pickupDateTime. Filter the DataFrame to include only rows where fareAmount is a positive number that is less than 100. How should you complete the code? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>\n<p>Nyctaxi_raw table:<\/p>\n<p>| Name | Data type | |---|---| | pickupDateTime | Timestamp | | passengerCount | Integer | | fareAmount | Double | | paymentType | String | | tipAmount | Double |<\/p>\n<p>Answer Area<\/p>\n<pre><code>df = spark.read.format(&quot;delta&quot;).load(&quot;Tables/nyctaxi_raw&quot;)\n\ndf2 = [dropdown 1] (&quot;pickupDate&quot;, df[&#x27;tpepPickupDateTime&#x27;]\n    [dropdown 2] \\\n    [dropdown 3]<\/code><\/pre>\n<ul><li>Dropdown 1: df.columns / df.select / df.withColumn / df.withColumnsRenamed<\/li><li>Dropdown 2: .alias(&#x27;date&#x27;) / .cast(&#x27;date&#x27;) / .cast(&#x27;pickupDate&#x27;) / .getfield(&#x27;date&#x27;)<\/li><li>Dropdown 3: .filter(&quot;fareAmount &gt; 0 AND farAmount &lt; 100&quot;) / .filter(col(&quot;fareAmount&quot;).contains(&quot;1..100&quot;)) / .when(df.fareAmount &gt; 0 AND fareAmount &lt; 100) / .where(df.fareAmount.isin([1,100]))<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>1. df.withColumn.<\/p>\n<p>The withColumn function is used to add or replace a column in a DataFrame.<\/p>\n<p>It is appropriate here because we are creating a new column (pickupDate) based on an existing column (tpepPickupDateTime).<\/p>\n<p>Alternative options like df.select or df.withColumnsRenamed would not modify a column directly.<\/p>\n<p>2 .cast(&#x27;date&#x27;)<\/p>\n<p>The .cast(&#x27;date&#x27;) function is used to convert a column’s data type to date.<\/p>\n<p>Since tpepPickupDateTime is likely a timestamp, converting it to a date ensures it only contains the date portion.<\/p>\n<p>Other options like .alias(&#x27;date&#x27;) only rename the column without changing its type.<\/p>\n<p>3.filter(&quot;fareAmount &gt; 0 AND fareAmount &lt; 100&quot;)<\/p>\n<p>The .filter() function in PySpark is used to apply SQL-like filtering conditions to DataFrames.<\/p>\n<p>The selected condition ensures that only rows where fareAmount is greater than 0 and less than 100 are retained.<\/p>\n<p>Other options like .where(df.fareAmount.isin()) filter for specific values rather than a range.<\/p>", "answer_area": {"kind": "dropdowns", "code": "df = spark.read.format(\"delta\").load(\"Tables/nyctaxi_raw\")\n\ndf2 = [dropdown 1] (\"pickupDate\", df['tpepPickupDateTime']\n    [dropdown 2] \\\n    [dropdown 3]", "controls": [{"id": "d1", "options": ["df.columns", "df.select", "df.withColumn", "df.withColumnsRenamed"], "correct": "df.withColumn"}, {"id": "d2", "options": [".alias('date')", ".cast('date')", ".cast('pickupDate')", ".getfield('date')"], "correct": ".cast('date')"}, {"id": "d3", "options": [".filter(\"fareAmount > 0 AND farAmount < 100\")", ".filter(col(\"fareAmount\").contains(\"1..100\"))", ".when(df.fareAmount > 0 AND fareAmount < 100)", ".where(df.fareAmount.isin([1,100]))"], "correct": ".filter(\"fareAmount > 0 AND farAmount < 100\")"}]}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Table columns<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Name<\/th><th>Data type<\/th><\/tr><\/thead><tbody><tr><td>pickupDateTime<\/td><td>Timestamp<\/td><\/tr><tr><td>passengerCount<\/td><td>Integer<\/td><\/tr><tr><td>fareAmount<\/td><td>Double<\/td><\/tr><tr><td>paymentType<\/td><td>String<\/td><\/tr><tr><td>tipAmount<\/td><td>Double<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 54, "kind": "series", "kind_label": "Yes / No", "case": null, "case_ref": null, "stem_html": "<p>Note: This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution. After you answer a question in this section, you will NOT be able to return to it. As a result, these questions will not appear in the review screen. You have a Fabric tenant that contains a new semantic model in OneLake. You use a Fabric notebook to read the data into a Spark DataFrame. You need to evaluate the data to calculate the min, max, mean, and standard deviation values for all the string and numeric columns. Solution: You use the following PySpark expression: df.explain() Does this meet the goal?<\/p>", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "key": ["B"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>The df.explain() method in PySpark is used to print the logical and physical plans of a DataFrame, which helps in understanding how Spark plans to execute the query. It does not compute any statistical values like min, max, mean, or standard deviation.<\/p>\n<p>To achieve the goal, you should use: df.describe().show()<\/p>", "exh": ""}, {"n": 55, "kind": "series", "kind_label": "Yes / No", "case": null, "case_ref": null, "stem_html": "<p>Note: This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution. After you answer a question in this section, you will NOT be able to return to it. As a result, these questions will not appear in the review screen. You have a Fabric tenant that contains a new semantic model in OneLake. You use a Fabric notebook to read the data into a Spark DataFrame. You need to evaluate the data to calculate the min, max, mean, and standard deviation values for all the string and numeric columns. Solution: You use the following PySpark expression: df.show() Does this meet the goal?<\/p>", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "key": ["B"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>Correct methods: Use df.describe().show() for basic statistics and df.agg() with appropriate functions (min, max, mean, stddev) for detailed statistics.<\/p>\n<p>The correct syntax is df.describe().<\/p>", "exh": ""}, {"n": 56, "kind": "series", "kind_label": "Yes / No", "case": null, "case_ref": null, "stem_html": "<p>Note: This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution. After you answer a question in this section, you will NOT be able to return to it. As a result, these questions will not appear in the review screen. You have a Fabric tenant that contains a new semantic model in OneLake. You use a Fabric notebook to read the data into a Spark DataFrame. You need to evaluate the data to calculate the min, max, mean, and standard deviation values for all the string and numeric columns. Solution: You use the following PySpark expression: df.summary() Does this meet the goal?<\/p>", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "key": ["A"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>A. Yes The df.summary() function in PySpark provides summary statistics for both numeric and string columns in a DataFrame, including:<\/p>\n<p>For numeric columns: count, mean, stddev, min, max<\/p>\n<p>For string columns: count, min, max<\/p>", "exh": ""}, {"n": 57, "kind": "series", "kind_label": "Yes / No", "case": null, "case_ref": null, "stem_html": "<p>Note: This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution. After you answer a question in this section, you will NOT be able to return to it. As a result, these questions will not appear in the review screen. You have a Fabric tenant that contains a lakehouse named Lakehouse1. Lakehouse1 contains a Delta table named Customer. When you query Customer, you discover that the query is slow to execute. You suspect that maintenance was NOT performed on the table. You need to identify whether maintenance tasks were performed on Customer. Solution: You run the following Spark SQL statement: DESCRIBE HISTORY customer - Does this meet the goal?<\/p>", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "key": ["A"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>Yes, running DESCRIBE HISTORY customer meets the goal of identifying whether maintenance tasks were performed on the Delta table.<\/p>", "exh": ""}, {"n": 58, "kind": "series", "kind_label": "Yes / No", "case": null, "case_ref": null, "stem_html": "<p>Note: This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution. After you answer a question in this section, you will NOT be able to return to it. As a result, these questions will not appear in the review screen. You have a Fabric tenant that contains a lakehouse named Lakehouse1. Lakehouse1 contains a Delta table named Customer. When you query Customer, you discover that the query is slow to execute. You suspect that maintenance was NOT performed on the table. You need to identify whether maintenance tasks were performed on Customer. Solution: You run the following Spark SQL statement: REFRESH TABLE customer - Does this meet the goal?<\/p>", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "key": ["B"], "key_source": "derived", "key_note": "Key follows from the explanation.", "statement_answers": null, "explanation_html": "<p>No, running REFRESH TABLE customer does not meet the goal of identifying whether maintenance tasks were performed on the Delta table. This Spark SQL command is used to refresh the metadata of a table. It ensures that the latest schema and data are available for queries but does not give any historical information about maintenance operations.<\/p>", "exh": ""}, {"n": 59, "kind": "series", "kind_label": "Yes / No", "case": null, "case_ref": null, "stem_html": "<p>Note: This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution. After you answer a question in this section, you will NOT be able to return to it. As a result, these questions will not appear in the review screen. You have a Fabric tenant that contains a lakehouse named Lakehouse1. Lakehouse1 contains a Delta table named Customer. When you query Customer, you discover that the query is slow to execute. You suspect that maintenance was NOT performed on the table. You need to identify whether maintenance tasks were performed on Customer. Solution: You run the following Spark SQL statement: EXPLAIN TABLE customer - Does this meet the goal?<\/p>", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "key": ["B"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>The EXPLAIN statement in Spark SQL is used to display the execution plan of a query. This plan shows how Spark will execute the query, including details about the operations and stages involved. While it is useful for understanding and optimizing query performance, it does not provide historical information about maintenance tasks like optimization, compaction, or vacuuming performed on the table.<\/p>", "exh": ""}, {"n": 60, "kind": "multi", "kind_label": "Multi-select", "case": "Litware", "case_ref": null, "stem_html": "<p>Overview - Litware, Inc. is a manufacturing company that has offices throughout North America. The analytics team at Litware contains data engineers, analytics engineers, data analysts, and data scientists. Existing Environment - Fabric Environment - Litware has been using a Microsoft Power BI tenant for three years. Litware has NOT enabled any Fabric capacities and features. Available Data - Litware has data that must be analyzed as shown in the following table.<\/p>\n<p>The Product data contains a single table and the following columns.<\/p>\n<p>The customer satisfaction data contains the following tables: •Survey •Question •Response For each survey submitted, the following occurs: •One row is added to the Survey table. •One row is added to the Response table for each question in the survey. The Question table contains the text of each survey question. The third question in each survey response is an overall satisfaction score. Customers can submit a survey after each purchase. User Problems - The analytics team has large volumes of data, some of which is semi-structured. The team wants to use Fabric to create a new data store. Product data is often classified into three pricing groups: high, medium, and low. This logic is implemented in several databases and semantic models, but the logic does NOT always match across implementations. Requirements - Planned Changes - Litware plans to enable Fabric features in the existing tenant. The analytics team will create a new data store as a proof of concept (PoC). The remaining Liware users will only get access to the Fabric features once the PoC is complete. The PoC will be completed by using a Fabric trial capacity The following three workspaces will be created: •AnalyticsPOC: Will contain the data store, semantic models, reports pipelines, dataflow, and notebooks used to populate the data store •DataEngPOC: Will contain all the pipelines, dataflows, and notebooks used to populate OneLake •DataSciPOC: Will contain all the notebooks and reports created by the data scientists The following will be created in the AnalyticsPOC workspace: •A data store (type to be decided) •A custom semantic model •A default semantic model •Interactive reports The data engineers will create data pipelines to load data to OneLake either hourly or daily depending on the data source. The analytics engineers will create processes to ingest, transform, and load the data to the data store in the AnalyticsPOC workspace daily. Whenever possible, the data engineers will use low-code tools for data ingestion. The choice of which data cleansing and transformation tools to use will be at the data engineers’ discretion. All the semantic models and reports in the Analytics POC workspace will use the data store as the sole data source. Technical Requirements - The data store must support the following: •Read access by using T-SQL or Python •Semi-structured and unstructured data •Row-level security (RLS) for users executing T-SQL queries Files loaded by the data engineers to OneLake will be stored in the Parquet format and will meet Delta Lake specifications. Data will be loaded without transformation in one area of the AnalyticsPOC data store. The data will then be cleansed, merged, and transformed into a dimensional model The data load process must ensure that the raw and cleansed data is updated completely before populating the dimensional model The dimensional model must contain a date dimension. There is no existing data source for the date dimension. The Litware fiscal year matches the calendar year. The date dimension must always contain dates from 2010 through the end of the current year. The product pricing group logic must be maintained by the analytics engineers in a single location. The pricing group data must be made available in the data store for T-SOL. queries and in the default semantic model. The following logic must be used: •List prices that are less than or equal to 50 are in the low pricing group. •List prices that are greater than 50 and less than or equal to 1,000 are in the medium pricing group. •List prices that are greater than 1,000 are in the high pricing group. Security Requirements - Only Fabric administrators and the analytics team must be able to see the Fabric items created as part of the PoC. Litware identifies the following security requirements for the Fabric items in the AnalyticsPOC workspace: •Fabric administrators will be the workspace administrators. •The data engineers must be able to read from and write to the data store. No access must be granted to datasets or reports. •The analytics engineers must be able to read from, write to, and create schemas in the data store. They also must be able to create and share semantic models with the data analysts and view and modify all reports in the workspace. •The data scientists must be able to read from the data store, but not write to it. They will access the data by using a Spark notebook •The data analysts must have read access to only the dimensional model objects in the data store. They also must have access to create Power BI reports by using the semantic models created by the analytics engineers. •The date dimension must be available to all users of the data store. •The principle of least privilege must be followed. Both the default and custom semantic models must include only tables or views from the dimensional model in the data store. Litware already has the following Microsoft Entra security groups: •FabricAdmins: Fabric administrators •AnalyticsTeam: All the members of the analytics team •DataAnalysts: The data analysts on the analytics team •DataScientists: The data scientists on the analytics team •DataEngineers: The data engineers on the analytics team •AnalyticsEngineers: The analytics engineers on the analytics team Report Requirements - The data analysts must create a customer satisfaction report that meets the following requirements: •Enables a user to select a product to filter customer survey responses to only those who have purchased that product. •Displays the average overall satisfaction score of all the surveys submitted during the last 12 months up to a selected dat. •Shows data as soon as the data is updated in the data store. •Ensures that the report and the semantic model only contain data from the current and previous year. •Ensures that the report respects any table-level security specified in the source data store. •Minimizes the execution time of report queries. You need to recommend a solution to prepare the tenant for the PoC. Which two actions should you recommend performing from the Fabric Admin portal? Each correct answer presents part of the solution. NOTE: Each correct answer is worth one point.<\/p>", "options": [{"letter": "A", "text": "Enable the Users can try Microsoft Fabric paid features option for the entire organization."}, {"letter": "B", "text": "Enable the Users can try Microsoft Fabric paid features option for specific security groups."}, {"letter": "C", "text": "Enable the Allow Azure Active Directory guest users to access Microsoft Fabric option for specific security groups."}, {"letter": "D", "text": "Enable the Users can create Fabric items option and exclude specific security groups."}, {"letter": "E", "text": "Enable the Users can create Fabric items option for specific security groups."}], "key": ["B", "E"], "key_source": "derived", "key_note": "Key follows from the explanation.", "statement_answers": null, "explanation_html": "<p>Enable the Users can try Microsoft Fabric paid features option for specific security groups: This will allow specific security groups (like the AnalyticsTeam, DataAnalysts, DataScientists, DataEngineers, and AnalyticsEngineers) to access and use the paid features of Microsoft Fabric necessary for the PoC. This is important to ensure that only the relevant team members can utilize these advanced features while preventing unnecessary access for other users.<\/p>\n<p>Enable the Users can create Fabric items option for specific security groups: This will allow only specific security groups to create Fabric items, ensuring that the creation of these items is controlled and managed by the appropriate team members. This helps maintain the principle of least privilege and ensures that only authorized personnel can create and manage Fabric items during the PoC.<\/p>", "exh": ""}, {"n": 61, "kind": "hotspot", "kind_label": "Hotspot", "case": "Litware", "case_ref": 60, "stem_html": "<p>You need to design a semantic model for the customer satisfaction report. Which data source authentication method and mode should you use? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p>\n<ul><li>Authentication method: Basic authentication / Service principal authentication / Single sign-on (SSO) authentication<\/li><li>Mode: Direct Lake / DirectQuery / Import<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>1. Authentication Method: &quot;Single sign-on (SSO) authentication&quot;<\/p>\n<p>SSO (Single Sign-On) allows users to authenticate once and gain access to multiple applications without needing to log in separately.<\/p>\n<p>This is a secure and seamless authentication method commonly used in enterprise environments for Microsoft Fabric, Power BI, and other services.<\/p>\n<p>Compared to Basic authentication (which requires username/password) or Service principal authentication (used for automated access), SSO provides better user experience and security.<\/p>\n<p>2. Mode: &quot;Direct Lake&quot;<\/p>\n<p>Direct Lake mode is a new hybrid query mode that combines the performance of Import mode with the real- time access of DirectQuery.<\/p>\n<p>Unlike Import mode, which loads data into memory, or DirectQuery, which queries the source live, Direct Lake queries Delta tables directly from OneLake without the need for pre-loading.<\/p>\n<p>This mode is optimized for high performance and scalability, making it an ideal choice for Power BI and Fabric scenarios.<\/p>", "answer_area": {"kind": "dropdowns", "controls": [{"id": "d1", "label": "Authentication method:", "options": ["Basic authentication", "Service principal authentication", "Single sign-on (SSO) authentication"], "correct": "Single sign-on (SSO) authentication"}, {"id": "d2", "label": "Mode:", "options": ["Direct Lake", "DirectQuery", "Import"], "correct": "Direct Lake"}]}, "exh": ""}, {"n": 62, "kind": "multi", "kind_label": "Multi-select", "case": "Litware", "case_ref": 60, "stem_html": "<p>You need to implement the date dimension in the data store. The solution must meet the technical requirements. What are two ways to achieve the goal? Each correct answer presents a complete solution. NOTE: Each correct selection is worth one point.<\/p>", "options": [{"letter": "A", "text": "Populate the date dimension table by using a dataflow."}, {"letter": "B", "text": "Populate the date dimension table by using a Copy activity in a pipeline."}, {"letter": "C", "text": "Populate the date dimension view by using T-SQL."}, {"letter": "D", "text": "Populate the date dimension table by using a Stored procedure activity in a pipeline."}], "key": ["A", "D"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>A. Populate the date dimension table by using a dataflow.<\/p>\n<p>Dataflows in Microsoft Fabric (or Power BI) allow ETL (Extract, Transform, Load) operations to create and populate tables.<\/p>\n<p>They can be used to generate and maintain a date dimension with calculated columns such as year, quarter, month, and week.<\/p>\n<p>D. Populate the date dimension table by using a Stored procedure activity in a pipeline.<\/p>\n<p>Stored procedures allow for predefined logic and transformations to be applied while inserting or updating records in the date dimension table.<\/p>\n<p>Using a Stored Procedure activity in an Azure Data Factory (ADF) or Microsoft Fabric pipeline is a common way to populate and maintain a date dimension.<\/p>", "exh": ""}, {"n": 63, "kind": "single", "kind_label": "Single choice", "case": "Litware", "case_ref": 60, "stem_html": "<p>You need to ensure the data loading activities in the AnalyticsPOC workspace are executed in the appropriate sequence. The solution must meet the technical requirements. What should you do?<\/p>", "options": [{"letter": "A", "text": "Create a dataflow that has multiple steps and schedule the dataflow."}, {"letter": "B", "text": "Create and schedule a Spark notebook."}, {"letter": "C", "text": "Create and schedule a Spark job definition."}, {"letter": "D", "text": "Create a pipeline that has dependencies between activities and schedule the pipeline."}], "key": ["D"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>D. Create a pipeline that has dependencies between activities and schedule the pipeline.<\/p>\n<p>To ensure that data loading activities in the AnalyticsPOC workspace are executed in the appropriate sequence while meeting technical requirements, the best approach is to use a data pipeline with dependencies between activities.<\/p>\n<p>Pipelines in Microsoft Fabric (or Azure Data Factory) allow you to orchestrate data movement, transformation, and processing across multiple steps.<\/p>\n<p>You can define activity dependencies, ensuring that each step executes only after the previous step completes successfully.<\/p>\n<p>You can schedule the pipeline to run at specific times, making it automated and reliable.<\/p>", "exh": ""}, {"n": 64, "kind": "single", "kind_label": "Single choice", "case": "Contoso", "case_ref": null, "stem_html": "<p>Overview - Contoso, Ltd. is a US-based health supplements company. Contoso has two divisions named Sales and Research. The Sales division contains two departments named Online Sales and Retail Sales. The Research division assigns internally developed product lines to individual teams of researchers and analysts. Existing Environment - Identity Environment - Contoso has a Microsoft Entra tenant named contoso.com. The tenant contains two groups named ResearchReviewersGroup1 and ResearchReviewersGroup2. Data Environment - Contoso has the following data environment: •The Sales division uses a Microsoft Power BI Premium capacity. •The semantic model of the Online Sales department includes a fact table named Orders that uses Import made. In the system of origin, the OrderID value represents the sequence in which orders are created. •The Research department uses an on-premises, third-party data warehousing product. •Fabric is enabled for contoso.com. •An Azure Data Lake Storage Gen2 storage account named storage1 contains Research division data for a product line named Productline1. The data is in the delta format. •A Data Lake Storage Gen2 storage account named storage2 contains Research division data for a product line named Productline2. The data is in the CSV format. Requirements - Planned Changes - Contoso plans to make the following changes: •Enable support for Fabric in the Power BI Premium capacity used by the Sales division. •Make all the data for the Sales division and the Research division available in Fabric. •For the Research division, create two Fabric workspaces named Productline1ws and Productine2ws. •In Productline1ws, create a lakehouse named Lakehouse1. •In Lakehouse1, create a shortcut to storage1 named ResearchProduct. Data Analytics Requirements - Contoso identifies the following data analytics requirements: •All the workspaces for the Sales division and the Research division must support all Fabric experiences. •The Research division workspaces must use a dedicated, on-demand capacity that has per-minute billing. •The Research division workspaces must be grouped together logically to support OneLake data hub filtering based on the department name. •For the Research division workspaces, the members of ResearchReviewersGroup1 must be able to read lakehouse and warehouse data and shortcuts by using SQL endpoints. •For the Research division workspaces, the members of ResearchReviewersGroup2 must be able to read lakehouse data by using Lakehouse explorer. •All the semantic models and reports for the Research division must use version control that supports branching. Data Preparation Requirements - Contoso identifies the following data preparation requirements: •The Research division data for Productline1 must be retrieved from Lakehouse1 by using Fabric notebooks. •All the Research division data in the lakehouses must be presented as managed tables in Lakehouse explorer. Semantic Model Requirements - Contoso identifies the following requirements for implementing and managing semantic models: •The number of rows added to the Orders table during refreshes must be minimized. •The semantic models in the Research division workspaces must use Direct Lake mode. General Requirements - Contoso identifies the following high-level requirements that must be considered for all solutions: •Follow the principle of least privilege when applicable. •Minimize implementation and maintenance effort when possible. You need to recommend which type of Fabric capacity SKU meets the data analytics requirements for the Research division. What should you recommend?<\/p>", "options": [{"letter": "A", "text": "A"}, {"letter": "B", "text": "EM"}, {"letter": "C", "text": "P"}, {"letter": "D", "text": "F"}], "key": ["D"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>Fabric capacity SKUs all start with F, they allows for Pay as you go by the minute. Reserved capacity is also available.<\/p>", "exh": ""}, {"n": 65, "kind": "hotspot", "kind_label": "Hotspot", "case": "Contoso", "case_ref": 64, "stem_html": "<p>You need to migrate the Research division data for Productline1. The solution must meet the data preparation requirements. How should you complete the code? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p>\n<pre><code>df=spark.read.format(&#x27;csv&#x27;).options(header=&quot;true&quot;,inferSchema=&quot;true&quot;).load(&quot;fsi@storage1.dfs.core.windows.net/files/productline1&quot;)\ndf.write.mode(&quot;overwrite&quot;).format(&quot;[dropdown 1]&quot;).save(&quot;[dropdown 2]&quot;)<\/code><\/pre>\n<ul><li>Dropdown 1: csv / delta / parquet<\/li><li>Dropdown 2: productline1 / Tables/productline1 / Tables/research/productline1<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>- &quot;delta&quot;<\/p>\n<p>- &quot;Tables/productline1&quot;<\/p>\n<p>Requirements: Use managed tables.<\/p>\n<p>If you use saveAsTable() you don&#x27;t need to specify the path &quot;Table/&quot;<\/p>\n<p>If you you save() you specify the full path<\/p>", "answer_area": {"kind": "dropdowns", "code": "df=spark.read.format('csv').options(header=\"true\",inferSchema=\"true\").load(\"fsi@storage1.dfs.core.windows.net/files/productline1\")\ndf.write.mode(\"overwrite\").format(\"[dropdown 1]\").save(\"[dropdown 2]\")", "controls": [{"id": "d1", "options": ["csv", "delta", "parquet"], "correct": "delta"}, {"id": "d2", "options": ["productline1", "Tables/productline1", "Tables/research/productline1"], "correct": "Tables/productline1"}]}, "exh": ""}, {"n": 66, "kind": "single", "kind_label": "Single choice", "case": "Contoso", "case_ref": 64, "stem_html": "<p>What should you use to implement calculation groups for the Research division semantic models?<\/p>", "options": [{"letter": "A", "text": "Microsoft Power BI Desktop"}, {"letter": "B", "text": "the Power BI service"}, {"letter": "C", "text": "DAX Studio"}, {"letter": "D", "text": "Tabular Editor"}], "key": ["D"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>D .Tabular Editor.<\/p>\n<p>The semantic models in the Research division workspaces must use Direct Lake mode. Considering Contoso&#x27;s requirement to minimize implementation and maintenance effort (general requirement), Tabular Editor offers a more efficient way to define calculation groups compared to manually writing DAX code. Additionally, since calculation groups are part of the semantic model itself, they can be deployed and managed alongside the model, simplifying maintenance.<\/p>", "exh": ""}, {"n": 67, "kind": "hotspot", "kind_label": "Hotspot", "case": "Contoso", "case_ref": 64, "stem_html": "<p>The number of rows added to the Orders table during refreshes must be minimized. •The semantic models in the Research division workspaces must use Direct Lake mode. General Requirements - Contoso identifies the following high-level requirements that must be considered for all solutions: •Follow the principle of least privilege when applicable. •Minimize implementation and maintenance effort when possible. Which workspace role assignments should you recommend for ResearchReviewersGroup1 and ResearchReviewersGroup2? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p>\n<ul><li>ResearchReviewersGroup1: Contributor / Member / Viewer<\/li><li>ResearchReviewersGroup2: Contributor / Member / Viewer<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>1. ResearchReviewersGroup1: Viewer.<\/p>\n<p>Members of this group can only view resources but cannot edit, add, or delete them.<\/p>\n<p>Suitable for users who need read-only access to reports, datasets, or workspaces.<\/p>\n<p>2.ResearchReviewersGroup2: Contributor.<\/p>\n<p>Members can edit and add content but cannot manage access or settings.<\/p>\n<p>Suitable for users who need to modify or update reports and datasets but should not have full administrative privileges.<\/p>", "answer_area": {"kind": "dropdowns", "controls": [{"id": "d1", "label": "ResearchReviewersGroup1:", "options": ["Contributor", "Member", "Viewer"], "correct": "Viewer"}, {"id": "d2", "label": "ResearchReviewersGroup2:", "options": ["Contributor", "Member", "Viewer"], "correct": "Contributor"}]}, "exh": ""}], "dumps": [{"n": 1, "kind": "single", "kind_label": "Single choice", "case": "Contoso", "case_ref": 28, "stem_html": "<p>Which syntax should you use in a notebook to access the Research division data for Productline1?<\/p>", "key": ["A"], "key_source": "verified", "key_note": null, "statement_answers": null, "explanation_html": "<p>The shortcut ResearchProduct sits in the Tables section of the lakehouse as a Delta table. Reading it with spark.read.format(\"delta\").load(\"Tables/ResearchProduct\") addresses that table directly. The Files section holds raw files rather than the shortcut table, and external_table is KQL syntax, not Spark.<\/p>", "options": [{"letter": "A", "text": "spark.read.format(“delta”).load(“Tables/ResearchProduct”)"}, {"letter": "B", "text": "spark.read.format(“delta”).load(“Files/ResearchProduct”)"}, {"letter": "C", "text": "external_table(‘Tables/ResearchProduct)"}, {"letter": "D", "text": "external_table(ResearchProduct)"}], "exh": ""}, {"n": 2, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant named Tenant1 that contains a workspace named WS1. WS1 uses a capacity named C1 and contains a dataset named DS1. You need to ensure read-write access to DS1 is available by using XMLA endpoint. What should be modified first?<\/p>", "key": ["C"], "key_source": "matched", "key_note": null, "statement_answers": null, "explanation_html": "<p>C. the C1 settings.<\/p>\n<p>To enable read-write access via the XMLA endpoint, the XMLA endpoint must be set to Read/Write at the capacity level.<\/p>\n<p>In Power BI / Fabric:<\/p>\n<p>XMLA endpoint configuration is controlled at the Premium capacity level<\/p>\n<p>Workspaces inherit this setting from the capacity.<\/p>", "options": [{"letter": "A", "text": "the DS1 settings"}, {"letter": "B", "text": "the WS1 settings"}, {"letter": "C", "text": "the C1 settings"}, {"letter": "D", "text": "the Tenant1 settings"}], "exh": ""}, {"n": 3, "kind": "multi", "kind_label": "Multi-select", "case": "Litware", "case_ref": 27, "stem_html": "<p>You need to recommend a solution to prepare the tenant for the PoC. Which two actions should you recommend performing from the Fabric Admin portal? Each correct answer presents part of the solution. NOTE: Each correct answer is worth one point.<\/p>", "key": ["B", "E"], "key_source": "matched", "key_note": null, "statement_answers": null, "explanation_html": "<p>Enable the Users can try Microsoft Fabric paid features option for specific security groups: This will allow specific security groups (like the AnalyticsTeam, DataAnalysts, DataScientists, DataEngineers, and AnalyticsEngineers) to access and use the paid features of Microsoft Fabric necessary for the PoC. This is important to ensure that only the relevant team members can utilize these advanced features while preventing unnecessary access for other users.<\/p>\n<p>Enable the Users can create Fabric items option for specific security groups: This will allow only specific security groups to create Fabric items, ensuring that the creation of these items is controlled and managed by the appropriate team members. This helps maintain the principle of least privilege and ensures that only authorized personnel can create and manage Fabric items during the PoC.<\/p>", "options": [{"letter": "A", "text": "Enable the Users can try Microsoft Fabric paid features option for the entire organization."}, {"letter": "B", "text": "Enable the Users can try Microsoft Fabric paid features option for specific security groups."}, {"letter": "C", "text": "Enable the Allow Azure Active Directory guest users to access Microsoft Fabric option for specific security groups."}, {"letter": "D", "text": "Enable the Users can create Fabric items option and exclude specific security groups."}, {"letter": "E", "text": "Enable the Users can create Fabric items option for specific security groups."}], "exh": ""}, {"n": 4, "kind": "multi", "kind_label": "Multi-select", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a machine learning model registered in a Fabric workspace. You need to use the model to generate predictions by using the PREDICT function in a Fabric notebook. Which two languages can you use to perform model scoring? Each correct answer presents a co
