mplete solution. NOTE: Each correct answer is worth one point.<\/p>", "key": ["C", "D"], "key_source": "matched", "key_note": null, "statement_answers": null, "explanation_html": "<p>Spark SQL: This language leverages the Spark framework, which is commonly used for big data processing and machine learning. Spark SQL allows you to run SQL queries over data and includes support for machine learning model scoring with the PREDICT function.<\/p>\n<p>PySpark: This is the Python API for Spark. PySpark allows you to interact with Spark using Python, which is one of the most popular programming languages for data analysis and machine learning. PySpark includes capabilities for integrating with machine learning models and running predictions using the PREDICT function.<\/p>", "options": [{"letter": "A", "text": "T-SQL"}, {"letter": "B", "text": "DAX"}, {"letter": "C", "text": "Spark SQL"}, {"letter": "D", "text": "PySpark"}], "exh": ""}, {"n": 5, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a lakehouse named Lakehouse1. You need to prevent new tables added to Lakehouse1 from being added automatically to the default semantic model of the lakehouse. What should you configure?<\/p>", "key": ["B"], "key_source": "verified", "key_note": null, "statement_answers": null, "explanation_html": "<p>The default semantic model automatically includes new tables added to the lakehouse. That behavior is controlled in the semantic model settings, where the automatic inclusion of new tables can be turned off.<\/p>", "options": [{"letter": "A", "text": "the SQL analytics endpoint settings"}, {"letter": "B", "text": "the semantic model settings"}, {"letter": "C", "text": "the workspace settings"}, {"letter": "D", "text": "the Lakehouse1 settings"}], "exh": ""}, {"n": 6, "kind": "hotspot", "kind_label": "Hotspot", "case": "Contoso", "case_ref": 28, "stem_html": "<p>You have a Fabric workspace named Workspace1 and an Azure Data Lake Storage Gen2 account named storage1. Workspace1 contains a lakehouse named Lakehouse1. You need to create a shortcut to storage1 in Lakehouse1. Which protocol and endpoint should you specify? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p><ul><li>Protocol: abfs / abfss / https<\/li><li>Endpoint: blob / dfs / file<\/li><\/ul>", "key": null, "key_source": null, "key_note": null, "statement_answers": null, "explanation_html": "<p>1. Connection Type: https<\/p>\n<p>The selection of https means that the connection is being made using secure HTTPS endpoints rather than using Azure Blob File System (ABFS/ABFSS) protocols.<\/p>\n<p>https is commonly used for REST API-based access to Azure Storage.<\/p>\n<p>2. Endpoint Type: dfs<\/p>\n<p>The selection of dfs (Distributed File System) means that the connection is using Azure Data Lake Storage Gen2.<\/p>\n<p>dfs endpoints enable Hierarchical Namespace (HNS), which allows for file system-like directory structures and optimized big data analytics.<\/p>\n<p>This is required for Spark, Azure Synapse, Fabric, and Databricks.<\/p>", "options": [], "answer_area": {"kind": "dropdowns", "controls": [{"id": "d1", "label": "Protocol:", "options": ["abfs", "abfss", "https"], "correct": "https"}, {"id": "d2", "label": "Endpoint:", "options": ["blob", "dfs", "file"], "correct": "dfs"}]}, "exh": ""}, {"n": 7, "kind": "hotspot", "kind_label": "Hotspot", "case": "Contoso", "case_ref": 28, "stem_html": "<p>You have an Azure Data Lake Storage Gen2 account named storage1 that contains a Parquet file named sales.parquet. You have a Fabric tenant that contains a workspace named Workspace1. Using a notebook in Workspace1, you need to load the content of the file to the default lakehouse. The solution must ensure that the content will display automatically as a table named Sales in Lakehouse explorer. How should you complete the code? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p><pre><code>df = spark.read.parquet(&quot;abfss://fs1@storage1.dfs.core.windows.net/files/sales.parquet&quot;)\n\ndf.write.mode(&quot;overwrite&quot;).format(&quot;[dropdown 1]&quot;).saveAsTable(&quot;[dropdown 2]&quot;)<\/code><\/pre><ul><li>Dropdown 1: csv / delta / parquet<\/li><li>Dropdown 2: sales / files/sales / tables/sales<\/li><\/ul>", "key": null, "key_source": null, "key_note": null, "statement_answers": null, "explanation_html": "<p>The file is Parquet, but the table must be a Delta table, so the format is delta. saveAsTable takes a table name, so the argument is the plain table name sales; files/sales and tables/sales are file paths, not table names.<\/p>", "options": [], "answer_area": {"kind": "dropdowns", "code": "df = spark.read.parquet(\"abfss://fs1@storage1.dfs.core.windows.net/files/sales.parquet\")\n\ndf.write.mode(\"overwrite\").format(\"[dropdown 1]\").saveAsTable(\"[dropdown 2]\")", "controls": [{"id": "d1", "options": ["csv", "delta", "parquet"], "correct": "delta"}, {"id": "d2", "options": ["sales", "files/sales", "tables/sales"], "correct": "sales"}]}, "exh": ""}, {"n": 8, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a warehouse. Several times a day, the performance of all warehouse queries degrades. You suspect that Fabric is throttling the compute used by the warehouse. What should you use to identify whether throttling is occurring?<\/p>", "key": ["D"], "key_source": "matched", "key_note": null, "statement_answers": null, "explanation_html": "<p>The Microsoft Capacity Metrics app, also known as the metrics app, serves as a monitoring tool within the Microsoft Power BI service. It offers functionalities to track and analyze the resource utilization.<\/p>", "options": [{"letter": "A", "text": "the Capacity settings"}, {"letter": "B", "text": "the Monitoring hub"}, {"letter": "C", "text": "dynamic management views (DMVs)"}, {"letter": "D", "text": "the Microsoft Fabric Capacity Metrics app"}], "exh": ""}, {"n": 9, "kind": "multi", "kind_label": "Multi-select", "case": null, "case_ref": null, "stem_html": "<p>You plan to deploy Microsoft Power BI items by using Fabric deployment pipelines. You have a deployment pipeline that contains three stages named Development, Test, and Production. A workspace is assigned to each stage. You need to provide Power BI developers with access to the pipeline. The solution must meet the following requirements: - Ensure that the developers can deploy items to the workspaces for Development and Test. - Prevent the developers from deploying items to the workspace for Production. - Ensure that the developers can view items in Production. - Follow the principle of least privilege. Which three levels of access should you assign to the developers? Each correct answer presents part of the solution. NOTE: Each correct answer is worth one point.<\/p>", "key": ["B", "D", "E"], "key_source": "matched", "key_note": null, "statement_answers": null, "explanation_html": "<p>Admin access to the deployment pipeline : Admin access to the deployment pipeline is necessary to manage the pipeline stages and deployment processes. This allows developers to configure deployments between stages but does not grant direct access to the workspaces themselves.<\/p>\n<p>Viewer access to the Production workspace : Providing Viewer access to the Production workspace ensures that developers can see the items in the Production stage but cannot make changes or deploy items to the Production workspace. This restriction aligns with the requirement to prevent developers from deploying to the Production workspace.<\/p>\n<p>Contributor access to the Development and Test workspaces : Contributor access to the Development and Test workspaces allows developers to deploy and modify items within these stages. This access is necessary to enable developers to work on and test their items before they move to production.<\/p>", "options": [{"letter": "A", "text": "Build permission to the production semantic models"}, {"letter": "B", "text": "Admin access to the deployment pipeline"}, {"letter": "C", "text": "Viewer access to the Development and Test workspaces"}, {"letter": "D", "text": "Viewer access to the Production workspace"}, {"letter": "E", "text": "Contributor access to the Development and Test workspaces"}, {"letter": "F", "text": "Contributor access to the Production workspace"}], "exh": ""}, {"n": 10, "kind": "single", "kind_label": "Single choice", "case": "Contoso", "case_ref": 28, "stem_html": "<p>You need to refresh the Orders table of the Online Sales department. The solution must meet the semantic model requirements. What should you include in the solution?<\/p>", "key": ["D"], "key_source": "matched", "key_note": null, "statement_answers": null, "explanation_html": "<p>D. an Azure Data Factory pipeline that executes a dataflow to retrieve the maximum value of the OrderID column in the destination lakehouse. A dataflow can be used to retrieve the max OrderID number (stored in the destination table - OrderID is a sequencial number). This number can be used to set from which row data must be added to the destination table (implementing an incremental load).<\/p>", "options": [{"letter": "A", "text": "an Azure Data Factory pipeline that executes a Stored procedure activity to retrieve the maximum value of the OrderID column in the destination lakehouse"}, {"letter": "B", "text": "an Azure Data Factory pipeline that executes a Stored procedure activity to retrieve the minimum value of the OrderID column in the destination lakehouse"}, {"letter": "C", "text": "an Azure Data Factory pipeline that executes a dataflow to retrieve the minimum value of the OrderID column in the destination lakehouse"}, {"letter": "D", "text": "an Azure Data Factory pipeline that executes a dataflow to retrieve the maximum value of the OrderID column in the destination lakehouse"}], "exh": ""}, {"n": 11, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a workspace named Workspace1 and a user named User1. Workspace1 contains a warehouse named DW1. You share DW1 with User1 and assign User1 the default permissions for DW1. What can User1 do?<\/p>", "key": ["C"], "key_source": "verified", "key_note": null, "statement_answers": null, "explanation_html": "<p>Sharing with default permissions grants only Read on the item, which is the equivalent of CONNECT: the recipient can connect to the SQL endpoint but cannot query tables, build reports on the default dataset, or read the underlying Parquet files. Those abilities need the additional share options to be selected.<\/p>", "options": [{"letter": "A", "text": "Build reports by using the default dataset."}, {"letter": "B", "text": "Read data from the tables in DW1."}, {"letter": "C", "text": "Connect to DW1 via the Azure SQL Analytics endpoint."}, {"letter": "D", "text": "Read the underlying Parquet files from OneLake."}], "exh": ""}, {"n": 12, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant. You plan to create a Fabric notebook that will use Spark DataFrames to generate Microsoft Power BI visuals. You run the following code. For each of the following statements, select Yes if the statement is true. Otherwise, select No. NOTE: Each correct selection is worth one point.<\/p>\n<pre><code>from powerbiclient import QuickVisualize, get_dataset_config, Report\n\nPBI_visualize = QuickVisualize(get_dataset_config(df))\nPBI_visualize<\/code><\/pre>\n<p>Answer Area<\/p><ul><li>The code embeds an existing Power BI report. — Yes / No<\/li><li>The code creates a Power BI report. — Yes / No<\/li><li>The code displays a summary of the DataFrame. — Yes / No<\/li><\/ul>", "key": null, "key_source": null, "key_note": null, "statement_answers": null, "explanation_html": "<p>QuickVisualize builds a new Power BI report from the DataFrame, so the code creates a report but does not embed an existing one. It does not display a summary of the DataFrame; that would need a profiling or summary call.<\/p>", "options": [], "answer_area": {"kind": "statements", "controls": [{"id": "s1", "text": "The code embeds an existing Power BI report.", "correct": "No"}, {"id": "s2", "text": "The code creates a Power BI report.", "correct": "Yes"}, {"id": "s3", "text": "The code displays a summary of the DataFrame.", "correct": "No"}]}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Notebook code<\/div><pre class=\"exh-pre\"><code>from powerbiclient import QuickVisualize, get_dataset_config, Report\n\nPBI_visualize = QuickVisualize(get_dataset_config(df))\nPBI_visualize<\/code><\/pre><\/div>"}, {"n": 13, "kind": "single", "kind_label": "Single choice", "case": "Contoso", "case_ref": 28, "stem_html": "<p>Which syntax should you use in a notebook to access the Research division data for Productline1?<\/p>", "key": ["B"], "key_source": "matched", "key_note": null, "statement_answers": null, "explanation_html": "<p>spark.sql(“SELECT * FROM Lakehouse1.ResearchProduct ”)<\/p>\n<p>The syntax of C and D is correct for KQL databases (incorrect in this use-case). When the shortcut is created, no additional folders have been added to the Tables section, therefore answer A is incorrect. Once created, the line of answer B can be used to access data correctly.<\/p>", "options": [{"letter": "A", "text": "spark.read.format(“delta”).load(“Files/ResearchProduct”)"}, {"letter": "B", "text": "spark.sql(“SELECT * FROM Lakehouse1.ResearchProduct ”)"}, {"letter": "C", "text": "spark.sql(“SELECT * FROM Lakehouse1.Tables.ResearchProduct ”)"}, {"letter": "D", "text": "external_table(ResearchProduct)"}], "exh": ""}, {"n": 14, "kind": "single", "kind_label": "Single choice", "case": "Litware", "case_ref": 27, "stem_html": "<p>You have a Fabric tenant that contains the workspaces shown in the following table. You have a deployment pipeline named Pipeline1 that deploys items from Workspace_DEV to Workspace_TEST. In Pipeline1, all items that have matching names are paired. You deploy the contents of Workspace_DEV to Workspace_TEST by using Pipeline1. What will the contents of Workspace_TEST be once the deployment is complete?<\/p>", "key": ["A"], "key_source": "verified", "key_note": null, "statement_answers": null, "explanation_html": "<p>Items with matching names are paired: SemanticModel1 exists in both workspaces, so it is paired and updated in place. Lakehouse1, Notebook1 and Pipeline1 exist only in Workspace_DEV, so they are deployed as new items into Workspace_TEST. Lakehouse2 and Notebook2 exist only in Workspace_TEST and are left untouched, so Workspace_TEST ends up holding all six items.<\/p>", "options": [{"letter": "A", "text": "Lakehouse1 Lakehouse2 Notebook1 Notebook2 Pipeline1 SemanticModel1"}, {"letter": "B", "text": "Lakehouse1 Notebook1 Pipeline1 SemanticModel1"}, {"letter": "C", "text": "Lakehouse2 Notebook2 SemanticModel1"}, {"letter": "D", "text": "Lakehouse2 Notebook2 Pipeline1 SemanticModel1"}], "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Workspaces and items<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Name<\/th><th>Contents<\/th><\/tr><\/thead><tbody><tr><td>Workspace_DEV<\/td><td>Lakehouse1&lt;br&gt;Notebook1&lt;br&gt;Pipeline1&lt;br&gt;SemanticModel1<\/td><\/tr><tr><td>Workspace_TEST<\/td><td>Lakehouse2&lt;br&gt;Notebook2&lt;br&gt;SemanticModel1<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 15, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have an Azure Repos Git repository named Repo1 and a Fabric-enabled Microsoft Power BI Premium capacity. The capacity contains two workspaces named Workspace1 and Workspace2. Git integration is enabled at the workspace level. You plan to use Microsoft Power BI Desktop and Workspace1 to make version-controlled changes to a semantic model stored in Repo1. The changes will be built and deployed to Workspace2 by using Azure Pipelines. You need to ensure that report and semantic model definitions are saved as individual text files in a folder hierarchy. The solution must minimize development and maintenance effort. In which file format should you save the changes?<\/p>", "key": ["A"], "key_source": "verified", "key_note": null, "statement_answers": null, "explanation_html": "<p>PBIP (Power BI Project) stores the semantic model and report definitions as individual text files in a folder hierarchy, which is what version control with Git and Azure Pipelines builds require. PBIX is a single binary file, PBIT is a template, and PBIDS is a connection file.<\/p>", "options": [{"letter": "A", "text": "PBIP"}, {"letter": "B", "text": "PBIDS"}, {"letter": "C", "text": "PBIT"}, {"letter": "D", "text": "PBIX"}], "exh": ""}, {"n": 16, "kind": "hotspot", "kind_label": "Hotspot", "case": "Contoso", "case_ref": 28, "stem_html": "<p>Which workspace role assignments should you recommend for ResearchReviewersGroup1 and ResearchReviewersGroup2? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p><ul><li>ResearchReviewersGroup1: Contributor / Member / Viewer<\/li><li>ResearchReviewersGroup2: Contributor / Member / Viewer<\/li><\/ul>", "key": null, "key_source": null, "key_note": null, "statement_answers": null, "explanation_html": "<p>ResearchReviewersGroup1: Viewer. For the Research division workspaces, the members of ResearchReviewersGroup1 must be able to read lakehouse and warehouse data and shortcuts by using SQL endpoints. In a lakehouse, a user with the Viewer role can only read data stored in Tables using the SQL analytics endpoint.<\/p><p>ResearchReviewersGroup2: Contributor. For the Research division workspaces, the members of ResearchReviewersGroup2 must be able to read lakehouse data by using Lakehouse explorer. Members can edit and add content but cannot manage access or settings.<\/p><p>Member is not correct for either group: it carries more permissions compared to Contributor.<\/p>", "options": [], "answer_area": {"kind": "dropdowns", "controls": [{"id": "d1", "label": "ResearchReviewersGroup1:", "options": ["Contributor", "Member", "Viewer"], "correct": "Viewer"}, {"id": "d2", "label": "ResearchReviewersGroup2:", "options": ["Contributor", "Member", "Viewer"], "correct": "Contributor"}]}, "exh": ""}, {"n": 17, "kind": "dragdrop", "kind_label": "Drag & drop", "case": null, "case_ref": null, "stem_html": "<p>You are implementing a medallion architecture in a single Fabric workspace. You have a lakehouse that contains the Bronze and Silver layers and a warehouse that contains the Gold layer. You create the items required to populate the layers as shown in the following table. You need to ensure that the layers are populated daily in sequential order such that Silver is populated only after Bronze is complete, and Gold is populated only after Silver is complete. The solution must minimize development effort and complexity. What should you use to execute each set of items? To answer, drag the appropriate options to the correct items. Each option may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p><p>Triggers: A pipeline Copy activity / A pipeline Dataflow activity / A pipeline Stored procedure activity / A schedule / A Spark job definition / An Invoke pipeline activity<\/p><ul><li>Orchestration pipeline: [drop target]<\/li><li>Bronze layer: [drop target]<\/li><li>Silver layer: [drop target]<\/li><li>Gold layer: [drop target]<\/li><\/ul>", "key": null, "key_source": null, "key_note": null, "statement_answers": null, "explanation_html": "<p>The orchestration pipeline runs on a schedule so the layers populate daily in order. Bronze is raw ingestion, so a Copy activity loads the raw data. Silver cleans and transforms, so a Dataflow activity does the transformation. Gold holds business aggregates in the warehouse, so a Stored procedure activity runs the warehouse logic.<\/p>", "options": [], "answer_area": {"kind": "dragdrop", "values": ["A pipeline Copy activity", "A pipeline Dataflow activity", "A pipeline Stored procedure activity", "A schedule", "A Spark job definition", "An Invoke pipeline activity"], "controls": [{"id": "t1", "label": "Orchestration pipeline:", "correct": "A schedule"}, {"id": "t2", "label": "Bronze layer:", "correct": "A pipeline Copy activity"}, {"id": "t3", "label": "Silver layer:", "correct": "A pipeline Dataflow activity"}, {"id": "t4", "label": "Gold layer:", "correct": "A pipeline Stored procedure activity"}]}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Medallion layers and tools<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Layer<\/th><th>Data integration tool<\/th><\/tr><\/thead><tbody><tr><td>Bronze<\/td><td>Pipelines with Copy activities<\/td><\/tr><tr><td>Silver<\/td><td>Dataflows<\/td><\/tr><tr><td>Gold<\/td><td>Stored procedures<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 18, "kind": "single", "kind_label": "Single choice", "case": "Contoso", "case_ref": 28, "stem_html": "<p>Which syntax should you use in a notebook to access the Research division data for Productline1?<\/p>", "key": ["B"], "key_source": "matched", "key_note": null, "statement_answers": null, "explanation_html": "<p>spark.sql(“SELECT * FROM Lakehouse1.ResearchProduct ”)<\/p>\n<p>The syntax of C and D is correct for KQL databases (incorrect in this use-case). When the shortcut is created, no additional folders have been added to the Tables section, therefore answer A is incorrect. Once created, the line of answer B can be used to access data correctly.<\/p>", "options": [{"letter": "A", "text": "spark.read.format(“delta”).load(“Tables/productline1/ResearchProduct”)"}, {"letter": "B", "text": "spark.sql(“SELECT * FROM Lakehouse1.ResearchProduct ”)"}, {"letter": "C", "text": "external_table(‘Tables/ResearchProduct)"}, {"letter": "D", "text": "external_table(ResearchProduct)"}], "exh": ""}, {"n": 19, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a lakehouse named Lakehouse1. Lakehouse1 contains a subfolder named Subfolder1 that contains CSV files. You need to convert the CSV files into the delta format that has V-Order optimization enabled. What should you do from Lakehouse explorer?<\/p>", "key": ["A"], "key_source": "matched", "key_note": null, "statement_answers": null, "explanation_html": "<p>A. Use the &quot;Load to Tables&quot; feature.<\/p>\n<p>To convert CSV files into Delta format with V-Order optimization, you need to load the files into tables in the Lakehouse.<\/p>\n<p>&quot;Load to Tables&quot; is a feature in Microsoft Fabric&#x27;s Lakehouse Explorer that allows you to convert files (such as CSV) into managed Delta tables.<\/p>\n<p>During this process, the data is converted into the Delta format, which supports V-Order optimization for better performance.<\/p>\n<p>V-Order is an advanced columnar storage format that enhances query performance and compression for Delta tables.<\/p>", "options": [{"letter": "A", "text": "Use the Load to Tables feature."}, {"letter": "B", "text": "Create a new shortcut in the Files section."}, {"letter": "C", "text": "Create a new shortcut in the Tables section."}, {"letter": "D", "text": "Use the Optimize feature."}], "exh": ""}, {"n": 20, "kind": "multi", "kind_label": "Multi-select", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric workspace named Workspace1 that contains a dataflow named Dataflow1. Dataflow1 returns 500 rows of data. You need to identify the min and max values for each column in the query results. Which three Data view options should you select? Each correct answer presents part of the solution. NOTE: Each correct answer is worth one point.<\/p>", "key": ["B", "C", "E"], "key_source": "verified", "key_note": null, "statement_answers": null, "explanation_html": "<p>Column profile computes per-column statistics including the minimum and maximum values. To see them you enable the details pane, enable column profile, and show the column profile in the details pane. Column quality shows only valid, empty and error counts, and value distribution shows distinct and unique counts; neither gives the minimum and maximum.<\/p>", "options": [{"letter": "A", "text": "Show column value distribution"}, {"letter": "B", "text": "Enable column profile"}, {"letter": "C", "text": "Show column profile in details pane"}, {"letter": "D", "text": "Show column quality details"}, {"letter": "E", "text": "Enable details pane"}], "exh": ""}, {"n": 21, "kind": "single", "kind_label": "Single choice", "case": "Litware", "case_ref": 27, "stem_html": "<p>You need to ensure the data loading activities in the AnalyticsPOC workspace are executed in the appropriate sequence. The solution must meet the technical requirements. What should you do?<\/p>", "key": ["D"], "key_source": "matched", "key_note": null, "statement_answers": null, "explanation_html": "<p>D. Create a pipeline that has dependencies between activities and schedule the pipeline.<\/p>\n<p>To ensure that data loading activities in the AnalyticsPOC workspace are executed in the appropriate sequence while meeting technical requirements, the best approach is to use a data pipeline with dependencies between activities.<\/p>\n<p>Pipelines in Microsoft Fabric (or Azure Data Factory) allow you to orchestrate data movement, transformation, and processing across multiple steps.<\/p>\n<p>You can define activity dependencies, ensuring that each step executes only after the previous step completes successfully.<\/p>\n<p>You can schedule the pipeline to run at specific times, making it automated and reliable.<\/p>", "options": [{"letter": "A", "text": "Create a dataflow that has multiple steps and schedule the dataflow."}, {"letter": "B", "text": "Create and schedule a Spark notebook."}, {"letter": "C", "text": "Create and schedule a Spark job definition."}, {"letter": "D", "text": "Create a pipeline that has dependencies between activities and schedule the pipeline."}], "exh": ""}, {"n": 22, "kind": "single", "kind_label": "Single choice", "case": "Contoso", "case_ref": 28, "stem_html": "<p>You need to ensure that Contoso can use version control to meet the data analytics requirements and the general requirements. What should you do?<\/p>", "key": ["C"], "key_source": "matched", "key_note": null, "statement_answers": null, "explanation_html": "<p>C. Modify the settings of the Research division workspaces to use an Azure Repos repository.<\/p>\n<p>Contoso needs version control for its data analytics and general requirements. In Microsoft Fabric and Power BI, version control is best managed through Git integration using Azure Repos or GitHub.<\/p>\n<p>Azure Repos is a Git-based repository within Azure DevOps, providing versioning, tracking, and collaboration for code, reports, and semantic models.<\/p>\n<p>This is the most appropriate choice for version-controlling Power BI artifacts like datasets, reports, and semantic models in a workspace.<\/p>", "options": [{"letter": "A", "text": "Store all the semantic models and reports in Data Lake Gen2 storage."}, {"letter": "B", "text": "Modify the settings of the Research workspaces to use a GitHub repository."}, {"letter": "C", "text": "Modify the settings of the Research division workspaces to use an Azure Repos repository."}, {"letter": "D", "text": "Store all the semantic models and reports in Microsoft OneDrive."}], "exh": ""}, {"n": 23, "kind": "multi", "kind_label": "Multi-select", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric workspace that contains a DirectQuery semantic model. The model queries a data source that has 500 million rows. You have a Microsoft Power Bi report named Report1 that uses the model. Report1 contains visuals on multiple pages. You need to reduce the query execution time for the visuals on all the pages. What are two features that you can use? Each correct answer presents a complete solution. NOTE: Each correct answer is worth one point.<\/p>", "key": ["A", "B"], "key_source": "matched", "key_note": null, "statement_answers": null, "explanation_html": "<p>A. User-defined aggregations.<\/p>\n<p>Aggregations help improve query performance by pre-aggregating data at different levels (e.g., summarizing sales by month instead of querying raw transactions).<\/p>\n<p>Users define aggregations based on expected queries, reducing the need to scan massive datasets.<\/p>\n<p>B. Automatic aggregations.<\/p>\n<p>Automatic aggregations optimize query performance by learning from query patterns and storing frequently used aggregate results in memory.<\/p>\n<p>This reduces the load on the underlying data source, speeding up DirectQuery performance.<\/p>", "options": [{"letter": "A", "text": "user-defined aggregations"}, {"letter": "B", "text": "automatic aggregation"}, {"letter": "C", "text": "query caching"}, {"letter": "D", "text": "OneLake integration"}], "exh": ""}, {"n": 24, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a lakehouse named Lakehouse1. Lakehouse1 contains an unpartitioned table named Table1. You plan to copy data to Table1 and partition the table based on a date column in the source data. You create a Copy activity to copy the data to Table1. You need to specify the partition column in the Destination settings of the Copy activity. What should you do first?<\/p>", "key": ["D"], "key_source": "matched", "key_note": null, "statement_answers": null, "explanation_html": "<p>D. From the Destination tabs, set Mode to Overwrite.<\/p>\n<p>Expand Advanced, in Table action, select Overwrite, and then select Enable partition, under Partition columns, select Add column, and choose the column you want to use as the partition column. You can choose to use a single column or multiple columns as the partition column.<\/p>", "options": [{"letter": "A", "text": "From the Destination tab, set Mode to Append."}, {"letter": "B", "text": "From the Destination tab, select the partition column."}, {"letter": "C", "text": "From the Source tab, select Enable partition discovery."}, {"letter": "D", "text": "From the Destination tabs, set Mode to Overwrite."}], "exh": ""}, {"n": 25, "kind": "hotspot", "kind_label": "Hotspot", "case": "Contoso", "case_ref": 28, "stem_html": "<p>You need to migrate the Research division data for Productline1. The solution must meet the data preparation requirements. How should you complete the code? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p><pre><code>df=spark.read.format(&#x27;csv&#x27;).options(header=&quot;true&quot;,inferSchema=&quot;true&quot;).load(&quot;fs1@storage1.dfs.core.windows.net/files/productline1&quot;)\ndf.write.mode(&quot;overwrite&quot;).format(&quot;[dropdown 1]&quot;).save(&quot;[dropdown 2]&quot;)<\/code><\/pre><ul><li>Dropdown 1: csv / delta / parquet<\/li><li>Dropdown 2: productline1 / Tables/productline1 / Tables/research/productline1<\/li><\/ul>", "key": null, "key_source": null, "key_note": null, "statement_answers": null, "explanation_html": "<p>- &quot;delta&quot;<\/p>\n<p>- &quot;Tables/productline1&quot;<\/p>\n<p>Requirements: Use managed tables.<\/p>\n<p>If you use saveAsTable() you don&#x27;t need to specify the path &quot;Table/&quot;<\/p>\n<p>If you you save() you specify the full path<\/p>", "options": [], "answer_area": {"kind": "dropdowns", "code": "df=spark.read.format('csv').options(header=\"true\",inferSchema=\"true\").load(\"fs1@storage1.dfs.core.windows.net/files/productline1\")\ndf.write.mode(\"overwrite\").format(\"[dropdown 1]\").save(\"[dropdown 2]\")", "controls": [{"id": "d1", "options": ["csv", "delta", "parquet"], "correct": "delta"}, {"id": "d2", "options": ["productline1", "Tables/productline1", "Tables/research/productline1"], "correct": "Tables/productline1"}]}, "exh": ""}, {"n": 26, "kind": "multi", "kind_label": "Multi-select", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a workspace named Workspace1 and a user named User1. User1 is assigned the Contributor role for Workspace1. You plan to configure Workspace1 to use an Azure DevOps repository for version control. You need to ensure that User1 can commit items to the repository. Which two settings should you enable for User1? Each correct answer presents part of the solution. NOTE: Each correct selection is worth one point.<\/p>", "key": ["C", "D"], "key_source": "verified", "key_note": null, "statement_answers": null, "explanation_html": "<p>Git integration needs two tenant switches enabled: \"Users can create Fabric items\" and \"Users can synchronize workspace items with their Git repositories\". The GitHub switch applies only to GitHub repositories, and \"Users can create and use Data workflows\" is unrelated to Git.<\/p>", "options": [{"letter": "A", "text": "Users can sync workspace items with GitHub repositories"}, {"letter": "B", "text": "Users can create and use Data workflows"}, {"letter": "C", "text": "Users can create Fabric items"}, {"letter": "D", "text": "Users can synchronize workspace items with their Git repositories"}], "exh": ""}, {"n": 27, "kind": "single", "kind_label": "Single choice", "case": "Litware", "case_ref": null, "stem_html": "<p>Overview - Litware, Inc. is a manufacturing company that has offices throughout North America. The analytics team at Litware contains data engineers, analytics engineers, data analysts, and data scientists. Existing Environment - Fabric Environment - Litware has been using a Microsoft Power BI tenant for three years. Litware has NOT enabled any Fabric capacities and features. Available Data - Litware has data that must be analyzed as shown in the following table. The Product data contains a single table and the following columns. The customer satisfaction data contains the following tables: - Survey - Question - Response For each survey submitted, the following occurs: - One row is added to the Survey table. - One row is added to the Response table for each question in the survey. The Question table contains the text of each survey question. The third question in each survey response is an overall satisfaction score. Customers can submit a survey after each purchase. User Problems - The analytics team has large volumes of data, some of which is semi-structured. The team wants to use Fabric to create a new data store. Product data is often classified into three pricing groups: high, medium, and low. This logic is implemented in several databases and semantic models, but the logic does NOT always match across implementations. Requirements - Planned Changes - Litware plans to enable Fabric features in the existing tenant. The analytics team will create a new data store as a proof of concept (PoC). The remaining Litware users will only get access to the Fabric features once the PoC is complete. The PoC will be completed by using a Fabric trial capacity. The following three workspaces will be created: - AnalyticsPOC: Will contain the data store, semantic models, reports pipelines, dataflow, and notebooks used to populate the data store - DataEngPOC: Will contain all the pipelines, dataflows, and notebooks used to populate OneLake - DataSciPOC: Will contain all the notebooks and reports created by the data scientists The following will be created in the AnalyticsPOC workspace: - A data store (type to be decided) - A custom semantic model - A default semantic model - Interactive reports The data engineers will create data pipelines to load data to OneLake either hourly or daily depending on the data source. The analytics engineers will create processes to ingest, transform, and load the data to the data store in the AnalyticsPOC workspace daily. Whenever possible, the data engineers will use low-code tools for data ingestion. The choice of which data cleansing and transformation tools to use will be at the data engineers’ discretion. All the semantic models and reports in the Analytics POC workspace will use the data store as the sole data source. Technical Requirements - The data store must support the following: - Read access by using T-SQL or Python - Semi-structured and unstructured data - Row-level security (RLS) for users executing T-SQL queries Files loaded by the data engineers to OneLake will be stored in the Parquet format and will meet Delta Lake specifications. Data will be loaded without transformation in one area of the AnalyticsPOC data store. The data will then be cleansed, merged, and transformed into a dimensional model. The data load process must ensure that the raw and cleansed data is updated completely before populating the dimensional model. The dimensional model must contain a date dimension. There is no existing data source for the date dimension. The Litware fiscal year matches the calendar year. The date dimension must always contain dates from 2010 through the end of the current year. The product pricing group logic must be maintained by the analytics engineers in a single location. The pricing group data must be made available in the data store for T-SQL queries and in the default semantic model. The following logic must be used: - List prices that are less than or equal to 50 are in the low pricing group. - List prices that are greater than 50 and less than or equal to 1,000 are in the medium pricing group. - List prices that are greater than 1,000 are in the high pricing group. Security Requirements - Only Fabric administrators and the analytics team must be able to see the Fabric items created as part of the PoC. Litware identifies the following security requirements for the Fabric items in the AnalyticsPOC workspace: - Fabric administrators will be the workspace administrators. - The data engineers must be able to read from and write to the data store. No access must be granted to datasets or reports. - The analytics engineers must be able to read from, write to, and create schemas in the data store. They also must be able to create and share semantic models with the data analysts and view and modify all reports in the workspace. - The data scientists must be able to read from the data store, but not write to it. They will access the data by using a Spark notebook - The data analysts must have read access to only the dimensional model objects in the data store. They also must have access to create Power BI reports by using the semantic models created by the analytics engineers. - The date dimension must be available to all users of the data store. - The principle of least privilege must be followed. Both the default and custom semantic models must include only tables or views from the dimensional model in the data store. Litware already has the following Microsoft Entra security groups: - FabricAdmins: Fabric administrators - AnalyticsTeam: All the members of the analytics team - DataAnalysts: The data analysts on the analytics team - DataScientists: The data scientists on the analytics team - DataEngineers: The data engineers on the analytics team - AnalyticsEngineers: The analytics engineers on the analytics team Report Requirements - The data analysts must create a customer satisfaction report that meets the following requirements: - Enables a user to select a product to filter customer survey responses to only those who have purchased that product. - Displays the average overall satisfaction score of all the surveys submitted during the last 12 months up to a selected date. - Shows data as soon as the data is updated in the data store. - Ensures that the report and the semantic model only contain data from the current and previous year. - Ensures that the report respects any table-level security specified in the source data store. - Minimizes the execution time of report queries. What should you recommend using to ingest the customer data into the data store in the AnalyticsPOC workspace?<\/p>", "key": ["D"], "key_source": "matched", "key_note": null, "statement_answers": null, "explanation_html": "<p>D. a dataflow.<\/p><p>A dataflow ingests the customer data into the data store and applies any needed transformations with Power Query before loading it. A stored procedure executes SQL logic inside a database, a pipeline with a KQL activity targets KQL databases, and a Spark notebook is a code-first compute tool rather than the ingestion service for this scenario.<\/p>", "options": [{"letter": "A", "text": "a stored procedure"}, {"letter": "B", "text": "a pipeline that contains a KQL activity"}, {"letter": "C", "text": "a Spark notebook"}, {"letter": "D", "text": "a dataflow"}], "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Litware data sources<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Description<\/th><th>Original source<\/th><th>Total size<\/th><\/tr><\/thead><tbody><tr><td>Customer data<\/td><td>Customer relationship management (CRM) system<\/td><td>50 MB<\/td><\/tr><tr><td>Product data<\/td><td>Customer relationship management (CRM) system<\/td><td>200 MB<\/td><\/tr><tr><td>Customer satisfaction surveys<\/td><td>SurveyMonkey<\/td><td>500 GB<\/td><\/tr><\/tbody><\/table><\/div><\/div><div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Product table<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Name<\/th><th>Data type<\/th><\/tr><\/thead><tbody><tr><td>ProductID<\/td><td>Integer<\/td><\/tr><tr><td>ProductName<\/td><td>String<\/td><\/tr><tr><td>ProductCategory<\/td><td>String<\/td><\/tr><tr><td>ListPrice<\/td><td>Decimal<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 28, "kind": "single", "kind_label": "Single choice", "case": "Contoso", "case_ref": null, "stem_html": "<p>Overview - Contoso, Ltd. is a US-based health supplements company. Contoso has two divisions named Sales and Research. The Sales division contains two departments named Online Sales and Retail Sales. The Research division assigns internally developed product lines to individual teams of researchers and analysts. Existing Environment - Identity Environment - Contoso has a Microsoft Entra tenant named contoso.com. The tenant contains two groups named ResearchReviewersGroup1 and ResearchReviewersGroup2. Data Environment - Contoso has the following data environment: The Sales division uses a Microsoft Power BI Premium capacity. - The semantic model of the Online Sales department includes a fact table named Orders that uses Import made. In the system of origin, the OrderID value represents the sequence in which orders are created. - The Research department uses an on-premises, third-party data warehousing product. - Fabric is enabled for contoso.com. - An Azure Data Lake Storage Gen2 storage account named storage1 contains Research division data for a product line named Productline1. The data is in the delta format. - A Data Lake Storage Gen2 storage account named storage2 contains Research division data for a product line named Productline2. The data is in the CSV format. Requirements - Planned Changes - Contoso plans to make the following changes: - Enable support for Fabric in the Power BI Premium capacity used by the Sales division. - Make all the data for the Sales division and the Research division available in Fabric. - For the Research division, create two Fabric workspaces named Productline1ws and Productline2ws. - In Productline1ws, create a lakehouse named Lakehouse1. - In Lakehouse1, create a shortcut to storage1 named ResearchProduct. Data Analytics Requirements - Contoso identifies the following data analytics requirements: - All the workspaces for the Sales division and the Research division must support all Fabric experiences. - The Research division workspaces must use a dedicated, on-demand capacity that has per- minute billing. - The Research division workspaces must be grouped together logically to support OneLake data hub filtering based on the department name. - For the Research division workspaces, the members of ResearchReviewersGroup1 must be able to read lakehouse and warehouse data and shortcuts by using SQL endpoints. - For the Research division workspaces, the members of ResearchReviewersGroup2 must be able to read lakehouse data by using Lakehouse explorer. - All the semantic models and reports for the Research division must use version control that supports branching. Data Preparation Requirements - Contoso identifies the following data preparation requirements: - The Research division data for Productline1 must be retrieved from Lakehouse1 by using Fabric notebooks. - All the Research division data in the lakehouses must be presented as managed tables in Lakehouse explorer. Semantic Model Requirements - Contoso identifies the following requirements for implementing and managing semantic models: - The number of rows added to the Orders table during refreshes must be minimized. - The semantic models in the Research division workspaces must use Direct Lake mode. General Requirements - Contoso identifies the following high-level requirements that must be considered for all solutions: - Follow the principle of least privilege when applicable. - Minimize implementation and maintenance effort when possible. You need to recommend which type of Fabric capacity SKU meets the data analytics requirements for the Research division. What should you recommend?<\/p>", "key": ["D"], "key_source": "matched", "key_note": null, "statement_answers": null, "explanation_html": "<p>Use F SKU for Fabric. Fabric capacity SKUs start with F and support pay-as-you-go per-minute billing, which is what the Research division workspaces need for a dedicated, on-demand capacity.<\/p><p>NOTE: Power BI embedded analytics requires a capacity (A, EM, P, or F SKU) in order to publish embedded Power BI content.<\/p>", "options": [{"letter": "A", "text": "A"}, {"letter": "B", "text": "EM"}, {"letter": "C", "text": "P"}, {"letter": "D", "text": "F"}], "exh": ""}, {"n": 29, "kind": "hotspot", "kind_label": "Hotspot", "case": "Litware", "case_ref": 27, "stem_html": "<p>You have a Fabric tenant that contains a workspace named Workspace_DEV. Workspace_DEV contains the semantic models shown in the following table. Workspace_DEV contains the dataflows shown in the following table. You create a new workspace named Workspace_TEST. You create a deployment pipeline named Pipeline1 to move items from Workspace_DEV to Workspace_TEST. You run Pipeline1. For each of the following statements, select Yes if the statement is true. Otherwise, select No. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p><ul><li>DF1 will be deployed. — Yes / No<\/li><li>Data from Model1 will be deployed. — Yes / No<\/li><li>The scheduled refresh policy for Model1 will be deployed. — Yes / No<\/li><\/ul>", "key": null, "key_source": null, "key_note": null, "statement_answers": null, "explanation_html": "<p>Dataflow Gen1 items cannot be deployed through deployment pipelines, so DF1 is not deployed. Deploying a semantic model also deploys its data, so the data from Model1 is deployed, and its configured scheduled refresh policy is deployed with it.<\/p>", "options": [], "answer_area": {"kind": "statements", "controls": [{"id": "s1", "text": "DF1 will be deployed.", "correct": "No"}, {"id": "s2", "text": "Data from Model1 will be deployed.", "correct": "Yes"}, {"id": "s3", "text": "The scheduled refresh policy for Model1 will be deployed.", "correct": "Yes"}]}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Semantic models<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Name<\/th><th>Scheduled refresh policy<\/th><\/tr><\/thead><tbody><tr><td>Model1<\/td><td>Configured<\/td><\/tr><tr><td>Model2<\/td><td>Not configured<\/td><\/tr><\/tbody><\/table><\/div><\/div><div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Dataflows<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Name<\/th><th>Type<\/th><th>Scheduled refresh policy<\/th><\/tr><\/thead><tbody><tr><td>DF1<\/td><td>Dataflow Gen1<\/td><td>Configured<\/td><\/tr><tr><td>DF2<\/td><td>Dataflow Gen2<\/td><td>Not configured<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 30, "kind": "multi", "kind_label": "Multi-select", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric warehouse named Warehouse1 that contains a table named Table1. Table1 contains customer data. You need to implement row-level security (RLS) for Table1. The solution must ensure that users can see only their respective data. Which two objects should you create? Each correct answer presents part of the solution. NOTE: Each correct selection is worth one point.<\/p>", "key": ["D", "E"], "key_source": "verified", "key_note": null, "statement_answers": null, "explanation_html": "<p>Row-level security in a warehouse is implemented with a predicate function that returns the rows a user may see, and a security policy that applies the function to the table. Roles grant membership, while stored procedures and constraints do not enforce row filtering.<\/p>", "options": [{"letter": "A", "text": "DATABASE ROLE"}, {"letter": "B", "text": "STORED PROCEDURE"}, {"letter": "C", "text": "CONSTRAINT"}, {"letter": "D", "text": "FUNCTION"}, {"letter": "E", "text": "SECURITY POLICY"}], "exh": ""}, {"n": 31, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a warehouse named Warehouse1. Warehouse1 contains three schemas named schemaA, schemaB, and schemaC. You need to ensure that a user named User1 can truncate tables in schemaA only. How should you complete the T-SQL statement? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p><pre><code>GRANT [dropdown 1] ON [dropdown 2] TO User1<\/code><\/pre><ul><li>Dropdown 1: ALTER / CONNECT / EXECUTE<\/li><li>Dropdown 2: DATABASE::schemaA / OBJECT::schemaA / SCHEMA::schemaA<\/li><\/ul>", "key": null, "key_source": null, "key_note": null, "statement_answers": null, "explanation_html": "<p>ALTER: Allows modification of schema objects .<\/p>\n<p>SCHEMA::schemaA: Grants permissions on an entire schema instead of an individual database or object .<\/p>", "options": [], "answer_area": {"kind": "dropdowns", "code": "GRANT [dropdown 1] ON [dropdown 2] TO User1", "controls": [{"id": "d1", "options": ["ALTER", "CONNECT", "EXECUTE"], "correct": "ALTER"}, {"id": "d2", "options": ["DATABASE::schemaA", "OBJECT::schemaA", "SCHEMA::schemaA"], "correct": "SCHEMA::schemaA"}]}, "exh": ""}, {"n": 32, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains two lakehouses. You are building a dataflow that will combine data from the lakehouses. The applied steps from one of the queries in the dataflow is shown in the following exhibit. Use the drop-down menus to select the answer choice that completes each statement based on the information presented in the graphic. NOTE: Each correct selection is worth one point.<\/p>\n<p>Query settings — Name: Customers1, Entity type: Custom. Applied steps: Source, Navigation 1, Capitalized each word, Appended query, Changed column type, Added custom, Filtered rows.<\/p>\n<p>Answer Area<\/p><ul><li> [Answer choice] of the transformation steps in the query will fold. — All / None / Some<\/li><li>The Added custom step will be performed in [Answer choice]. — each lakehouse&#x27;s query engine / the Microsoft Power Query engine / the source lakehouse query engine<\/li><\/ul>", "key": null, "key_source": null, "key_note": null, "statement_answers": null, "explanation_html": "<p>1.Some of the transformation steps in the query will fold.&quot;<\/p>\n<p>Query folding refers to the ability of Power Query to push transformations back to the data source rather than processing them in Power Query itself.<\/p>\n<p>The answer &quot;Some&quot;.<\/p>\n<p>Some transformations are foldable (executed at the source).<\/p>\n<p>Some transformations are not foldable and will be executed locally in Power Query.<\/p>\n<p>This is common because basic transformations (filtering, joins, aggregations, etc.) often fold, but more complex operations (custom columns, advanced functions, etc.) may not.<\/p>\n<p>2. The Added custom step will be performed in the Microsoft Power Query engine.<\/p>\n<p>When a transformation cannot be folded, it is processed in the Power Query engine instead of being pushed to the source.<\/p>\n<p>Since the question mentions an added custom step, it likely includes:<\/p>\n<p>Custom calculations<\/p>\n<p>Complex transformations (like M code or certain joins)<\/p>\n<p>Operations that cannot be executed at the data source<\/p>\n<p>Such transformations are executed locally within Power Query rather than at the source (lakehouse query engine).<\/p>", "options": [], "answer_area": {"kind": "dropdowns", "controls": [{"id": "d1", "before": "", "after": " of the transformation steps in the query will fold.", "options": ["All", "None", "Some"], "correct": "Some"}, {"id": "d2", "before": "The Added custom step will be performed in", "after": ".", "options": ["each lakehouse's query engine", "the Microsoft Power Query engine", "the source lakehouse query engine"], "correct": "the Microsoft Power Query engine"}]}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Power Query “Query settings” pane<\/div><ul class=\"exh-ul\"><li><b>Name:<\/b> Customers1 &nbsp;·&nbsp; <b>Entity type:<\/b> Custom<\/li><li><b>Applied steps<\/b> (in order): Source → Navigation 1 → Capitalized each word → Appended query → Changed column type → Added custom → <b>Filtered rows<\/b> (selected step)<\/li><li>Right-click menu on “Filtered rows”: Edit settings · Rename · Delete · Delete until end · Insert step after · Move before · Move after (greyed out) · Extract previous… · View data source query (greyed out) · View query plan (greyed out) · Properties<\/li><\/ul><\/div>"}, {"n": 33, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a semantic model. You need to modify object-level security (OLS) for the model. What should you use?<\/p>", "key": ["D"], "key_source": "verified", "key_note": null, "statement_answers": null, "explanation_html": "<p>Object-level security is authored in Tabular Editor, which edits the model metadata directly. Power BI Desktop and the Fabric service do not expose OLS authoring, and ALM Toolkit is used for comparing and deploying models.<\/p>", "options": [{"letter": "A", "text": "the Fabric service"}, {"letter": "B", "text": "Microsoft Power BI Desktop"}, {"letter": "C", "text": "ALM Toolkit"}, {"letter": "D", "text": "Tabular Editor"}], "exh": ""}, {"n": 34, "kind": "dragdrop", "kind_label": "Drag & drop", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric workspace named Workspace1. You have three groups named Group1, Group2, and Group3. You need to assign a workspace role to each group. The solution must follow the principle of least privilege and meet the following requirements: - Group1 must be able to write data to Workspace1, but be unable to add members to Workspace1. - Group2 must be able to configure and maintain the settings of Workspace1. - Group3 must be able to write data and add members to Workspace1, but be unable to delete Workspace1. Which workspace role should you assign to each group? To answer, drag the appropriate roles to the correct groups. Each role may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p><p>Roles: Admin / Contributor / Member / Viewer<\/p><ul><li>Group1: [drop target]<\/li><li>Group2: [drop target]<\/li><li>Group3: [drop target]<\/li><\/ul>", "key": null, "key_source": null, "key_note": null, "statement_answers": null, "explanation_html": "<p>Contributor can write data but cannot add members. Admin can configure and maintain workspace settings. Member can write data and add members but cannot delete the workspace; only an Admin can delete it.<\/p>", "options": [], "answer_area": {"kind": "dragdrop", "values": ["Admin", "Contributor", "Member", "Viewer"], "controls": [{"id": "t1", "label": "Group1:", "correct": "Contributor"}, {"id": "t2", "label": "Group2:", "correct": "Admin"}, {"id": "t3", "label": "Group3:", "correct": "Member"}]}, "exh": ""}, {"n": 35, "kind": "multi", "kind_label": "Multi-select", "case": null, "case_ref": null, "stem_html": "<p>You have source data in a folder on a local computer. You need to create a solution that will use Fabric to populate a data store. The solution must meet the following requirements: - Support the use of dataflows to load and append data to the data store. - Ensure that Delta tables are V-Order optimized and compacted automatically. Which two types of data stores should you use? Each correct answer presents a complete solution. NOTE: Each correct selection is worth one point.<\/p>", "key": ["A"], "key_source": "matched", "key_note": null, "statement_answers": null, "explanation_html": "<p>The Lakehouse and the Delta Lake table format are central to Microsoft Fabric, assuring that tables are optimized for analytics is a key requirement.<\/p>\n<p>To meet the requirements of supporting dataflows to load and append data to the data store while ensuring that Delta tables are V-Order optimized and compacted automatically, you should use a lakehouse in Fabric as your solution.<\/p>", "options": [{"letter": "A", "text": "a lakehouse"}, {"letter": "B", "text": "an Azure SQL database"}, {"letter": "C", "text": "a warehouse"}, {"letter": "D", "text": "a KQL database"}], "exh": ""}, {"n": 36, "kind": "multi", "kind_label": "Multi-select", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a lakehouse. You plan to query sales data files by using the SQL endpoint. The files will be in an Amazon Simple Storage Service (Amazon S3) storage bucket. You need to recommend which file format to use and where to create a shortcut. Which two actions should you include in the recommendation? Each correct answer presents part of the solution. NOTE: Each correct answer is worth one point.<\/p>", "key": ["D", "E"], "key_source": "matched", "key_note": null, "statement_answers": null, "explanation_html": "<p>D. Create Shortcut in Tables Section.<\/p>\n<p>The SQL endpoint:<\/p>\n<p>Can only query objects inside the Tables area of a lakehouse<\/p>\n<p>Cannot directly query items in the Files section<\/p>\n<p>Therefore:<\/p>\n<p>The S3 shortcut must point to Delta files<\/p>\n<p>The shortcut must be created under Tables<\/p>\n<p>This registers the data as a table accessible via SQL.<\/p>\n<p>E.Delta Format .<\/p>\n<p>The SQL endpoint in Fabric only supports querying tables, not raw files.<\/p>\n<p>Delta format:<\/p>\n<p>Is the native table format in Fabric<\/p>\n<p>Is fully supported by the SQL endpoint<\/p>\n<p>Supports ACID transactions<\/p>\n<p>Supports schema enforcement<\/p>\n<p>Enables better performance.<\/p>", "options": [{"letter": "A", "text": "Create a shortcut in the Files section."}, {"letter": "B", "text": "Use the Parquet format"}, {"letter": "C", "text": "Use the CSV format."}, {"letter": "D", "text": "Create a shortcut in the Tables section."}, {"letter": "E", "text": "Use the delta format."}], "exh": ""}, {"n": 37, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a lakehouse. You are using a Fabric notebook to save a large DataFrame by using the following code. df.write.partitionBy(“year”, “month”, “day”).mode(“overwrite”).parquet(“Files/ SalesOrder”) For each of the following statements, select Yes if the statement is true. Otherwise, select No. NOTE: Each correct selection is worth one point. Hot Area:<\/p>\n<p>Answer Area<\/p><ul><li>The results will form a hierarchy of folders for each partition key. — Yes / No<\/li><li>The resulting file partitions can be read in parallel across multiple nodes. — Yes / No<\/li><li>The resulting file partitions will use file compression. — Yes / No<\/li><\/ul>", "key": null, "key_source": null, "key_note": null, "statement_answers": null, "explanation_html": "<p>partitionBy creates a folder hierarchy with one folder per partition key value (year, then month, then day). The partitions are separate files, so they can be read in parallel across nodes. Parquet files are compressed by default, so the partitions use file compression.<\/p>", "options": [], "answer_area": {"kind": "statements", "controls": [{"id": "s1", "text": "The results will form a hierarchy of folders for each partition key.", "correct": "Yes"}, {"id": "s2", "text": "The resulting file partitions can be read in parallel across multiple nodes.", "correct": "Yes"}, {"id": "s3", "text": "The resulting file partitions will use file compression.", "correct": "Yes"}]}, "exh": ""}, {"n": 38, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a lakehouse named Lakehouse1. Lakehouse1 contains a table named Table1. You are creating a new data pipeline. You plan to copy external data to Table1. The schema of the external data changes regularly. You need the copy operation to meet the following requirements: - Replace Table1 with the schema of the external data. - Replace all the data in Table1 with the rows in the external data. You add a Copy data activity to the pipeline. What should you do for the Copy data activity?<\/p>", "key": ["B"], "key_source": "matched", "key_note": null, "statement_answers": null, "explanation_html": "<p>B. From the Destination tab, set Table action to Overwrite.<\/p>\n<p>You need the copy operation to:<\/p>\n<p>Replace Table1 with the schema of the external data<\/p>\n<p>Replace all data in Table1 with the external data<\/p>\n<p>The best way to achieve this is by setting Table action to &quot;Overwrite&quot; in the Destination tab of the Copy Data activity.<\/p>\n<p>&quot;Overwrite&quot; ensures that the table is completely replaced, including the schema and data, which meets both requirements.<\/p>\n<p>This means that every time the pipeline runs, Table1 will have the latest schema and data from the external source.<\/p>", "options": [{"letter": "A", "text": "From the Source tab, add additional columns."}, {"letter": "B", "text": "From the Destination tab, set Table action to Overwrite."}, {"letter": "C", "text": "From the Settings tab, select Enable staging."}, {"letter": "D", "text": "From the Source tab, select Enable partition discovery."}, {"letter": "E", "text": "From the Source tab, select Recursively."}], "exh": ""}, {"n": 39, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains JSON files in OneLake. The files have one billion items. You plan to perform time series analysis of the items. You need to transform the data, visualize the data to find insights, perform anomaly detection, and share the insights with other business users. The solution must meet the following requirements: - Use parallel processing. - Minimize the duplication of data. - Minimize how long it takes to load the data. What should you use to transform and visualize the data?<\/p>", "key": ["A"], "key_source": "verified", "key_note": null, "statement_answers": null, "explanation_html": "<p>With one billion items the data must be processed in a distributed way. The PySpark library runs on the Spark engine across the cluster, while pandas runs in memory on a single node and cannot handle that volume. A report visualizes results; it does not transform the data.<\/p>", "options": [{"letter": "A", "text": "the PySpark library in a Fabric notebook"}, {"letter": "B", "text": "the pandas library in a Fabric notebook"}, {"letter": "C", "text": "a Microsoft Power BI report that uses core visuals"}], "exh": ""}, {"n": 40, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains lakehouse named Lakehouse1. Lakehouse1 contains a Delta table with eight columns. You receive new data that contains the same eight columns and two additional columns. You create a Spark DataFrame and assign the DataFrame to a variable named df. The DataFrame contains the new data. You need to add the new data to the Delta table to meet the following requirements: - Keep all the existing rows. - Ensure that all the new data is added to the table. How should you complete the code? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p><pre><code>df.write.format(&quot;delta&quot;).mode(&quot;[dropdown 1]&quot;).option(&quot;[dropdown 2]&quot;).saveAsTable(&quot;table&quot;)<\/code><\/pre><ul><li>Dropdown 1: (&quot;append&quot;) / (&quot;error&quot;) / (&quot;errorIfExists&quot;) / (&quot;ignore&quot;) / (&quot;overwrite&quot;)<\/li><li>Dropdown 2: (&quot;mergeSchema&quot;,&quot;false&quot;) / (&quot;mergeSchema&quot;,&quot;true&quot;) / (&quot;overwriteSchema&quot;,&quot;false&quot;) / (&quot;overwriteSchema&quot;,&quot;true&quot;)<\/li><\/ul>", "key": null, "key_source": null, "key_note": null, "statement_answers": null, "explanation_html": "<p>The new data has the same eight columns and must be added to the existing rows, so the write mode is append. No schema change is needed, so overwriteSchema stays false.<\/p>", "options": [], "answer_area": {"kind": "dropdowns", "code": "df.write.format(\"delta\").mode(\"[dropdown 1]\").option(\"[dropdown 2]\").saveAsTable(\"table\")", "controls": [{"id": "d1", "options": ["(\"append\")", "(\"error\")", "(\"errorIfExists\")", "(\"ignore\")", "(\"overwrite\")"], "correct": "(\"append\")"}, {"id": "d2", "options": ["(\"mergeSchema\",\"false\")", "(\"mergeSchema\",\"true\")", "(\"overwriteSchema\",\"false\")", "(\"overwriteSchema\",\"true\")"], "correct": "(\"overwriteSchema\",\"false\")"}]}, "exh": ""}, {"n": 41, "kind": "hotspot", "kind_label": "Hotspot", "case": "Litware", "case_ref": 27, "stem_html": "<p>You need to assign permissions for the data store in the AnalyticsPOC workspace. The solution must meet the security requirements. Which additional permissions should you assign when you share the data store? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p><ul><li>DataEngineers: Build Reports on the default dataset / Read All Apache Spark / Read All SQL analytics endpoint data<\/li><li>DataAnalysts: Build Reports on the default dataset / Read All Apache Spark / Read All SQL analytics endpoint data<\/li><li>DataScientists: Build Reports on the default dataset / Read All Apache Spark / Read All SQL analytics endpoint data<\/li><\/ul>", "key": null, "key_source": null, "key_note": null, "statement_answers": null, "explanation_html": "<p>Data Engineers: Read all Apache Spark - because they need to be able to work with Spark for Data curation.<\/p>\n<p>Data Analysts: Build Reports on the default dataset - because they are report builders<\/p>\n<p>Data Scientists: Read All SQL analytics Endpoints data_ They leverage curated data (by engineers) to do predictive analytics.<\/p>", "options": [], "answer_area": {"kind": "dropdowns", "controls": [{"id": "d1", "label": "DataEngineers:", "options": ["Build Reports on the default dataset", "Read All Apache Spark", "Read All SQL analytics endpoint data"], "correct": "Read All Apache Spark"}, {"id": "d2", "label": "DataAnalysts:", "options": ["Build Reports on the default dataset", "Read All Apache Spark", "Read All SQL analytics endpoint data"], "correct": "Build Reports on the default dataset"}, {"id": "d3", "label": "DataScientists:", "options": ["Build Reports on the default dataset", "Read All Apache Spark", "Read All SQL analytics endpoint data"], "correct": "Read All SQL analytics endpoint data"}]}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Litware data sources<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Description<\/th><th>Original source<\/th><th>Total size<\/th><\/tr><\/thead><tbody><tr><td>Customer data<\/td><td>Customer relationship management (CRM) system<\/td><td>50 MB<\/td><\/tr><tr><td>Product data<\/td><td>Customer relationship management (CRM) system<\/td><td>200 MB<\/td><\/tr><tr><td>Customer satisfaction surveys<\/td><td>SurveyMonkey<\/td><td>500 GB<\/td><\/tr><\/tbody><\/table><\/div><\/div><div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Product table<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Name<\/th><th>Data type<\/th><\/tr><\/thead><tbody><tr><td>ProductID<\/td><td>Integer<\/td><\/tr><tr><td>ProductName<\/td><td>String<\/td><\/tr><tr><td>ProductCategory<\/td><td>String<\/td><\/tr><tr><td>ListPrice<\/td><td>Decimal<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 42, "kind": "single", "kind_label": "Single choice", "case": "Contoso", "case_ref": 28, "stem_html": "<p>Which syntax should you use in a notebook to access the Research division data for Productline1?<\/p>", "key": ["A"], "key_source": "verified", "key_note": null, "statement_answers": null, "explanation_html": "<p>The shortcut ResearchProduct sits in the Tables section of the lakehouse as a Delta table, so it is read with spark.read.format(\"delta\").load(\"Tables/ResearchProduct\"). The path Tables/productline1/ResearchProduct does not exist, and the Lakehouse1.productline1 schema used in the Spark SQL option does not exist either.<\/p>", "options": [{"letter": "A", "text": "spark.read.format(“delta”).load(“Tables/ResearchProduct”)"}, {"letter": "B", "text": "spark.read.format(“delta”).load(“Files/ResearchProduct”)"}, {"letter": "C", "text": "spark.sql(“SELECT * FROM Lakehouse1.productline1.ResearchProduct”)"}, {"letter": "D", "text": "spark.read.format(“delta”).load(“Tables/productline1/ResearchProduct”)"}], "exh": ""}, {"n": 43, "kind": "multi", "kind_label": "Multi-select", "case": "Litware", "case_ref": 27, "stem_html": "<p>You need to implement the date dimension in the data store. The solution must meet the technical requirements. What are two ways to achieve the goal? Each correct answer presents a complete solution. NOTE: Each correct selection is worth one point.<\/p>", "key": ["A", "D"], "key_source": "matched", "key_note": null, "statement_answers": null, "explanation_html": "<p>A. Populate the date dimension table by using a dataflow.<\/p>\n<p>Dataflows in Microsoft Fabric (or Power BI) allow ETL (Extract, Transform, Load) operations to create and populate tables.<\/p>\n<p>They can be used to generate and maintain a date dimension with calculated columns such as year, quarter, month, and week.<\/p>\n<p>D. Populate the date dimension table by using a Stored procedure activity in a pipeline.<\/p>\n<p>Stored procedures allow for predefined logic and transformations to be applied while inserting or updating records in the date dimension table.<\/p>\n<p>Using a Stored Procedure activity in an Azure Data Factory (ADF) or Microsoft Fabric pipeline is a common way to populate and maintain a date dimension.<\/p>", "options": [{"letter": "A", "text": "Populate the date dimension table by using a dataflow."}, {"letter": "B", "text": "Populate the date dimension table by using a Copy activity in a pipeline."}, {"letter": "C", "text": "Populate the date dimension view by using T-SQ"}, {"letter": "D", "text": "Populate the date dimension table by using a Stored procedure activity in a pipeline."}], "exh": ""}, {"n": 44, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a workspace named Workspace1. Workspace1 contains a warehouse named DW1. DW1 contains two tables named Employees and Sales. All users have read access to Dw1. You need to implement access controls to meet the following requirements: - For the Sales table, ensure that the users can see only the sales data from their respective region. - For the Employees table, restrict access to all Personally Identifiable Information (PII). - Maintain access to unrestricted data for all the users. What should you use for each table? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p><ul><li>Employees: Column-level security / Item permissions / Row-level security (RLS) / Workspace permissions<\/li><li>Sales: Column-level security / Item permissions / Row-level security (RLS) / Workspace permissions<\/li><\/ul>", "key": null, "key_source": null, "key_note": null, "statement_answers": null, "explanation_html": "<p>Restricting PII columns is column-level security, applied to the Employees table. Limiting rows by region is row-level security, applied to the Sales table.<\/p>", "options": [], "answer_area": {"kind": "dropdowns", "controls": [{"id": "d1", "label": "Employees:", "options": ["Column-level security", "Item permissions", "Row-level security (RLS)", "Workspace permissions"], "correct": "Column-level security"}, {"id": "d2", "label": "Sales:", "options": ["Column-level security", "Item permissions", "Row-level security (RLS)", "Workspace permissions"], "correct": "Row-level security (RLS)"}]}, "exh": ""}, {"n": 45, "kind": "multi", "kind_label": "Multi-select", "case": "Contoso", "case_ref": 28, "stem_html": "<p>Your company has a finance department. You have a Fabric tenant, an Azure Storage account named storage1, and a Microsoft Entra group named Group1. Group1 contains the users in the finance department. You need to create a new workspace named Workspace1 in the tenant. The solution must meet the following requirements: - Ensure that the finance department users can create and edit items in Workspace1. - Ensure that Workspace1 can securely access storage1 to read and write data. - Ensure that you are the only admin of Workspace1. - Minimize administrative effort. You create Workspace1. Which two actions should you perform next? Each correct answer presents part of the solution. NOTE: Each correct selection is worth one point.<\/p>", "key": ["A", "B"], "key_source": "verified", "key_note": null, "statement_answers": null, "explanation_html": "<p>Assigning the Contributor role to Group1 gives every finance user create and edit rights in one step, which minimizes administrative effort. A workspace identity lets the workspace itself securely access storage1 to read and write data. You are already the workspace admin as its creator, and assigning the role to each user individually would be extra effort.<\/p>", "options": [{"letter": "A", "text": "Assign the Contributor role to Group1."}, {"letter": "B", "text": "Create a workspace identity."}, {"letter": "C", "text": "Assign the Admin role to yourself."}, {"letter": "D", "text": "Assign the Contributor role to each finance department user."}], "exh": ""}, {"n": 46, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant. You need to configure OneLake security for users shown in the following table. The solution must follow the principle of least privilege. Which permission should you assign to each user? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>\n<p>Answer Area<\/p><ul><li>User1: Read / ReadAll / ReadData<\/li><li>User2: Read / ReadAll / ReadData<\/li><\/ul>", "key": null, "key_source": null, "key_note": null, "statement_answers": null, "explanation_html": "<p>Reading data through Spark and the OneLake APIs needs the ReadAll permission, so User1 gets ReadAll. Reading data through the SQL endpoint needs the ReadData permission, so User2 gets ReadData.<\/p>", "options": [], "answer_area": {"kind": "dropdowns", "controls": [{"id": "d1", "label": "User1:", "options": ["Read", "ReadAll", "ReadData"], "correct": "ReadAll"}, {"id": "d2", "label": "User2:", "options": ["Read", "ReadAll", "ReadData"], "correct": "ReadData"}]}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Required access<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Name<\/th><th>Required access<\/th><\/tr><\/thead><tbody><tr><td>User1<\/td><td>Read all the Spark data.<\/td><\/tr><tr><td>User2<\/td><td>Read all the SQL endpoint data.<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 47, "kind": "hotspot", "kind_label": "Hotspot", "case": "Litware", "case_ref": 27, "stem_html": "<p>You have a Fabric tenant that contains a workspace named Enterprise. Enterprise contains a semantic model named Model1. Model1 contains a date parameter named Date1 that was created in Power Query. You build a deployment pipeline named Enterprise Data that includes two stages named Development and Test. You assign the Enterprise workspace to the Development stage. You need to perform the following actions: - Create a workspace named Enterprise [Test] and assign the workspace to the Test stage. - Configure a rule that will modify the value of Date1 when changes are deployed to the Test stage. Which two settings should you use? To answer, select the appropriate settings in the answer area. NOTE: Each correct answer is worth one point.<\/p>", "key": null, "key_source": null, "key_note": null, "statement_answers": null, "explanation_html": "<p>The Test stage has no workspace yet, so you assign one using the \"Deploy to this stage or Assign a workspace\" area. Deployment rules such as changing the Date1 parameter are configured in the Test stage settings, using the pencil icon on the Test stage.<\/p>", "options": [], "answer_area": {"kind": "image_zones", "controls": [{"id": "z1", "label": "Test stage settings", "correct": true}, {"id": "z2", "label": "Deploy to this stage or Assign a workspace", "correct": true}, {"id": "z3", "label": "Deployment history", "correct": false}, {"id": "z4", "label": "Manage Access", "correct": false}, {"id": "z5", "label": "Settings", "correct": false}, {"id": "z6", "label": "Development stage", "correct": false}, {"id": "z7", "label": "Enterprise workspace", "correct": false}]}, "exh": ""}, {"n": 48, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a data pipeline. You need to ensure that the pipeline runs every four hours on Mondays and Fridays. To what should you set Repeat for the schedule?<\/p>", "key": ["C"], "key_source": "matched", "key_note": null, "statement_answers": null, "explanation_html": "<p>Answer C : Weekly.<\/p>\n<p>The only way to do this is to set the schedule to &#x27;&#x27;Weekly&#x27;&#x27;, set the days on Monday and Friday and add manually 6 Time of 4 hour intervals.<\/p>\n<p>You need the pipeline to run every four hours on Mondays and Fridays.<\/p>\n<p>Weekly scheduling allows you to specify particular days of the week (e.g., Monday and Friday).<\/p>\n<p>W
