tains a semantic model. The model contains 15 tables. You need to programmatically change each column that ends in the word Key to meet the following requirements: * Hide the column. * Set Nullable to False. * Set Summarize By to None * Set Available in MDX to False. * Mark the column as a key column. What should you use?<\/p>", "options": [{"letter": "A", "text": "Microsoft Power BI Desktop"}, {"letter": "B", "text": "Tabular Editor"}, {"letter": "C", "text": "ALM Toolkit"}, {"letter": "D", "text": "DAX Studio"}], "key": ["B"], "key_source": "answer", "key_note": null, "statement_answers": null, "explanation_html": "<p>Tabular Editor is an advanced tool for editing Tabular models outside of Power BI Desktop that allows you to script out changes and apply them across multiple columns or tables. To accomplish the task programmatically, you would: * Open the model in Tabular Editor. * Create an Advanced Script using C# to iterate over all tables and their respective columns. * Within the script, check if the column name ends with ’Key’. * For columns that meet the condition, set the properties accordingly: IsHidden = true, IsNullable = false, SummarizeBy = None, IsAvailableInMDX = false. * Additionally, mark the column as a key column. * Save the changes and deploy them back to the Fabric tenant.<\/p>", "answer_area": null, "exh": ""}, {"n": 24, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have an Azure SQL database named DB1 and a Fabric workspace named Workspace1. Workspace1 contains a lakehouse named LH1 and a Dataflow Gen2 named Dataflow1. Dataflow1 includes a query named Query1 that loads data from DB1. applies transformations to the data, and then filters the data. You discover that Query1 loads all the data before applying the transformations. You need to ensure that Query1 uses query folding. What should you do?<\/p>", "options": [{"letter": "A", "text": "Remove unused columns from Query1."}, {"letter": "B", "text": "Enable incremental refresh for Query1."}, {"letter": "C", "text": "Move the filter steps before the transformation steps in Query1."}, {"letter": "D", "text": "Replace DB1 with a Microsoft SQL Server database."}], "key": ["C"], "key_source": "answer", "key_note": null, "statement_answers": null, "explanation_html": "<p>Query folding pushes the filter to the database so only the filtered rows are loaded. The filter steps must come before the transformation steps that break folding; as written, Query1 loads all the data first and then filters it. Removing unused columns and enabling incremental refresh do not restore folding, and replacing the database does not change the query.<\/p>", "answer_area": null, "exh": ""}, {"n": 25, "kind": "dragdrop", "kind_label": "Drag & drop", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a data warehouse named DW1. DW1 contains a table named DimCustomer. DimCustomer contains the fields shown in the following table.<\/p><p>You need to identify duplicate email addresses in DimCustomer. The solution must return a maximum of 1,000 records. Which four T-SQL statements should you run in sequence? To answer, move the appropriate statements from the list of statements to the answer area and arrange them in the correct order.<\/p>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>A query that finds duplicate CustomerAltKey values reads SELECT CustomerAltKey, COUNT(*) FROM DimCustomer, groups the rows with GROUP BY CustomerAltKey, and keeps only the groups with more than one row with HAVING COUNT(*) > 1.<\/p>", "answer_area": {"kind": "dragdrop", "values": ["LIMIT 1000", "SELECT TOP(1000) CustomerAltKey, COUNT(*)", "WHERE COUNT(*) > 1", "SELECT CustomerAltKey, COUNT(*)", "FROM DimCustomer", "GROUP BY CustomerAltKey", "HAVING COUNT(*) > 1"], "controls": [{"id": "t1", "label": "Step 1", "correct": "SELECT CustomerAltKey, COUNT(*)"}, {"id": "t2", "label": "Step 2", "correct": "FROM DimCustomer"}, {"id": "t3", "label": "Step 3", "correct": "GROUP BY CustomerAltKey"}, {"id": "t4", "label": "Step 4", "correct": "HAVING COUNT(*) > 1"}]}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): DimCustomer (sample rows)<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>ID<\/th><th>CustomerKey<\/th><th>CustomerAltKey<\/th><th>Title<\/th><th>FirstName<\/th><th>LastName<\/th><th>AddressLine1<\/th><th>City<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>29546<\/td><td>christopher1@contoso.com<\/td><td>Mr.<\/td><td>Christopher<\/td><td>Beck<\/td><td>93-2501, Blackfriars Road<\/td><td>London<\/td><\/tr><tr><td>2<\/td><td>29587<\/td><td>john12@contoso.com<\/td><td>Mr.<\/td><td>John<\/td><td>Brooks<\/td><td>99-3 Forest Works<\/td><td>London<\/td><\/tr><tr><td>3<\/td><td>29612<\/td><td>richard2@contoso.com<\/td><td>Mr.<\/td><td>Richard<\/td><td>Byham<\/td><td>Knaves Beech Ind<\/td><td>High Wycombe<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 26, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Microsoft Power BI Premium Per User (PPU) workspace that contains a semantic model. You have an Azure App Service app named App1 that modifies row-level security (RLS) for the model by using the XMLA endpoint. App1 requires users to sign in by using their Microsoft Entra credentials to access the XMLA endpoint. You need to configure App1 to use a service account to access the model. What should you do first?<\/p>", "options": [{"letter": "A", "text": "Add a managed identity to the workspace."}, {"letter": "B", "text": "Add a managed identity to App1."}, {"letter": "C", "text": "Upgrade the workspace to Premium capacity."}, {"letter": "D", "text": "Modify the XMLA Endpoint setting."}], "key": ["B"], "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>Power BI Premium Per User (PPU) already supports XMLA read/write . You don’t need to upgrade to Premium capacity. The workspace itself does not get a managed identity; rather, App1 (Azure App Service) can be configured with a managed identity . Once App1 has a managed identity, you grant it access to the Power BI model in the workspace via XMLA endpoint. Modifying the XMLA endpoint setting is not sufficient; authentication must come from the service (App1). Correct answer: B . Reference: Service principals and managed identities for Power BI XMLA<\/p><p>Valid DP-600 shared by .com for Helping Passing DP-600 Exam! .com now offer the newest DP-600 exam , the .com DP-600 exam questions have been updated and answers have been corrected get the newest .com DP-600 with Test Engine here: (212 Q&amp;As , 30%OFF Special Discount: )<\/p>", "answer_area": null, "exh": ""}, {"n": 27, "kind": "multi", "kind_label": "Multi-select", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric workspace named Workspace1 that contains a lakehouse named Lakehouse1 and a user named User1. You need to ensure that User1 can read all the data in Lakehouse1. The solution must follow the principle of least privilege. Which two actions should you perform? Each correct answer presents part of the solution. NOTE: Each correct selection is worth one point.<\/p><p>B. Select Read all Apache Spark<\/p>", "options": [{"letter": "A", "text": "Share Lakehouse1 by using item permissions."}, {"letter": "B", "text": "Select Read all Apache Spark"}, {"letter": "C", "text": "Assign the Contributor role to User1."}, {"letter": "D", "text": "Assign the Viewer role to User1."}, {"letter": "E", "text": "Assign the Member role to User1."}], "key": ["A", "B"], "key_source": "answer", "key_note": null, "statement_answers": null, "explanation_html": "<p>Sharing the lakehouse with item permissions and selecting \"Read all Apache Spark\" gives User1 read access to all the data in the lakehouse. The Viewer role alone does not grant data read access in a lakehouse, and Contributor and Member grant more than the least privilege requires.<\/p>", "answer_area": null, "exh": ""}, {"n": 28, "kind": "dragdrop", "kind_label": "Drag & drop", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a workspace named Workspace1 Workspace1 uses the Pro license mode and contains a semantic model named Model1. You have an Azure DevOps organization. You need to enable version control for Workspace1. The solution must ensure that Model 1 is added to the repository. Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.<\/p>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>A workspace must be assigned to a Fabric capacity before it can be connected to Git, and it must be connected to the Git provider before it can be synchronised with the repository.<\/p>", "answer_area": {"kind": "dragdrop", "values": ["Create a deployment pipeline.", "Configure branch policies in Azure DevOps.", "Assign Workspace1 to a Fabric capacity.", "Connect Workspace1 to a Git provider.", "Sync Workspace1 with the repository."], "controls": [{"id": "t1", "label": "Step 1", "correct": "Assign Workspace1 to a Fabric capacity."}, {"id": "t2", "label": "Step 2", "correct": "Connect Workspace1 to a Git provider."}, {"id": "t3", "label": "Step 3", "correct": "Sync Workspace1 with the repository."}]}, "exh": ""}, {"n": 29, "kind": "dragdrop", "kind_label": "Drag & drop", "case": null, "case_ref": null, "stem_html": "<p>You create a semantic model by using Microsoft Power BI Desktop. The model contains one security role named SalesRegionManager and the following tables: * Sales * SalesRegion * Sales Ad dress You need to modify the model to ensure that users assigned the SalesRegionManager role cannot see a column named Address in Sales Address. Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.<\/p>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>Object Level Security cannot be set in Power BI Desktop; it is set in Tabular Editor. Open the model in Tabular Editor, select the Address column in SalesAddress, and set Object Level Security to None for the SalesRegionManager role.<\/p>", "answer_area": {"kind": "dragdrop", "values": ["Open the model in Power BI Desktop.", "Set Object Level Security to Default for SalesRegionManager.", "Set the Hidden property to True.", "Open the model in Tabular Editor.", "Select the Address column in SalesAddress.", "Set Object Level Security to None for SalesRegionManager."], "controls": [{"id": "t1", "label": "Step 1", "correct": "Open the model in Tabular Editor."}, {"id": "t2", "label": "Step 2", "correct": "Select the Address column in SalesAddress."}, {"id": "t3", "label": "Step 3", "correct": "Set Object Level Security to None for SalesRegionManager."}]}, "exh": ""}, {"n": 30, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a warehouse named DW1 and a lakehouse named LH1. DW1 contains a table named Sales.Product. LH1 contains a table named Sales.Orders. You plan to schedule an automated process that will create a new point-in-time (PIT) table named Sales. ProductOrder in DW1. Sales.ProductOrder will be built by using the results of a query that will join Sales. Product and Sales.Orders. You need to ensure that the types of columns in Sales. ProductOrder match the column types in the source tables. The solution must minimize the number of operations required to create the new table. Which operation should you use?<\/p>", "options": [{"letter": "A", "text": "CREATE TABLE AS SELECT (CTAS)"}, {"letter": "B", "text": "INSERT INTO"}, {"letter": "C", "text": "CREATE MATERIALIZED VIEW AS SELECT"}, {"letter": "D", "text": "CREATE TABLE AS CLONE OF"}], "key": ["A"], "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>CTAS creates a new table from the results of a query, automatically inheriting the column types of the origin tables. It is the simplest and most efficient way to create a point-in-time (PIT) table. INSERT INTO requires a table to already exist. CREATE MATERIALIZED VIEW keeps results up to date but is heavier and not required for PIT. CLONE creates a shallow copy of an existing table, but we are joining two tables, so clone is not applicable. Correct: A. Reference: CTAS in Fabric data warehouse<\/p>", "answer_area": null, "exh": ""}, {"n": 31, "kind": "dragdrop", "kind_label": "Drag & drop", "case": null, "case_ref": null, "stem_html": "<p>You have Fabric tenant that contains four workspaces named Development, Test, QA, and Production. All the workspaces are in Premium Per User (PPU) license mode. You plan to use a release pipeline to support the development lifecycle from Development to Production. Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.<\/p>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>A deployment pipeline must exist before its stages can be created, and the stages must exist before workspaces can be assigned to them. The pipeline is created first, then the QA stage, then the workspaces are assigned.<\/p>", "answer_area": {"kind": "dragdrop", "values": ["Move each workspace to Pro license mode.", "Create the QA stage.", "Create a deployment pipeline.", "Assign workspaces.", "Create a deployment rule."], "controls": [{"id": "t1", "label": "Step 1", "correct": "Create a deployment pipeline."}, {"id": "t2", "label": "Step 2", "correct": "Create the QA stage."}, {"id": "t3", "label": "Step 3", "correct": "Assign workspaces."}]}, "exh": ""}, {"n": 32, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a Microsoft Power BI semantic model that is used by your company ’s finance and sales departments for monthly reporting. The semantic model contains two explicit measures named sales Amount and Orders and a measure named KPI Title that returns text for dynamic visual titles. You need to implement a calculation group named Time Intelligence that contains a column named Time Calculation. The solution must meet the following requirements * Apply time-intelligence patterns to both explicit measures by using SELECTEDMEASURE(). * Format only the yoy% calculation item as a percentage. What should you configure ’ To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point<\/p>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>The year-to-date pattern is CALCULATE with SELECTEDMEASURE and DATESYTD over the Date table. The percentage format belongs on the calculation item as a dynamic format string, so it applies to the YOY% item without changing the measure itself; wrapping the expression in FORMAT would return text, and a static format string cannot be set per calculation item.<\/p>", "answer_area": {"kind": "dropdowns", "controls": [{"id": "d1", "label": "Measure expression pattern for Time Intelligence:", "options": ["CALCULATE(SELECTEDMEASURE(), DATESYTD('Date'[Date]))", "FORMAT(SELECTEDMEASURE(), \"General Number\")", "SUMX(VALUES('Date'[Date]), SELECTEDMEASURE())"], "correct": "CALCULATE(SELECTEDMEASURE(), DATESYTD('Date'[Date]))"}, {"id": "d2", "label": "To format the YOY% calculation item:", "options": ["Wrap the YOY% expression with FORMAT.", "Set the static format string of the measure to #,##0.00%.", "Set the dynamic format string of the calculation item to #,##0.00%."], "correct": "Set the dynamic format string of the calculation item to #,##0.00%."}]}, "exh": ""}, {"n": 33, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains a workspace named Workspace_DEV. Workspace_DEV contains the semantic models shown in the following table.<\/p><p>Workspace_DEV contains the dataflows shown in the following table.<\/p>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>DF1 is a Dataflow Gen1 with a configured scheduled refresh policy, so it is deployed to the Test workspace. Data is never deployed by a deployment pipeline, and a scheduled refresh policy is not deployed either.<\/p><p><b>Note:<\/b> the Dumps tab holds a variant of this question with a different answer key (DF1 not deployed; Model1 data and refresh policy deployed). Deployment pipelines copy item definitions, not data or scheduled-refresh settings, so the key shown here follows that behaviour; verify against the current Microsoft Learn deployment-pipeline docs before relying on either.<\/p>", "answer_area": {"kind": "statements", "controls": [{"id": "s1", "text": "DF1 will be deployed to Workspace_TEST.", "correct": "Yes"}, {"id": "s2", "text": "Data from Model1 will be deployed to Workspace_TEST.", "correct": "No"}, {"id": "s3", "text": "The scheduled refresh policy for Model1 will be deployed to Workspace_TEST.", "correct": "No"}]}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Workspace_DEV items<\/div><p class=\"exh-p\"><b>Semantic models<\/b><\/p><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Name<\/th><th>Scheduled refresh policy<\/th><\/tr><\/thead><tbody><tr><td>Model1<\/td><td>Configured<\/td><\/tr><tr><td>Model2<\/td><td>Not configured<\/td><\/tr><\/tbody><\/table><\/div><p class=\"exh-p\"><b>Dataflows<\/b><\/p><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Name<\/th><th>Type<\/th><th>Scheduled refresh policy<\/th><\/tr><\/thead><tbody><tr><td>DF1<\/td><td>Dataflow Gen1<\/td><td>Configured<\/td><\/tr><tr><td>DF2<\/td><td>Dataflow Gen2<\/td><td>Not configured<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 34, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have source data in a CSV file that has the following fields: * SalesTransactionID * SaleDate * CustomerCode * CustomerName * CustomerAddress * ProductCode * ProductName * Quantity * UnitPrice You plan to implement a star schema for the tables in WH1. Thedimension tables in WH1 will implement Type 2 slowly changing dimension (SCD) logic. You need to design the tables that will be used for sales transaction analysis and load the source data. Which type of target table should you specify for the CustomerName, CustomerCode, and SaleDate fields? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>In a star schema the descriptive attributes belong in dimensions. CustomerCode and CustomerName describe the customer, and SaleDate describes the date, so all three are dimensions; none of them is a fact, a factless fact or a junk dimension.<\/p>", "answer_area": {"kind": "dropdowns", "controls": [{"id": "d1", "label": "CustomerCode:", "options": ["Dimension", "Fact", "Factless fact", "Junk dimension"], "correct": "Dimension"}, {"id": "d2", "label": "CustomerName:", "options": ["Dimension", "Fact", "Factless fact", "Junk dimension"], "correct": "Dimension"}, {"id": "d3", "label": "SaleDate:", "options": ["Dimension", "Fact", "Factless fact", "Junk dimension"], "correct": "Dimension"}]}, "exh": ""}, {"n": 35, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant You plan to create a data pipeline named Pipeline1. Pipeline1 will include two activities that will execute in sequence. You need to ensure that a failure of the first activity will NOT block the second activity. Which conditional path should you configure between the first activity and the second activity?<\/p>", "options": [{"letter": "A", "text": "Upon Completion"}, {"letter": "B", "text": "Upon Success"}, {"letter": "C", "text": "Upon Skip"}, {"letter": "D", "text": "Upon Failure"}], "key": ["A"], "key_source": "answer", "key_note": null, "statement_answers": null, "explanation_html": "<p>Upon Success: downstream runs only if the first activity succeeds. Upon Failure: downstream runs only if the first activity fails. Upon Skip: downstream runs if the activity was skipped. Upon Completion: downstream runs regardless of whether the first activity succeeded or failed. Since we want the second activity to run even if the first fails, the correct answer is Upon Completion. Reference: Pipeline activity dependencies in Fabric Data Factory<\/p>", "answer_area": null, "exh": ""}, {"n": 36, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric warehouse that contains a table named Sales.Products. Sales.Products contains the following columns.<\/p><p>You need to write a T-SQL query that will return the following columns.<\/p><p>How should you complete the code? To answer, select the appropriate options in the answer area.<\/p>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p class=\"key-note\">Note: the written explanation for this question suggests MAX for the first value. MAX is an aggregate over rows; the highest value across the three price columns on the same row is returned by GREATEST.<\/p><p>GREATEST returns the largest value among its arguments on the same row, which is the highest selling price across the three price columns. COALESCE returns the first non-null value, so it returns the AgentPrice when it exists and otherwise the WholesalePrice or the ListPrice.<\/p>", "answer_area": {"kind": "dropdowns", "code": "SELECT ProductID,\n    [dropdown 1] (ListPrice, WholesalePrice, AgentPrice) AS HighestSellingPrice,\n    [dropdown 2] (AgentPrice, WholesalePrice, ListPrice) AS TradePrice\nFROM Sales.Products", "controls": [{"id": "d1", "options": ["GREATEST", "COALESCE", "IIF", "MAX"], "correct": "GREATEST"}, {"id": "d2", "options": ["COALESCE", "CHOOSE", "IIF", "MAX"], "correct": "COALESCE"}]}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Sales.Products<\/div><p class=\"exh-p\"><b>Columns of Sales.Products<\/b><\/p><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Name<\/th><th>Data type<\/th><th>Nullable<\/th><\/tr><\/thead><tbody><tr><td>ProductID<\/td><td>Integer<\/td><td>No<\/td><\/tr><tr><td>ProductName<\/td><td>Varchar(30)<\/td><td>No<\/td><\/tr><tr><td>ListPrice<\/td><td>Decimal(18,2)<\/td><td>No<\/td><\/tr><tr><td>WholesalePrice<\/td><td>Decimal(18,2)<\/td><td>Yes<\/td><\/tr><tr><td>AgentPrice<\/td><td>Decimal(18,2)<\/td><td>Yes<\/td><\/tr><\/tbody><\/table><\/div><p class=\"exh-p\"><b>Columns the query must return<\/b><\/p><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Name<\/th><th>Description<\/th><\/tr><\/thead><tbody><tr><td>ProductID<\/td><td>Return the ProductID value<\/td><\/tr><tr><td>HighestSellingPrice<\/td><td>Returns the highest value from ListPrice, WholesalePrice, and AgentPrice<\/td><\/tr><tr><td>TradePrice<\/td><td>Returns the AgentPrice value if present, otherwise returns the WholesalePrice value if present, otherwise returns the ListPrice value<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 37, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Microsoft Power BI semantic model. You need to identify any surrogate key columns in the model that have the Summarize By property set to a value other than to None. The solution must minimize effort. What should you use?<\/p>", "options": [{"letter": "A", "text": "DAX Formatter in DAX Studio"}, {"letter": "B", "text": "Model view in Microsoft Power BI Desktop"}, {"letter": "C", "text": "Model explorer in Microsoft Power BI Desktop"}, {"letter": "D", "text": "Best Practice Analyzer in Tabular Editor"}], "key": ["D"], "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>To identify surrogate key columns with the &quot;Summarize By&quot; property set to a value other than &quot;None,&quot; the Best Practice Analyzer in Tabular Editor is the most efficient tool. The Best Practice Analyzer can analyze the entire model and provide a report on all columns that do not meet a specified best practice, such as having the &quot;Summarize By&quot; property set correctly for surrogate key columns. Here’s how you would proceed: * Open your Power BI model in Tabular Editor. * Go to the Advanced Scripting window. * Write or use an existing script that checks the &quot;Summarize By&quot; property of each column. * Execute the script to get a report on the surrogate key columns that do not have their &quot;Summarize By&quot; property set to &quot;None&quot;. * You can then review and adjust the properties of the columns directly within the Tabular Editor.<\/p>", "answer_area": null, "exh": ""}, {"n": 38, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric lakehouse named Lakehouse1 that contains the following data.<\/p><p>You need build a T-SQL statement that will return the total sales amount by OrderDate only for the days that are holidays in Australia. The total sales amount must sum the quantity multiplied by the price on each row in the dbo.sales table. How should you complete the statement? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>The total sales amount per OrderDate is the sum of quantity multiplied by unit price over all rows, so the expression is Sum(s.Quantity * s.UnitPrice). An inner join keeps only the sales whose OrderDate matches a public holiday, which is exactly the set of days required.<\/p>", "answer_area": {"kind": "dropdowns", "code": "SELECT s.OrderDate,\n    [dropdown 1] AS TotalSalesAmt\nFROM [Lakehouse1].[dbo].[sales] AS s\n    [dropdown 2] JOIN [Lakehouse1].[dbo].[publicHolidays] AS ph ON s.OrderDate = ph.date\nWHERE ph.country = 'Australia'\nGROUP BY s.OrderDate", "controls": [{"id": "d1", "options": ["s.Quantity * s.UnitPrice", "Sum(s.Quantity * s.UnitPrice)", "Sum(s.quantity) * s.UnitPrice", "Sum(s.Quantity) * Sum(s.UnitPrice)"], "correct": "Sum(s.Quantity * s.UnitPrice)"}, {"id": "d2", "options": ["Cross", "Full outer", "Inner", "Right outer"], "correct": "Inner"}]}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Lakehouse1 tables<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Table name<\/th><th>Column name<\/th><th>Data type<\/th><\/tr><\/thead><tbody><tr><td>dbo.publicholidays<\/td><td>countryOrRegion<\/td><td>Varchar(8000)<\/td><\/tr><tr><td>dbo.publicholidays<\/td><td>holidayName<\/td><td>Varchar(8000)<\/td><\/tr><tr><td>dbo.publicholidays<\/td><td>date<\/td><td>Date<\/td><\/tr><tr><td>dbo.sales<\/td><td>OrderDate<\/td><td>Date<\/td><\/tr><tr><td>dbo.sales<\/td><td>Quantity<\/td><td>Float<\/td><\/tr><tr><td>dbo.sales<\/td><td>UnitPrice<\/td><td>Float<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 39, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a KQL database that contains a table named Readings. You need to query Readings and return the results shown in the following table.<\/p><p>How should you complete the query? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p class=\"key-note\">Note: the answer-area image writes \"PrevTimestamp\" in the extend line. The results table and the project line both use \"PrevDatetime\", which is the name used here.<\/p><p>extend adds the two new columns PrevMeterReading and PrevDatetime, computed with prev() from the previous row. project then selects the six output columns in the order shown in the results table.<\/p>", "answer_area": {"kind": "dropdowns", "code": "Readings\n| filter City == \"Copenhagen\"\n| sort by Datetime\n| [dropdown 1] PrevMeterReading = prev(MeterReading), PrevDatetime = prev(Datetime)\n| [dropdown 2] City, Area, MeterReading, Datetime, PrevMeterReading, PrevDatetime", "controls": [{"id": "d1", "options": ["evaluate", "extend", "lookup", "project", "summarize"], "correct": "extend"}, {"id": "d2", "options": ["evaluate", "extend", "lookup", "project", "summarize"], "correct": "project"}]}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Required result (Readings, Copenhagen)<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>City<\/th><th>Area<\/th><th>MeterReading<\/th><th>Datetime<\/th><th>PrevMeterReading<\/th><th>PrevDatetime<\/th><\/tr><\/thead><tbody><tr><td>Copenhagen<\/td><td>Area1<\/td><td>2700<\/td><td>2022-04-20 10:00:00<\/td><td>None<\/td><td>None<\/td><\/tr><tr><td>Copenhagen<\/td><td>Area2<\/td><td>2720<\/td><td>2022-04-20 11:00:00<\/td><td>2700<\/td><td>2022-04-20 10:00:00<\/td><\/tr><tr><td>Copenhagen<\/td><td>Area1<\/td><td>2750<\/td><td>2022-04-20 12:00:00<\/td><td>2720<\/td><td>2022-04-20 11:00:00<\/td><\/tr><tr><td>Copenhagen<\/td><td>Area2<\/td><td>2780<\/td><td>2022-04-20 13:00:00<\/td><td>2750<\/td><td>2022-04-20 12:00:00<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 40, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have the following KQL query named Query1. You need to improve the performance of Query1. The solution must minimize resource use How should you restructure Query1?<\/p>", "options": [{"letter": "A", "text": "SigninLogs | where OfficeLocation == 'Seattle' | summarize FailedLogons = countif(ResultType != 0) by UserPrincipalName, OfficeLocation | project UserPrincipalName, FailedLogons, OfficeLocation"}, {"letter": "B", "text": "SigninLogs | summarize FailedLogons = countif(ResultType != 0) by UserPrincipalName, OfficeLocation | where OfficeLocation == 'Seattle' | project UserPrincipalName, FailedLogons, OfficeLocation"}, {"letter": "C", "text": "SigninLogs | project UserPrincipalName, FailedLogons, OfficeLocation | where OfficeLocation == 'Seattle' | summarize FailedLogons = countif(ResultType != 0) by UserPrincipalName, OfficeLocation"}, {"letter": "D", "text": "SigninLogs | project UserPrincipalName, FailedLogons, OfficeLocation | summarize FailedLogons = countif(ResultType != 0) by UserPrincipalName, OfficeLocation | where OfficeLocation == 'Seattle'"}], "key": ["A"], "key_source": "answer", "key_note": null, "statement_answers": null, "explanation_html": "<p>Filtering with where before summarize reduces the rows that have to be aggregated, and projecting the output columns last keeps the query efficient. Moving the filter after the aggregation, or projecting before the aggregation, forces the engine to process more data.<\/p>", "answer_area": null, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Query1<\/div><pre class=\"exh-pre\"><code>SigninLogs\n| summarize FailedLogons = countif(ResultType != 0) by UserPrincipalName, OfficeLocation\n| project UserPrincipalName, FailedLogons, OfficeLocation\n| where OfficeLocation == &#x27;Seattle&#x27;<\/code><\/pre><\/div>"}, {"n": 41, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric workspace that contains a warehouse named Warehouse1. Warehouse1 contains the following data.<\/p><p>You need to create a T-SQL statement that will denormalize the tables and include the ContractType and StartDate attributes in the results. The solution must meet the following requirements: * Include attributes from matching rows in the Contract table. * Ensure that all the rows from the Employee table are preserved. * Return the total number of employees per contract type for all the contract types that have more than two employees. How should you complete the statement? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.<\/p>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>A left outer join keeps every row from Employee and adds the matching Contract attributes, so no employee is lost. The totals are grouped by ContractType, and HAVING keeps only the contract types with more than two employees.<\/p>", "answer_area": {"kind": "dropdowns", "code": "WITH result AS(\n    SELECT\n        e.EmployeeID\n        , e.EmployeeName\n        , e.EmployeePosition\n        , c.ContractType\n    FROM Employee AS e\n    [dropdown 1] Contract AS c on c.EmployeeID = e.EmployeeID)\nSELECT COUNT(DISTINCT EmployeeID) AS TotalEmployees, ContractType\nFROM result\nGROUP BY ContractType\n[dropdown 2] COUNT(DISTINCT EmployeeID) > 2", "controls": [{"id": "d1", "options": ["CROSS JOIN", "INNER JOIN", "LEFT OUTER JOIN", "RIGHT OUTER JOIN"], "correct": "LEFT OUTER JOIN"}, {"id": "d2", "options": ["CONTAINS", "HAVING", "LIMIT", "WHERE"], "correct": "HAVING"}]}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Warehouse1 tables<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Table name<\/th><th>Column name<\/th><th>Data type<\/th><\/tr><\/thead><tbody><tr><td>Employee<\/td><td>EmployeeID<\/td><td>Int<\/td><\/tr><tr><td>Employee<\/td><td>EmployeeName<\/td><td>Varchar(128)<\/td><\/tr><tr><td>Employee<\/td><td>EmployeePosition<\/td><td>Varchar(64)<\/td><\/tr><tr><td>Contract<\/td><td>EmployeeID<\/td><td>Int<\/td><\/tr><tr><td>Contract<\/td><td>ContractType<\/td><td>Varchar(64)<\/td><\/tr><tr><td>Contract<\/td><td>StartDate<\/td><td>Datetime2<\/td><\/tr><tr><td>Contract<\/td><td>EndDate<\/td><td>Datetime2<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 42, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric workspace named Workspace1 that contains a KQL database The database contains a table named Table1. Workspace1 is allocated to an F 128 capacity. Table1 contains 10 billion rows and 25 columns named d through c25. Column cl contains identifiers that range from 1 to 15 and are equally distributed. You have the following query. You modify the query as shown.<\/p><p>How will the execution time of the query be affected?<\/p>", "options": [{"letter": "A", "text": "The execution time will longer."}, {"letter": "B", "text": "The execution time will remain the same."}, {"letter": "C", "text": "The query will fail"}, {"letter": "D", "text": "The execution time will be shorter."}], "key": ["B"], "key_source": "answer", "key_note": null, "statement_answers": null, "explanation_html": "<p>The query engine applies the filter before the projection regardless of the order the two operators are written in, so rewriting the query does not change the execution time.<\/p>", "answer_area": null, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Original and modified query<\/div><p class=\"exh-p\"><b>Original query<\/b><\/p><pre class=\"exh-pre\"><code>Table1\n| project c1, c2, c3\n| where c1 == 1<\/code><\/pre><p class=\"exh-p\"><b>Modified query<\/b><\/p><pre class=\"exh-pre\"><code>Table1\n| where c1 == 1\n| project c1, c2, c3<\/code><\/pre><\/div>"}, {"n": 43, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Fabric tenant that contains two workspaces named Workspace1 and Workspace2. Workspace1 contains a lakehouse named Lakehouse1. Workspace2 contains a lakehouse named Lakehouse2. Lakehouse1 contains a table named dbo.Sales. Lakehouse2 contains a table named dbo.Customers. You need to ensure that you can write queries that reference both dbo.Sales and dbo.Customers in the same SQL query without making additional copies of the tables. What should you use?<\/p>", "options": [{"letter": "A", "text": "a shortcut"}, {"letter": "B", "text": "a Dataflow Gen2"}, {"letter": "C", "text": "a copy job"}, {"letter": "D", "text": "a deployment pipeline"}], "key": ["A"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>A shortcut in one lakehouse that points to the table in the other makes both tables queryable together from the SQL analytics endpoint without copying any data.<\/p><p><b>Note:<\/b> the source lists only the correct answer; the other options were written for practice.<\/p>", "exh": ""}, {"n": 43, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Microsoft Power BI report named Report1 that uses a Fabric semantic model. Users discover that Report1 renders slowly. You open Performance analyzer and identify that a visual named Orders By Date is the slowest to render. The duration breakdown for Orders By Date is shown in the exhibit. What will provide the greatest reduction in the rendering duration of Report1?<\/p>", "options": [{"letter": "A", "text": "Reduce the number of visuals in Report1."}, {"letter": "B", "text": "Optimize the DAX query of the visual."}, {"letter": "C", "text": "Change the visual to a table."}, {"letter": "D", "text": "Increase the capacity size."}], "key": ["A"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>The DAX query takes 27 ms and visual display 39 ms, but Other takes 1,047 ms. Other is time spent waiting on and rendering other visuals, so reducing the number of visuals on the page gives the largest gain.<\/p><p><b>Note:<\/b> the source lists only the correct answer; the other options were written for practice.<\/p>", "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Orders By Date duration breakdown<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Name<\/th><th>Duration (ms)<\/th><\/tr><\/thead><tbody><tr><td>DAX query<\/td><td>27<\/td><\/tr><tr><td>Visual display<\/td><td>39<\/td><\/tr><tr><td>Other<\/td><td>1047<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 43, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a custom Direct Lake semantic model named Model1 that has one billion rows of data. You use Tabular Editor to connect to Model1 by using the XMLA endpoint. You need to ensure that when users interact with reports based on Model1, their queries always use Direct Lake mode. What should you do?<\/p>", "options": [{"letter": "A", "text": "From Model, configure the Direct Lake Behavior option."}, {"letter": "B", "text": "From Model, set the storage mode of each table to Import."}, {"letter": "C", "text": "From the Fabric admin portal, disable DirectQuery for the tenant."}, {"letter": "D", "text": "From the workspace settings, switch the model to Small storage format."}], "key": ["A"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>The Direct Lake Behavior property on the model controls fallback. Setting it to Direct Lake only means queries never fall back to DirectQuery.<\/p><p><b>Note:<\/b> the source lists only the correct answer; the other options were written for practice.<\/p>", "exh": ""}], "pl300": [{"n": 1, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You plan to create the Power BI model shown in the exhibit. (Click the Exhibit tab.)<\/p>\n<p>The data has the following refresh requirements:<\/p>\n<ul><li>Customer must be refreshed daily.<\/li><li>Date must be refreshed once every three years.<\/li><li>Sales must be refreshed in near real time.<\/li><li>SalesAggregate must be refreshed once per week.<\/li><\/ul>\n<p>You need to select the storage modes for the tables. The solution must meet the following requirements:<\/p>\n<ul><li>Minimize the load times of visuals.<\/li><li>Ensure that the data is loaded to the model based on the refresh requirements.<\/li><\/ul>\n<p>Which storage mode should you select for each table? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point. Hot Area:<\/p>\n<p>Answer Area<\/p>\n<ul><li>Customer: DirectQuery / Dual / Import<\/li><li>Date: DirectQuery / Dual / Import<\/li><li>Sales: DirectQuery / Dual / Import<\/li><li>SalesAggregate: DirectQuery / Dual / Import<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>Box 1: Dual -<\/p>\n<p>Customer should use the dual storage mode.<\/p>\n<p>Dual: Tables with this setting can act as either cached or not cached, depending on the context of the query that&#x27;s submitted to the Power BI dataset. In some cases, you fulfill queries from cached data. In other cases, you fulfill queries by executing an on-demand query to the data source.<\/p>\n<p>Note: You set the Storage mode property to one of these three values: Import, DirectQuery, and Dual.<\/p>\n<p>Box 2: Dual -<\/p>\n<p>You can set the dimension tables (Customer, Geography, and Date) to Dual to reduce the number of limited relationships in the dataset, and improve performance.<\/p>\n<p>Box 3: DirectQuery -<\/p>\n<p>Sales should use the DirectQuery storage mode.<\/p>\n<p>DirectQuery: Tables with this setting aren&#x27;t cached. Queries that you submit to the Power BI dataset&quot;for example, DAX queries&quot;and that return data from<\/p>\n<p>DirectQuery tables can be fulfilled only by executing on-demand queries to the data source. Queries that you submit to the data source use the query language for that data source, for example, SQL.<\/p>\n<p>Box 4: Import -<\/p>\n<p>Import: Imported tables with this setting are cached. Queries submitted to the Power BI dataset that return data from Import tables can be fulfilled only from cached data.<\/p>\n<p>Note:-<\/p>\n<p>Dual (Composite) Mode:<\/p>\n<p>The dual storage mode is between Import and DirectQuery. it is a hybrid approach, Like importing data, the dual storage mode caches the data in the table. However, it leaves it up to Power BI to determine the best way to query the table depending on the query context.<\/p>\n<ul><li>Sales Must be Refreshed in Near real time so &quot;Direct Query&quot;<\/li><\/ul>\n<ul><li>Sales Aggregate is once per week so &quot;Import&quot; (performance also required)<\/li><\/ul>\n<ul><li>Both Date and Customer has relationship with both Sales and SalesAggregate tables so &quot;Dual&quot;<\/li><\/ul>\n<p>because to support performance for DirectQuery(Sales) and Import(SalesAggregate)<\/p>", "answer_area": {"controls": [{"correct": "Dual", "id": "d1", "label": "Customer:", "options": ["DirectQuery", "Dual", "Import"]}, {"correct": "Dual", "id": "d2", "label": "Date:", "options": ["DirectQuery", "Dual", "Import"]}, {"correct": "DirectQuery", "id": "d3", "label": "Sales:", "options": ["DirectQuery", "Dual", "Import"]}, {"correct": "Import", "id": "d4", "label": "SalesAggregate:", "options": ["DirectQuery", "Dual", "Import"]}], "kind": "dropdowns"}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Power BI model<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Table<\/th><th>Columns shown<\/th><\/tr><\/thead><tbody><tr><td>Sales<\/td><td>CustomerKey, DueDateKey<\/td><\/tr><tr><td>SalesAggregate<\/td><td>CustomerKey, DueDateKey<\/td><\/tr><tr><td>Date<\/td><td>Date, DateKey<\/td><\/tr><tr><td>Customer<\/td><td>CustomerKey<\/td><\/tr><\/tbody><\/table><\/div><p class=\"exh-p\"><b>Relationships<\/b> (many-to-one, “*” side first): Sales * → 1 Date · Sales * → 1 Customer · SalesAggregate * → 1 Date · SalesAggregate * → 1 Customer. All filter from the “1” side to the “*” side.<\/p><\/div>"}, {"n": 2, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a project management app that is fully hosted in Microsoft Teams. The app was developed by using Microsoft Power Apps. You need to create a Power BI report that connects to the project management app. Which connector should you select?<\/p>", "options": [{"letter": "A", "text": "Microsoft Teams Personal Analytics"}, {"letter": "B", "text": "SQL Server database"}, {"letter": "C", "text": "Dataverse"}, {"letter": "D", "text": "Dataflows"}], "key": ["C"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>Data sources in Power BI Desktop.<\/p>\n<p>The Power Platform category provides the following data connections:<\/p>\n<p>Power BI datasets -<\/p>\n<p>Power BI dataflows -<\/p>\n<p>Common Data Service (Legacy)<\/p>\n<p>Dataverse -<\/p>\n<p>Dataflows -<\/p>\n<p>Other data sources include Microsoft Teams Personal Analytics (Beta).<\/p>\n<p>You can use the Microsoft Power BI template to import data into Power BI from Project for the web and Project Online. When you&#x27;re using the template, you&#x27;re connected to your Microsoft Dataverse instance, where your Microsoft Project web app data is stored.<\/p>\n<p>df4ccca1-68e9-418c-9d0f-022ac05249a2<\/p>", "exh": ""}, {"n": 3, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>For the sales department at your company, you publish a Power BI report that imports data from a Microsoft Excel file located in a Microsoft SharePoint folder. The data model contains several measures. You need to create a Power BI report from the existing data. The solution must minimize development effort. Which type of data source should you use?<\/p>", "options": [{"letter": "A", "text": "Power BI dataset"}, {"letter": "B", "text": "a SharePoint folder"}, {"letter": "C", "text": "Power BI dataflows"}, {"letter": "D", "text": "an Excel workbook"}], "key": ["A"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>Power BI dataset<\/p>\n<p>because the case states there is already a report published and the datamodel contains measures. therefore and to be able to use the measures in the datamodel you should connect to the existing dataset (which was created when you plublished the report) instead of starting from scratch with the files in the SharePoint folder.<\/p>", "exh": ""}, {"n": 4, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You import two Microsoft Excel tables named Customer and Address into Power Query. Customer contains the following columns:<\/p>\n<ul><li>Customer ID<\/li><li>Customer Name<\/li><li>Phone<\/li><li>Email Address<\/li><li>Address ID<\/li><\/ul>\n<p>Address contains the following columns:<\/p>\n<ul><li>Address ID<\/li><li>Address Line 1<\/li><li>Address Line 2<\/li><li>City<\/li><li>State/Region<\/li><li>Country<\/li><li>Postal Code<\/li><\/ul>\n<p>Each Customer ID represents a unique customer in the Customer table. Each Address ID represents a unique address in the Address table. You need to create a query that has one row per customer. Each row must contain City, State/Region, and Country for each customer. What should you do?<\/p>", "options": [{"letter": "A", "text": "Merge the Customer and Address tables."}, {"letter": "B", "text": "Group the Customer and Address tables by the Address ID column."}, {"letter": "C", "text": "Transpose the Customer and Address tables."}, {"letter": "D", "text": "Append the Customer and Address tables."}], "key": ["A"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>Remember Merge is JOIN, APPEND is UNION<\/p>\n<p>A merge queries operation joins two existing tables together based on matching values from one or multiple columns. You can choose to use different types of joins, depending on the output you want.<\/p>", "exh": ""}, {"n": 5, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have two Azure SQL databases that contain the same tables and columns. For each database, you create a query that retrieves data from a table named Customer. You need to combine the Customer tables into a single table. The solution must minimize the size of the data model and support scheduled refresh in powerbi.com. What should you do? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point. Hot Area:<\/p>\n<p>Answer Area<\/p>\n<ul><li>Option to use to combine the Customer tables: Append Queries / Append Queries as New / Merge Queries / Merge Queries as New<\/li><li>Action to perform on the original two SQL database queries: Delete the queries / Disable including the query in report refresh / Disable loading the query to the data model / Duplicate the queries<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>Box 1: Append Queries as New -<\/p>\n<p>When you have additional rows of data that you&#x27;d like to add to an existing query, you append the query.<\/p>\n<p>There are two append options:<\/p>\n<p>* Append queries as new displays the Append dialog box to create a new query by appending multiple tables.<\/p>\n<p>* Append queries displays the Append dialog box to add additional tables to the current query.<\/p>\n<p>Incorrect: When you have one or more columns that you&#x27;d like to add to another query, you merge the queries.<\/p>\n<p>Box 2: Disable loading the query to the data model<\/p>\n<p>By default, all queries from Query Editor will be loaded into the memory of Power BI Model. You can disable the load for some queries, especially queries that used as intermediate transformation to produce the final query for the model.<\/p>\n<p>Disabling Load doesn&#x27;t mean the query won&#x27;t be refreshed, it only means the query won&#x27;t be loaded into the memory. When you click on Refresh model in Power<\/p>\n<p>BI, or when a scheduled refresh happens even queries marked as Disable Load will be refreshed, but their data will be used as intermediate source for other queries instead of loading directly into the model. This is a very basic performance tuning tip, but very important when your Power BI model grows bigger and bigger.<\/p>", "answer_area": {"controls": [{"correct": "Append Queries as New", "id": "d1", "label": "Option to use to combine the Customer tables:", "options": ["Append Queries", "Append Queries as New", "Merge Queries", "Merge Queries as New"]}, {"correct": "Disable loading the query to the data model", "id": "d2", "label": "Action to perform on the original two SQL database queries:", "options": ["Delete the queries", "Disable including the query in report refresh", "Disable loading the query to the data model", "Duplicate the queries"]}], "kind": "dropdowns"}, "exh": ""}, {"n": 6, "kind": "dragdrop", "kind_label": "Drag & drop", "case": null, "case_ref": null, "stem_html": "<p>In Power Query Editor, you have three queries named ProductCategory, ProductSubCategory, and Product. Every Product has a ProductSubCategory. Not every ProductsubCategory has a parent ProductCategory. You need to merge the three queries into a single query. The solution must ensure the best performance in Power Query. How should you merge the tables? To answer, drag the appropriate merge types to the correct queries. Each merge type may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content. NOTE: Each correct selection is worth one point. Select and Place:<\/p>\n<p>Answer Area<\/p>\n<p>Values: Full outer / Inner / Left anti / Left outer / Right anti / Right outer<\/p>\n<ul><li>Product (Left Table) / ProductSubCategory (Right Table) - Join Kind<\/li><li>ProductSubCategory (Left Table) / ProductCategory (Right Table) - Join Kind<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>Box 1: Inner -<\/p>\n<p>Every Product has a ProductSubCategory.<\/p>\n<p>A standard join is needed.<\/p>\n<p>One of the join kinds available in the Merge dialog box in Power Query is an inner join, which brings in only matching rows from both the left and right tables.<\/p>\n<p>Box 2: Left outer -<\/p>\n<p>Not every ProductsubCategory has a parent ProductCategory.<\/p>\n<p>One of the join kinds available in the Merge dialog box in Power Query is a left outer join, which keeps all the rows from the left table and brings in any matching rows from the right table.<\/p>\n<p>query/merge-queries-left-outer<\/p>", "answer_area": {"controls": [{"correct": "Inner", "id": "t1", "label": "Product (Left Table) / ProductSubCategory (Right Table) - Join Kind"}, {"correct": "Left outer", "id": "t2", "label": "ProductSubCategory (Left Table) / ProductCategory (Right Table) - Join Kind"}], "kind": "dragdrop", "values": ["Full outer", "Inner", "Left anti", "Left outer", "Right anti", "Right outer"]}, "exh": ""}, {"n": 7, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You are building a Power BI report that uses data from an Azure SQL database named erp1. You import the following tables.<\/p>\n<p>You need to perform the following analyses:<\/p>\n<ul><li>Orders sold over time that include a measure of the total order value<\/li><\/ul>\n<p>Orders by attributes of products sold The solution must minimize update times when interacting with visuals in the report. What should you do first?<\/p>", "options": [{"letter": "A", "text": "From Power Query, merge the Order Line Items query and the Products query."}, {"letter": "B", "text": "Create a calculated column that adds a list of product categories to the Orders table by using a DAX function."}, {"letter": "C", "text": "Calculate the count of orders per product by using a DAX function."}, {"letter": "D", "text": "From Power Query, merge the Orders query and the Order Line Items query."}], "key": ["D"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>D. It&#x27;s the Header/Detail Schema, and the most optimal way is to flatten the header into the detail table.<\/p>\n<p>GPT: Merging the Orders query and the Order Line Items query in Power Query will allow you to create a single query that combines the necessary data from the different tables. This will make it easier and more efficient to perform the required analyses, as you will have all the information you need in one place.<\/p>\n<p>--- PBI will do the best aggregation base on Star Schema model, we now have 1 Fact table (Order Line Items) and 2 Dim tables (Products, Orders). Orders has common field with Products (ProductID), and pretty sure time series field (OrderDate); Orders Line Items has Price and Quanity.<\/p>\n<p>--- We need summarize some values like &quot;price&quot; and &quot;quantity&quot; over-time by attributes product. But we only have common field in Dim table (Orders) so we need to merge Dim (Orders) and Fact (Order Line Items) to new single Fact table to design the right Star Schema model.<\/p>\n<p>=&gt; So that D is correct<\/p>", "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Tables<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Name<\/th><th>Description<\/th><\/tr><\/thead><tbody><tr><td>Products<\/td><td>Contains the product catalog<\/td><\/tr><tr><td>Orders<\/td><td>Contains high-level information about orders<\/td><\/tr><tr><td>Order Line Items<\/td><td>Contains the product ID, quantity, and price details of an order<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 8, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Microsoft SharePoint Online site that contains several document libraries. One of the document libraries contains manufacturing reports saved as Microsoft Excel files. All the manufacturing reports have the same data structure. You need to use Power BI Desktop to load only the manufacturing reports to a table for analysis. What should you do?<\/p>", "options": [{"letter": "A", "text": "Get data from a SharePoint folder and enter the site URL Select Transform, then filter by the folder path to the manufacturing reports library."}, {"letter": "B", "text": "Get data from a SharePoint list and enter the site URL. Select Combine & Transform, then filter by the folder path to the manufacturing reports library."}, {"letter": "C", "text": "Get data from a SharePoint folder, enter the site URL, and then select Combine & Load."}, {"letter": "D", "text": "Get data from a SharePoint list, enter the site URL, and then select Combine & Load."}], "key": ["A"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>We have to import Excel files from SharePoint, so we need the connector SharePoint folder which is used to get access to the files stored in the library. SharePoint list is a collection of content that has rows and columns (like a table) and is used for task lists, calendars, etc.<\/p>\n<p>Since we have to filter only on manufacturing reports, we have to select Transform and then filter by the corresponding folder path.<\/p>", "exh": ""}, {"n": 9, "kind": "dragdrop", "kind_label": "Drag & drop", "case": null, "case_ref": null, "stem_html": "<p>You have a Microsoft Excel workbook that contains two sheets named Sheet1 and Sheet2. Sheet1 contains the following table named Table1.<\/p>\n<p>Sheet2 contains the following table named Table2.<\/p>\n<p>You need to use Power Query Editor to combine the products from Table1 and Table2 into the following table that has one column containing no duplicate values.<\/p>\n<p>Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order. Select and Place:<\/p>\n<p>Answer Area<\/p>\n<p>Values: From Power Query Editor, remove errors from the table. / From Power Query Editor, select Table1, and then select Remove duplicates. / From Power Query Editor, merge Table1 and Table2. / From Power BI Desktop, import the data from Excel, and select Table1 and Table2. / From Power Query Editor, append Table2 to Table1.<\/p>\n<ul><li>Step 1<\/li><li>Step 2<\/li><li>Step 3<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>From Power BI Desktop, import data from Excel, and select Table 1 and Table 2.<\/p>\n<p>From Power Query Editor, append Table 2 to Table 1.<\/p>\n<p>From Power Query Editor Select Table 1,and then Select Remove duplicates.<\/p>", "answer_area": {"controls": [{"correct": "From Power BI Desktop, import the data from Excel, and select Table1 and Table2.", "id": "t1", "label": "Step 1"}, {"correct": "From Power Query Editor, append Table2 to Table1.", "id": "t2", "label": "Step 2"}, {"correct": "From Power Query Editor, select Table1, and then select Remove duplicates.", "id": "t3", "label": "Step 3"}], "kind": "dragdrop", "values": ["From Power Query Editor, remove errors from the table.", "From Power Query Editor, select Table1, and then select Remove duplicates.", "From Power Query Editor, merge Table1 and Table2.", "From Power BI Desktop, import the data from Excel, and select Table1 and Table2.", "From Power Query Editor, append Table2 to Table1."]}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Table 1<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Products<\/th><\/tr><\/thead><tbody><tr><td>abc<\/td><\/tr><tr><td>def<\/td><\/tr><tr><td>ghi<\/td><\/tr><tr><td>jkl<\/td><\/tr><tr><td>mno<\/td><\/tr><\/tbody><\/table><\/div><\/div><div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Table 2<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Products<\/th><\/tr><\/thead><tbody><tr><td>abc<\/td><\/tr><tr><td>xyz<\/td><\/tr><tr><td>tuv<\/td><\/tr><tr><td>mno<\/td><\/tr><tr><td>pqr<\/td><\/tr><tr><td>stu<\/td><\/tr><\/tbody><\/table><\/div><\/div><div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Expected result<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Products<\/th><\/tr><\/thead><tbody><tr><td>abc<\/td><\/tr><tr><td>xyz<\/td><\/tr><tr><td>tuv<\/td><\/tr><tr><td>mno<\/td><\/tr><tr><td>pqr<\/td><\/tr><tr><td>stu<\/td><\/tr><tr><td>def<\/td><\/tr><tr><td>ghi<\/td><\/tr><tr><td>jkl<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 10, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a CSV file that contains user complaints. The file contains a column named Logged. Logged contains the date and time each complaint occurred. The data in Logged is in the following format: 2018-12-31 at 08:59. You need to be able to analyze the complaints by the logged date and use a built-in date hierarchy. What should you do?<\/p>", "options": [{"letter": "A", "text": "Apply a transformation to extract the last 11 characters of the Logged column and set the data type of the new column to Date."}, {"letter": "B", "text": "Change the data type of the Logged column to Date."}, {"letter": "C", "text": "Split the Logged column by using at as the delimiter."}, {"letter": "D", "text": "Apply a transformation to extract the first 11 characters of the Logged column."}], "key": ["C"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>You should split the Logged column by using &quot;at&quot; as the delimiter. This will allow you to separate the date and time into separate columns, which will enable you to analyze the complaints by date and use a built-in date hierarchy. Alternatively, you could also use a transformation to extract the date and time from the Logged column and set the data type of the new columns to Date and Time, respectively. Option A is incorrect because it only extracts the last 11 characters of the Logged column, which would not include the date. Option B is incorrect because the data in the Logged column is in a non-standard date format and cannot be directly<\/p>\n<p>converted to the Date data type. Option D is incorrect because it only extracts the first 11 characters of the Logged column, which would not include the time.<\/p>", "exh": ""}, {"n": 11, "kind": "multi", "kind_label": "Multi-select", "case": null, "case_ref": null, "stem_html": "<p>You have a Microsoft Excel file in a Microsoft OneDrive folder. The file must be imported to a Power BI dataset. You need to ensure that the dataset can be refreshed in powerbi.com. Which two connectors can you use to connect to the file? Each correct answer presents a complete solution. NOTE: Each correct selection is worth one point.<\/p>", "options": [{"letter": "A", "text": "Excel Workbook"}, {"letter": "B", "text": "Text/CSV"}, {"letter": "C", "text": "Folder"}, {"letter": "D", "text": "SharePoint folder"}, {"letter": "E", "text": "Web"}], "key": ["D", "E"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>We can import an excel file from multiple connectors (excel workbook, folder, web, share point) but if we must refresh the data from the service with no gateways then We must use web and share point connectors.<\/p>", "exh": ""}, {"n": 12, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You are profiling data by using Power Query Editor. You have a table named Reports that contains a column named State. The distribution and quality data metrics for the data in State is shown in the following exhibit.<\/p>\n<p>Use the drop-down menus to select the answer choice that completes each statement based on the information presented in the graphic. NOTE: Each correct selection is worth one point. Hot Area:<\/p>\n<p>Answer Area<\/p>\n<ul><li>There are [answer choice] different values in State including nulls. 4 / 65 / 69 / 73<\/li><li>There are [answer choice] non-null values that occur only once in State. 4 / 65 / 69 / 73<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>Box 1: 69 -<\/p>\n<p>69 distinct/different values.<\/p>\n<p>Note: Column Distribution allows you to get a sense for the overall distribution of values within a column in your data previews, including the count of distinct values (total number of different values found in a given column) and unique values (total number of values that only appear once in a given column).<\/p>\n<p>Box 2: 4 -<\/p>", "answer_area": {"controls": [{"correct": "69", "id": "d1", "label": "There are [answer choice] different values in State including nulls.", "options": ["4", "65", "69", "73"]}, {"correct": "4", "id": "d2", "label": "There are [answer choice] non-null values that occur only once in State.", "options": ["4", "65", "69", "73"]}], "kind": "dropdowns"}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Column profile for “State” (text column)<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Quality<\/th><th>Share<\/th><\/tr><\/thead><tbody><tr><td>Valid<\/td><td>96%<\/td><\/tr><tr><td>Error<\/td><td>0%<\/td><\/tr><tr><td>Empty<\/td><td>4%<\/td><\/tr><\/tbody><\/table><\/div><p class=\"exh-p\">Column distribution: <b>69 distinct, 4 unique<\/b> values.<\/p><\/div>"}, {"n": 13, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have two CSV files named Products and Categories. The Products file contains the following columns:<\/p>\n<ul><li>ProductID<\/li><li>ProductName<\/li><li>SupplierID<\/li><li>CategoryID<\/li><\/ul>\n<p>The Categories file contains the following columns:<\/p>\n<ul><li>CategoryID<\/li><li>CategoryName<\/li><li>CategoryDescription<\/li><\/ul>\n<p>From Power BI Desktop, you import the files into Power Query Editor. You need to create a Power BI dataset that will contain a single table named Product. The Product will table includes the following columns:<\/p>\n<ul><li>ProductID<\/li><li>ProductName<\/li><li>SupplierID<\/li><li>CategoryID<\/li><li>CategoryName<\/li><li>CategoryDescription<\/li><\/ul>\n<p>How should you combine the queries, and what should you do on the Categories query? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point. Hot Area:<\/p>\n<p>Answer Area<\/p>\n<ul><li>Combine the queries by performing a: Append / Merge / Transpose<\/li><li>On the Categories query: Delete the query. / Disable the query load. / Exclude the query from report refresh.<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>Box 1: Merge -<\/p>\n<p>There are two primary ways of combining queries: merging and appending.<\/p>\n<p>* When you have one or more columns that you&#x27;d like to add to another query, you merge the queries.<\/p>\n<p>* When you have additional rows of data that you&#x27;d like to add to an existing query, you append the query.<\/p>\n<p>Box 2: Disable the query load -<\/p>\n<p>Managing loading of queries -<\/p>\n<p>In many situations, it makes sense to break down your data transformations in multiple queries. One popular example is merging where you merge two queries into one to essentially do a join. In this type of situations, some queries are not relevant to load into Desktop as they are intermediate steps, while they are still required for your data transformations to work correctly. For these queries, you can make sure they are not loaded in Desktop by un-checking &#x27;Enable load&#x27; in the context menu of the query in Desktop or in the Properties screen:<\/p>", "answer_area": {"controls": [{"correct": "Merge", "id": "d1", "label": "Combine the queries by performing a:", "options": ["Append", "Merge", "Transpose"]}, {"correct": "Disable the query load.", "id": "d2", "label": "On the Categories query:", "options": ["Delete the query.", "Disable the query load.", "Exclude the query from report refresh."]}], "kind": "dropdowns"}, "exh": ""}, {"n": 14, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have an Azure SQL database that contains sales transactions. The database is updated frequently. You need to generate reports from the data to detect fraudulent transactions. The data must be visible within five minutes of an update. How should you configure the data connection?<\/p>", "options": [{"letter": "A", "text": "Add a SQL statement."}, {"letter": "B", "text": "Set the Command timeout in minutes setting."}, {"letter": "C", "text": "Set Data Connectivity mode to Import."}, {"letter": "D", "text": "Set Data Connectivity mode to DirectQuery."}], "key": ["D"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>DirectQuery: No data is imported or copied into Power BI Desktop. For relational sources, the selected tables and columns appear in the Fields list. For multi- dimensional sources like SAP Business Warehouse, the dimensions and measures of the selected cube appear in the Fields list. As you create or interact with a visualization, Power BI Desktop queries the underlying data source, so you&#x27;re always viewing current data.<\/p>", "exh": ""}, {"n": 15, "kind": "dragdrop", "kind_label": "Drag & drop", "case": null, "case_ref": null, "stem_html": "<p>You have a folder that contains 100 CSV files. You need to make the file metadata available as a single dataset by using Power BI. The solution must NOT store the data of the CSV files.<\/p>\n<p>Which three actions should you perform in sequence. To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order. Select and Place:<\/p>\n<p>Answer Area<\/p>\n<p>Values: From Power BI Desktop, select Get Data, and then select Folder. / From Power Query Editor, expand the Attributes column. / From Power Query Editor, remove the Content column. / From Power Query Editor, remove the Attributes column. / From Power BI Desktop, select Get Data, and then select Text/CSV. / From Power Query Editor, combine the Content column.<\/p>\n<ul><li>Step 1<\/li><li>Step 2<\/li><li>Step 3<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>1. Get data and select folder.<\/p>\n<p>2. Remove the content column<\/p>\n<p>3. Expand the attributes column.<\/p>\n<p>Get Data from the folder:<\/p>\n<p>This is the first step where you connect to the folder that contains your CSV files. Power BI will recognize all the CSV files in the folder and generate a dataset with both file metadata and content.<\/p>\n<p>Remove Content Column:<\/p>\n<p>After you load the data from the folder, Power BI typically presents two columns: Content (which contains the actual data of the CSV files) and Attributes (which contains the metadata). In this step, you would remove the Content column to ensure you&#x27;re only working with the metadata (e.g., file names, paths, creation dates).<\/p>\n<p>Expand Attributes:<\/p>\n<p>The Attributes column contains a record with metadata for each file. To make the metadata more accessible and usable in your report, you&#x27;ll need to expand this column. Expanding will break the record down into individual metadata fields (e.g., file name, file path, etc.), so that you can work with these attributes as separate columns in Power Query.<\/p>", "answer_area": {"controls": [{"correct": "From Power BI Desktop, select Get Data, and then select Folder.", "id": "t1", "label": "Step 1"}, {"correct": "From Power Query Editor, remove the Content column.", "id": "t2", "label": "Step 2"}, {"correct": "From Power Query Editor, expand the Attributes column.", "id": "t3", "label": "Step 3"}], "kind": "dragdrop", "values": ["From Power BI Desktop, select Get Data, and then select Folder.", "From Power Query Editor, expand the Attributes column.", "From Power Query Editor, remove the Content column.", "From Power Query Editor, remove the Attributes column.", "From Power BI Desktop, select Get Data, and then select Text/CSV.", "From Power Query Editor, combine the Content column."]}, "exh": ""}, {"n": 16, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>A business intelligence (BI) developer creates a dataflow in Power BI that uses DirectQuery to access tables from<\/p>\n<p>an on-premises Microsoft SQL server. The Enhanced Dataflows Compute Engine is turned on for the dataflow. You need to use the dataflow in a report. The solution must meet the following requirements:<\/p>\n<ul><li>Minimize online processing operations.<\/li><li>Minimize calculation times and render times for visuals.<\/li><li>Include data from the current year, up to and including the previous day.<\/li><\/ul>\n<p>What should you do?<\/p>", "options": [{"letter": "A", "text": "Create a dataflows connection that has DirectQuery mode selected."}, {"letter": "B", "text": "Create a dataflows connection that has DirectQuery mode selected and configure a gateway connection for the dataset."}, {"letter": "C", "text": "Create a dataflows connection that has Import mode selected and schedule a daily refresh."}, {"letter": "D", "text": "Create a dataflows connection that has Import mode selected and create a Microsoft Power Automate solution to refresh the data hourly."}], "key": ["C"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>A daily update is adequate.<\/p>\n<p>When you set up a refresh schedule, Power BI connects directly to the data sources using connection information and credentials in the dataset to query for updated data, then loads the updated data into the dataset. Any visualizations in reports and dashboards based on that dataset in the Power BI service are also updated.<\/p>", "exh": ""}, {"n": 17, "kind": "dragdrop", "kind_label": "Drag & drop", "case": null, "case_ref": null, "stem_html": "<p>You publish a dataset that contains data from an on-premises Microsoft SQL Server database. The dataset must be refreshed daily. You need to ensure that the Power BI service can connect to the database and refresh the dataset. Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.<\/p>\n<p>Answer Area<\/p>\n<p>Values: Add the dataset owner to the data source. / Configure an on-premises data gateway. / Configure a virtual network data gateway. / Add a data source. / Configure a scheduled refresh.<\/p>\n<ul><li>Step 1<\/li><li>Step 2<\/li><li>Step 3<\/li><li>Step 4<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>Configure an on premises data gateway.<\/p>\n<p>Add a data source.<\/p>\n<p>Add the dataset owner to the data source.<\/p>\n<p>Configure a scheduled refresh.<\/p>\n<p>Set up an on-premises data gateway: Download and install an on-premises data gateway on a machine that has access to the SQL Server database. Make sure that the gateway is registered to the same workspace as the dataset.<\/p>\n<p>Configure a data source: In the Power BI service, go to the dataset settings, and select the data source. Then, enter the necessary details, including the server name, database name, and credentials.<\/p>\n<p>Schedule refresh: In the dataset settings, go to the &quot;Scheduled refresh&quot; tab, and set up a refresh schedule. Ensure that the gateway is selected as the &quot;Data source credentials&quot; option.<\/p>\n<p>Publish the dataset: Finally, publish the dataset to the Power BI service. The dataset will be refreshed according to the schedule you set up, and the on-premises data gateway will allow the service to connect to the SQL Server database.<\/p>", "answer_area": {"controls": [{"correct": "Configure an on-premises data gateway.", "id": "t1", "label": "Step 1"}, {"correct": "Add a data source.", "id": "t2", "label": "Step 2"}, {"correct": "Add the dataset owner to the data source.", "id": "t3", "label": "Step 3"}, {"correct": "Configure a scheduled refresh.", "id": "t4", "label": "Step 4"}], "kind": "dragdrop", "values": ["Add the dataset owner to the data source.", "Configure an on-premises data gateway.", "Configure a virtual network data gateway.", "Add a data source.", "Configure a scheduled refresh."]}, "exh": ""}, {"n": 18, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You attempt to connect Power BI Desktop to a Cassandra database. From the Get Data connector list, you discover that there is no specific connector for the Cassandra database. You need to select an alternate data connector that will connect to the database. Which type of connector should you choose?<\/p>", "options": [{"letter": "A", "text": "Microsoft SQL Server database"}, {"letter": "B", "text": "ODBC"}, {"letter": "C", "text": "OLE DB"}, {"letter": "D", "text": "OData"}], "key": ["B"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>B is Correct because, B´cause it allows you to connect to data sources that aren&#x27;t identified in the Get Data lists.<\/p>\n<p>The ODBC connector lets you import data from any third-party ODBC driver simply by specifying a Data Source Name (DSN) or a connection string. As an option, you can also specify a SQL statement to execute against the ODBC driver.<\/p>\n<p>List details a few examples of data sources to which Power BI Desktop can connect by using the generic ODBC interface:<\/p>", "exh": ""}, {"n": 19, "kind": "dragdrop", "kind_label": "Drag & drop", "case": null, "case_ref": null, "stem_html": "<p>You receive annual sales data that must be included in Power BI reports. From Power Query Editor, you connect to the Microsoft Excel source shown in the following exhibit.<\/p>\n<p>You need to create a report that meets the following requirements:<\/p>\n<ul><li>Visualizes the Sales value over a period of years and months<\/li><li>Adds a slicer for the month<\/li><li>Adds a slicer for the year<\/li><\/ul>\n<p>Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.<\/p>\n<p>Answer Area<\/p>\n<p>Values: Select the Month and MonthNumber columns. / Select Unpivot other columns. / Rename the Attribute column as Year and the Value column as Sales. / Select the 2019, 2020, and 2021 columns. / Select Transpose.<\/p>\n<ul><li>Step 1<\/li><li>Step 2<\/li><li>Step 3<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>Select the Month and Month Number Columns.<\/p>\n<p>Select Unpivot Other Columns<\/p>\n<p>Rename the Attribute Column as Year and the value Column as Sales.<\/p>\n<p>Action 1: Select the Month and MonthNumber C
