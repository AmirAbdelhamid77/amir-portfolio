<main><section class="domain"><h2>Plan, implement, and manage a solution for data analytics (10–15%)</h2><div class="skill-wrap"><h3 class="skill">Plan a data analytics environment</h3><article class="sec open" id="s1"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Identifying Requirements for a Solution:</span></button><div class="sec-body"><p>This step involves understanding the specific needs of your data analytics project to choose the right components, features, and capacity within Microsoft Azure. Here&#x27;s a breakdown of the factors to consider:</p>
<ul>
<li><strong>Components:</strong>
<ul><li><strong>Data Ingestion:</strong> How will data enter the system? (e.g., Data Factory, Azure Blob Storage)</li></ul>
<ul><li><strong>Data Storage:</strong> Where will the data be housed? (e.g., Azure Data Lake Storage (ADLS), Azure Synapse Analytics)</li></ul>
<ul><li><strong>Data Processing &amp; Transformation:</strong> How will the data be cleaned, transformed, and prepared for analysis? (e.g., Azure Data Factory, Azure Databricks)</li></ul>
<ul><li><strong>Analytics &amp; Visualization:</strong> How will users explore and analyze the data? (e.g., Power BI, Azure Analysis Services)</li></ul>
</li>
<li><strong>Features:</strong>
<ul><li>Depending on your chosen components, specific features may be relevant. (e.g., Partitioning for tables in ADLS, Incremental refresh for Power BI datasets)</li></ul>
</li>
<li><strong>Performance:</strong>
<ul><li>Consider data volume, processing needs, and desired query response times. This will influence your choice of SKUs (Stock Keeping Units) for services like Synapse Analytics or Databricks.</li></ul>
</li>
<li><strong>Capacity (SKUs):</strong>
<ul><li>Azure offers various service tiers (SKUs) with different compute power and storage capacities. You&#x27;ll need to choose SKUs that align with your expected data volume and processing needs.</li></ul>
</li></ul></div></article><article class="sec open" id="s2"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Tools &amp; Resources:</span></button><div class="sec-body"><ul>
<li>Microsoft Azure documentation provides detailed information on available services, features, and SKUs.
</li>
<li>The Azure Pricing Calculator can help estimate costs based on your chosen components and SKUs.
</li></ul></div></article><article class="sec open" id="s3"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>2. Recommending Settings in Fabric Admin Portal:</span></button><div class="sec-body"><p>The Microsoft Fabric Admin Portal allows you to configure various settings for your data analytics environment. Here are some key settings you might recommend:</p>
<ul>
<li><strong>Workspace Settings:</strong>
<ul><li>Define user access controls for workspaces within your environment.</li></ul>
<ul><li>Configure workspace monitoring and logging preferences.</li></ul>
</li>
<li><strong>Data Sharing:</strong>
<ul><li>Enable data sharing between workspaces, warehouses, and lakehouses for collaboration.</li></ul>
</li>
<li><strong>Sensitivity Labels:</strong>
<ul><li>Implement data classification and access controls based on sensitivity levels.</li></ul>
</li>
<li><strong>Capacity Management:</strong>
<ul><li>Monitor resource utilization and set up alerts for potential capacity issues.</li></ul>
<ul><li>Consider autoscaling options for certain services to automatically adjust resources based on demand.</li></ul>
</li></ul></div></article><article class="sec open" id="s4"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Additional Tips:</span></button><div class="sec-body"><ul>
<li>Start by understanding the data sources, processing needs, and user requirements for your project.
</li>
<li>Design a cost-effective solution by choosing the right components and SKUs based on your needs.
</li>
<li>Leverage the Fabric Admin Portal to ensure secure access, manage data sharing, and optimize resource utilization.
</li>
<li>Remember - scalability is key! Plan for potential growth in data volume and processing needs.
</li></ul></div></article><article class="sec open" id="s5"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Plan a data analytics environment:</span></button><div class="sec-body"><p>This involves outlining the infrastructure and services needed to collect, store, transform, and analyze your data. Here are some key considerations:</p>
<ul>
<li><strong>Data sources:</strong> Identify the various sources of your data, whether on-premises databases, cloud storage solutions, or SaaS applications.
</li>
<li><strong>Data storage:</strong> Choose an appropriate Azure data storage service based on the volume, velocity, and variety of your data. Options include Azure Data Lake Storage (ADLS) for large, unstructured data, Azure SQL Database for relational data, and Azure Cosmos DB for NoSQL data.
</li>
<li><strong>Data processing:</strong> Select the best data processing service for your needs. Azure Data Factory (ADF) is ideal for orchestrating data pipelines, Azure Databricks for large-scale data processing, and Azure Synapse Analytics for data warehousing and analytics.
</li>
<li><strong>Data visualization:</strong> Choose a platform for data visualization and reporting. Power BI is a popular choice for creating interactive reports and dashboards.
</li>
<li><strong>Security:</strong> Implement robust security measures to protect sensitive data throughout the data lifecycle. Azure Active Directory (AAD) helps manage access control, and Azure Key Vault safeguards encryption keys.
</li></ul></div></article><article class="sec open" id="s6"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Choose a data gateway type:</span></button><div class="sec-body"><p>Data gateways act as bridges between on-premises data sources and Azure data services. There are two primary types:</p>
<ul>
<li><strong>On-premises data gateway:</strong> Installs on a local server and enables secure access to on-premises data sources like SQL Server Analysis Services (SSAS) databases.
</li>
<li><strong>Personal gateway:</strong> Runs on a user&#x27;s machine and allows them to refresh data in Power BI reports and dashboards from on-premises sources while working remotely.
</ul>
<p>Choosing the right gateway depends on your specific needs. For centralized access from multiple users, an on-premises gateway is preferred. For individual access, a personal gateway might suffice.</p></div></article><article class="sec open" id="s7"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Create a custom Power BI report theme:</span></button><div class="sec-body"><p>Power BI allows you to customize the visual style of your reports using themes. Themes define elements like fonts, colors, and backgrounds, ensuring a consistent look and feel across your reports.</p>
<p>Here&#x27;s how to create a custom theme:</p>
<ul>
<li><strong>Open Power BI Desktop.</strong>
</li>
<li>Go to <strong>Format</strong> &gt; <strong>Themes</strong> &gt; <strong>New Theme</strong>.
</li>
<li>Choose a starting point like a pre-built theme or a blank theme.
</li>
<li>Customize the theme by adjusting fonts, colors, and background settings.
</li>
<li>Save your custom theme for future use.
</ul>
<p>Using custom themes enhances the visual appeal and professionalism of your Power BI reports, improving user experience and data communication.</p></div></article></div><div class="skill-wrap"><h3 class="skill">Implement and manage a data analytics environment</h3><article class="sec open" id="s8"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Implementing Workspace and Item-Level Access Controls for Fabric Items</span></button><div class="sec-body"><p>Microsoft Fabric provides a collaborative workspace for data analysts, data scientists, and business users. Here&#x27;s how to manage access within Fabric workspaces:</p>
<ul>
<li><strong>Roles:</strong> Fabric offers predefined roles such as Admin, Analyst, Viewer, and Contributor. Each role has specific permissions for creating, editing, and sharing content within a workspace. Assigning appropriate roles ensures users only access data and functionalities relevant to their tasks.
</li>
<li><strong>Item-Level Permissions:</strong> Beyond workspace roles, you can define granular access control for individual reports, datasets, and other items within a workspace. This allows you to restrict access to sensitive data on a per-item basis. For example, you might grant edit access to a specific report only to a particular team.
</li>
<li><strong>Security Groups:</strong> Azure Active Directory (AAD) security groups can be used to manage access controls within Fabric workspaces. By assigning users or groups to specific security groups, you can simplify permission management.
</li></ul></div></article><article class="sec open" id="s9"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Implementing Data Sharing for Workspaces, Warehouses, and Lakehouses</span></button><div class="sec-body"><p>Sharing data securely is crucial in a collaborative data analytics environment. Here&#x27;s how to achieve this with different data sources:</p>
<ul>
<li><strong>Workspace Sharing:</strong> Fabric workspaces can be shared with other users or groups within your organization. You can control the sharing level by specifying whether recipients can view reports and datasets only (View) or also modify them (Edit).
</li>
<li><strong>Warehouse Sharing:</strong> Azure Synapse Analytics workspaces can be shared with other users or groups. Similar to workspaces, you can define permissions for viewing or modifying data within the warehouse.
</li>
<li><strong>Lakehouse Sharing:</strong> Azure Data Lake Storage (ADLS) Gen2 offers various sharing options. You can grant read, write, or both permissions to specific users or groups for specific folders within the data lake. Additionally, Azure Data Share allows you to share data from ADLS Gen2 with external collaborators in a secure and controlled manner.
</li></ul></div></article><article class="sec open" id="s10"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Additional Considerations:</span></button><div class="sec-body"><ul>
<li><strong>Sensitivity Labels:</strong> You can leverage Azure Purview data classification to assign sensitivity labels to data within workspaces, warehouses, and lakehouses. These labels can then be used to enforce additional access controls based on the data&#x27;s sensitivity level.
</li>
<li><strong>Auditing:</strong> Monitor access and activity within your data analytics environment using Azure Monitor logs. This helps identify any suspicious activity and ensures proper data governance.
</li></ul></div></article><article class="sec open" id="s11"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Manage Sensitivity Labels in Semantic Models and Lakehouses:</span></button><div class="sec-body"><ul>
<li><strong>Sensitivity Labels:</strong> These are classifications applied to data to indicate its confidentiality level (e.g., confidential, secret).
</li>
<li><strong>Semantic Models:</strong> These represent the data structure within Power BI, including relationships between tables and hierarchies.
</li>
<li><strong>Lakehouses:</strong> A data storage architecture combining a data lake (raw data) and a data warehouse (structured data).
</li></ul></div></article><article class="sec open" id="s12"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Management Process:</span></button><div class="sec-body"><ul>
<li><strong>Defining Labels:</strong> Create sensitivity labels within Microsoft Information Protection (MIP) to categorize data based on its confidentiality.
</li>
<li><strong>Assigning Labels to Semantic Models:</strong> Integrate MIP with Power BI to apply sensitivity labels to semantic models. This restricts access based on user security clearances.
</li>
<li><strong>Label Inheritance:</strong> Labels assigned to datasets within the lakehouse can automatically inherit and propagate to the semantic model, simplifying data governance.
</li></ul></div></article><article class="sec open" id="s13"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Benefits:</span></button><div class="sec-body"><ul>
<li><strong>Enhanced Data Security:</strong> Ensures only authorized users can access sensitive data within Power BI reports and dashboards.
</li>
<li><strong>Streamlined Compliance:</strong> Simplifies adherence to data privacy regulations.
</li></ul></div></article><article class="sec open" id="s14"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Configure Fabric-Enabled Workspace Settings:</span></button><div class="sec-body"><ul>
<li><strong>Microsoft Power BI Fabric:</strong> A cloud-based platform for managing and governing Power BI deployments within an organization.
</li>
<li><strong>Workspace Settings:</strong> Configurations applied to workspaces within Power BI Service, which are collaborative environments for data analysis.
</li></ul></div></article><article class="sec open" id="s15"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Key Settings:</span></button><div class="sec-body"><ul>
<li><strong>Data Access Control:</strong> Define user permissions within the workspace to control who can view, edit, or share data.
</li>
<li><strong>Sharing Settings:</strong> Manage how reports and datasets can be shared with other users or groups, both inside and outside the organization.
</li>
<li><strong>Data Refresh Schedule:</strong> Set refresh schedules for datasets to ensure data within Power BI reports remains up-to-date.
</li>
<li><strong>Security Features:</strong> Enable additional security features like row-level security (RLS) for granular data access control within reports.
</li></ul></div></article><article class="sec open" id="s16"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Benefits:</span></button><div class="sec-body"><ul>
<li><strong>Centralized Management:</strong> Provides a central location to manage workspace settings and enforce data governance policies across the organization.
</li>
<li><strong>Improved Collaboration:</strong> Streamlines collaboration by managing user access and sharing permissions for data within workspaces.
</li></ul></div></article><article class="sec open" id="s17"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Manage Fabric Capacity:</span></button><div class="sec-body"><ul>
<li><strong>Power BI Service Capacity:</strong> Refers to the computing resources allocated to your Power BI tenant within the cloud.
</li>
<li><strong>Capacity Management:</strong> Optimizing resource allocation to ensure smooth performance for data processing, model refresh, and report generation.
</li></ul></div></article><article class="sec open" id="s18"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Key Management Aspects:</span></button><div class="sec-body"><ul>
<li><strong>Monitoring Capacity Usage:</strong> Track resource consumption within your Power BI tenant to identify potential bottlenecks.
</li>
<li><strong>Scaling Capacity:</strong> Scale capacity up or down based on your organization&#x27;s data processing needs. This might involve adding or removing compute nodes within your tenant.
</li>
<li><strong>Cost Optimization:</strong> Manage capacity effectively to optimize costs associated with Power BI service usage.
</li></ul></div></article><article class="sec open" id="s19"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Benefits:</span></button><div class="sec-body"><ul>
<li><strong>Performance Optimization:</strong> Ensures sufficient resources are available to handle data processing workloads, resulting in faster data refreshes and report generation.
</li>
<li><strong>Cost Control:</strong> Prevents overspending by optimizing capacity allocation based on actual usage.
</li></ul></div></article></div><div class="skill-wrap"><h3 class="skill">Manage the analytics development lifecycle</h3><article class="sec open" id="s20"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Implementing Version Control for a Workspace:</span></button><div class="sec-body"><p>Version control is essential for tracking changes to your Power BI workspace and its components. This allows for:</p>
<ul>
<li><strong>Rollbacks:</strong> If an update introduces issues, you can revert to a previous working version.
</li>
<li><strong>Collaboration:</strong> Multiple analysts can work on the same workspace without conflicts. Version control tracks changes and allows merging modifications seamlessly.
</li>
<li><strong>Audit Trail:</strong> You can maintain a record of changes made to the workspace, ensuring transparency and accountability.
</ul>
<p>Here are your options for version control in Power BI:</p>
<ul>
<li><strong>Azure DevOps with Git:</strong> This is a popular choice for robust version control functionalities. It allows branching, merging, and conflict resolution.
</li>
<li><strong>Power BI Desktop Version History:</strong> While not as comprehensive as Git, Power BI Desktop maintains a limited version history within the .pbix file. This allows for limited rollbacks within the same file.
</li></ul></div></article><article class="sec open" id="s21"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Creating and Managing a Power BI Desktop Project (.pbix):</span></button><div class="sec-body"><p>A Power BI Desktop project (.pbix) file is the core of your data analysis work. It contains all the elements needed to create reports and visualizations:</p>
<ul>
<li><strong>Data Model:</strong> This defines the relationships and structure of your data.
</li>
<li><strong>Measures and Calculations:</strong> These define custom calculations used in your reports.
</li>
<li><strong>Visualizations:</strong> Charts, graphs, and other visual representations of your data.
</li></ul></div></article><article class="sec open" id="s22"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Managing a .pbix file effectively involves:</span></button><div class="sec-body"><ul>
<li><strong>Organization:</strong> Use folders and naming conventions to keep your project organized and easy to navigate.
</li>
<li><strong>Documentation:</strong> Include comments and descriptions to explain data sources and calculations, improving clarity for yourself and collaborators.
</li>
<li><strong>Security:</strong> Manage access to the .pbix file to ensure data security and prevent unauthorized modifications.
</li></ul></div></article><article class="sec open" id="s23"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Planning and Implementing Deployment Solutions:</span></button><div class="sec-body"><p>Deployment involves publishing your completed Power BI reports and dashboards to a platform where users can access and interact with them. Here are common deployment solutions in Microsoft Fabric:</p>
<ul>
<li><strong>Power BI Service:</strong> This is a cloud-based platform for sharing and managing Power BI reports. It offers features like user access control, report refresh scheduling, and collaboration functionalities.
</li>
<li><strong>AppSource:</strong> You can publish your Power BI apps to AppSource, allowing users to easily discover and install them within their organizations.
</li>
<li><strong>Embedded Analytics:</strong> Integrate your Power BI reports directly into external applications, providing seamless data visualization within existing workflows.
</li></ul></div></article><article class="sec open" id="s24"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Planning for deployment involves:</span></button><div class="sec-body"><ul>
<li><strong>Choosing the right platform:</strong> Consider factors like user access needs, collaboration requirements, and security considerations.
</li>
<li><strong>Defining user roles and permissions:</strong> Determine who can access and interact with your reports in the chosen platform.
</li>
<li><strong>Scheduling data refresh:</strong> Ensure your reports reflect the latest data by configuring automated data refresh schedules.
</li></ul></div></article><article class="sec open" id="s25"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Impact Analysis of Downstream Dependencies:</span></button><div class="sec-body"><p>This concept revolves around understanding how changes made in one part of your data pipeline can affect other parts. Imagine your data pipeline as a chain reaction, where each step depends on the successful completion of the previous one.</p>
<ul>
<li><strong>Downstream Dependencies:</strong> These are elements in your data pipeline that rely on the output of another element. For example, a Power BI report depends on a well-defined semantic model, which in turn depends on a dataflow that has transformed data from a data warehouse.
</li>
<li><strong>Lakehouses, Data Warehouses, Dataflows, and Semantic Models:</strong>
<ul><li><strong>Lakehouses:</strong> A hybrid data storage architecture combining a data warehouse with a data lake, allowing for structured and unstructured data.</li></ul>
<ul><li><strong>Data Warehouses:</strong> Centralized repositories designed for data analysis, optimized for querying and reporting.</li></ul>
<ul><li><strong>Dataflows:</strong> Processes that transform raw data into a usable format for analysis.</li></ul>
<ul><li><strong>Semantic Models:</strong> Data models that define how data from various sources is presented within Power BI reports.</li></ul>
</li></ul></div></article><article class="sec open" id="s26"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Performing an impact analysis involves:</span></button><div class="sec-body"><ul>
<li><strong>Identifying all downstream dependencies:</strong> Mapping out the entire data pipeline, pinpointing how each element relies on the others.
</li>
<li><strong>Understanding the nature of the dependencies:</strong> This involves knowing what specific data transformations or outputs are essential for downstream elements to function.
</li>
<li><strong>Evaluating the potential impact of changes:</strong> Consider how modifications to a specific element (data warehouse schema change, dataflow transformation update) might affect downstream reports or dashboards.
</li></ul></div></article><article class="sec open" id="s27"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Tools and Techniques for Impact Analysis:</span></button><div class="sec-body"><ul>
<li><strong>Dependency Mapping Tools:</strong> Visualize and document data pipeline connections.
</li>
<li><strong>Version Control Systems:</strong> Track changes made to data models, dataflows, and other elements.
</li>
<li><strong>Automated Impact Analysis Tools:</strong> Some tools can automatically identify potential downstream effects based on planned changes.
</li></ul></div></article><article class="sec open" id="s28"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Deploying and Managing Semantic Models with XMLA Endpoint:</span></button><div class="sec-body"><p>Semantic models act as a bridge between your data sources and Power BI reports, defining how data is presented and accessed. The XMLA endpoint (XML for Analysis) is a protocol for managing and deploying these models.</p></div></article><article class="sec open" id="s29"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Deployment Steps using XMLA:</span></button><div class="sec-body"><p>1. <strong>Export the semantic model:</strong> Export the model from Power BI Desktop as a .bim file. 2. <strong>Connect to the Azure Analysis Services instance:</strong> Use a tool like SQL Server Management Studio (SSMS) to connect to your Azure Analysis Services workspace. 3. <strong>Deploy the semantic model:</strong> Utilize the XMLA endpoint to upload the .bim file to your Azure Analysis Services workspace. 4. <strong>Configure model settings:</strong> Set permissions, refresh schedules, and other configuration options through the XMLA endpoint or the Azure portal.</p></div></article><article class="sec open" id="s30"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Benefits of XMLA Deployment:</span></button><div class="sec-body"><ul>
<li><strong>Automated Deployments:</strong> Script the deployment process for consistency and repeatability.
</li>
<li><strong>Version Control:</strong> Manage different versions of the semantic model alongside Power BI Desktop files.
</li>
<li><strong>Centralized Management:</strong> Deploy and manage models across multiple environments from a single location.
</li></ul></div></article><article class="sec open" id="s31"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Additional Considerations:</span></button><div class="sec-body"><ul>
<li><strong>Security:</strong> Ensure proper access controls are configured for the XMLA endpoint to prevent unauthorized modifications.
</li>
<li><strong>Error Handling:</strong> Implement robust error handling mechanisms to troubleshoot any deployment issues.
</li></ul></div></article><article class="sec open" id="s32"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Power BI Template (.pbit) Files:</span></button><div class="sec-body"><ul>
<li>Think of a .pbit file as a blueprint for your Power BI reports. It defines the overall structure, layout, and formatting of the report, without including any actual data.
</li>
<li>Benefits:
<ul><li>Ensures consistency in look and feel across reports developed by different users.</li></ul>
<ul><li>Saves time by eliminating the need to recreate the same report layout from scratch.</li></ul>
<ul><li>Promotes a standardized approach to data visualization within your organization.</li></ul>
</li>
<li>What a .pbit file contains:
<ul><li>Report visuals (charts, tables, etc.) arranged in a specific layout.</li></ul>
<ul><li>Themes, colors, and formatting applied to the report elements.</li></ul>
<ul><li>Filters and slicers pre-configured for the report.</li></ul>
<ul><li>Page navigation settings and drill-down capabilities.</li></ul>
</li>
<li><strong>Note:</strong> A .pbit file doesn&#x27;t include any data connections or the underlying data itself.
</li></ul></div></article><article class="sec open" id="s33"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Power BI Data Source (.pbids) Files:</span></button><div class="sec-body"><ul>
<li>A .pbids file defines the connection details for accessing data from various sources. It acts like a reusable connector, saving you from repeatedly configuring the connection every time you need to work with that specific data source.
</li>
<li>Benefits:
<ul><li>Simplifies data access for reports that require connecting to the same source repeatedly.</li></ul>
<ul><li>Standardizes connection settings, ensuring everyone uses the same credentials and configuration.</li></ul>
<ul><li>Improves security by managing data access centrally through connection permissions.</li></ul>
</li>
<li>What a .pbids file contains:
<ul><li>Connection information for specific data sources like databases, cloud storage, or APIs.</li></ul>
<ul><li>Authentication details for accessing the data (e.g., usernames, passwords).</li></ul>
<ul><li>Advanced settings for optimizing data retrieval (e.g., query folding, privacy levels).</li></ul>
</li></ul></div></article><article class="sec open" id="s34"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Shared Semantic Models:</span></button><div class="sec-body"><ul>
<li>A shared semantic model is a centralized data model that defines how data from various sources is integrated and presented in your Power BI reports. It acts as a single source of truth for data definitions and relationships.
</li>
<li>Benefits:
<ul><li>Improves data consistency across reports by ensuring everyone uses the same data model.</li></ul>
<ul><li>Reduces redundancy by eliminating the need to define data relationships in each individual report.</li></ul>
<ul><li>Enables efficient data management and governance, especially with large and complex datasets.</li></ul>
<ul><li>Shared semantic models are typically managed using Azure Analysis Services (AAS).</li></ul>
</li></ul></div></article><article class="sec open" id="s35"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Additional Points:</span></button><div class="sec-body"><ul>
<li>DP-600 also emphasizes version control for managing changes to these reusable assets. This ensures you can track modifications, revert to previous versions if needed, and maintain a history of updates.
</li>
<li>Implementing access controls for these assets is crucial to manage who can view, edit, or use them within your organization.
</li></ul></div></article></div></section><section class="domain"><h2>Prepare and serve data (40–45%)</h2><div class="skill-wrap"><h3 class="skill">Create objects in a lakehouse or warehouse</h3><article class="sec open plain-sec" id="s36"><div class="sec-body"><ul>
<li><strong>Lakehouse:</strong> This refers to a data storage architecture that combines the characteristics of a data lake (raw, unstructured data) and a data warehouse (structured data for analytics). In DP-600, you&#x27;ll likely learn how to create tables, schemas, or other data containers within the lakehouse portion of Microsoft Fabric.
</li>
<li><strong>Warehouse:</strong> This refers to a centralized repository of structured data specifically designed for querying and analysis. DP-600 might cover creating data warehouses within Fabric, including defining tables, columns, and relationships.
</li></ul></div></article><article class="sec open" id="s37"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Ingest data by using a data pipeline, dataflow, or notebook:</span></button><div class="sec-body"><ul>
<li><strong>Data pipeline:</strong> An automated process that extracts, transforms, and loads (ETL) data from various sources into the target destination (lakehouse or warehouse) in Fabric. DP-600 will likely teach you how to design and configure data pipelines within the platform.
</li>
<li><strong>Dataflow:</strong> This could be a specific type of data pipeline within Fabric, potentially focused on continuous data movement and transformation. The course might cover creating and managing dataflows for real-time data ingestion.
</li>
<li><strong>Notebook:</strong> Jupyter Notebooks or similar tools are interactive environments for data manipulation and analysis. DP-600 might involve using notebooks to write code for data ingestion tasks within Fabric, perhaps for smaller datasets or exploratory purposes.
</li></ul></div></article><article class="sec open" id="s38"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Create and manage shortcuts:</span></button><div class="sec-body"><p>Shortcuts within Fabric could refer to pre-defined configurations or workflows for data processing tasks. DP-600 might teach you how to create reusable shortcuts to streamline common data engineering processes.</p></div></article><article class="sec open" id="s39"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Implement file partitioning for analytics workloads in a lakehouse:</span></button><div class="sec-body"><ul>
<li><strong>File partitioning:</strong> This is a technique where data is organized into smaller, self-contained files based on specific criteria (e.g., date, region). In DP-600, you&#x27;ll likely learn how to implement file partitioning within the lakehouse portion of Fabric to improve query performance for analytics workloads. Partitioning allows queries to focus on specific data subsets, reducing processing time.
</li></ul></div></article><article class="sec open" id="s40"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Building Views, Functions, and Stored Procedures:</span></button><div class="sec-body"><p>These objects help manipulate and analyze data efficiently. You can use tools like:</p>
<ul>
<li><strong>SQL Notebooks:</strong> Write and execute T-SQL code directly within the Fabric workspace to create views, functions, and stored procedures for your lakehouse or warehouse data.
</li>
<li><strong>Synapse Studio:</strong> For warehouses, Synapse Studio provides a visual interface to manage objects. You can create views and stored procedures with a drag-and-drop interface or write T-SQL code within the studio.
</li></ul></div></article><article class="sec open" id="s41"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Data Enrichment:</span></button><div class="sec-body"><p>Fabric allows enriching data by adding new columns or tables:</p>
<ul>
<li><strong>Transformations:</strong> Use tools like Azure Databricks or Data Factory pipelines to transform data and create new columns based on existing data within the lakehouse.
</li>
<li><strong>ETL/ELT Processes:</strong> Design ETL (Extract, Transform, Load) or ELT (Extract, Load, Transform) processes to integrate data from various sources and enrich it before loading it into the lakehouse or warehouse. You can leverage Azure Data Factory for building such pipelines.
</li></ul></div></article><article class="sec open" id="s42"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Additional Considerations:</span></button><div class="sec-body"><ul>
<li><strong>Security:</strong> DP-600 emphasizes data security. When creating objects and enriching data, ensure proper access controls and data governance practices are in place.
</li>
<li><strong>Version Control:</strong> Fabric allows versioning objects like views and functions. This helps track changes and revert to previous versions if needed.
</li></ul></div></article></div><div class="skill-wrap"><h3 class="skill">Copy data</h3><article class="sec open" id="s43"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Choosing the Right Method:</span></button><div class="sec-body"><p>The first step involves selecting the most suitable method for copying data based on your specific needs. Here are the main options:</p>
<ul>
<li><strong>Data Pipeline:</strong> Offers a visual, drag-and-drop interface to build workflows for data movement. Ideal for complex transformations and orchestration of multiple data sources.
</li>
<li><strong>Dataflow:</strong> Leverages code (typically T-SQL) for data manipulation and movement. Provides granular control for developers familiar with SQL.
</li>
<li><strong>Notebook:</strong> Utilizes notebooks (like Azure Databricks Notebooks) with programming languages (e.g., Python) for data manipulation and copying. Ideal for complex data transformations and advanced analytics scenarios.
</li></ul></div></article><article class="sec open" id="s44"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Factors to Consider When Choosing:</span></button><div class="sec-body"><ul>
<li><strong>Complexity of data transformation:</strong> Pipelines are better for complex transformations, while dataflows and notebooks offer more flexibility.
</li>
<li><strong>Technical expertise:</strong> Pipelines have a user-friendly interface, while dataflows and notebooks require coding knowledge.
</li>
<li><strong>Need for advanced analytics:</strong> Notebooks excel in advanced data manipulation and analytics alongside data copying.
</li></ul></div></article><article class="sec open" id="s45"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Copying Data Using Your Chosen Method:</span></button><div class="sec-body"><p>Once you&#x27;ve selected the appropriate method, it&#x27;s time to configure the copying process. Here&#x27;s a general overview for each approach:</p>
<ul>
<li><strong>Data Pipeline:</strong> Drag and drop data source and destination connectors, define transformation activities (if needed), and schedule the pipeline execution.
</li>
<li><strong>Dataflow:</strong> Write T-SQL code specifying the data source, transformation logic (if needed), and target destination within the dataflow editor.
</li>
<li><strong>Notebook:</strong> Use programming functions within the notebook environment to read data from the source, perform transformations (if needed), and write the data to the target lakehouse or warehouse.
</li></ul></div></article><article class="sec open" id="s46"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Additional Resources:</span></button><div class="sec-body"><p>For in-depth guidance on configuring data pipelines, dataflows, and notebooks for data copying in Microsoft Fabric, refer to the official Microsoft documentation:</p>
<ul>
<li><a href="https://learn.microsoft.com/en-us/fabric/" target="_blank" rel="noopener">https://learn.microsoft.com/en-us/fabric/</a>
</li></ul></div></article><article class="sec open" id="s47"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Building the Data Pipeline: Orchestrating Data Movement</span></button><div class="sec-body"><ul>
<li><strong>Stored Procedures:</strong> These pre-written SQL statements can be integrated into your data pipeline, automating specific data manipulation tasks during the copy process. They offer efficiency and reusability for complex transformations.
</li>
<li><strong>Notebooks:</strong> For advanced processing needs, notebooks like Spark notebooks can be incorporated into your pipeline. These allow for custom scripts using languages like Python or Scala, providing flexibility for handling intricate data transformations during the copy operation.
</li>
<li><strong>Dataflows:</strong> Fabric&#x27;s dataflows offer a visual interface to define and orchestrate data movement. You can chain together various data sources, transformations, and destinations, including copying data between different locations within the Fabric ecosystem.
</li></ul></div></article><article class="sec open" id="s48"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Scheduling Your Data Movement:</span></button><div class="sec-body"><ul>
<li><strong>Data Pipeline Scheduling:</strong> Once your data pipeline is built, you can configure it to run on a specific schedule. This ensures data is copied automatically at regular intervals, keeping your data lake or warehouse up-to-date.
</li>
<li><strong>Dataflow and Notebook Scheduling:</strong> Similar to data pipelines, dataflows and notebooks can also be scheduled to run at designated times. This allows for automated data copying tasks specific to these tools, ensuring your data processing adheres to a defined schedule.
</li></ul></div></article></div><div class="skill-wrap"><h3 class="skill">Transform data</h3><article class="sec open" id="s49"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Data Cleansing:</span></button><div class="sec-body"><ul>
<li><strong>Identifying and removing errors:</strong> This includes handling missing values, outliers, inconsistencies, and duplicate records. Techniques like filtering, replacing, imputation, and deduplication can be used.
</li>
<li><strong>Data validation:</strong> Ensuring data adheres to defined formats and business rules through techniques like data type conversion, pattern matching, and range checks.
</li>
<li><strong>Data normalization:</strong> Restructuring data to minimize redundancy and improve data integrity. This may involve techniques like removing duplicate data or splitting tables into smaller, more focused ones.
</li></ul></div></article><article class="sec open" id="s50"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Star Schema Implementation:</span></button><div class="sec-body"><p>A star schema is a dimensional modeling technique ideal for data warehousing and lakehouses. Here&#x27;s how to implement it:</p>
<ul>
<li><strong>Fact Table:</strong> This central table holds the core metrics for analysis. It typically has a foreign key relationship with each dimension table.
</li>
<li><strong>Dimension Tables:</strong> These tables hold descriptive details related to the facts. They are linked to the fact table using primary and foreign keys.
</li>
<li><strong>Dimension Types:</strong>
<ul><li><strong>Type 1 Slowly Changing Dimensions (SCDs):</strong> Update existing records in the dimension table to reflect changes over time.</li></ul>
<ul><li><strong>Type 2 Slowly Changing Dimensions (SCDs):</strong> Maintain a history of changes by adding new rows to the dimension table with new values and keeping the old records.</li></ul>
</li></ul></div></article><article class="sec open" id="s51"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Bridge Tables:</span></button><div class="sec-body"><p>Bridge tables are used to link dimension tables with many-to-many relationships. They contain foreign keys from both dimension tables and any additional attributes relevant to the relationship. Here&#x27;s when you might use them:</p>
<ul>
<li>Connecting two dimension tables with a many-to-many relationship.
</li>
<li>Simplifying complex relationships in a star schema.
</li></ul></div></article><article class="sec open" id="s52"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Denormalization:</span></button><div class="sec-body"><ul>
<li><strong>Concept:</strong> Involves strategically introducing redundancy in your data model to improve query performance. This is often used in data warehouses where complex joins might slow down queries.
</li>
<li><strong>Example:</strong> Imagine an e-commerce database with separate tables for orders and customer information. Denormalization could involve adding customer details (name, address) directly to the order table for faster retrieval of order details without needing a join with the customer table.
</li></ul></div></article><article class="sec open" id="s53"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Aggregation or De-aggregation:</span></button><div class="sec-body"><ul>
<li><strong>Concept:</strong>
<ul><li><strong>Aggregation:</strong> Rolling up data to a higher level of detail. For example, summing daily sales figures into monthly or yearly totals.</li></ul>
<ul><li><strong>De-aggregation:</strong> The opposite process, where you drill down from a higher level to see the underlying details. For example, analyzing sales trends by product category and then further de-aggregating to see individual product performance.</li></ul>
</li>
<li><strong>Example:</strong> You might aggregate website traffic data by week to understand overall trends. However, you might then de-aggregate to analyze specific days with high traffic spikes.
</li></ul></div></article><article class="sec open" id="s54"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Merging or Joining Data:</span></button><div class="sec-body"><ul>
<li><strong>Concept:</strong> Combining data from multiple tables based on a shared field. This allows you to analyze relationships between different data sets.
</li>
<li><strong>Types of Joins:</strong>
<ul><li><strong>Inner Join:</strong> Returns only matching records from both tables.</li></ul>
<ul><li><strong>Left Join:</strong> Returns all records from the left table and matching records from the right table.</li></ul>
<ul><li><strong>Right Join:</strong> Returns all records from the right table and matching records from the left table.</li></ul>
<ul><li><strong>Full Join:</strong> Returns all records from both tables, even if there&#x27;s no match.</li></ul>
</li>
<li><strong>Example:</strong> Merging a customer table with an order table based on a customer ID would allow you to analyze purchase history for each customer.
</li></ul></div></article><article class="sec open" id="s55"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Identifying and Addressing Data Quality Issues:</span></button><div class="sec-body"><ul>
<li><strong>Duplicate Data:</strong> This can lead to skewed results. Techniques like using unique identifiers or deduplication algorithms can help identify and remove duplicates.
</li>
<li><strong>Missing Data:</strong> Missing values can also distort analysis. You can handle missing data by filling it with appropriate values (e.g., mean, median) or removing rows with excessive missing data.
</li>
<li><strong>Null Values:</strong> Null values are distinct from missing data and often represent intentional absence of information. You can address null values similar to missing data, but the strategy might differ depending on the context.
</li></ul></div></article><article class="sec open" id="s56"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Data Type Conversion:</span></button><div class="sec-body"><p>Data comes in various formats. To ensure accurate analysis, you might need to convert data types using tools like SQL or PySpark. Here are some common conversions:</p>
<ul>
<li><strong>String to Numeric:</strong> Convert text representing numbers to actual numerical values for calculations.
</li>
<li><strong>Dates and Times:</strong> Ensure consistent date and time formats across your data for proper analysis.
</li></ul></div></article><article class="sec open" id="s57"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Data Filtering:</span></button><div class="sec-body"><p>Data filtering allows you to focus on specific subsets relevant to your analysis. You can use SQL queries or programming languages like PySpark to filter data based on certain criteria.</p></div></article></div><div class="skill-wrap"><h3 class="skill">Optimize performance</h3><article class="sec open" id="s58"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Identifying Bottlenecks:</span></button><div class="sec-body"><ul>
<li><strong>Monitoring Tools:</strong> Utilize ADF&#x27;s monitoring tools to track pipeline execution times, data movement volumes, and resource utilization (CPU, memory) across dataflows, notebooks, and activities. Slow execution times or high resource usage can indicate bottlenecks.
</li>
<li><strong>Profiling Techniques:</strong> Profile dataflows and notebooks to identify the most time-consuming transformations or code sections. This can reveal issues like complex calculations, unnecessary data shuffles, or inefficient data filtering.
</li>
<li><strong>Query Execution Plans:</strong> Analyze query execution plans in SQL activities to pinpoint expensive operations like full table scans, inefficient joins, or missing indexes.
</li></ul></div></article><article class="sec open" id="s59"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Resolving Bottlenecks in Dataflows:</span></button><div class="sec-body"><ul>
<li><strong>Data Partitioning:</strong> Partitioning data based on a chosen column can significantly speed up filtering and aggregation operations in dataflows.
</li>
<li><strong>Optimize Transformations:</strong> Simplify complex transformations into smaller, more efficient steps. Consider using built-in data flow functions instead of custom code when possible.
</li>
<li><strong>Optimize Data Movement:</strong> Minimize unnecessary data shuffles between data stores. Utilize data compression techniques to reduce data movement volume when transferring data.
</li></ul></div></article><article class="sec open" id="s60"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Resolving Bottlenecks in Notebooks:</span></button><div class="sec-body"><ul>
<li><strong>Optimize Code:</strong> Refactor code in notebooks for efficiency. Use vectorized operations and optimized data structures (e.g., DataFrames) for data manipulation.
</li>
<li><strong>Parallelize Operations:</strong> Utilize libraries like Spark or Dask to parallelize operations across multiple cores for faster processing, especially when dealing with large datasets.
</li>
<li><strong>Caching Data:</strong> Cache intermediate results within notebooks to avoid redundant computations, especially for frequently used data transformations.
</li></ul></div></article><article class="sec open" id="s61"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Resolving Bottlenecks in SQL Queries:</span></button><div class="sec-body"><ul>
<li><strong>Indexing:</strong> Implement appropriate indexes on frequently accessed columns to optimize query execution plans and reduce full table scans.
</li>
<li><strong>Denormalization:</strong> Consider denormalizing data structures to minimize expensive joins when necessary, but be mindful of potential data redundancy issues.
</li>
<li><strong>Optimize Joins:</strong> Utilize appropriate join types (e.g., inner join, left join) based on your data relationships. Choose efficient join algorithms like hash joins for large datasets.
</li>
<li><strong>Query Tuning:</strong> Review and optimize SQL queries to remove unnecessary operations, utilize efficient functions, and leverage query hints for optimized execution plans.
</li></ul></div></article><article class="sec open" id="s62"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Dataflows, Notebooks, and SQL Queries:</span></button><div class="sec-body"><ul>
<li><strong>Monitoring and Analysis:</strong> Use built-in tools like the <strong>Monitoring Hub</strong> and <strong>Capacity Metrics </strong> <strong>App</strong> to identify slow-running dataflows, notebooks, and queries. Analyze execution plans to pinpoint bottlenecks.
</li>
<li><strong>Dataflow Optimization:</strong>
<ul><li><strong>Staging:</strong> Leverage <strong>dataflow staging</strong> to optimize data transformation logic and minimize redundant operations.</li></ul>
<ul><li><strong>Fast Copy:</strong> Utilize <strong>fast copy</strong> to efficiently move data between data stores within the same region.</li></ul>
<ul><li><strong>Code Optimization:</strong> Review code for inefficiencies. Simplify complex expressions, leverage built-in functions effectively, and avoid unnecessary data shuffles.</li></ul>
<ul><li><strong>Parallelization:</strong> Consider parallel execution for data transformation steps whenever possible to improve processing speed.</li></ul>
</li>
<li><strong>Notebook Optimization:</strong>
<ul><li><strong>Code Structure:</strong> Organize code efficiently, minimizing redundant calculations and data loading.</li></ul>
<ul><li><strong>Resource Allocation:</strong> Allocate appropriate resources (memory, cores) to notebooks based on workload requirements.</li></ul>
<ul><li><strong>Caching:</strong> Implement caching mechanisms for frequently used data to minimize redundant computations.</li></ul>
</li>
<li><strong>SQL Query Optimization:</strong>
<ul><li><strong>Indexing:</strong> Ensure proper indexing on frequently accessed columns in tables for faster query execution.</li></ul>
<ul><li><strong>Query Tuning:</strong> Analyze query plans and optimize queries by eliminating unnecessary joins, filtering data early, and using appropriate data types.</li></ul>
<ul><li><strong>Denormalization:</strong> Consider denormalization techniques for specific use cases to improve query performance at the cost of increased data storage needs.</li></ul>
</li></ul></div></article><article class="sec open" id="s63"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Delta Table File Size Management:</span></button><div class="sec-body"><ul>
<li><strong>File Partitioning:</strong> Implement file partitioning based on relevant columns to improve query performance by allowing scans of specific data subsets.
</li>
<li><strong>VACUUM and OPTIMIZE:</strong> Utilize <strong>VACUUM</strong> and <strong>OPTIMIZE</strong> operations on Delta tables to reclaim unused space and potentially improve query performance by reorganizing data files.
</li></ul></div></article></div></section><section class="domain"><h2>Implement and manage semantic models (20–25%)</h2><div class="skill-wrap"><h3 class="skill">Design and build semantic models</h3><article class="sec open" id="s64"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Choosing a Storage Mode, Including DirectQuery:</span></button><div class="sec-body"><ul>
<li><strong>Storage Modes:</strong> Power BI offers two main storage modes for semantic models:
<ul><li><strong>Import:</strong> Data is copied and stored locally within the Power BI model. This provides fast query performance but requires refreshing the data to reflect changes in the source.</li></ul>
<ul><li><strong>DirectQuery:</strong> Queries bypass the model and directly access the source data. This offers real-time data reflection but can impact query performance for complex analyses.</li></ul>
</li>
<li><strong>DirectQuery with DirectQuery for Live Connections (Preview):</strong> This advanced mode allows connecting to live data sources that also support DirectQuery. It combines the benefits of both modes.
</li></ul></div></article><article class="sec open" id="s65"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Use Cases for DAX Studio and Tabular Editor 2:</span></button><div class="sec-body"><ul>
<li><strong>DAX Studio:</strong> This free, third-party tool empowers advanced users to write and debug DAX (Data Analysis Expressions) formulas. It offers features like syntax highlighting, IntelliSense for autocomplete, and performance profiling.
</li>
<li><strong>Tabular Editor 2:</strong> This free, Microsoft-developed tool allows for advanced editing and management of semantic models. It provides functionalities beyond Power BI Desktop, including managing relationships, defining hierarchies, and creating calculated tables.
</li></ul></div></article><article class="sec open" id="s66"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Implementing a Star Schema for a Semantic Model:</span></button><div class="sec-body"><ul>
<li><strong>Star Schema:</strong> This is a widely used data modeling approach for data warehouses and semantic models. It features a central fact table surrounded by dimension tables linked by relationships.
<ul><li><strong>Fact Table:</strong> Stores transactional data with measures (calculations).</li></ul>
<ul><li><strong>Dimension Tables:</strong> Contain descriptive attributes of the data in the fact table.</li></ul>
</li></ul></div></article><article class="sec open" id="s67"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Implementing Relationships:</span></button><div class="sec-body"><ul>
<li><strong>Relationships:</strong> These define how tables in a semantic model are connected. They enable users to navigate and analyze data across tables.
<ul><li><strong>One-to-Many:</strong> A common relationship where a row in the parent table (dimension) relates to multiple rows in the child table (fact).</li></ul>
<ul><li><strong>Many-to-Many:</strong> Requires a bridge table to connect two dimension tables that have a many-to-many relationship with each other.</li></ul>
</li></ul></div></article><article class="sec open" id="s68"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Calculations with DAX Variables and Functions:</span></button><div class="sec-body"><ul>
<li><strong>DAX Variables:</strong> These act as temporary containers for storing intermediate results within a DAX expression. They allow you to break down complex calculations into smaller, more manageable steps, improving readability and maintainability.
</li>
<li><strong>DAX Functions:</strong> DAX offers a rich library of functions for various purposes, including:
<ul><li><strong>Iterators:</strong> Functions like SUMX and AVERAGEX iterate over a table, performing calculations on each row and returning a single aggregated value.</li></ul>
<ul><li><strong>Table Filtering:</strong> Functions like FILTER and DISTINCT allow you to dynamically filter tables based on specific criteria within your DAX expression.</li></ul>
<ul><li><strong>Windowing Functions:</strong> Functions like CALCULATE and PREVIOUSYEAR enable calculations that consider the current row&#x27;s position within a larger context, such as calculating year-over-year comparisons.</li></ul>
<ul><li><strong>Information Functions:</strong> Functions like ISBLANK and ISFILTERED provide information about the data context within your DAX expression, allowing for conditional logic and dynamic calculations.</li></ul>
</li></ul></div></article><article class="sec open" id="s69"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Implementing Calculation Groups:</span></button><div class="sec-body"><ul>
<li>Calculation groups are a powerful feature that allows you to define multiple related calculations within a single entity. These calculations share a common base expression and can be further customized with specific parameters for each calculation.
</li>
<li>This simplifies model design and reduces redundancy, as you can define variations of a core calculation within the group. The results of these calculations appear as separate columns in your data model, providing flexibility for analysis.
</li></ul></div></article><article class="sec open" id="s70"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Dynamic Strings and Field Parameters:</span></button><div class="sec-body"><ul>
<li><strong>Dynamic Strings:</strong> DAX allows you to construct strings dynamically within your calculations. Functions like CONCATENATE and SUBSTITUTE enable you to combine text values and data fields to create customized labels, titles, or even filter criteria.
</li>
<li><strong>Field Parameters:</strong> These are user-defined inputs within your DAX expressions. They allow you to control the behavior of your calculations through user interface elements like sliders or text boxes within Power BI. This empowers users to interact with your model and explore data from different perspectives.
</ul>
<p><strong>By mastering these DAX concepts, you can create robust, flexible, and user-friendly semantic </strong><strong>models for effective data analysis in Power BI.</strong></p>
<p>Here are some additional resources for further exploration:</p>
<ul>
<li>Microsoft DAX Documentation: <a href="https://learn.microsoft.com/en-us/dax/" target="_blank" rel="noopener">https://learn.microsoft.com/en-us/dax/</a>
</li>
<li>Power BI DAX Guide: <a href="https://learn.microsoft.com/en-us/dax/" target="_blank" rel="noopener">https://learn.microsoft.com/en-us/dax/</a>
</li>
<li>Online Tutorials and Courses: Numerous online resources offer interactive tutorials and indepth courses on DAX for Power BI.
</li></ul></div></article><article class="sec open" id="s71"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Design and Build a Large Format Dataset:</span></button><div class="sec-body"><p>Large format datasets are designed to handle massive data volumes (billions of rows) efficiently. Here&#x27;s what you need to know:</p>
<ul>
<li><strong>Storage Modes:</strong> Choose between Import or DirectQuery based on data size, refresh needs, and performance requirements.
</li>
<li><strong>Partitioning:</strong> Divide data into smaller chunks for faster query execution.
</li>
<li><strong>Aggregation Design:</strong> Pre-calculate aggregations at specific levels (e.g., year, month) to improve query response time.
</li></ul></div></article><article class="sec open" id="s72"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Design and Build Composite Models:</span></button><div class="sec-body"><p>Composite models combine imported data and live connections to external data sources. Here&#x27;s the key:</p>
<ul>
<li><strong>Data Source Selection:</strong> Determine which data benefits from import and which works best with live connections.
</li>
<li><strong>Relationships:</strong> Establish relationships between tables across different data sources to create a cohesive data model.
</li>
<li><strong>Aggregations:</strong> Decide where to pre-calculate aggregations (imported data) or rely on the external data source (live connections).
</li></ul></div></article><article class="sec open" id="s73"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Implement Dynamic Row-Level Security (RLS) and Object-Level Security (OLS):</span></button><div class="sec-body"><p>These security features control data access based on user attributes or roles.</p>
<ul>
<li><strong>RLS:</strong> Restricts data visibility at the row level based on user attributes (e.g., department, location).
</li>
<li><strong>OLS:</strong> Controls user access to entire objects like tables or measures.
</li></ul></div></article><article class="sec open" id="s74"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Validate Row-Level Security and Object-Level Security:</span></button><div class="sec-body"><p>Ensure your security measures function as intended:</p>
<ul>
<li><strong>Testing Tools:</strong> Utilize Power BI Desktop&#x27;s security testing tools to simulate user access and verify data visibility.
</li>
<li><strong>Reviewing Effective Security:</strong> Double-check that RLS and OLS rules are applied correctly and achieve the desired access control.
</li></ul></div></article><article class="sec open" id="s75"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Additional Resources:</span></button><div class="sec-body"><ul>
<li>Microsoft Documentation on Designing Semantic Models: <a href="https://learn.microsoft.com/en-us/fabric/data-warehouse/semantic-models" target="_blank" rel="noopener">https://learn.microsoft.com/en-us/fabric/data-warehouse/semantic-models</a>
</li>
<li>Microsoft documentation on Large Datasets: <a href="https://learn.microsoft.com/en-us/power-bi/enterprise/service-premium-large-models" target="_blank" rel="noopener">https://learn.microsoft.com/en-us/power-bi/enterprise/service-premium-large-models</a>
</li>
<li>Microsoft documentation on Composite Models: <a href="https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-composite-models" target="_blank" rel="noopener">https://learn.microsoft.com/en-us/power-bi/transform-model/desktop-composite-models</a>
</li>
<li>Microsoft documentation on Row-Level Security: <a href="https://learn.microsoft.com/en-us/fabric/security/service-admin-row-level-security" target="_blank" rel="noopener">https://learn.microsoft.com/en-us/fabric/security/service-admin-row-level-security</a>
</li>
<li>Microsoft documentation on Object-Level Security: <a href="https://learn.microsoft.com/en-us/fabric/security/service-admin-object-level-security" target="_blank" rel="noopener">https://learn.microsoft.com/en-us/fabric/security/service-admin-object-level-security</a>
</li></ul></div></article></div><div class="skill-wrap"><h3 class="skill">Optimize enterprise-scale semantic models</h3><article class="sec open" id="s76"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Implementing Performance Improvements in Queries and Report Visuals:</span></button><div class="sec-body"><ul>
<li><strong>Identify Bottlenecks:</strong> Use tools like Performance Analyzer in Power BI Desktop to pinpoint slow queries and visuals. Look for factors like complex calculations, large datasets, or inefficient filters.
</li>
<li><strong>Optimize DAX Queries:</strong> Write efficient DAX formulas that minimize data processing. Techniques include:
<ul><li>Pre-calculating complex calculations in separate measures.</li></ul>
<ul><li>Using CALCULATE and FILTER functions strategically.</li></ul>
<ul><li>Leveraging aggregation tables for summarized data.</li></ul>
</li>
<li><strong>Optimize Visuals:</strong> Choose appropriate visuals for the data type (e.g., bar charts for comparisons, line charts for trends). Minimize unnecessary data points and formatting complexity.
</li>
<li><strong>Optimize Data Model Relationships:</strong> Ensure relationships between tables are correctly defined with proper cardinality (one-to-one, one-to-many, many-to-many) to avoid unnecessary data joins.
</li></ul></div></article><article class="sec open" id="s77"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Improving DAX Performance with DAX Studio:</span></button><div class="sec-body"><p>DAX Studio is a free, third-party tool that provides advanced features for writing and analyzing DAX formulas. It can help with:</p>
<ul>
<li><strong>Syntax Highlighting and Autocomplete:</strong> Speeds up DAX code writing and reduces errors.
</li>
<li><strong>Formula Validation and Testing:</strong> Checks DAX syntax and allows testing with sample data.
</li>
<li><strong>Performance Profiling:</strong> Identifies slow parts of DAX queries and suggests optimization techniques.
</li>
<li><strong>Version Control and Collaboration:</strong> Enables sharing DAX code with colleagues and tracking changes.
</li></ul></div></article><article class="sec open" id="s78"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Optimizing a Semantic Model with Tabular Editor 2:</span></button><div class="sec-body"><p>Tabular Editor 2 (free version) is another valuable tool for optimizing semantic models. It allows for:</p>
<ul>
<li><strong>Viewing and Editing Model Structure:</strong> Visualize tables, columns, relationships, and hierarchies within the model.
</li>
<li><strong>Optimizing Cardinality:</strong> Change column relationships and data types to improve query performance.
</li>
<li><strong>Creating Calculated Columns and Measures:</strong> Develop complex calculations outside of Power BI Desktop for better organization and reusability.
</li>
<li><strong>Managing Security Roles:</strong> Define row-level security and object-level security to control data access.
</li>
<li><strong>Partitioning and Aggregation:</strong> Partition large tables for faster queries and pre-aggregate data for quicker report loading.
</li></ul></div></article><article class="sec open" id="s79"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Implementing Incremental Refresh:</span></button><div class="sec-body"><p>Incremental refresh is a technique for updating large datasets in a Power BI model without refreshing the entire dataset each time. It allows for:</p>
<ul>
<li><strong>Faster Refresh Times:</strong> Update only the changed data sections, minimizing data processing and refresh time.
</li>
<li><strong>Improved Query Performance:</strong> Keeps data in the model more up-to-date, potentially leading to faster queries.
</li>
<li><strong>Reduced Data Transfer Costs:</strong> Transfers only the changed data, saving on bandwidth and storage costs.
</li></ul></div></article></div></section><section class="domain"><h2>Explore and analyze data (20–25%)</h2><div class="skill-wrap"><h3 class="skill">Perform exploratory analytics</h3><article class="sec open" id="s80"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Descriptive and Diagnostic Analytics:</span></button><div class="sec-body"><p>These are the foundation of understanding your data.</p>
<ul>
<li><strong>Descriptive Analytics:</strong> This focuses on summarizing and describing the characteristics of your data. It answers basic questions like &quot;What happened?&quot; and &quot;Who/What is affected?&quot; Think of it as painting a picture of your current situation. Tools like measures (averages, sums, etc.) and aggregations (grouping data) are commonly used here.
</li>
<li><strong>Diagnostic Analytics:</strong> This delves deeper, asking &quot;Why did it happen?&quot; It helps identify the root causes behind patterns or trends observed in descriptive analytics. Techniques like filtering, sorting, and creating calculated columns to isolate specific data points are often employed.
</li></ul></div></article><article class="sec open" id="s81"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Integrating Prescriptive and Predictive Analytics:</span></button><div class="sec-body"><p>These techniques go beyond understanding the past and present, venturing into the future.</p>
<ul>
<li><strong>Prescriptive Analytics:</strong> This focuses on recommending optimal courses of action based on past trends and simulations. Imagine having data suggest the best product to upsell a customer or the most efficient route for delivery. Techniques like optimization models and decision trees can be used here.
</li>
<li><strong>Predictive Analytics:</strong> This forecasts future outcomes based on historical data and statistical models. Predicting sales figures, customer churn, or equipment failure are all examples of this. Techniques like linear regression, machine learning algorithms, and forecasting functions are commonly used.
</li></ul></div></article><article class="sec open" id="s82"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Integration into Visuals and Reports:</span></button><div class="sec-body"><p>While the above techniques provide valuable insights, effectively communicating them is key. This is where integrating them into visuals and reports comes in. Here&#x27;s how:</p>
<ul>
<li><strong>Visualizations:</strong> Charts, graphs, and dashboards can be used to represent complex data in an easily understandable format. These visuals can showcase descriptive statistics, trends, and relationships within your data, making it easier to identify patterns and anomalies.
</li>
<li><strong>Reports:</strong> Structured reports can combine visuals with textual explanations, providing a comprehensive narrative around the insights gleaned from your analyses. They can include tables, charts, and specific recommendations derived from prescriptive and predictive analytics.
</li></ul></div></article><article class="sec open" id="s83"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Data Profiling:</span></button><div class="sec-body"><p>This involves analyzing your data to understand its structure, content, and quality. It&#x27;s like getting to know your data intimately. Here&#x27;s what data profiling entails:</p>
<ul>
<li><strong>Identifying data types:</strong> Understanding if your data is numeric, textual, date/time, etc., helps determine appropriate analysis techniques.
</li>
<li><strong>Checking for missing values:</strong> Data can be incomplete, so identifying missing values and their impact is crucial.
</li>
<li><strong>Analyzing data distribution:</strong> Understanding how data is spread out (e.g., normal distribution, skewed) helps choose the right statistical methods.
</li>
<li><strong>Identifying outliers:</strong> Outliers are data points that fall significantly outside the expected range. Addressing them is important for accurate analysis.
</li></ul></div></article></div><div class="skill-wrap"><h3 class="skill">Query data by using SQL</h3><article class="sec open" id="s84"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Querying a Lakehouse:</span></button><div class="sec-body"><ul>
<li><strong>SQL Queries:</strong> You can directly write SQL queries to interact with data residing in a Fabric lakehouse. This grants you flexibility and control over the specific data you retrieve. Tools like Azure Data Studio or any SQL client that supports PolyBase can be used for this purpose.
</li>
<li><strong>Visual Query Editor:</strong> Fabric offers a visual query editor, a user-friendly interface that allows you to construct queries without writing them in raw SQL. This is ideal for users less comfortable with traditional SQL syntax. It provides drag-and-drop functionality and visual representations of data relationships for easier exploration.
</li></ul></div></article><article class="sec open" id="s85"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Querying a Warehouse:</span></button><div class="sec-body"><p>Similar to lakehouses, Fabric warehouses can be queried using:</p>
<ul>
<li><strong>SQL Queries:</strong> You can write standard SQL queries to access data stored in a warehouse. This method offers fine-grained control over the data retrieved. Tools like Azure Data Studio or any SQL client can be used for this purpose.
</li>
<li><strong>Visual Query Editor:</strong> As with lakehouses, the visual query editor provides a user-friendly alternative to writing raw SQL for querying warehouse data. It allows for easier exploration and construction of queries through drag-and-drop functionality and visual representations.
</li></ul></div></article><article class="sec open" id="s86"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Connecting and Querying Datasets with the XMLA Endpoint:</span></button><div class="sec-body"><p>The XMLA endpoint is another method for querying data within Fabric. This approach is particularly useful for connecting tools like Power BI to Fabric datasets. Here&#x27;s how it works:</p>
<ul>
<li><strong>XMLA (Extensible Markup Language for Analytics):</strong> This standardized protocol allows communication between BI tools and analytical data sources. Fabric exposes datasets through an XMLA endpoint, enabling tools like Power BI to connect and query the data.
</li>
<li><strong>Benefits:</strong> The XMLA endpoint offers several advantages. It simplifies the connection process for BI tools, allows for creation of semantic models on top of Fabric data, and enables features like role-based access control (RBAC).
</li></ul></div></article><article class="sec open" id="s87"><button class="sec-head" aria-expanded="true"><span class="chev">&#9656;</span><span>Key Points to Remember:</span></button><div class="sec-body"><ul>
<li>The specific tools and features available for querying data in Fabric may vary depending on the chosen deployment option (e.g., Azure Data Factory, Azure Synapse Analytics).
</li>
<li>Understanding the data schema and data types within the lakehouse and warehouse is crucial for writing effective SQL queries.
</li>
<li>Security best practices should be followed when querying data, such as using appropriate permissions and filtering data based on user needs.
</li></ul></div></article></div></section></main>
</div>
