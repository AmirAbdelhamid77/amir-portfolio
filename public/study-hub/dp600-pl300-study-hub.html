tegration issue at hand. Relevance to Sanity of Data: Irrelevant to the issue of unsanitized data causing matching challenges.<\/p>\n<p>B. Disable Fuzzy Matching:<\/p>\n<p>Inappropriateness Reason: Disabling fuzzy matching would exacerbate the problem. With potentially varied spellings or formats in the Customer Name field, disabling this feature would reduce the likelihood of successful matches. Impact on Data Integrity: Negatively impacts by potentially leading to under-reporting of contacts due to failed matches.<\/p>\n<p>C. Set Join Kind to Left Outer:<\/p>\n<p>Inappropriateness Reason: Similar to A, the join type (Left Outer) doesn’t tackle the core issue of name variations. A Left Outer Join would return all records from the Customer table and matching records from the Contacts table, but doesn’t ensure more accurate name matching. Relevance to Data Sanitization: Does not address the lack of data sanitization.<\/p>\n<p>D. Enable Fuzzy Matching:<\/p>\n<p>Correctness Reason: Enabling fuzzy matching is the most appropriate action. It allows Power BI to identify and match records based on similarities rather than exact string matches, effectively countering the issues posed by unsanitized data with potential variations in Customer Name / Customer_Name fields. Benefit: Enhances the accuracy of the merge by accounting for potential typos or formatting differences in names, directly addressing the data sanitization issue.<\/p>\n<p>Conclusion: Given the unsanitized nature of the Contacts table&#x27;s data and the reliance on name matching for the merge, enabling fuzzy matching (Option D) is the best approach to ensure a more accurate and comprehensive integration of the Customer and Contacts tables.<\/p>\n<p>1. Microsoft Power BI Documentation - Fuzzy Matching: query/what-is-power-query#fuzzy-matching 2. Power BI Desktop - Merge Queries (with Join Types Explanation): us/power-bi/guided-learning/power-bi-learn-data-prepare-transform#merge-queries<\/p>", "exh": ""}, {"n": 58, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Power BI semantic model that imports data from a Microsoft SQL Server database and an Oracle database. The semantic model is deployed to the Power BI service. Parameters are already used for the SQL Server data source. You are planning to make change to the semantic model that will ensure consistent behavior across all the data sources.<\/p>\n<p>You need to enable parameterization for the Oracle data source. The solution must minimize changes to the existing model. What should you do?<\/p>", "options": [{"letter": "A", "text": "From Power BI Desktop, modify the Oracle data source to use a parameter, and then republish the model to the Power BI service."}, {"letter": "B", "text": "From the Power BI service, modify the parameters of the SQL Server data source."}, {"letter": "C", "text": "From the Power BI service, create a new semantic model that uses the existing model as a data source, and then parameterize the new model."}, {"letter": "D", "text": "From the Power BI service, set a parameter value for the model."}], "key": ["A"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>Technical Justification for Correct Answer: A<\/p>\n<p>Why A is the Best Option:<\/p>\n<p>Direct Modification and Minimal Changes: Option A involves directly modifying the Oracle data source in Power BI Desktop to use a parameter, which is the most straightforward approach to enable parameterization for that specific data source. This method ensures minimal changes to the existing model, as only the Oracle data source settings are altered. Republishing Maintains Consistency: Republishing the updated model to the Power BI service after making the changes ensures that the semantic model in the service reflects the new parameterization for the Oracle data source, maintaining consistency across all data sources (SQL Server and Oracle). Alignment with Best Practices: Modifying the data source directly in Power BI Desktop before republishing aligns with best practices for managing and updating Power BI models, as it allows for local testing before deployment to the service.<\/p>\n<p>Why Other Options are Less Suitable:<\/p>\n<p>B. Modifying SQL Server Parameters:<\/p>\n<p>Off-Target: This option does not address the requirement to enable parameterization for the Oracle data source. Potential for Unnecessary Changes: Altering existing parameters for SQL Server could introduce unintended behavior or require additional testing for no gain towards the Oracle objective. C. Creating a New Semantic Model:<\/p>\n<p>Excessive Complexity: Introduces unnecessary complexity by adding a layer of indirection (using the existing model as a data source for a new model). Maintenance Overhead: Doubles the maintenance effort, as changes would need to be reflected in both the original and the new model. D. Setting a Parameter Value in the Power BI Service:<\/p>\n<p>Lacks Enablement of Parameterization: This option only sets a value for an existing parameter but does not enable parameterization for the Oracle data source if it&#x27;s not already set up. Misinterpretation of the Requirement: Fails to address the core need to configure the Oracle data source for parameterization.<\/p>\n<p>Correct Answer: A. From Power BI Desktop, modify the Oracle data source to use a parameter, and then republish the model to the Power BI service.<\/p>", "exh": ""}, {"n": 59, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You are creating a report in Power BI Desktop. You load a data extract that includes a free text field named coll. You need to analyze the frequency distribution of the string lengths in col1. The solution must not affect the size of the model. What should you do?<\/p>", "options": [{"letter": "A", "text": "In the report, add a DAX calculated column that calculates the length of col1"}, {"letter": "B", "text": "In the report, add a DAX function that calculates the average length of col1"}, {"letter": "C", "text": "From Power Query Editor, add a column that calculates the length of col1"}, {"letter": "D", "text": "From Power Query Editor, change the distribution for the Column profile to group by length for col1"}], "key": ["D"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>A will affect the size of the model as would C.<\/p>\n<p>B doesn&#x27;t give you enough information about the distribution (just the average)<\/p>\n<p>D is the right answer.<\/p>\n<p>1. Power Query Editor -&gt; View -&gt; Enable Column Profile<\/p>\n<p>2. Select three dots (top left corner) in the profile pane appear at the bottom of the Query Editor window.<\/p>\n<p>3. Group By -&gt; Text length<\/p>\n<p>Using Column Profiling in Power Query Editor allows you to analyze the frequency distribution of string lengths in col1 without adding new columns or increasing the size of the model. This meets the requirements efficiently, as the analysis is performed in-memory and not persisted in the model.<\/p>", "exh": ""}, {"n": 60, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a collection of reports for the HR department of your company. The datasets use row-level security (RLS). The company has multiple sales regions. Each sales region has an HR manager. You need to ensure that the HR managers can interact with the data from their region only. The HR managers must be prevented from changing the layout of the reports. How should you provision access to the reports for the HR managers?<\/p>", "options": [{"letter": "A", "text": "Publish the reports in an app and grant the HR managers access permission."}, {"letter": "B", "text": "Create a new workspace, copy the datasets and reports, and add the HR managers as members of the workspace."}, {"letter": "C", "text": "Publish the reports to a different workspace other than the one hosting the datasets."}, {"letter": "D", "text": "Add the HR managers as members of the existing workspace that hosts the reports and the datasets."}], "key": ["A"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>A. Publish the reports in an app and grant the HR managers access permission.<\/p>\n<p>Power BI apps are the recommended way to share content with end users.<\/p>\n<p>HR managers get read-only access, so they cannot change the report layout.<\/p>\n<p>Row-level security (RLS) is enforced automatically, ensuring each HR manager sees only data for their own sales region.<\/p>\n<p>Access can be managed easily using Azure AD groups per region.<\/p>", "exh": ""}, {"n": 61, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You need to provide a user with the ability to add members to a workspace. The solution must use the principle of least privilege. Which role should you assign to the user?<\/p>", "options": [{"letter": "A", "text": "Viewer"}, {"letter": "B", "text": "Admin"}, {"letter": "C", "text": "Contributor"}, {"letter": "D", "text": "Member"}], "key": ["D"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>Member role allows adding members or other with lower permissions to the workspace.<\/p>", "exh": ""}, {"n": 62, "kind": "multi", "kind_label": "Multi-select", "case": null, "case_ref": null, "stem_html": "<p>You have a Power BI query named Sales that imports the columns shown in the following table.<\/p>\n<p>Users only use the date part of the Sales_Date field. Only rows with a Status of Finished are used in analysis. You need to reduce the load times of the query without affecting the analysis. Which two actions achieve this goal? Each correct answer presents a complete solution. NOTE: Each correct selection is worth one point.<\/p>", "options": [{"letter": "A", "text": "Remove the rows in which Sales[Status] has a value of Canceled."}, {"letter": "B", "text": "Remove Sales[Sales_Date]."}, {"letter": "C", "text": "Change the data type of Sale[Delivery_Time] to Integer."}, {"letter": "D", "text": "Split Sales[Sale_Date] into separate date and time columns."}, {"letter": "E", "text": "Remove Sales[Canceled Date]."}], "key": ["A", "E"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>A. Remove the rows in which Sales[Status] has a value of Canceled<\/p>\n<p>E. Remove Sales[Canceled Date]<\/p>\n<p>A reduces the number of rows loaded by filtering out data that is never used in analysis (only Finished rows are analyzed). Fewer rows = faster load times.<\/p>\n<p>E removes an unused column, which reduces model size and improves query load performance.<\/p>", "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Sales data columns<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Name<\/th><th>Description<\/th><th>Sample value<\/th><\/tr><\/thead><tbody><tr><td>ID<\/td><td>A unique value that represents a sale<\/td><td>10253<\/td><\/tr><tr><td>Sale_Date<\/td><td>Sales date. A column to extract the date of the sale<\/td><td>2021-11-23T09:53:00<\/td><\/tr><tr><td>Customer_ID<\/td><td>Represents a unique customer ID number<\/td><td>13158<\/td><\/tr><tr><td>Delivery_Time<\/td><td>Elapsed delivery time in hours. Can contain null values<\/td><td>51.52<\/td><\/tr><tr><td>Status<\/td><td>Sales status. Contains only the following two values: Finished and Canceled<\/td><td>Finished<\/td><\/tr><tr><td>Canceled_Date<\/td><td>Cancellation date and time. Can contain null values<\/td><td>2021-11-24T14:11:23<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 63, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You build a report to analyze customer transactions from a database that contains the tables shown in the following table.<\/p>\n<p>You import the tables. Which relationship should you use to link the tables?<\/p>", "options": [{"letter": "A", "text": "one-to-many from Transaction to Customer"}, {"letter": "B", "text": "one-to-one between Customer and Transaction"}, {"letter": "C", "text": "many-to-many between Customer and Transaction"}, {"letter": "D", "text": "one-to-many from Customer to Transaction"}], "key": ["D"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>D. one-to-many from Customer to Transaction.<\/p>\n<p>A Customer can have multiple Transactions<\/p>\n<p>Each Transaction belongs to one Customer<\/p>\n<p>This is the classic one-to-many relationship:<\/p>\n<p>One Customer → Many Transactions<\/p>", "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Tables<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Table name<\/th><th>Column name<\/th><\/tr><\/thead><tbody><tr><td>Customer<\/td><td>CustomerID (primary key)&lt;br&gt;Name&lt;br&gt;State&lt;br&gt;Email<\/td><\/tr><tr><td>Transaction<\/td><td>TransactionID (primary key)&lt;br&gt;CustomerID (foreign key)&lt;br&gt;Date&lt;br&gt;Amount<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 64, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a custom connector that returns ID, From, To, Subject, Body, and Has Attachments for every email sent during the past year. More than 10 million records are returned. You build a report analyzing the internal networks of employees based on whom they send emails to. You need to prevent report recipients from reading the analyzed emails. The solution must minimize the model size. What should you do?<\/p>", "options": [{"letter": "A", "text": "From Model view, set the Subject and Body columns to Hidden."}, {"letter": "B", "text": "Remove the Subject and Body columns during the import."}, {"letter": "C", "text": "Implement row-level security (RLS) so that the report recipients can only see results based on the emails they sent."}], "key": ["B"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>&quot;prevent report recipients from reading the analyzed emails&quot;<\/p>\n<p>The Subject and the Body are not needed in the report. Dropping them resolves the security problem and minimizes the model.<\/p>", "exh": ""}, {"n": 65, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You create a Power BI dataset that contains the table shown in the following exhibit.<\/p>\n<p>You need to make the table available as an organizational data type in Microsoft Excel. How should you configure the properties of the table? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point. Hot Area:<\/p>\n<p>Answer Area<\/p>\n<ul><li>Row label: Cost Center / Headcount / ID / Name<\/li><li>Key column: Cost Center / Headcount / ID / Name<\/li><li>Is featured table: No / Yes<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>Box 1:Row label: Name<\/p>\n<p>excel#:~:text=Power%20BI%20Organizational%20Data%20Types%20in%20Excel%20allow%20you<\/p>\n<p>%20to,company%2C%20to%20name%20a%20few.<\/p>\n<p>Box 2: ID -<\/p>\n<p>The Key column field value provides the unique ID for the row. This value enables Excel to link a cell to a specific row in the table.<\/p>\n<p>Box 3: Yes -<\/p>\n<p>In the Data Types Gallery in Excel, your users can find data from featured tables in your Power BI datasets.<\/p>", "answer_area": {"controls": [{"correct": "Name", "id": "d1", "label": "Row label:", "options": ["Cost Center", "Headcount", "ID", "Name"]}, {"correct": "ID", "id": "d2", "label": "Key column:", "options": ["Cost Center", "Headcount", "ID", "Name"]}, {"correct": "Yes", "id": "d3", "label": "Is featured table:", "options": ["No", "Yes"]}], "kind": "dropdowns"}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Business Unit table (model view)<\/div><p class=\"exh-p\">Fields: <b>Cost Center, Headcount, ID, Name<\/b>.<\/p><\/div>"}, {"n": 66, "kind": "multi", "kind_label": "Multi-select", "case": null, "case_ref": null, "stem_html": "<p>You have the Power BI model shown in the following exhibit.<\/p>\n<p>A manager can represent only a single country. You need to use row-level security (RLS) to meet the following requirements:<\/p>\n<ul><li>The managers must only see the data of their respective country.<\/li><li>The number of RLS roles must be minimized.<\/li><\/ul>\n<p>Which two actions should you perform? Each correct answer presents a complete solution. NOTE: Each correct selection is worth one point.<\/p>", "options": [{"letter": "A", "text": "Create a single role that filters Country[Manager_Email] by using the USERNAME DAX function."}, {"letter": "B", "text": "Create a single role that filters Country[Manager_Email] by using the USEROBJECTID DAX function."}, {"letter": "C", "text": "For the relationship between Purchase Detail and Purchase, select Apply security filter in both directions."}, {"letter": "D", "text": "Create one role for each country."}, {"letter": "E", "text": "For the relationship between Purchase and Purchase Detail, change the Cross filter direction to Single."}], "key": ["A", "C"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>A: You can take advantage of the DAX functions username() or userprincipalname() within your dataset. You can use them within expressions in Power BI<\/p>\n<p>Desktop. When you publish your model, it will be used within the Power BI service.<\/p>\n<p>Note: To define security roles, follow these steps.<\/p>\n<p>Import data into your Power BI Desktop report, or configure a DirectQuery connection.<\/p>\n<p>1. From the Modeling tab, select Manage Roles.<\/p>\n<p>2. From the Manage roles window, select Create.<\/p>\n<p>3. Under Roles, provide a name for the role.<\/p>\n<p>4. Under Tables, select the table to which you want to apply a DAX rule.<\/p>\n<p>5. In the Table filter DAX expression box, enter the DAX expressions. This expression returns a value of true or<\/p>\n<p>false. For example: [Entity ID] = Value.<\/p>\n<p>6. After you&#x27;ve created the DAX expression, select the checkmark above the expression box to validate the expression.<\/p>\n<p>Note: You can use username() within this expression.<\/p>\n<p>7. Select Save.<\/p>\n<p>C: By default, row-level security filtering uses single-directional filters, whether the relationships are set to single direction or bi-directional. You can manually enable bi-directional cross-filtering with row-level security by selecting the relationship and checking the Apply security filter in both directions checkbox. Select this option when you&#x27;ve also implemented dynamic row-level security at the server level, where row-level security is based on username or login ID.<\/p>", "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Power BI model<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Table<\/th><th>Fields<\/th><\/tr><\/thead><tbody><tr><td>Country<\/td><td>Country_Id, Country_Name, Manager, Manager_Email<\/td><\/tr><tr><td>Calendar<\/td><td>Date, Month Name, Year<\/td><\/tr><tr><td>Purchase<\/td><td>Country_Id, Purchase Date, Purchase ID, Total Value (Σ)<\/td><\/tr><tr><td>Purchase Detail<\/td><td>Item Name, Purchase ID, Quantity, Unit Price<\/td><\/tr><\/tbody><\/table><\/div><p class=\"exh-p\"><b>Relationships<\/b> (1 → *): Country → Purchase (single filter direction, from Country) · Calendar → Purchase (single filter direction, from Calendar) · Purchase → Purchase Detail (<b>both<\/b> filter directions).<\/p><\/div>"}, {"n": 67, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a Power BI imported dataset that contains the data model shown in the following exhibit.<\/p>\n<p>Use the drop-down menus to select the answer choice that completes each statement based on the information presented in the graphic. NOTE: Each correct selection is worth one point. Hot Area:<\/p>\n<p>Answer Area<\/p>\n<ul><li>Changing the [answer choice] setting of the relationships will improve report query performance. Cardinality / Cross filter direction / Assume Referential Integrity<\/li><li>The data model is organized into a [answer choice]. star schema / snowflake schema / denormalized table<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>Box 1: cross filter direction -<\/p>\n<p>As the answer correctly states &quot;Assume Referential Integrity&quot; only works for direct query connections.<\/p>\n<p>Box 2: Star schema -<\/p>\n<p>Star schema is a mature modeling approach widely adopted by relational data warehouses. It requires modelers to classify their model tables as either dimension or fact.<\/p>\n<p>Generally, dimension tables contain a relatively small number of rows. Fact tables, on the other hand, can contain a very large number of rows and continue to grow over time.<\/p>\n<p>Example:<\/p>\n<p>Reference:<\/p>", "answer_area": {"controls": [{"correct": "Cross filter direction", "id": "d1", "label": "Changing the [answer choice] setting of the relationships will improve report query performance.", "options": ["Cardinality", "Cross filter direction", "Assume Referential Integrity"]}, {"correct": "star schema", "id": "d2", "label": "The data model is organized into a [answer choice].", "options": ["star schema", "snowflake schema", "denormalized table"]}], "kind": "dropdowns"}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Power BI model<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Table<\/th><th>Fields shown<\/th><\/tr><\/thead><tbody><tr><td>Employee<\/td><td>Age, AgeGroupID, BadHires, BU, date, EmpID, EthnicGroup, FP, Gender, …<\/td><\/tr><tr><td>SeparationReason<\/td><td>SeparationTypeID<\/td><\/tr><tr><td>Ethnicity<\/td><td>Ethnic Group<\/td><\/tr><tr><td>Date<\/td><td>Date, MonthEndDate, MonthStartDate<\/td><\/tr><tr><td>FP<\/td><td>FP<\/td><\/tr><tr><td>PayType<\/td><td>PayTypeID<\/td><\/tr><tr><td>Gender<\/td><td>ID<\/td><\/tr><tr><td>BU<\/td><td>BU<\/td><\/tr><tr><td>AgeGroup<\/td><td>AgeGroupID<\/td><\/tr><\/tbody><\/table><\/div><p class=\"exh-p\"><b>Relationships:<\/b> each of SeparationReason, Ethnicity, Date, FP, PayType, Gender, BU and AgeGroup has a one-to-many relationship (1 → *) to Employee, and every relationship shows the <b>double-arrow<\/b> (cross-filter direction: Both).<\/p><\/div>"}, {"n": 68, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You have a Power BI model that contains a table named Sales and a related date table. Sales contains a measure named Total Sales. You need to create a measure that calculates the total sales from the equivalent month of the previous year. How should you complete the calculation? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point. Hot Area:<\/p>\n<p>Answer Area<\/p>\n<p>Values: CALCULATE / EVALUATE / SUM / SUMX / DATESMTD / PARALLELPERIOD / SAMEPERIODLASTYEAR / TOTALMTD / [Date] / 'Date' [Date] / 'Date' [Month]<\/p>\n<pre><code>Sales Previous Year = [drop target 1] ( [Total Sales], [drop target 2] ( [drop target 3] ) )<\/code><\/pre>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>CALCULATE<\/p>\n<p>SAMEPERIODLASTYEAR<\/p>\n<p>&#x27;DATE&#x27;[DATE]<\/p>\n<p>Box 1: CALCULATE -<\/p>\n<p>Box 2: SAMEPERIODLASTYEAR<\/p>\n<p>accepts a data column, Month will usually be either text (Jan) or Integer (1). so: CALCULATE([Total Sales], SAMEPERIODLASTYEAR(&#x27;Date&#x27;[Date]))<\/p>\n<p>Box 3: &#x27;DATE&#x27; [DATE]<\/p>\n<p>us/dax/sameperiodlastyear-function-dax<\/p>", "answer_area": {"code": "Sales Previous Year = [drop target 1] ( [Total Sales], [drop target 2] ( [drop target 3] ) )", "controls": [{"correct": "CALCULATE", "id": "t1", "label": "Target 1"}, {"correct": "SAMEPERIODLASTYEAR", "id": "t2", "label": "Target 2"}, {"correct": "'Date' [Date]", "id": "t3", "label": "Target 3"}], "kind": "dragdrop", "values": ["CALCULATE", "EVALUATE", "SUM", "SUMX", "DATESMTD", "PARALLELPERIOD", "SAMEPERIODLASTYEAR", "TOTALMTD", "[Date]", "'Date' [Date]", "'Date' [Month]"]}, "exh": ""}, {"n": 69, "kind": "dragdrop", "kind_label": "Drag & drop", "case": null, "case_ref": null, "stem_html": "<p>You plan to create a report that will display sales data from the last year for multiple regions. You need to restrict access to individual rows of the data on a per region-basis by using roles. Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order. Select and Place:<\/p>\n<p>Answer Area<\/p>\n<p>Values: Publish the report. / Assign users to the role. / Add a filter to the report. / Create a role definition. / Import the data to Power BI Desktop.<\/p>\n<ul><li>Step 1<\/li><li>Step 2<\/li><li>Step 3<\/li><li>Step 4<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>With respect, you can not assign users to a role until AFTER the report has been published to the Power BI Service. Those posting that you create the role and then assign users to the role BEFORE publishing are incorrect. Roles are created in Power BI Desktop. Desktop does not have any way to assign users to the roles. They are empty when created. Role assignment happens in the service.<\/p>\n<p>Publish the report to the Power BI service. Go to your Workspace, using the Dataset, select the More Options menu(...) and click Security. This is where the Roles are populated.<\/p>\n<ul><li>Import your data into Power BI Desktop<\/li><\/ul>\n<ul><li>Create the role definition (on the Modeling tab)<\/li><\/ul>\n<ul><li>Publish the report to the Power BI service<\/li><\/ul>\n<ul><li>Assign users to the role<\/li><\/ul>", "answer_area": {"controls": [{"correct": "Import the data to Power BI Desktop.", "id": "t1", "label": "Step 1"}, {"correct": "Create a role definition.", "id": "t2", "label": "Step 2"}, {"correct": "Publish the report.", "id": "t3", "label": "Step 3"}, {"correct": "Assign users to the role.", "id": "t4", "label": "Step 4"}], "kind": "dragdrop", "values": ["Publish the report.", "Assign users to the role.", "Add a filter to the report.", "Create a role definition.", "Import the data to Power BI Desktop."]}, "exh": ""}, {"n": 70, "kind": "dragdrop", "kind_label": "Drag & drop", "case": null, "case_ref": null, "stem_html": "<p>You create a data model in Power BI. Report developers and users provide feedback that the data model is too complex. The model contains the following tables.<\/p>\n<p>The model has the following relationships:<\/p>\n<ul><li>There is a one-to-one relationship between Sales_Region and Region_Manager.<\/li><li>There are more records in Manager than in Region_Manager, but every record in Region_Manager has a<\/li><\/ul>\n<p>corresponding record in Manager.<\/p>\n<ul><li>There are more records in Sales_Manager than in Sales_Region, but every record in Sales_Region has a<\/li><\/ul>\n<p>corresponding record in Sales_Manager. You need to denormalize the model into a single table. Only managers who are associated to a sales region must be included in the reports. Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order. NOTE: More than one order of answer choices is correct. You will receive credit for any of the correct orders you select. Select and Place:<\/p>\n<p>Answer Area<\/p>\n<p>Values: Merge [Region_Manager] and [Manager] by using an inner join. / Merge [Sales_Manager] and [Sales_Region] by using a left join. / Merge [Sales_Region] and [Sales_Manager] by using an inner join. / Merge [Sales_Region] and [Sales_Manager] by using an inner join as a new query named [Sales_Region_and_Manager]. / Merge [Sales_Region] and [Region_Manager] by using a right join as a new query named [Sales_Region_and_Region_Manager]. / Merge [Sales_Region] and [Region_Manager] by using an inner join.<\/p>\n<ul><li>Step 1<\/li><li>Step 2<\/li><li>Step 3<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>1.Merge [Region_Manager] and [Manager] by using an inner join.<\/p>\n<p>3.Merge [Sales_Region] and [Sales_Manager] by using an inner join.<\/p>\n<p>6.Merge [Sales_Region] and [Region_Manager] by using an inner join.<\/p>", "answer_area": {"controls": [{"correct": "Merge [Region_Manager] and [Manager] by using an inner join.", "id": "t1", "label": "Step 1"}, {"correct": "Merge [Sales_Region] and [Sales_Manager] by using an inner join.", "id": "t2", "label": "Step 2"}, {"correct": "Merge [Sales_Region] and [Region_Manager] by using an inner join.", "id": "t3", "label": "Step 3"}], "kind": "dragdrop", "values": ["Merge [Region_Manager] and [Manager] by using an inner join.", "Merge [Sales_Manager] and [Sales_Region] by using a left join.", "Merge [Sales_Region] and [Sales_Manager] by using an inner join.", "Merge [Sales_Region] and [Sales_Manager] by using an inner join as a new query named [Sales_Region_and_Manager].", "Merge [Sales_Region] and [Region_Manager] by using a right join as a new query named [Sales_Region_and_Region_Manager].", "Merge [Sales_Region] and [Region_Manager] by using an inner join."]}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Tables<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Table name<\/th><th>Column name<\/th><th>Data type<\/th><\/tr><\/thead><tbody><tr><td>Sales_Region<\/td><td>region_id<\/td><td>Integer<\/td><\/tr><tr><td><\/td><td>name<\/td><td>Varchar<\/td><\/tr><tr><td>Region_Manager<\/td><td>region_id<\/td><td>Integer<\/td><\/tr><tr><td><\/td><td>manager_id<\/td><td>Integer<\/td><\/tr><tr><td>Sales_Manager<\/td><td>sales_manager_id<\/td><td>Integer<\/td><\/tr><tr><td><\/td><td>name<\/td><td>Varchar<\/td><\/tr><tr><td><\/td><td>region_id<\/td><td>Integer<\/td><\/tr><tr><td>Manager<\/td><td>manager_id<\/td><td>Integer<\/td><\/tr><tr><td><\/td><td>name<\/td><td>Varchar<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 71, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Microsoft Power BI report. The size of PBIX file is 550 MB. The report is accessed by using an App workspace in shared capacity of powerbi.com. The report uses an imported dataset that contains one fact table. The fact table contains 12 million rows. The dataset is scheduled to refresh twice a day at 08:00 and 17:00. The report is a single page that contains 15 AppSource visuals and 10 default visuals. Users say that the report is slow to load the visuals when they access and interact with the report. You need to recommend a solution to improve the performance of the report. What should you recommend?<\/p>", "options": [{"letter": "A", "text": "Change any DAX measures to use iterator functions."}, {"letter": "B", "text": "Enable visual interactions."}, {"letter": "C", "text": "Replace the default visuals with AppSource visuals."}, {"letter": "D", "text": "Split the visuals onto multiple pages."}], "key": ["D"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>One page with many visuals may also make your report loading slow. Please appropriately reduce the number of visualizations on one page.<\/p>", "exh": ""}, {"n": 72, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You are creating a Microsoft Power BI imported data model to perform basket analysis. The goal of the analysis is to identify which products are usually bought together in the same transaction across and within sales territories. You import a fact table named Sales as shown in the exhibit. (Click the Exhibit tab.)<\/p>\n<p>The related dimension tables are imported into the model. Sales contains the data shown in the following table.<\/p>\n<p>You are evaluating how to optimize the model. For each of the following statements, select Yes if the statement is true. Otherwise, select No. NOTE: Each correct selection is worth one point. Hot Area:<\/p>\n<p>Answer Area<\/p>\n<ul><li>The SalesRowID and AuditID columns can be removed from the model without impeding the analysis goals. — Yes / No<\/li><li>Both the OrderDateKey and OrderDate columns are necessary to perform the basket analysis. — Yes / No<\/li><li>The TaxAmt column must retain the current number of decimal places to perform the basket analysis. — Yes / No<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>Box 1: Yes - Those two columns not need in the analysis.<\/p>\n<p>Box 2: No - Can remove the surrogate key OrderDateKey from the analysis.<\/p>\n<p>Box 3: No - Tax charged not relevant for the analysis.<\/p>", "answer_area": {"controls": [{"correct": "Yes", "id": "s1", "text": "The SalesRowID and AuditID columns can be removed from the model without impeding the analysis goals."}, {"correct": "No", "id": "s2", "text": "Both the OrderDateKey and OrderDate columns are necessary to perform the basket analysis."}, {"correct": "No", "id": "s3", "text": "The TaxAmt column must retain the current number of decimal places to perform the basket analysis."}], "kind": "statements"}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Query results (first 7 rows)<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>SalesRowID<\/th><th>ProductKey<\/th><th>OrderDateKey<\/th><th>OrderDate<\/th><th>CustomerKey<\/th><th>SalesTerritoryKey<\/th><th>SalesOrderNumber<\/th><th>SalesOrderLineNumber<\/th><th>OrderQuantity<\/th><th>LineTotal<\/th><th>TaxAmt<\/th><th>Freight<\/th><th>LastModified<\/th><th>AuditID<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>310<\/td><td>20101229<\/td><td>2010-12-29 00:00:00.000<\/td><td>21768<\/td><td>6<\/td><td>SO43697<\/td><td>1<\/td><td>1<\/td><td>3578.27<\/td><td>286.2616<\/td><td>89.4568<\/td><td>2011-01-10 00:00:00.000<\/td><td>127<\/td><\/tr><tr><td>2<\/td><td>346<\/td><td>20101229<\/td><td>2010-12-29 00:00:00.000<\/td><td>28389<\/td><td>7<\/td><td>SO43698<\/td><td>1<\/td><td>1<\/td><td>3399.99<\/td><td>271.9992<\/td><td>84.9998<\/td><td>2011-01-10 00:00:00.000<\/td><td>127<\/td><\/tr><tr><td>3<\/td><td>346<\/td><td>20101229<\/td><td>2010-12-29 00:00:00.000<\/td><td>25863<\/td><td>1<\/td><td>SO43699<\/td><td>1<\/td><td>1<\/td><td>3399.99<\/td><td>271.9992<\/td><td>84.9998<\/td><td>2011-01-10 00:00:00.000<\/td><td>127<\/td><\/tr><tr><td>4<\/td><td>336<\/td><td>20101229<\/td><td>2010-12-29 00:00:00.000<\/td><td>14501<\/td><td>4<\/td><td>SO43700<\/td><td>1<\/td><td>1<\/td><td>699.0982<\/td><td>55.9279<\/td><td>17.4775<\/td><td>2011-01-10 00:00:00.000<\/td><td>127<\/td><\/tr><tr><td>5<\/td><td>346<\/td><td>20101229<\/td><td>2010-12-29 00:00:00.000<\/td><td>11003<\/td><td>9<\/td><td>SO43701<\/td><td>1<\/td><td>1<\/td><td>3399.99<\/td><td>271.9992<\/td><td>84.9998<\/td><td>2011-01-10 00:00:00.000<\/td><td>127<\/td><\/tr><tr><td>6<\/td><td>311<\/td><td>20101230<\/td><td>2010-12-30 00:00:00.000<\/td><td>27645<\/td><td>4<\/td><td>SO43702<\/td><td>1<\/td><td>1<\/td><td>3578.27<\/td><td>286.2616<\/td><td>89.4568<\/td><td>2011-01-11 00:00:00.000<\/td><td>127<\/td><\/tr><tr><td>7<\/td><td>310<\/td><td>20101230<\/td><td>2010-12-30 00:00:00.000<\/td><td>16624<\/td><td>9<\/td><td>SO43703<\/td><td>1<\/td><td>1<\/td><td>3578.27<\/td><td>286.2616<\/td><td>89.4568<\/td><td>2011-01-11 00:00:00.000<\/td><td>127<\/td><\/tr><\/tbody><\/table><\/div><\/div><div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Table columns<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Column name<\/th><th>Data type<\/th><th>Description<\/th><\/tr><\/thead><tbody><tr><td>SalesRowID<\/td><td>Integer<\/td><td>ID of the row from the source system, which represents a unique combination of SalesOrderNumber and SalesOrderLineNumber<\/td><\/tr><tr><td>ProductKey<\/td><td>Integer<\/td><td>Surrogate key that relates to the product dimension<\/td><\/tr><tr><td>OrderDateKey<\/td><td>Integer<\/td><td>Surrogate key that relates to the date dimension and is in the YYYYMMDD format<\/td><\/tr><tr><td>OrderDate<\/td><td>Datetime<\/td><td>Date and time an order was processed<\/td><\/tr><tr><td>CustomerKey<\/td><td>Integer<\/td><td>Surrogate key that relates to the customer dimension<\/td><\/tr><tr><td>SalesTerritoryKey<\/td><td>Integer<\/td><td>Surrogate key that relates to the sales territory dimension<\/td><\/tr><tr><td>SalesOrderNumber<\/td><td>Text<\/td><td>Unique identifier of an order<\/td><\/tr><tr><td>SalesOrderLineNumber<\/td><td>Integer<\/td><td>Unique identifier of a line within an order<\/td><\/tr><tr><td>OrderQuantity<\/td><td>Integer<\/td><td>Quantity of the product ordered<\/td><\/tr><tr><td>LineTotal<\/td><td>Decimal<\/td><td>Total sales amount of a line before tax<\/td><\/tr><tr><td>TaxAmt<\/td><td>Decimal<\/td><td>Amount of tax charged for the items on a specified line within an order<\/td><\/tr><tr><td>Freight<\/td><td>Decimal<\/td><td>Amount of freight charged for the items on a specified line within an order<\/td><\/tr><tr><td>LastModified<\/td><td>Datetime<\/td><td>The date and time that a row was last modified in the source system<\/td><\/tr><tr><td>AuditID<\/td><td>Integer<\/td><td>The ID of the data load process that last updated a row<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 73, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have a Microsoft Power BI data model that contains three tables named Orders, Date, and City. There is a one- to-many relationship between Date and Orders and between City and Orders. The model contains two row-level security (RLS) roles named Role1 and Role2. Role1 contains the following filter. City[State Province] = &quot;Kentucky&quot; Role2 contains the following filter. Date[Calendar Year] = 2020 - If a user is a member of both Role1 and Role2, what data will they see in a report that uses the model?<\/p>", "options": [{"letter": "A", "text": "The user will see data for which the State Province value is Kentucky or where the Calendar Year is 2020."}, {"letter": "B", "text": "The user will receive an error and will not be able to see the data in the report."}, {"letter": "C", "text": "The user will only see data for which the State Province value is Kentucky."}, {"letter": "D", "text": "The user will only see data for which the State Province value is Kentucky and the Calendar Year is 2020."}], "key": ["A"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>A, from the Microsoft documentation :<\/p>\n<p>&quot;When a report user is assigned to multiple roles, RLS filters become additive. It means report users can see table rows that represent the union of those filters.&quot;<\/p>\n<p>This means that you would see all data where either Role1 OR Role2 applies, so the answer is A not D.<\/p>\n<p>Example from MS Learn linked below:<\/p>\n<p>&quot;Consider a model with two roles: The first role, named Workers, restricts access to all Payroll table rows by using the following rule expression:<\/p>\n<p>DAX:<\/p>\n<p>FALSE()<\/p>\n<p>A rule will return no table rows when its expression evaluates to false.<\/p>\n<p>Yet, a second role, named Managers, allows access to all Payroll table rows by using the following rule expression:<\/p>\n<p>DAX:<\/p>\n<p>TRUE()<\/p>\n<p>Take care: Should a report user map to both roles, they&#x27;ll see all Payroll table rows.&quot;<\/p>\n<p>It seems to be indeed A in that scenario. User will see the data from the first as well as the second filter, it is FILTER A OR FILTER B (not FILTER A AND FILTER B)<\/p>", "exh": ""}, {"n": 74, "kind": "series", "kind_label": "Yes / No", "case": null, "case_ref": null, "stem_html": "<p>Note: This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution. After you answer a question in this section, you will NOT be able to return to it. As a result, these questions will not appear in the review screen. You are modeling data by using Microsoft Power BI. Part of the data model is a large Microsoft SQL Server table named Order that has more than 100 million records. During the development process, you need to import a sample of the data from the Order table. Solution: From Power Query Editor, you import the table and then add a filter step to the query. Does this meet the goal?<\/p>", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "key": ["B"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>This would load the entire table in the first step.<\/p>\n<p>Instead: You add a WHERE clause to the SQL statement.<\/p>", "exh": ""}, {"n": 75, "kind": "series", "kind_label": "Yes / No", "case": null, "case_ref": null, "stem_html": "<p>Note: This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution. After you answer a question in this section, you will NOT be able to return to it. As a result, these questions will not appear in the review screen. You are modeling data by using Microsoft Power BI. Part of the data model is a large Microsoft SQL Server table named Order that has more than 100 million records. During the development process, you need to import a sample of the data from the Order table. Solution: You write a DAX expression that uses the FILTER function. Does this meet the goal?<\/p>", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "key": ["B"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>Instead: You add a WHERE clause to the SQL statement.<\/p>\n<p>Note: DAX is not a language designed to fetch the data like SQL rather than used for data analysis purposes. It is always a better and recommended approach to transform the data as close to the data source itself. For example, your data source is a relational database; then, it&#x27;s better to go with T-SQL.<\/p>\n<p>SQL is a structured query language, whereas DAX is a formula language used for data analysis purposes. When our data is stored in some structured database systems like SQL server management studio, MySQL, or others, we have to use SQL to fetch the stored data.<\/p>", "exh": ""}, {"n": 76, "kind": "series", "kind_label": "Yes / No", "case": null, "case_ref": null, "stem_html": "<p>Note: This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution. After you answer a question in this section, you will NOT be able to return to it. As a result, these questions will not appear in the review screen. You are modeling data by using Microsoft Power BI. Part of the data model is a large Microsoft SQL Server table named Order that has more than 100 million records. During the development process, you need to import a sample of the data from the Order table. Solution: You add a WHERE clause to the SQL statement. Does this meet the goal?<\/p>", "options": [{"letter": "A", "text": "Yes"}, {"letter": "B", "text": "No"}], "key": ["A"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>Power Query enables you to specify your native database query in a text box under Advanced options when connecting to a database. In the example below, you&#x27;ll import data from a SQL Server database using a native database query entered in the SQL statement text box.<\/p>\n<p>1. Connect to a SQL Server database using Power Query. Select the SQL Server database option in the connector selection.<\/p>\n<p>2. In the SQL Server database popup window:<\/p>\n<p>3. Specify the Server and Database where you want to import data from using native database query.<\/p>\n<p>4. Under Advanced options, select the SQL statement field and paste or enter your native database query, then select OK.<\/p>\n<p>Reference:<\/p>", "exh": ""}, {"n": 77, "kind": "dragdrop", "kind_label": "Drag & drop", "case": null, "case_ref": null, "stem_html": "<p>You are preparing a financial report in Power BI. You connect to the data stored in a Microsoft Excel spreadsheet by using Power Query Editor as shown in the following exhibit.<\/p>\n<p>You need to prepare the data to support the following:<\/p>\n<ul><li>Visualizations that include all measures in the data over time<\/li><li>Year-over-year calculations for all the measures<\/li><\/ul>\n<p>Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order. Select and Place:<\/p>\n<p>Answer Area<\/p>\n<p>Values: Use headers as the first row. / Rename the Measure column as Year. / Rename the Attribute column as Year. / Use the first row as headers. / Transpose the table. / Unpivot all the columns other than Measure. / Change the data type of the Year column to Date.<\/p>\n<ul><li>Step 1<\/li><li>Step 2<\/li><li>Step 3<\/li><li>Step 4<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>1. Use first row as header<\/p>\n<p>2. Unpivot all columns other than &quot;Measure&quot;<\/p>\n<p>3. Rename &quot;Attribute&quot; to &quot;Year&quot;<\/p>\n<p>4. Change data type of &quot;Year&quot; column to Date<\/p>", "answer_area": {"controls": [{"correct": "Use the first row as headers.", "id": "t1", "label": "Step 1"}, {"correct": "Unpivot all the columns other than Measure.", "id": "t2", "label": "Step 2"}, {"correct": "Rename the Attribute column as Year.", "id": "t3", "label": "Step 3"}, {"correct": "Change the data type of the Year column to Date.", "id": "t4", "label": "Step 4"}], "kind": "dragdrop", "values": ["Use headers as the first row.", "Rename the Measure column as Year.", "Rename the Attribute column as Year.", "Use the first row as headers.", "Transpose the table.", "Unpivot all the columns other than Measure.", "Change the data type of the Year column to Date."]}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Power Query preview<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th><\/th><th>Column1<\/th><th>Column2<\/th><th>Column3<\/th><th>Column4<\/th><th>Column5<\/th><th>Column6<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Measure<\/td><td>2016<\/td><td>2017<\/td><td>2018<\/td><td>2019<\/td><td>2020<\/td><\/tr><tr><td>2<\/td><td>Revenue<\/td><td>0.5<\/td><td>0.6<\/td><td>0.55<\/td><td>0.61<\/td><td>0.42<\/td><\/tr><tr><td>3<\/td><td>Overheads<\/td><td>0.11<\/td><td>0.330410907<\/td><td>0.167055779<\/td><td>0.360178153<\/td><td>0.183179995<\/td><\/tr><tr><td>4<\/td><td>Cost of Goods<\/td><td>0.204388253<\/td><td>0.165848321<\/td><td>0.25<\/td><td>0.17<\/td><td>0.109073918<\/td><\/tr><\/tbody><\/table><\/div><p class=\"exh-p\">Column1 is text; Column2–Column6 are decimal numbers.<\/p><\/div>"}, {"n": 78, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You are creating an analytics report that will consume data from the tables shown in the following table.<\/p>\n<p>There is a relationship between the tables. There are no reporting requirements on employee_id and employee_photo. You need to optimize the data model. What should you configure for employee_id and employee_photo? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point. Hot Area:<\/p>\n<p>Answer Area<\/p>\n<ul><li>Employee_id: Change Type / Delete / Hide / Sort<\/li><li>Employee_photo: Change Type / Delete / Hide / Sort<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>Box 1: Hide -<\/p>\n<p>Need in the relation, so cannot delete it.<\/p>\n<p>Hide: We should hide the &quot;employee_id&quot; column if there are no reporting requirements on it. This means it won&#x27;t be visible in the report, but it will still be available for any potential relationships or calculations with the model.<\/p>\n<p>Box 2: Delete -<\/p>\n<p>Delete: Since there are no reporting requirements on the &quot;employee_photo&quot; column, we should delete it from the data model to reduce unnecessary storage and improve performance. This means that the &quot;employee_photo&quot; data is not needed for any calculations or relationships within the model.<\/p>", "answer_area": {"controls": [{"correct": "Hide", "id": "d1", "label": "Employee_id:", "options": ["Change Type", "Delete", "Hide", "Sort"]}, {"correct": "Delete", "id": "d2", "label": "Employee_photo:", "options": ["Change Type", "Delete", "Hide", "Sort"]}], "kind": "dropdowns"}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Tables<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Table name<\/th><th>Column name<\/th><th>Data type<\/th><\/tr><\/thead><tbody><tr><td>Sales<\/td><td>sales_id<\/td><td>Integer<\/td><\/tr><tr><td><\/td><td>sales_date<\/td><td>Datetime<\/td><\/tr><tr><td><\/td><td>Customer_id<\/td><td>Integer<\/td><\/tr><tr><td><\/td><td>sales_amount<\/td><td>Floating<\/td><\/tr><tr><td><\/td><td>employee_id<\/td><td>Integer<\/td><\/tr><tr><td><\/td><td>sales_ship_date<\/td><td>Datetime<\/td><\/tr><tr><td><\/td><td>store_id<\/td><td>Varchar(100)<\/td><\/tr><tr><td>Employee<\/td><td>employee_id<\/td><td>Integer<\/td><\/tr><tr><td><\/td><td>first_name<\/td><td>Varchar(100)<\/td><\/tr><tr><td><\/td><td>last_name<\/td><td>Varchar(100)<\/td><\/tr><tr><td><\/td><td>employee_photo<\/td><td>Binary<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 79, "kind": "hotspot", "kind_label": "Hotspot", "case": null, "case_ref": null, "stem_html": "<p>You plan to create Power BI dataset to analyze attendance at a school. Data will come from two separate views named View1 and View2 in an Azure SQL database. View1 contains the columns shown in the following table.<\/p>\n<p>View2 contains the columns shown in the following table.<\/p>\n<p>The views can be related based on the Class ID column. Class ID is the unique identifier for the specified class, period, teacher, and school year. For example, the same class can be taught by the same teacher during two different periods, but the class will have a different class ID. You need to design a star schema data model by using the data in both views. The solution must facilitate the following analysis:<\/p>\n<ul><li>The count of classes that occur by period<\/li><li>The count of students in attendance by period by day<\/li><li>The average number of students attending a class each month<\/li><\/ul>\n<p>In which table should you include the Teacher First Name and Period Number fields? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point. Hot Area:<\/p>\n<p>Answer Area<\/p>\n<ul><li>Teacher First Name: Attendance fact / Class dimension / Teacher dimension / Teacher fact<\/li><li>Period Number: Attendance fact / Class dimension / Teacher dimension / Teacher fact<\/li><\/ul>", "options": [], "key": null, "key_source": "explanation", "key_note": null, "statement_answers": null, "explanation_html": "<p>Box 1: Teacher Dimension-<\/p>\n<p>Box 2: Class Dimension-<\/p>\n<p>teacher&#x27;s dim and class dim because teacher name and period number are static information that are directly related to the keys (teacher ID and class ID) so they belong in the relevant dimension tables. Since the &quot;Class ID is unique for the class, period, teacher and school year&quot; this information should be included in the class dimension table and not repeated for each student&#x27;s attendance to keep your model as small as possible and to avoid mistakes.<\/p>", "answer_area": {"controls": [{"correct": "Teacher dimension", "id": "d1", "label": "Teacher First Name:", "options": ["Attendance fact", "Class dimension", "Teacher dimension", "Teacher fact"]}, {"correct": "Class dimension", "id": "d2", "label": "Period Number:", "options": ["Attendance fact", "Class dimension", "Teacher dimension", "Teacher fact"]}], "kind": "dropdowns"}, "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Attendance table<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Name<\/th><th>Data type<\/th><\/tr><\/thead><tbody><tr><td>Attendance Date<\/td><td>Date<\/td><\/tr><tr><td>Student ID<\/td><td>Bigint<\/td><\/tr><tr><td>Period Number<\/td><td>Tinyint<\/td><\/tr><tr><td>Class ID<\/td><td>Int<\/td><\/tr><\/tbody><\/table><\/div><\/div><div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Class table<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Name<\/th><th>Data type<\/th><\/tr><\/thead><tbody><tr><td>Class ID<\/td><td>Bigint<\/td><\/tr><tr><td>Class Name<\/td><td>Varchar(200)<\/td><\/tr><tr><td>Class Subject<\/td><td>Varchar(100)<\/td><\/tr><tr><td>Teacher ID<\/td><td>Int<\/td><\/tr><tr><td>Teacher First Name<\/td><td>Varchar(100)<\/td><\/tr><tr><td>Teacher Last Name<\/td><td>Varchar(100)<\/td><\/tr><tr><td>Period Number<\/td><td>Tinyint<\/td><\/tr><tr><td>School Year<\/td><td>Varchar(50)<\/td><\/tr><tr><td>Period Start Time<\/td><td>Time<\/td><\/tr><tr><td>Period End Time<\/td><td>Time<\/td><\/tr><\/tbody><\/table><\/div><\/div>"}, {"n": 80, "kind": "single", "kind_label": "Single choice", "case": null, "case_ref": null, "stem_html": "<p>You have the Power BI model shown in the following exhibit.<\/p>\n<p>There are four departments in the Departments table. You need to ensure that users can see the data of their respective department only. What should you do?<\/p>", "options": [{"letter": "A", "text": "Create a slicer that filters Departments based on DepartmentID."}, {"letter": "B", "text": "Create a row-level security (RLS) role for each department, and then define the membership of the role."}, {"letter": "C", "text": "Create a DepartmentID parameter to filter the Departments table."}, {"letter": "D", "text": "To the ConfidentialData table, add a calculated measure that uses the CURRENTGROUP DAX function."}], "key": ["B"], "key_source": "answer-key", "key_note": null, "statement_answers": null, "explanation_html": "<p>Row-level security (RLS) with Power BI can be used to restrict data access for given users. Filters restrict data access at the row level, and you can define filters within roles.<\/p>", "exh": "<div class=\"exh\"><div class=\"exh-t\">Exhibit (transcribed): Power BI model<\/div><div class=\"tx-wrap\"><table class=\"tx \"><thead><tr><th>Table<\/th><th>Fields<\/th><\/tr><\/thead><tbody><tr><td>Departments<\/td><td>DepartmentID, DepartmentName<\/td><\/tr><tr><td>ConfidentialData<\/td><td>DepartmentID<\/td><\/tr><\/tbody><\/table><\/div><p class=\"exh-p\"><b>Relationship:<\/b> Departments (1) → ConfidentialData (*), single cross-filter direction from Departments.<\/p><\/div>"}]};
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function Quiz(host, cfg){
  const QUESTIONS = cfg.data;
  const N = QUESTIONS.length;
  const root = host.attachShadow({mode:'open'});
  const CHECKABLE = QUESTIONS.filter(q => q.key || q.answer_area).length;
  const STUDY = N - CHECKABLE;
  const kinds = [['single','Single choice'],['multi','Multi-select'],['series','Yes / No'],['hotspot','Hotspot'],['dragdrop','Drag & drop']]
    .filter(k => QUESTIONS.some(q => q.kind === k[0]));
  root.innerHTML = '<style>' + QUIZ_CSS + '</style>' +
    '<header><h1>' + esc(cfg.title) + '</h1><p>' + esc(cfg.subtitle) + '</p><div class="stats">' +
    '<span class="stat">Score: <b id="score">0 / 0</b> <span id="score-note">checked</span></span>' +
    '<span class="stat">Progress: <b id="progress">0 / ' + N + '</b> answered or reviewed</span>' +
    '<span class="stat">Checkable questions: <b>' + CHECKABLE + '</b> &middot; ' + (STUDY ? STUDY + ' study questions without a key' : 'All question types interactive') + '</span></div></header>' +
    '<div class="toolbar" role="toolbar" aria-label="Filters">' +
    '<button class="chip" data-filter="all" aria-pressed="true">All (' + N + ')</button>' +
    kinds.map(k => '<button class="chip" data-filter="' + k[0] + '" aria-pressed="false">' + k[1] + '</button>').join('') +
    '<label><input type="checkbox" id="unanswered-only"> Unanswered only</label>' +
    '<input type="search" id="search" placeholder="Search question text or number…" aria-label="Search questions">' +
    '<button class="reset" id="reset">Reset progress</button></div>' +
    '<div class="layout"><aside><h2>Questions</h2><div class="grid" id="grid"></div></aside>' +
    '<main><div class="card" id="card"></div><div class="nav-row"><button class="secondary" id="prev">← Previous</button><button class="secondary" id="next">Next →</button></div></main></div>' +
    '<footer><p>' + N + ' practice questions. Tables, exhibits and screenshots from the original material are transcribed to text. This is a practice aid, not an official Microsoft exam.</p></footer>';
  const $ = id => root.getElementById(id);
  const storeKey = cfg.storeKey;
  let state = { sel: {}, checked: {}, reviewed: {} };
  try {
    const saved = JSON.parse(localStorage.getItem(storeKey) || '{}');
    if (saved && typeof saved === 'object') state = Object.assign(state, saved);
  } catch (e) {}
  function save(){ try { localStorage.setItem(storeKey, JSON.stringify(state)); } catch (e) {} }

  let current = 1, filterKind = 'all', unansweredOnly = false, query = '', dragSel = null;
  const gridEl = $('grid'), cardEl = $('card');
  const top = () => { try { host.scrollIntoView({block:'start'}); window.scrollTo({top:0}); } catch (e) {} };

  function isChecked(n){ return !!state.checked[n]; }
  function isReviewed(n){ return !!state.reviewed[n]; }
  function isDone(n){ return isChecked(n) || isReviewed(n); }
  function aaSel(q){
    const s = state.sel[q.n];
    if (q.answer_area && q.answer_area.kind === 'image_zones') return Array.isArray(s) ? s : [];
    return (s && typeof s === 'object' && !Array.isArray(s)) ? s : {};
  }
  function aaComplete(q, sel){
    if (!q.answer_area) return false;
    if (q.answer_area.kind === 'image_zones') return Array.isArray(sel) && sel.length > 0;
    return q.answer_area.controls.every(c => { const v = sel[c.id]; return v !== undefined && v !== null && v !== ''; });
  }
  function aaAllCorrect(q, sel){
    if (!q.answer_area) return false;
    if (q.answer_area.kind === 'image_zones'){
      const correct = q.answer_area.controls.filter(c => c.correct).map(c => c.id).sort();
      const got = (sel || []).slice().sort();
      return got.length === correct.length && got.every((v, i) => v === correct[i]);
    }
    return q.answer_area.controls.every(c => sel[c.id] === c.correct);
  }
  function isCorrect(n){
    const q = QUESTIONS[n-1];
    if (!state.checked[n]) return false;
    if (q.answer_area) return aaAllCorrect(q, aaSel(q));
    if (!q.key) return false;
    const sel = state.sel[n] || [];
    return sel.length === q.key.length && q.key.every(k => sel.includes(k));
  }
  function matchesFilter(q){
    if (filterKind !== 'all' && q.kind !== filterKind) return false;
    if (unansweredOnly && isDone(q.n)) return false;
    if (query){
      const hay = ('question ' + q.n + ' ' + q.stem_html.replace(/<[^>]+>/g,' ') + ' ' + (q.exh || '').replace(/<[^>]+>/g,' ')).toLowerCase();
      if (!hay.includes(query)) return false;
    }
    return true;
  }
  function renderGrid(){
    gridEl.innerHTML = '';
    QUESTIONS.forEach(q => {
      const b = document.createElement('button');
      b.textContent = q.n; b.type = 'button';
      b.setAttribute('aria-label', 'Question ' + q.n);
      if (q.n === current) b.classList.add('current');
      if (isChecked(q.n)) b.classList.add(isCorrect(q.n) ? 'correct' : 'incorrect');
      else if (isReviewed(q.n)) b.classList.add('reviewed');
      if (!matchesFilter(q)) b.classList.add('hidden-q');
      b.addEventListener('click', () => { current = q.n; renderAll(); top(); });
      gridEl.appendChild(b);
    });
  }
  function updateStats(){
    let correct = 0, checked = 0, done = 0;
    QUESTIONS.forEach(q => {
      if (isChecked(q.n)){ checked++; if (isCorrect(q.n)) correct++; }
      if (isDone(q.n)) done++;
    });
    $('score').textContent = correct + ' / ' + checked;
    $('score-note').textContent = 'checked (' + CHECKABLE + ' checkable in total)';
    $('progress').textContent = done + ' / ' + N;
  }
  function optLabel(q){
    if (!q.key) return '';
    return q.key.map(k => {
      const o = q.options.find(x => x.letter === k);
      if (!o) return k;
      return o.code ? '<br><b>' + k + '.</b><pre class="opt-code">' + esc(o.text) + '</pre>' : k + '. ' + esc(o.text);
    }).join('  •  ');
  }
  function aaSelectHTML(q, c, sel, checked){
    const cls = 'aa-select' + (checked ? (sel[c.id] === c.correct ? ' correct' : ' incorrect') : '');
    let h = '<select class="' + cls + '" data-ctrl="' + c.id + '"' + (checked ? ' disabled' : '') + ' aria-label="' + esc(c.label || c.before || ('Dropdown ' + c.id)) + '">';
    h += '<option value="">Select…</option>';
    c.options.forEach(o => { h += '<option value="' + esc(o) + '"' + (sel[c.id] === o ? ' selected' : '') + '>' + esc(o) + '</option>'; });
    return h + '</select>';
  }
  function ddZoneHTML(q, c, sel, checked){
    const v = sel[c.id] || '';
    const cls = 'dd-zone' + (v ? ' filled' : '') + (checked ? (v === c.correct ? ' correct' : ' incorrect') : '');
    const inner = v ? esc(v) + (checked ? '' : ' <button type="button" class="clear" data-clear="' + c.id + '" aria-label="Remove value">×</button>') : 'Drop here';
    return '<span class="' + cls + '" data-target="' + c.id + '" tabindex="0" role="button" aria-label="Drop target ' + c.id + '">' + inner + '</span>';
  }
  function renderAnswerArea(q, sel, checked){
    const aa = q.answer_area;
    let h = '<div class="aa-block">';
    if (aa.kind === 'image_zones'){
      const need = aa.controls.filter(c => c.correct).length;
      h += '<p class="dd-hint">Select ' + need + ' setting' + (need > 1 ? 's' : '') + '. Click an item to toggle it.</p><ol class="options">';
      aa.controls.forEach(c => {
        const isSel = Array.isArray(sel) && sel.includes(c.id);
        let cls = 'opt' + (isSel ? ' selected' : '');
        if (checked){ cls += ' disabled'; if (c.correct) cls += ' correct'; else if (isSel) cls += ' incorrect'; }
        h += '<li class="' + cls + '" data-zone="' + c.id + '" role="button" tabindex="0" aria-pressed="' + isSel + '"><span class="letter">' + (isSel ? '✓' : '') + '</span><span class="opt-text"><span>' + esc(c.label) + '</span></span></li>';
      });
      return h + '</ol></div>';
    }
    if (aa.kind === 'dragdrop'){
      h += '<p class="dd-hint">Drag a value onto a target, or tap a value and then tap a target. A value may be used once, more than once, or not at all.</p><div class="dd-pool" aria-label="Values">';
      aa.values.forEach(v => { h += '<button type="button" class="dd-chip' + (dragSel === v ? ' selected' : '') + '" draggable="true" data-value="' + esc(v) + '">' + esc(v) + '</button>'; });
      h += '</div>';
    }
    if (aa.code){
      let code = esc(aa.code);
      aa.controls.forEach((c, i) => {
        const token = aa.kind === 'dragdrop' ? '[drop target ' + (i+1) + ']' : '[dropdown ' + (i+1) + ']';
        const repl = aa.kind === 'dragdrop' ? ddZoneHTML(q, c, sel, checked) : aaSelectHTML(q, c, sel, checked);
        code = code.split(token).join(repl);
      });
      h += '<div class="aa-code"><pre>' + code + '</pre></div>';
    } else {
      aa.controls.forEach(c => {
        if (aa.kind === 'statements'){
          const v = sel[c.id] || '';
          h += '<div class="yn-row' + (checked ? (v === c.correct ? ' correct' : ' incorrect') : '') + '"><span>' + esc(c.text) + '</span><span class="yn-opts">';
          ['Yes','No'].forEach(yn => {
            let bcls = 'yn-opt' + (v === yn ? ' selected' : '');
            if (checked) bcls += (yn === c.correct ? ' correct' : (v === yn ? ' incorrect' : ''));
            h += '<button type="button" class="' + bcls + '" data-ctrl="' + c.id + '" data-val="' + yn + '"' + (checked ? ' disabled' : '') + '>' + yn + '</button>';
          });
          h += '</span></div>';
        } else if (aa.kind === 'dragdrop'){
          h += '<div class="aa-row"><span class="aa-label">' + esc(c.label) + '</span>' + ddZoneHTML(q, c, sel, checked) + '</div>';
        } else {
          h += '<div class="aa-row">';
          if (c.before) h += '<span>' + esc(c.before) + '</span>';
          if (c.label) h += '<span class="aa-label">' + esc(c.label) + '</span>';
          h += aaSelectHTML(q, c, sel, checked);
          if (c.after) h += '<span>' + esc(c.after) + '</span>';
          h += '</div>';
        }
      });
    }
    return h + '</div>';
  }
  function aaCorrectSummary(q){
    if (q.answer_area.kind === 'image_zones') return q.answer_area.controls.filter(c => c.correct).map(c => c.label).join('  •  ');
    return q.answer_area.controls.map(c => (c.label || c.text || ('Target ' + c.id)) + ' → ' + c.correct).join('  •  ');
  }
  function renderCard(){
    const q = QUESTIONS[current-1];
    const checked = isChecked(q.n), reviewed = isReviewed(q.n);
    const sel = state.sel[q.n] || [];
    let h = '<div class="badges"><span class="badge">Question ' + q.n + ' of ' + N + '</span><span class="badge">' + q.kind_label + '</span>';
    if (q.case) h += '<span class="badge case">Case study: ' + q.case + '</span>';
    h += '</div><h2>Question ' + q.n + '</h2>';
    if (q.case_ref) h += '<div class="case-banner">Case-study question. The scenario is printed with Question ' + q.case_ref + '. <button class="secondary" data-goto="' + q.case_ref + '">View Question ' + q.case_ref + '</button></div>';
    h += '<div class="stem">' + q.stem_html + '</div>' + (q.exh || '');
    if (q.key){
      h += '<ol class="options">';
      q.options.forEach(o => {
        const isSel = sel.includes(o.letter);
        let cls = 'opt' + (isSel ? ' selected' : '');
        if (checked){ cls += ' disabled'; if (q.key.includes(o.letter)) cls += ' correct'; else if (isSel) cls += ' incorrect'; }
        h += '<li class="' + cls + '" data-letter="' + o.letter + '" role="button" tabindex="0" aria-pressed="' + isSel + '"><span class="letter">' + o.letter + '</span><span class="opt-text">';
        h += o.code ? '<pre class="opt-code">' + esc(o.text) + '</pre>' : '<span>' + esc(o.text) + '</span>';
        h += '</span></li>';
      });
      h += '</ol>';
      if (q.kind === 'multi') h += '<p style="font-size:13px;color:var(--muted)">Select all that apply — click options to toggle them, then check your answer.</p>';
    } else if (q.answer_area){
      h += renderAnswerArea(q, aaSel(q), checked);
    }
    h += '<div class="actions">';
    if (q.key) h += '<button class="primary" id="checkBtn" ' + (sel.length === 0 || checked ? 'disabled' : '') + '>Check answer</button>';
    else if (q.answer_area) h += '<button class="primary" id="checkBtn" ' + (!aaComplete(q, aaSel(q)) || checked ? 'disabled' : '') + '>Check answer</button>';
    else h += '<button class="primary" id="showBtn">' + (reviewed ? 'Reviewed ✓ — unmark' : 'Mark as reviewed') + '</button>';
    h += '</div>';
    if (checked || reviewed){
      const ok = (q.key || q.answer_area) ? isCorrect(q.n) : null;
      h += '<div class="feedback ' + (q.key || q.answer_area ? (ok ? 'correct' : 'incorrect') : 'study') + '">';
      if (q.key){
        h += ok ? '<h3>✓ Correct</h3>' : '<h3>✗ Not quite — correct answer: ' + q.key.join(', ') + '</h3>';
        h += '<p><b>Correct answer' + (q.key.length > 1 ? 's' : '') + ':</b> ' + optLabel(q) + '</p>';
        if (q.key_source === 'derived' && q.key_note) h += '<p class="key-note">' + q.key_note + '</p>';
      } else if (q.answer_area){
        h += ok ? '<h3>✓ Correct — every selection matches</h3>' : '<h3>✗ Not quite — correct selections:</h3>';
        h += '<p><b>Correct selections:</b> ' + esc(aaCorrectSummary(q)) + '</p>';
      } else {
        h += '<h3>No key in the material.</h3><p>This question is shown for study. No answer key was available for it.</p>';
      }
      if (q.key || q.answer_area){
        h += q.explanation_html ? '<div class="expl"><h4>Explanation</h4>' + q.explanation_html + '</div>' : '<p>No explanation was printed for this question.</p>';
      }
      h += '</div>';
    }
    cardEl.innerHTML = h;
    cardEl.querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', () => { current = +b.dataset.goto; renderAll(); top(); }));
    if (q.key){
      cardEl.querySelectorAll('.opt').forEach(el => {
        if (checked) return;
        const pick = () => {
          const letter = el.dataset.letter;
          let s = state.sel[q.n] || [];
          s = q.kind === 'multi' ? (s.includes(letter) ? s.filter(x => x !== letter) : s.concat(letter)) : [letter];
          state.sel[q.n] = s; save(); renderAll();
        };
        el.addEventListener('click', pick);
        el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); pick(); } });
      });
      const cb = $('checkBtn');
      if (cb) cb.addEventListener('click', () => { state.checked[q.n] = true; save(); renderAll(); });
    } else if (q.answer_area && !checked){
      const refreshCheckBtn = () => { const cb = $('checkBtn'); if (cb) cb.disabled = !aaComplete(q, aaSel(q)); };
      const setSel = (ctrl, val) => {
        const s = Object.assign({}, aaSel(q));
        if (val === null || val === undefined || val === '') delete s[ctrl]; else s[ctrl] = val;
        state.sel[q.n] = s; save();
      };
      cardEl.querySelectorAll('[data-zone]').forEach(el => {
        const tog = () => {
          let s = Array.isArray(state.sel[q.n]) ? state.sel[q.n].slice() : [];
          const id = el.dataset.zone;
          s = s.includes(id) ? s.filter(x => x !== id) : s.concat(id);
          state.sel[q.n] = s; save(); renderCard();
        };
        el.addEventListener('click', tog);
        el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); tog(); } });
      });
      cardEl.querySelectorAll('select.aa-select').forEach(el => el.addEventListener('change', () => { setSel(el.dataset.ctrl, el.value); refreshCheckBtn(); }));
      cardEl.querySelectorAll('.yn-opt').forEach(el => el.addEventListener('click', () => { setSel(el.dataset.ctrl, el.dataset.val); renderCard(); }));
      cardEl.querySelectorAll('.dd-chip').forEach(el => {
        el.addEventListener('click', () => { dragSel = (dragSel === el.dataset.value) ? null : el.dataset.value; renderCard(); });
        el.addEventListener('dragstart', e => { dragSel = el.dataset.value; try { e.dataTransfer.setData('text/plain', el.dataset.value); e.dataTransfer.effectAllowed = 'copy'; } catch (err) {} });
      });
      cardEl.querySelectorAll('.dd-zone').forEach(el => {
        el.addEventListener('click', e => {
          if (e.target && e.target.dataset && e.target.dataset.clear){ setSel(el.dataset.target, null); renderCard(); return; }
          if (dragSel){ setSel(el.dataset.target, dragSel); dragSel = null; renderCard(); }
        });
        el.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && dragSel){ e.preventDefault(); setSel(el.dataset.target, dragSel); dragSel = null; renderCard(); } });
        el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });
        el.addEventListener('dragleave', () => el.classList.remove('over'));
        el.addEventListener('drop', e => {
          e.preventDefault(); el.classList.remove('over');
          let v = dragSel;
          try { v = e.dataTransfer.getData('text/plain') || v; } catch (err) {}
          if (v){ setSel(el.dataset.target, v); dragSel = null; renderCard(); }
        });
      });
      const cb = $('checkBtn');
      if (cb) cb.addEventListener('click', () => { state.checked[q.n] = true; save(); renderAll(); });
    } else if (!q.key && !q.answer_area){
      const sb = $('showBtn');
      if (sb) sb.addEventListener('click', () => { state.reviewed[q.n] = !state.reviewed[q.n]; save(); renderAll(); });
    }
  }
  function renderAll(){ renderGrid(); renderCard(); updateStats(); }
  root.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
    root.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed','false'));
    c.setAttribute('aria-pressed','true');
    filterKind = c.dataset.filter; renderAll();
  }));
  $('unanswered-only').addEventListener('change', e => { unansweredOnly = e.target.checked; renderAll(); });
  $('search').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); renderAll(); });
  $('reset').addEventListener('click', () => {
    if (confirm('Clear all saved answers and progress for this quiz?')){ state = { sel: {}, checked: {}, reviewed: {} }; save(); renderAll(); }
  });
  $('prev').addEventListener('click', () => { if (current > 1){ current--; renderAll(); top(); } });
  $('next').addEventListener('click', () => { if (current < N){ current++; renderAll(); top(); } });
  document.addEventListener('keydown', e => {
    if (!host.classList.contains('active')) return;
    const t = (e.composedPath && e.composedPath()[0]) || e.target;
    if (t && ['INPUT','SELECT','TEXTAREA'].indexOf(t.tagName) >= 0) return;
    if (e.key === 'ArrowLeft' && current > 1){ current--; renderAll(); }
    if (e.key === 'ArrowRight' && current < N){ current++; renderAll(); }
  });
  renderAll();
}

/* ---------------- hub ---------------- */
const TABS = [
  {id:'dp600', label:'DP-600 Quiz', count:DATA.dp600.length, kind:'quiz', cfg:{title:'DP-600 — Implementing Analytics Solutions Using Microsoft Fabric', subtitle:DATA.dp600.length + ' DP-600 practice questions · Select an answer, check it against the key, and read the explanation.', storeKey:'dp600-quiz-v1', data:DATA.dp600}},
  {id:'dumps', label:'DP-600 Dumps', count:DATA.dumps.length, kind:'quiz', cfg:{title:'DP-600 — Practice Dumps', subtitle:DATA.dumps.length + ' additional DP-600 practice questions · Select an answer, check it against the key, and read the explanation.', storeKey:'dp600-dumps-quiz-v1', data:DATA.dumps}},
  {id:'extra', label:'DP-600 Extra', count:DATA.extra.length, kind:'quiz', cfg:{title:'DP-600 — Extra Practice Questions', subtitle:DATA.extra.length + ' additional DP-600 practice questions · Exhibits and screenshots are transcribed to text. Select an answer, check it against the key, and read the explanation.', storeKey:'dp600-extra-quiz-v1', data:DATA.extra}},
  {id:'pl300', label:'PL-300 Quiz', count:DATA.pl300.length, kind:'quiz', cfg:{title:'PL-300 — Microsoft Power BI Data Analyst', subtitle:DATA.pl300.length + ' PL-300 practice questions · Select an answer, check it against the key, and read the explanation.', storeKey:'pl300-quiz-v1', data:DATA.pl300}},
  {id:'guide', label:'DP-600 Study Guide', kind:'guide', tpl:'tpl-guide'},
  {id:'cheat', label:'PL-300 Cheat Sheet', kind:'guide', tpl:'tpl-cheat'}
];
(function(){
  const hub = document.getElementById('hub');
  hub.innerHTML = '<span class="brand">Study Hub</span>' + TABS.map(t => '<button role="tab" id="t-' + t.id + '" aria-selected="false" data-tab="' + t.id + '">' + t.label + (t.count ? ' <small>(' + t.count + ')</small>' : '') + '</button>').join('');
  const mounted = {};
  function setTop(){ document.documentElement.style.setProperty('--hubtop', hub.offsetHeight + 'px'); }
  function activate(id, fromUser){
    const tab = TABS.find(t => t.id === id) || TABS[0];
    TABS.forEach(t => {
      const p = document.getElementById('p-' + t.id);
      p.classList.toggle('active', t.id === tab.id);
      document.getElementById('t-' + t.id).setAttribute('aria-selected', t.id === tab.id ? 'true' : 'false');
    });
    const host = document.getElementById('p-' + tab.id);
    if (!mounted[tab.id]){
      mounted[tab.id] = true;
      host.innerHTML = '';
      if (tab.kind === 'quiz') Quiz(host, tab.cfg);
      else {
        const sr = host.attachShadow({mode:'open'});
        sr.appendChild(document.getElementById(tab.tpl).content.cloneNode(true));
        mountGuide(sr);
      }
    }
    try { localStorage.setItem('studyhub-tab', tab.id); } catch (e) {}
    try { if (fromUser) location.hash = tab.id; } catch (e) {}
    if (fromUser) window.scrollTo({top:0});
    setTop();
  }
  hub.addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (b) activate(b.dataset.tab, true); });
  window.addEventListener('resize', setTop);
  let start = (location.hash || '').replace('#','');
  if (!TABS.some(t => t.id === start)){ try { start = localStorage.getItem('studyhub-tab') || 'dp600'; } catch (e) { start = 'dp600'; } }
  activate(start, false);
  window.addEventListener('hashchange', () => { const h = location.hash.replace('#',''); if (TABS.some(t => t.id === h)) activate(h, false); });
  setTop();
})();

function mountGuide(sr){
  const R = {
    getElementById: id => sr.getElementById(id),
    querySelectorAll: s => sr.querySelectorAll(s),
    createTextNode: t => document.createTextNode(t),
    createTreeWalker: (r, w) => document.createTreeWalker(r, w),
    createDocumentFragment: () => document.createDocumentFragment(),
    createElement: t => document.createElement(t)
  };

(function(){
var input=R.getElementById('q');
var countEl=R.getElementById('count');
var secs=Array.prototype.slice.call(R.querySelectorAll('.sec'));
var navLinks={};
R.querySelectorAll('aside a[data-sec]').forEach(function(a){navLinks[a.getAttribute('data-sec')]=a;});
secs.forEach(function(s){
  var head=s.querySelector('.sec-head');
  if(head){
    head.addEventListener('click',function(){
      var open=s.classList.toggle('open');
      head.setAttribute('aria-expanded',open?'true':'false');
    });
  }
  s._plain=(s.textContent||'').toLowerCase();
  s._body=s.querySelector('.sec-body');
});
function clearMarks(root){
  root.querySelectorAll('mark').forEach(function(m){
    var p=m.parentNode;p.replaceChild(R.createTextNode(m.textContent),m);p.normalize();
  });
}
function markText(root,q){
  var walker=R.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  var nodes=[];while(walker.nextNode()){nodes.push(walker.currentNode);}
  nodes.forEach(function(node){
    var t=node.nodeValue;var low=t.toLowerCase();var idx=low.indexOf(q);
    if(idx<0||!node.parentNode)return;
    var frag=R.createDocumentFragment();var rest=t;var pos=0;
    while(true){
      var i=rest.toLowerCase().indexOf(q);
      if(i<0){frag.appendChild(R.createTextNode(rest));break;}
      frag.appendChild(R.createTextNode(rest.slice(0,i)));
      var m=R.createElement('mark');m.textContent=rest.slice(i,i+q.length);frag.appendChild(m);
      rest=rest.slice(i+q.length);
    }
    node.parentNode.replaceChild(frag,node);
  });
}
function applySearch(){
  var q=(input.value||'').trim().toLowerCase();
  var shown=0;
  secs.forEach(function(s){
    clearMarks(s);
    if(!q){s.classList.remove('hidden');s.classList.add('open');shown++;return;}
    if(s._plain.indexOf(q)>=0){
      s.classList.remove('hidden');s.classList.add('open');markText(s,q);shown++;
    }else{s.classList.add('hidden');}
  });
  R.querySelectorAll('.domain,.skill-wrap').forEach(function(d){
    var any=d.querySelector('.sec:not(.hidden)');
    d.classList.toggle('hidden',!any);
  });
  Object.keys(navLinks).forEach(function(id){
    var el=R.getElementById(id);
    navLinks[id].classList.toggle('hidden',!!el&&el.classList.contains('hidden'));
  });
  countEl.textContent=q?shown+' of '+secs.length+' sections match':'All '+secs.length+' sections shown';
}
input.addEventListener('input',applySearch);
R.getElementById('expand').addEventListener('click',function(){
  secs.forEach(function(s){if(!s.classList.contains('hidden'))s.classList.add('open');});
});
R.getElementById('collapse').addEventListener('click',function(){
  secs.forEach(function(s){s.classList.remove('open');});
});
})();

  sr.querySelectorAll('aside a[data-sec]').forEach(a => a.addEventListener('click', ev => {
    ev.preventDefault();
    const el = sr.getElementById(a.getAttribute('data-sec'));
    if (el){ el.classList.add('open'); const h = el.querySelector('.sec-head'); if (h) h.setAttribute('aria-expanded','true'); el.scrollIntoView({behavior:'smooth', block:'start'}); }
  }));
}
</script>
