<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200"><rect width="900" height="200" fill="#FAFBFC"/><text x="450" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#0B3D5C" font-weight="700">Three rehearsals before the meeting</text><rect x="30" y="50" width="260" height="120" rx="10" fill="#E8F4F3" stroke="#0E7C7B"/><text x="160" y="92" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="700" fill="#0E7C7B">Self</text><text x="160" y="122" text-anchor="middle" font-family="system-ui" font-size="12" fill="#57606A">Am I actually convinced?</text><rect x="320" y="50" width="260" height="120" rx="10" fill="#E8EEF8" stroke="#2B6CB0"/><text x="450" y="92" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="700" fill="#2B6CB0">Friend</text><text x="450" y="122" text-anchor="middle" font-family="system-ui" font-size="12" fill="#57606A">Can a smart non-specialist follow?</text><rect x="610" y="50" width="260" height="120" rx="10" fill="#FBECEC" stroke="#E05A4F"/><text x="740" y="92" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="700" fill="#E05A4F">Skeptic</text><text x="740" y="122" text-anchor="middle" font-family="system-ui" font-size="12" fill="#57606A">Where will they attack first?</text></svg>