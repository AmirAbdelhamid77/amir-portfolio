<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220"><rect width="960" height="220" fill="#FAFBFC"/><text x="480" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#0B3D5C" font-weight="700">Setup - Stakes - Shift - Stake-out</text><g font-family="system-ui"><rect x="20" y="50" width="220" height="130" rx="10" fill="#fff" stroke="#0E7C7B"/><text x="130" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#0E7C7B">Setup</text><text x="130" y="118" text-anchor="middle" font-size="12" fill="#57606A">One sentence</text><text x="130" y="136" text-anchor="middle" font-size="12" fill="#57606A">of current reality</text><rect x="253" y="50" width="220" height="130" rx="10" fill="#fff" stroke="#E6A23C"/><text x="363" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#C27A10">Stakes</text><text x="363" y="118" text-anchor="middle" font-size="12" fill="#57606A">Why the committee</text><text x="363" y="136" text-anchor="middle" font-size="12" fill="#57606A">must weigh this now</text><rect x="486" y="50" width="220" height="130" rx="10" fill="#fff" stroke="#2B6CB0"/><text x="596" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#2B6CB0">Shift</text><text x="596" y="118" text-anchor="middle" font-size="12" fill="#57606A">The move named</text><text x="596" y="136" text-anchor="middle" font-size="12" fill="#57606A">in one sentence</text><rect x="719" y="50" width="220" height="130" rx="10" fill="#0B3D5C"/><text x="829" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Stake-out</text><text x="829" y="118" text-anchor="middle" font-size="12" fill="#D0D7DE">What changes at yes</text><text x="829" y="136" text-anchor="middle" font-size="12" fill="#D0D7DE">What we accept at no</text></g></svg>