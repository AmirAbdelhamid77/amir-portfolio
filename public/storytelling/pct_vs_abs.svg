<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230"><rect width="880" height="230" fill="#FAFBFC"/><text x="440" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#0B3D5C" font-weight="700">A 50% lift can be a $5 story</text><rect x="40" y="50" width="380" height="150" rx="10" fill="#FBECEC" stroke="#E05A4F"/><text x="230" y="88" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="700" fill="#E05A4F">Relative only</text><text x="230" y="128" text-anchor="middle" font-family="system-ui" font-size="28" font-weight="700" fill="#0B3D5C">+50%</text><text x="230" y="164" text-anchor="middle" font-family="system-ui" font-size="12" fill="#57606A">$10 to $15</text><rect x="460" y="50" width="380" height="150" rx="10" fill="#E8F4F3" stroke="#0E7C7B"/><text x="650" y="88" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="700" fill="#0E7C7B">Relative + absolute</text><text x="650" y="128" text-anchor="middle" font-family="system-ui" font-size="22" font-weight="700" fill="#0B3D5C">+50%  =  +$5</text><text x="650" y="164" text-anchor="middle" font-family="system-ui" font-size="12" fill="#57606A">Always show the baseline</text></svg>