<svg xmlns="http://www.w3.org/2000/svg" width="960" height="180" viewBox="0 0 960 180"><rect width="960" height="180" fill="#FAFBFC"/><text x="480" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#0B3D5C" font-weight="700">McCandless - the visual has to survive four questions</text><g font-family="system-ui" font-size="12" font-weight="700" fill="#0B3D5C"><rect x="16" y="48" width="220" height="100" rx="10" fill="#E8F4F3" stroke="#0E7C7B"/><text x="126" y="92" text-anchor="middle">1 Headline</text><text x="126" y="114" text-anchor="middle" font-weight="400" fill="#57606A">insight, not filename</text><rect x="252" y="48" width="220" height="100" rx="10" fill="#E8F4F3" stroke="#0E7C7B"/><text x="362" y="92" text-anchor="middle">2 Anticipate</text><text x="362" y="114" text-anchor="middle" font-weight="400" fill="#57606A">source / window / why</text><rect x="488" y="48" width="220" height="100" rx="10" fill="#E8F4F3" stroke="#0E7C7B"/><text x="598" y="92" text-anchor="middle">3 Explain</text><text x="598" y="114" text-anchor="middle" font-weight="400" fill="#57606A">do not make them hunt</text><rect x="724" y="48" width="220" height="100" rx="10" fill="#0B3D5C"/><text x="834" y="92" text-anchor="middle" fill="#fff">4 Relevant</text><text x="834" y="114" text-anchor="middle" font-weight="400" fill="#D0D7DE">tie to the decision</text></g></svg>