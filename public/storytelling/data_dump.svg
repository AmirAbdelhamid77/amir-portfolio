<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240"><rect width="960" height="240" fill="#FAFBFC"/><text x="480" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#0B3D5C" font-weight="700">Data dump vs minimum sufficient evidence</text><rect x="24" y="46" width="440" height="170" rx="8" fill="#FBECEC" stroke="#E05A4F"/><text x="244" y="74" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="700" fill="#E05A4F">Dump</text><text x="244" y="108" text-anchor="middle" font-family="system-ui" font-size="12" fill="#57606A">20 charts  -  40 metrics  -  15 tables</text><text x="244" y="132" text-anchor="middle" font-family="system-ui" font-size="12" fill="#57606A">then: any questions?</text><text x="244" y="168" text-anchor="middle" font-family="system-ui" font-size="12" fill="#9B2C2C">The room does the analysis for you</text><rect x="496" y="46" width="440" height="170" rx="8" fill="#E8F4F3" stroke="#0E7C7B"/><text x="716" y="74" text-anchor="middle" font-family="system-ui" font-size="13" font-weight="700" fill="#0E7C7B">Minimum evidence</text><text x="716" y="108" text-anchor="middle" font-family="system-ui" font-size="12" fill="#57606A">One Big Idea</text><text x="716" y="132" text-anchor="middle" font-family="system-ui" font-size="12" fill="#57606A">Only charts that would change the decision</text><text x="716" y="168" text-anchor="middle" font-family="system-ui" font-size="12" fill="#0E7C7B">The rest lives in the appendix</text></svg>